      resolve({ ok: false });
    });
  }

  // ------------------------------------------------------------------
  // Rolling backup — IndexedDB (резерв: localStorage)
  // ------------------------------------------------------------------

  function idbAvailable() {
    if (backupModeForced === "ls" || backupModeForced === "none") return false;
    try { return !!global.indexedDB; } catch (e) { return false; }
  }

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      if (!idbAvailable()) { reject(new Error("IndexedDB недоступний")); return; }
      var req;
      try {
        req = global.indexedDB.open(IDB_NAME, IDB_VERSION);
      } catch (e) { reject(e); return; }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) {
          db.createObjectStore(IDB_STORE, { keyPath: "seq", autoIncrement: true });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error("IndexedDB open error")); };
      req.onblocked = function () { reject(new Error("IndexedDB blocked")); };
    });
  }

  function makeSnapshot(state, info) {
    var src = state || cache || currentState();
    var json = canonical(src);
    return {
      at: nowISO(),
      reason: (info && info.reason) || "manual",
      schemaVersion: src && src.schemaVersion,
      appVersion: appVersion(),
      sessions: (src && src.sessions && src.sessions.length) || 0,
      bytes: bytesOf(json),
      json: json
    };
  }

  // Додає знімок і одразу підрізає до BACKUP_KEEP — усе в одній транзакції.
  function backupPushIDB(snap) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx, st, seq = null;
        try {
          tx = db.transaction(IDB_STORE, "readwrite");
          st = tx.objectStore(IDB_STORE);
        } catch (e) { reject(e); return; }

        var addReq = st.add(snap);
        addReq.onsuccess = function () {
          seq = addReq.result;
          var keys = [];
          var cur = st.openKeyCursor(); // autoIncrement → зростання = від старих
          cur.onsuccess = function () {
            var c = cur.result;
            if (c) { keys.push(c.primaryKey); c.continue(); return; }
            var excess = keys.length - BACKUP_KEEP;
            for (var i = 0; i < excess; i++) st.delete(keys[i]);
          };
        };
        tx.oncomplete = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          resolve({ ok: true, seq: seq, store: "idb", keep: BACKUP_KEEP });
        };
        tx.onerror = tx.onabort = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          reject(tx.error || new Error("IndexedDB tx error"));
        };
      });
    });
  }

  function backupPushLS(snap) {
    if (backupModeForced === "none") {
      return { ok: false, code: "DISABLED", store: "none" };
    }
    if (snap.bytes > BACKUP_LS_MAX_BYTES) {
      return { ok: false, code: "TOO_BIG", store: "ls", bytes: snap.bytes };
    }
    var m = patchMeta(function (mm) { mm.backupSeq = (mm.backupSeq || 0) + 1; });
    var seq = m.backupSeq;
    var key = K.backupPrefix + seq;
    var r = lsSetRaw(key, JSON.stringify(snap));
    if (!r.ok) return { ok: false, code: r.code, store: "ls" };

    var keys = lsKeys(K.backupPrefix).sort(function (a, b) {
      return backupSeqOf(a) - backupSeqOf(b);
    });
    var excess = keys.length - BACKUP_KEEP_LS;
    for (var i = 0; i < excess; i++) lsDel(keys[i]);
    return { ok: true, seq: seq, store: "ls", keep: BACKUP_KEEP_LS };
  }

  function backupSeqOf(key) {
    return parseInt(key.slice(K.backupPrefix.length), 10) || 0;
  }

  function backupPush(state, info) {
    var snap;
    try {
      snap = makeSnapshot(state, info);
    } catch (e) {
      return Promise.resolve({ ok: false, code: "SNAPSHOT_FAILED", error: e });
    }
    if (!idbAvailable()) {
      return Promise.resolve(backupPushLS(snap));
    }
    return backupPushIDB(snap).catch(function () {
      return backupPushLS(snap); // IndexedDB відвалився — не лишаємось без копії
    });
  }

  function backupListIDB() {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx, st, out = [];
        try {
          tx = db.transaction(IDB_STORE, "readonly");
          st = tx.objectStore(IDB_STORE);
        } catch (e) { reject(e); return; }
        var cur = st.openCursor();
        cur.onsuccess = function () {
          var c = cur.result;
          if (c) {
            var v = c.value;
            out.push({
              seq: c.primaryKey, at: v.at, reason: v.reason,
              bytes: v.bytes, sessions: v.sessions,
              schemaVersion: v.schemaVersion, store: "idb"
            });
            c.continue();
          }
        };
        tx.oncomplete = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          resolve(out);
        };
        tx.onerror = tx.onabort = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          reject(tx.error || new Error("IndexedDB tx error"));
        };
      });
    });
  }

  function backupListLS() {
    var keys = lsKeys(K.backupPrefix).sort(function (a, b) {
      return backupSeqOf(a) - backupSeqOf(b);
    });
    var out = [];
    for (var i = 0; i < keys.length; i++) {
      var raw = lsGet(keys[i]);
      if (!raw) continue;
      try {
        var v = JSON.parse(raw);
        out.push({
          seq: backupSeqOf(keys[i]), at: v.at, reason: v.reason,
          bytes: v.bytes, sessions: v.sessions,
          schemaVersion: v.schemaVersion, store: "ls"
        });
      } catch (e) { /* пропускаємо биту копію */ }
    }
    return out;
  }

  function backupList() {
    if (!idbAvailable()) return Promise.resolve(backupListLS());
    return backupListIDB().catch(function () { return backupListLS(); });
  }

  function backupGet(seq) {
    if (!idbAvailable()) {
      var raw = lsGet(K.backupPrefix + seq);
      if (!raw) return Promise.resolve(null);
      try { return Promise.resolve(JSON.parse(raw)); }
      catch (e) { return Promise.resolve(null); }
    }
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx, st;
        try {
          tx = db.transaction(IDB_STORE, "readonly");
          st = tx.objectStore(IDB_STORE);
        } catch (e) { reject(e); return; }
        var req = st.get(seq);
        var val = null;
        req.onsuccess = function () { val = req.result || null; };
        tx.oncomplete = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          resolve(val);
        };
        tx.onerror = tx.onabort = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          reject(tx.error || new Error("IndexedDB tx error"));
        };
      });
    }).catch(function () { return null; });
  }

  function backupRestore(seq) {
    return backupGet(seq).then(function (snap) {
      if (!snap || !snap.json) {
        return { ok: false, code: "NOT_FOUND" };
      }
      return importJSON(snap.json, { skipBackup: false });
    });
  }

  function backupClear() {
    var lsKeysList = lsKeys(K.backupPrefix);
    for (var i = 0; i < lsKeysList.length; i++) lsDel(lsKeysList[i]);
    if (!idbAvailable()) return Promise.resolve({ ok: true, store: "ls" });
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx, st;
        try {
          tx = db.transaction(IDB_STORE, "readwrite");
          st = tx.objectStore(IDB_STORE);
        } catch (e) { reject(e); return; }
        st.clear();
        tx.oncomplete = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          resolve({ ok: true, store: "idb" });
        };
        tx.onerror = tx.onabort = function () {
          try { db.close(); } catch (e) { /* ігноруємо */ }
          reject(tx.error || new Error("IndexedDB tx error"));
        };
      });
    }).catch(function () { return { ok: false, code: "IDB_FAILED" }; });
  }

  // ------------------------------------------------------------------
  // Публічний API
  // ------------------------------------------------------------------

  var Store = {
    PREFIX: PREFIX,
    SCHEMA_VERSION: SCHEMA_VERSION,
    KEYS: K,

    init: init,
    load: load,
    save: save,
    clearAll: clearAll,

    // сигнали й блокування
    status: function () { return ensureInit(); },
    isLocked: function () { return !!lock; },
    lockInfo: function () { return lock ? { code: lock.code, message: lock.message } : null; },
    getBlockedRaw: function () { return blockedRaw; },
    unlock: function (opts) {
      if (!opts || opts.confirm !== true) return { ok: false, code: "NEED_CONFIRM" };
      lock = null;
      return { ok: true };
    },
    onError: function (fn) {
      if (typeof fn === "function") errorHandlers.push(fn);
      return function () {
        errorHandlers = errorHandlers.filter(function (f) { return f !== fn; });
      };
    },

    // секції стану
    SECTIONS: SECTIONS.slice(),
    isSection: isSection,
    getSection: getSection,
    setSection: setSection,
    getSettings: function () { return getSection("settings"); },
    setSettings: function (v, o) { return setSection("settings", v, o); },
    getExercises: function () { return getSection("exercises"); },
    setExercises: function (v, o) { return setSection("exercises", v, o); },
    getProgram: function () { return getSection("program"); },
    setProgram: function (v, o) { return setSection("program", v, o); },
    getMetrics: function () { return getSection("metrics"); },
    setMetrics: function (v, o) { return setSection("metrics", v, o); },
    getCalibration: function () { return getSection("calibration"); },
    setCalibration: function (v, o) { return setSection("calibration", v, o); },
    getLog: function () { return getSection("log"); },
    setLog: function (v, o) { return setSection("log", v, o); },
    appendLog: appendLog,
    resetSection: resetSection,

    // сесії
    getSessions: getSessions,
    getSession: getSession,
    appendSession: appendSession,
    deleteSession: deleteSession,
    orphanSessions: orphanSessions,

    // export / import
    exportObject: exportObject,
    exportJSON: exportJSON,
    exportFilename: exportFilename,
    downloadFile: downloadFile,
    copyToClipboard: copyToClipboard,
    importJSON: importJSON,
    getRescueJSON: getRescueJSON,
    needsExportReminder: needsExportReminder,
    // етап 8: файл резервної копії (конверт + сума + пароль)
    BACKUP_FORMAT: BACKUP_FORMAT,
    BACKUP_FORMAT_VERSION: BACKUP_FORMAT_VERSION,
    PBKDF2_ITERATIONS: PBKDF2_ITERATIONS,
    EXPORT_REMINDER_EVERY: EXPORT_REMINDER_EVERY,
    exportBackup: exportBackup,
    inspectBackup: inspectBackup,
    importBackup: importBackup,
    backupSummary: backupSummary,
    currentSummary: currentSummary,
    downloadText: downloadText,
    markExported: markExported,

    // сховище
    usage: usage,
    estimate: estimate,
    meta: readMeta,

    persist: {
      supported: persistSupported,
      status: persistStatus,
      isPersisted: persistIsPersisted,
      request: persistRequest,
      afterSession: persistAfterSession,
      RETRY_MS: PERSIST_RETRY_MS
    },

    backup: {
      KEEP: BACKUP_KEEP,
      KEEP_LS: BACKUP_KEEP_LS,
      MAX_LS_BYTES: BACKUP_LS_MAX_BYTES,
      push: backupPush,
      list: backupList,
      get: backupGet,
      restore: backupRestore,
      clear: backupClear,
      mode: function () { return idbAvailable() ? "idb" : (backupModeForced === "none" ? "none" : "ls"); }
    },

    // внутрішнє — тільки для tests.html
    _: {
      canonical: canonical,
      deepCopy: deepCopy,
      emptyState: emptyState,
      normalizeTop: normalizeTop,
      migrate: migrate,
      validateRegistry: validateRegistry,
      migrations: function () { return MIGRATIONS; },
      schemaVersion: function () { return SCHEMA_VERSION; },
      useSchema: function (version, reg) {
        SCHEMA_VERSION = version;
        MIGRATIONS = reg || [];
        Store.SCHEMA_VERSION = version;
      },
      restoreSchema: function () {
        SCHEMA_VERSION = DEFAULT_SCHEMA_VERSION;
        MIGRATIONS = DEFAULT_MIGRATIONS;
        Store.SCHEMA_VERSION = DEFAULT_SCHEMA_VERSION;
      },
      useIdbName: function (name) { IDB_NAME = name || "bb-backup"; },
      idbName: function () { return IDB_NAME; },
      usePersistImpl: function (fn) { persistImpl = fn || null; },
      isQuotaError: isQuotaError,
      sessionKey: sessionKey,
      bytesOf: bytesOf,
      LS_CAPACITY_BYTES: LS_CAPACITY_BYTES,
      EXPORT_REMINDER_EVERY: EXPORT_REMINDER_EVERY,
      useStorage: function (obj) {
        storage = obj || null;
        storageChecked = !!obj;
        cache = null;
        initResult = null;
        lock = null;
        blockedRaw = null;
        rescueJSON = null;
      },
      restoreStorage: function () {
        storage = null;
        storageChecked = false;
        cache = null;
        initResult = null;
        lock = null;
        blockedRaw = null;
        rescueJSON = null;
      },
      forceBackupStore: function (mode) { backupModeForced = mode || "auto"; },
      resetMeta: function () { lsDel(K.meta); }
    }
  };

  global.Store = Store;
})(typeof window !== "undefined" ? window : this);

<script>
// algo-core.js — ядро арифметики алгоритму.
//
// Класичний скрипт (НЕ type="module"), без залежностей і без зовнішніх
// запитів. Підключається ПІСЛЯ store.js.
//
// Джерело чисел — docs/ALGO.md, дослівно:
//   §0    e1RM з одного сету: Брицький при n ≤ 6, Епплі при n > 6; n > 12 —
//         сет не використовується для оцінки;
//   §0    асиметричне згладжування тренду (вгору 0.7/0.3, вниз 0.9/0.1);
//   §0.1  гілки на межі НЕ сходяться — це відомий і свідомий розрив;
//   §1    %1RM = інверсія ТІЄЇ САМОЇ гілки; w = e1RM × %1RM × T_adj × S_adj;
//         округлення вниз до реальної сітки залу, РІВНО ОДИН РАЗ, після обох
//         множників;
//   §1.1  круговий обхід «вага → e1RM → вага» — тотожність;
//   §2    правило рішення прогресії: ADVANCE / CONSOLIDATE / GROW / MISS;
//   §0.2/§2.1 вправа без зовнішньої ваги: e1RM не рахується, поле ваги — це
//         тільки додатковий вантаж від 0, прогресія йде повторами;
//   §3    RIR-калібрування: bias, trust, AMRAP-проби, rep-drop-off,
//         три режими прескрипції за trust;
//   §11.4 S_adj множиться до округлення, корекція §3 — після S_adj.
//
// ─────────────────────────────────────────────────────────────────────────
// ГОЛОВНЕ ПРАВИЛО ЦЬОГО ФАЙЛУ
//
// `factor(n)` (пряма) і `pct(n)` (зворотна) — дві половини однієї тотожності
// §1.1. Гілку обирає ОДНА функція `branchFor(n)`, і обидві половини питають
// саме її. Це не стиль, а запобіжник: стара версія рахувала пряму за
// Брицьким, а інвертувала тільки Епплі, і вага повзла вниз на 3.2–3.7%
// щосесії саме на силових anchor-рухах (§1.1). Правити одну половину без
// другої — означає повернути той самий баг.
//
// Тому: змінюєш `factor` — зміни `pct`; змінюєш `branchFor` — переганяй
// секцію «крок 5» у tests.html, вона ловить розходження за визначенням.
// ─────────────────────────────────────────────────────────────────────────

(function (global) {
  "use strict";

  // ------------------------------------------------------------------
  // Константи (числа — з docs/ALGO.md, не переоцінені)
  // ------------------------------------------------------------------

  var BRZYCKI_MAX_N = 6;   // §0: n ≤ 6 → Брицький, далі Епплі
  var E1RM_MAX_N = 12;     // §0: n > 12 → сет НЕ дає оцінки e1RM
  var MIN_N = 1;           // менше одного повтору формули не визначені

  var SMOOTH_UP_OLD = 0.7;   // §0: вгору  e1RM = 0.7 × old + 0.3 × set
  var SMOOTH_DOWN_OLD = 0.9; // §0: вниз   e1RM = 0.9 × old + 0.1 × set

  var TRUST_PENALTY = 0.02;  // §1: T_adj = 1 − 0.02 × (1 − trust)

  // docs/DATA.md → settings. Використовуються, лише якщо в налаштуваннях
  // сміття: сітка залу — це фізика, і мовчки лишати її невизначеною гірше,
  // ніж узяти дефолт і сказати про це кодом відповіді.
  var DEFAULT_PLATE_STEP = 1.25;
  var DEFAULT_BAR_WEIGHT = 20;

  // Допуск ТІЛЬКИ для порівнянь із сіткою. У формулах §0/§1 жодних допусків
  // немає — там тотожність, а не наближення.
  var GRID_EPS = 1e-9;

  // §2.1: обладнання, де базове навантаження — власне тіло. Резервний спосіб
  // розпізнати таку вправу, якщо в записі бази немає явного `bodyweightBase`.
  var BODYWEIGHT_EQUIPMENT = ["bodyweight", "pullup-bar"];

  // ------------------------------------------------------------------
  // Дрібні хелпери
  // ------------------------------------------------------------------

  function isNum(x) {
    return typeof x === "number" && isFinite(x);
  }

  // Прибирає двійковий шум ваг (20 + 0.2 × 7 = 21.400000000000002).
  // Застосовується ТІЛЬКИ до результату округлення до сітки.
  function fixKg(x) {
    return Math.round(x * 1e6) / 1e6;
  }

  function clamp(x, lo, hi) {
    return x < lo ? lo : (x > hi ? hi : x);
  }

  // ------------------------------------------------------------------
  // §2.1 — вправа без зовнішньої ваги: ЄДИНА точка перевірки
  // ------------------------------------------------------------------
  //
  // Один предикат на весь застосунок. Розкидати `equipment === "bodyweight"`
  // по файлах не можна за визначенням: ознака входить у §0 (чи рахувати
  // e1RM), §1 (яка сітка), §2 (чи законна вага 0) і §6 (чи є що знижувати) —
  // чотири різні місця з однією підставою. Розійдуться вони мовчки.
  //
  // Джерело істини — поле `bodyweightBase` в записі вправи (docs/DATA.md).
  // Обладнання — резерв на випадок запису, доданого без цього поля: краще
  // впізнати вправу за `pullup-bar`, ніж призначити їй 62.5 кг на штанзі.

  function isBodyweight(exercise) {
    if (!exercise || typeof exercise !== "object") return false;
    if (typeof exercise.bodyweightBase === "boolean") return exercise.bodyweightBase;
    var raw = exercise.equipment;
    var eq = Array.isArray(raw) ? raw : (typeof raw === "string" && raw ? [raw] : []);
    for (var i = 0; i < eq.length; i++) {
      if (BODYWEIGHT_EQUIPMENT.indexOf(eq[i]) >= 0) return true;
    }
    return false;
  }

  // ------------------------------------------------------------------
  // §0 / §1 — гілка, пряма формула, зворотна формула
  // ------------------------------------------------------------------

  // Єдина точка вибору гілки. Обидві формули зобов'язані питати саме її.
  function branchFor(n) {
    return n <= BRZYCKI_MAX_N ? "brzycki" : "epley";
  }

  // Пряма: множник w → e1RM (§0).
  function factor(n) {
    return branchFor(n) === "brzycki"
      ? 36 / (37 - n)
      : 1 + n / 30;
  }

  // Зворотна: %1RM (§1). Інверсія тієї самої гілки, що й factor().
  function pct(n) {
    return branchFor(n) === "brzycki"
      ? (37 - n) / 36
      : 1 / (1 + n / 30);
  }

  // Спільна перевірка n. Повертає код помилки або null.
  function nProblem(n) {
    if (!isNum(n)) return "BAD_N";
    if (n < MIN_N) return "BAD_N";
    return null;
  }

  // ------------------------------------------------------------------
  // §0 — e1RM з одного сету
  // ------------------------------------------------------------------
  //
  // Повертає повний об'єкт: null-ів у алгоритмі бути не повинно «мовчки»,
  // у кожної відмови є код і причина, яку можна показати користувачу.
  //
  //   { ok, value, n, branch, factor, code }
  //   code: OK | BAD_WEIGHT | BAD_N | N_TOO_HIGH

  function e1rmInfo(w, n) {
    var np = nProblem(n);
    if (!isNum(w) || w <= 0) {
      return { ok: false, value: null, n: n, branch: null, factor: null, code: "BAD_WEIGHT" };
    }
    if (np) {
      return { ok: false, value: null, n: n, branch: null, factor: null, code: np };
    }
    if (n > E1RM_MAX_N) {
      // §0: точність падає — сет не використовується для оцінки e1RM.
      return { ok: false, value: null, n: n, branch: branchFor(n), factor: factor(n), code: "N_TOO_HIGH" };
    }
    var f = factor(n);
    return { ok: true, value: w * f, n: n, branch: branchFor(n), factor: f, code: "OK" };
  }

  // Коротка форма: число або null. null = «оцінки немає», ніколи не NaN.
  function e1rm(w, n) {
    var r = e1rmInfo(w, n);
    return r.ok ? r.value : null;
  }

  // Зі структури сету (docs/DATA.md): n = reps + RIR_eff (§0).
  //
  // Другий аргумент — запис вправи. §0.2: для вправи з власною вагою `set.w`
  // означає ТІЛЬКИ додатковий вантаж, тому `w × factor(n)` не є оцінкою
  // максимуму: справжнє навантаження — «тіло + вантаж», а масу тіла система
  // навмисно не знає. Оцінки немає, і мовчати про це не можна — код відмови
  // явний.
  function e1rmForSet(set, exercise) {
    if (isBodyweight(exercise)) {
      return { ok: false, value: null, n: null, branch: null, factor: null, code: "BODYWEIGHT_BASE" };
    }
    if (!set || typeof set !== "object") {
      return { ok: false, value: null, n: null, branch: null, factor: null, code: "BAD_SET" };
    }
    var reps = set.reps;
    var rir = ("rirEff" in set) ? set.rirEff : 0;
    if (!isNum(reps) || !isNum(rir)) {
      return { ok: false, value: null, n: null, branch: null, factor: null, code: "BAD_N" };
    }
    return e1rmInfo(set.w, reps + rir);
  }

  // ------------------------------------------------------------------
  // §0.3 (етап 6) — оцінка максимуму для вправ з власною вагою, коли людина
  // САМА вказала масу тіла (поле необов'язкове)
  // ------------------------------------------------------------------
  //
  // Лише для показу прогресу. У прескрипцію, §6, тригери дельоуду й
  // metrics.e1rm це число НЕ йде: там і далі §0.2 (e1rmForSet →
  // BODYWEIGHT_BASE), тож поведінка без маси тіла й з нею однакова скрізь,
  // крім екрана «Прогрес».
  //
  //   навантаження = частка × (маса тіла + додатковий вантаж)
  //
  // Частка — поле `bwLoadFrac` запису вправи, і лише там, де вона виміряна
  // в джерелі (data/exercises.js: віджимання 0.64 — Ebben 2011; підтягування
  // 1.0 — Sánchez-Moreno 2017). Немає частки — немає оцінки (§2.1: вигадане
  // число зробило б ряд правдоподібно неправильним).
  // ⚑ Додатковий вантаж множиться на ту саму частку — у джерелі (Ebben 2011)
  // його не міряли; для підтягувань (частка 1.0) різниці немає.
  //
  //   { ok, value, load, frac, n, branch, factor, code }
  //   code: OK | NOT_BODYWEIGHT | NO_BW_FRACTION | NO_BODY_MASS | BAD_SET |
  //         BAD_N | BAD_WEIGHT | N_TOO_HIGH

  var BODY_MASS_MIN = 30;    // ⚑ межі вводу (захист від описки), не алгоритм
  var BODY_MASS_MAX = 250;   // ⚑

  function normBodyMass(v) {
    var n = v;
    if (typeof v === "string" && v.trim() !== "") n = Number(v.trim().replace(",", "."));
    if (!isNum(n) || n < BODY_MASS_MIN || n > BODY_MASS_MAX) return null;
    return Math.round(n * 10) / 10;
  }

  function bwLoadFracOf(exercise) {
    var f = exercise && exercise.bwLoadFrac;
    return (isNum(f) && f > 0 && f <= 1) ? f : null;
  }

  function bodyweightE1rmForSet(set, exercise, bodyMassKg) {
    function no(code) {
      return { ok: false, value: null, load: null, frac: null, n: null, branch: null, factor: null, code: code };
    }
    if (!isBodyweight(exercise)) return no("NOT_BODYWEIGHT");
    var frac = bwLoadFracOf(exercise);
    if (frac === null) return no("NO_BW_FRACTION");
    var bm = normBodyMass(bodyMassKg);
    if (bm === null) return no("NO_BODY_MASS");
    if (!set || typeof set !== "object") return no("BAD_SET");
    var reps = set.reps;
    var rir = ("rirEff" in set) ? set.rirEff : 0;
    if (!isNum(reps) || !isNum(rir)) return no("BAD_N");
    var extra = (isNum(set.w) && set.w > 0) ? set.w : 0;
    var load = frac * (bm + extra);
    var r = e1rmInfo(load, reps + rir);
    r.load = load;
    r.frac = frac;
    return r;
  }

  // ------------------------------------------------------------------
  // §0 — асиметричне згладжування тренду
  // ------------------------------------------------------------------
  //
  //   { value, direction, wOld, code }
  //   direction: init | up | down | flat

  function smoothInfo(prev, next) {
    if (!isNum(next) || next <= 0) {
      return { value: isNum(prev) ? prev : null, direction: "none", wOld: null, code: "BAD_INPUT" };
    }
    // Перший вимір: базова точка ставиться як є. Згладжувати нічого з чим —
    // і те саме потрібне після розриву тренду (§0.1: зміна діапазону).
    if (!isNum(prev) || prev <= 0) {
      return { value: next, direction: "init", wOld: 0, code: "OK" };
    }
    if (next === prev) {
      return { value: prev, direction: "flat", wOld: SMOOTH_UP_OLD, code: "OK" };
    }
    var wOld = next > prev ? SMOOTH_UP_OLD : SMOOTH_DOWN_OLD;
    return { value: wOld * prev + (1 - wOld) * next, direction: next > prev ? "up" : "down", wOld: wOld, code: "OK" };
  }

  function smooth(prev, next) {
    return smoothInfo(prev, next).value;
  }

  // Серія вимірів → серія значень тренду. prev = null → перший вимір
  // стає базовою точкою.
  function smoothSeries(values, prev) {
    var out = [];
    var cur = isNum(prev) && prev > 0 ? prev : null;
    if (!values || !values.length) return out;
    for (var i = 0; i < values.length; i++) {
      cur = smoothInfo(cur, values[i]).value;
      out.push(cur);
    }
    return out;
  }

  // ------------------------------------------------------------------
  // §1 — %1RM і призначення робочої ваги
  // ------------------------------------------------------------------
  //
  // Важливо: верхньої межі n тут НЕМАЄ. Стеля 12 (§0) — це обмеження на
  // ВИМІР e1RM, а не на призначення: діапазон допоміжки 8–15 плюс цільовий
  // RIR 3 дає n = 18, і це нормальна прескрипція.

  function pct1rmInfo(n) {
    var np = nProblem(n);
    if (np) return { ok: false, value: null, n: n, branch: null, code: np };
    return { ok: true, value: pct(n), n: n, branch: branchFor(n), code: "OK" };
  }

  function pct1rm(n) {
    var r = pct1rmInfo(n);
    return r.ok ? r.value : null;
  }

  // §1: T_adj = 1 − 0.02 × (1 − trust). trust поза [0,1] затискається.
  function tAdj(trust) {
    var t = isNum(trust) ? clamp(trust, 0, 1) : 0;
    return 1 - TRUST_PENALTY * (1 - t);
  }

  // ------------------------------------------------------------------
  // §1 — округлення вниз до реальної сітки залу
  // ------------------------------------------------------------------
  //
  // Сітки:
  //   { kind: "barbell",  bar, step }   step = 2 × plateStep (по бліну з боку)
  //   { kind: "dumbbell", list }        відсортований список наявних гантелей
  //   { kind: "added",    step }        §2.1: ТІЛЬКИ додатковий вантаж, дно = 0
  //   { kind: "none" }                  без округлення
  //
  // Результат: { ok, weight, code, target, delta }
  //   code: OK | FLOOR | TOP | NO_GRID | BAD_INPUT
  //     FLOOR — ціль нижча за найлегше, що фізично існує (порожній гриф /
  //             найлегша гантель). Повертається саме воно: ALGO про цей
  //             випадок мовчить, а порожній гриф — це те, що реально лежить
  //             у залі. Прапорець потрібен UI, щоб сказати «легше не буває».
  //     TOP   — ціль вища за найважчу наявну гантель; віддається найважча.

  function barbellGrid(settings) {
    var s = settings || {};
    var plate = isNum(s.plateStep) && s.plateStep > 0 ? s.plateStep : DEFAULT_PLATE_STEP;
    var bar = isNum(s.barWeight) && s.barWeight >= 0 ? s.barWeight : DEFAULT_BAR_WEIGHT;
    // §1: крок на штанзі = 2 × plateStep — блін кладеться з обох боків.
    return { kind: "barbell", bar: bar, step: 2 * plate };
  }

  // §2.1: сітка додаткового вантажу. Дно — 0 (сама вага тіла), крок — той,
  // яким вантаж реально нарощується на цій вправі (`incrementKg`).
  // ⚑ Немає `incrementKg` — беремо `plateStep`, тобто ОДИН блін: на пояс чи
  // між ноги кладеться один диск, а не пара, як на штангу.
  function addedGrid(exercise, settings) {
    var s = settingsFrom(settings);
    var inc = (exercise && isNum(exercise.incrementKg) && exercise.incrementKg > 0)
      ? exercise.incrementKg : null;
    var step = (inc !== null) ? inc
      : (isNum(s.plateStep) && s.plateStep > 0 ? s.plateStep : DEFAULT_PLATE_STEP);
    return { kind: "added", step: step };
  }

  function dumbbellGrid(settings) {
    var s = settings || {};
    var raw = Array.isArray(s.dumbbells) ? s.dumbbells : [];
    var list = [];
    for (var i = 0; i < raw.length; i++) {
      if (isNum(raw[i]) && raw[i] > 0) list.push(raw[i]);
    }
    list.sort(function (a, b) { return a - b; });
    return { kind: "dumbbell", list: list };
  }

  // Налаштування: явні, інакше зі Store (якщо він є і вже піднятий).
  function settingsFrom(source) {
    if (source && typeof source === "object") return source;
    try {
      if (global.Store && typeof global.Store.getSettings === "function") {
        var s = global.Store.getSettings();
        if (s && typeof s === "object") return s;
      }
    } catch (e) { /* сховище недоступне — працюємо на дефолтах */ }
    return { plateStep: DEFAULT_PLATE_STEP, barWeight: DEFAULT_BAR_WEIGHT, dumbbells: [] };
  }

  // Сітка під конкретну вправу за її обладнанням (docs/DATA.md → exercises).
  function gridFor(exercise, settings) {
    var s = settingsFrom(settings);
    // §2.1 попереду решти: у такої вправи вага — це не «скільки взяти»,
    // а «скільки ДОДАТИ», і сітка залу до неї не має стосунку.
    if (isBodyweight(exercise)) return addedGrid(exercise, s);
    var rawEq = exercise && exercise.equipment;
    var eq = Array.isArray(rawEq) ? rawEq : (typeof rawEq === "string" && rawEq ? [rawEq] : []);
    if (eq.indexOf("dumbbell") >= 0) return dumbbellGrid(s);
    if (eq.indexOf("barbell") >= 0) return barbellGrid(s);
    return { kind: "none" };
  }

  function roundDown(target, grid) {
    // §2.1 стоїть ПЕРЕД спільною відсічкою «target > 0»: нуль додаткового
    // вантажу — це законна прескрипція («працюєш власною вагою»), а не
    // порожній вхід. Спільна відсічка відкинула б її як помилку.
    if (grid && grid.kind === "added") {
      if (!isNum(target) || target < 0 || !isNum(grid.step) || grid.step <= 0) {
        return { ok: false, weight: null, code: "BAD_INPUT", target: target, delta: null };
      }
      var ka = Math.floor(target / grid.step + GRID_EPS);
      if (ka < 0) ka = 0;
      var wa = fixKg(ka * grid.step);
      return { ok: true, weight: wa, code: "OK", target: target, delta: fixKg(target - wa) };
    }
    if (!isNum(target) || target <= 0) {
      return { ok: false, weight: null, code: "BAD_INPUT", target: target, delta: null };
    }
    if (!grid || grid.kind === "none") {
      return { ok: true, weight: target, code: "OK", target: target, delta: 0 };
    }

    if (grid.kind === "barbell") {
      if (!isNum(grid.step) || grid.step <= 0 || !isNum(grid.bar) || grid.bar < 0) {
        return { ok: false, weight: null, code: "BAD_INPUT", target: target, delta: null };
      }
      if (target < grid.bar - GRID_EPS) {
        // Легше за порожній гриф не буває. delta від'ємна — призначене ВИЩЕ
        // за ціль, і це єдиний випадок, коли §1 «округлюється вниз» не
        // виконується: фізика важливіша за формулу.
        return { ok: true, weight: fixKg(grid.bar), code: "FLOOR", target: target, delta: fixKg(target - grid.bar) };
      }
      var k = Math.floor((target - grid.bar) / grid.step + GRID_EPS);
      if (k < 0) k = 0;
      var w = fixKg(grid.bar + k * grid.step);
      return { ok: true, weight: w, code: "OK", target: target, delta: fixKg(target - w) };
    }

    if (grid.kind === "dumbbell") {
      var list = Array.isArray(grid.list) ? grid.list : [];
      if (!list.length) {
        // Список гантелей порожній — округляти нема до чого. Мовчки віддати
        // сире число означало б призначити вагу, якої в залі не існує.
        return { ok: false, weight: null, code: "NO_GRID", target: target, delta: null };
      }
      if (target < list[0] - GRID_EPS) {
        return { ok: true, weight: fixKg(list[0]), code: "FLOOR", target: target, delta: fixKg(target - list[0]) };
      }
      var best = list[0];
      for (var i = 0; i < list.length; i++) {
        if (list[i] <= target + GRID_EPS) best = list[i]; else break;
      }
      var top = list[list.length - 1];
      var code = (target > top + GRID_EPS) ? "TOP" : "OK";
      return { ok: true, weight: fixKg(best), code: code, target: target, delta: fixKg(target - best) };
    }

    return { ok: false, weight: null, code: "BAD_INPUT", target: target, delta: null };
  }

  // ------------------------------------------------------------------
  // §1 — повне призначення робочої ваги
  // ------------------------------------------------------------------
  //
  // opts: {
  //   e1rm, reps, targetRir  (або готове n),
  //   trust  — §1, дає T_adj;  або готове tAdj
  //   sAdj   — §11.2, 1.00 для 1-ї вправи сесії
  //   grid   — сітка; null/відсутня → без округлення
  // }
  //
  // Повертає: { ok, code, n, branch, pct, tAdj, sAdj, raw, weight, rounding }
  //   raw    — до округлення (саме воно бере участь у тотожності §1.1)
  //   weight — після ОДНОГО округлення, вже після обох множників (§1)

  function assignWeight(opts) {
    var o = opts || {};
    var out = {
      ok: false, code: "BAD_INPUT", n: null, branch: null,
      pct: null, tAdj: null, sAdj: null, raw: null, weight: null, rounding: null
    };

    // §2.1: у вправи з власною вагою e1RM не існує (§0.2), тому весь шлях
    // «e1RM → %1RM → вага» тут не працює. Відмова явна: мовчки повернути
    // число, порахуване з додаткового вантажу, означало б призначити
    // 62.5 кг на розкатку колеса.
    if (o.bodyweight === true || isBodyweight(o.exercise)) {
      out.code = "BODYWEIGHT_BASE";
      return out;
    }

    if (!isNum(o.e1rm) || o.e1rm <= 0) { out.code = "BAD_E1RM"; return out; }

    var n = isNum(o.n) ? o.n : (isNum(o.reps) ? o.reps + (isNum(o.targetRir) ? o.targetRir : 0) : NaN);
    var p = pct1rmInfo(n);
    if (!p.ok) { out.code = p.code; out.n = n; return out; }

    var ta = isNum(o.tAdj) ? o.tAdj : tAdj(isNum(o.trust) ? o.trust : 1);
    var sa = isNum(o.sAdj) ? o.sAdj : 1;

    // §1: множники незалежні, округлення — один раз, після обох.
    var raw = o.e1rm * p.value * ta * sa;

    out.ok = true;
    out.code = "OK";
    out.n = n;
    out.branch = p.branch;
    out.pct = p.value;
    out.tAdj = ta;
    out.sAdj = sa;
    out.raw = raw;

    if (o.grid && o.grid.kind && o.grid.kind !== "none") {
      var r = roundDown(raw, o.grid);
      out.rounding = r;
      out.weight = r.weight;
      if (!r.ok) { out.ok = false; out.code = r.code; }
    } else {
      out.rounding = null;
      out.weight = raw;
    }
    return out;
  }

  // ==================================================================
  // §3 — RIR-калібрування
  // ==================================================================
  //
  // Сенс розділу: RIR не приймається на віру. Заявлений запас порівнюється з
  // фактично виконаним, з різниці накопичується `bias`, а `trust` вирішує,
  // наскільки система взагалі спирається на самозвіт (три режими прескрипції).
  //
  // Числа — з §3 дослівно:
  //   RIR_eff = clamp(RIR_reported + bias, 0, 6)
  //   старт bias: +1.0 для всіх профілів (етап 5, Halperin 2022)
  //   проба:      e = actual − pred, pred = reps_target + RIR_reported
  //               bias = median(останні 5 e), зміна ≤ ±0.5 за одну пробу
  //   drop-off:   заявлено RIR 0, падіння повторів <8% → bias += 0.25
  //   шум:        стрибок e1RM >7% без зміни ваги → trust не росте
  //   trust = clamp(0.15 + 0.15 × n_probes − 0.3 × noise, 0, 0.9)
  //   режими: <0.45 об'єктивний | 0.45…0.7 змішаний | >0.7 авторегуляція
  //
  // Позначкою «⚑ рішення реалізації» помічено те, про що §3 мовчить і що
  // довелось визначити тут (див. звіт кроку 6). Числа §3 не переоцінені.

  var RIR_EFF_MIN = 0;
  var RIR_EFF_MAX = 6;              // §3: clamp(RIR_reported + bias, 0, 6)
  var RIR_REPORTED_MAX = 6;         // самозвіт поза 0…6 — не помилка, а прапорець

  // Етап 5 (аудит доказовості): Halperin 2022, метааналіз, doi:10.1007/s40279-021-01559-x —
  // недооцінка в середньому 0.95 повтору (95% ДІ 0.17–1.73), стаж на точність
  // не впливав. Колишні «новачки 4–5 / досвідчені 1–2» (старт 2.0 / 0) джерела
  // не мали. Старт — популяційне середнє, далі bias веде власна проба.
  var BIAS_START_NOVICE = 1.0;      // §3 (етап 5, Halperin 2022)
  var BIAS_START_EXPERIENCED = 1.0; // §3 (етап 5: стаж не впливав на точність)
  var BIAS_MIN = -6;                // ⚑ жорсткий стоп; §3 задає лише темп ±0.5
  var BIAS_MAX = 6;                 // ⚑ дзеркально до стелі RIR_eff

  var PROBE_WINDOW = 5;             // §3: median(останні 5 e)
  var PROBE_MAX_STEP = 0.5;         // §3: не більше ±0.5 за одну пробу
  var PROBE_MIN_DAYS = 7;           // §3: раз на 7–10 днів
  var PROBE_MAX_DAYS = 10;

  var DROPOFF_NORM_LO = 0.10;       // §3: норма падіння −10…−20% (довідково)
  var DROPOFF_NORM_HI = 0.20;
  var DROPOFF_FLAT = 0.08;          // §3: падіння <8% при заявленому RIR 0
  var DROPOFF_BIAS_STEP = 0.25;     // §3: bias += 0.25

  var NOISE_E1RM_JUMP = 0.07;       // §3: стрибок e1RM >7% без зміни ваги

  var TRUST_BASE = 0.15;            // §3, він же trust на порожній історії
  var TRUST_PER_PROBE = 0.15;
  var TRUST_NOISE_WEIGHT = 0.3;
  var TRUST_MIN = 0;
  var TRUST_MAX = 0.9;

  var MODE_OBJECTIVE_BELOW = 0.45;  // §3: trust < 0.45 → об'єктивний
  var MODE_MIXED_UP_TO = 0.7;       // §3: 0.45…0.7 → змішаний; далі авторегуляція

  var VETO_DOUBLE_STEP_RIR = 3;     // §3: RIR_eff ≥ 3 → подвійний крок ваги
  var AUTOREG_RIR_EXCESS = 2;       // §3: сет 1 дав RIR на 2+ вище цілі
  var AUTOREG_BUMP_LO = 0.025;      // §3: +2.5…5% на сет 2
  var AUTOREG_BUMP_HI = 0.05;

  // Прибирає двійковий шум у величинах калібрування. Потрібен не для краси:
  // 0.15 + 0.15 × 2 у double дає 0.44999999999999996, тобто рівно на межі
  // режимів (0.45) система мовчки лишалась би в «об'єктивному». Округлення
  // до 1e-6 — єдине місце, де ця межа стає передбачуваною.
  function fix6(x) {
    return Math.round(x * 1e6) / 1e6;
  }

  function median(list) {
    if (!list || !list.length) return null;
    var a = [];
    for (var i = 0; i < list.length; i++) {
      if (isNum(list[i])) a.push(list[i]);
    }
    if (!a.length) return null;
    a.sort(function (x, y) { return x - y; });
    var m = a.length >> 1;
    // Парна кількість → середнє двох центральних. ⚑ §3 каже «median» без
    // уточнення; беремо стандартне визначення, крок лишається кратним 0.5.
    return (a.length % 2) ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  // ------------------------------------------------------------------
  // §3 — RIR_eff і стартові значення
  // ------------------------------------------------------------------
  //
  //   { ok, value, code, reported, bias, clamped }
  //   code: OK | BAD_RIR | BAD_BIAS | REPORTED_OUT_OF_RANGE
  //
  // REPORTED_OUT_OF_RANGE — це НЕ відмова: значення визначене (затиснуте),
  // просто позначене. Самозвіт «RIR 9» — інформація про власника, а не
  // привід віддати NaN.

  function rirEffInfo(reported, bias) {
    if (!isNum(reported)) {
      return { ok: false, value: null, code: "BAD_RIR", reported: reported, bias: bias, clamped: false };
    }
    if (!isNum(bias)) {
      return { ok: false, value: null, code: "BAD_BIAS", reported: reported, bias: bias, clamped: false };
    }
    var b = clamp(bias, BIAS_MIN, BIAS_MAX);
    var sum = reported + b;
    var v = clamp(sum, RIR_EFF_MIN, RIR_EFF_MAX);
    var code = (reported < RIR_EFF_MIN || reported > RIR_REPORTED_MAX)
      ? "REPORTED_OUT_OF_RANGE" : "OK";
    return { ok: true, value: fix6(v), code: code, reported: reported, bias: b, clamped: v !== sum };
  }

  function rirEff(reported, bias) {
    var r = rirEffInfo(reported, bias);
    return r.ok ? r.value : null;
  }

  // §3 знає рівно два профілі. ⚑ Усе інше (зокрема "intermediate" з
  // налаштувань) отримує значення новачка з кодом PROFILE_UNKNOWN: помилитись
  // у бік «самозвіту не довіряю» дешевше — при малому trust вагу все одно
  // веде прогресія за фактом (§3, об'єктивний режим).
  var PROFILES_NOVICE = ["novice", "beginner", "новачок"];
  var PROFILES_EXPERIENCED = ["advanced", "experienced", "expert", "досвідчений"];

  function startBiasInfo(profile) {
    var p = (typeof profile === "string") ? profile.toLowerCase() : "";
    if (PROFILES_NOVICE.indexOf(p) >= 0) {
      return { value: BIAS_START_NOVICE, code: "OK", profile: p };
    }
    if (PROFILES_EXPERIENCED.indexOf(p) >= 0) {
      return { value: BIAS_START_EXPERIENCED, code: "OK", profile: p };
    }
    return { value: BIAS_START_NOVICE, code: "PROFILE_UNKNOWN", profile: p };
  }

  function startBias(profile) { return startBiasInfo(profile).value; }

  // trust на порожній історії — це не окрема константа, а та сама формула §3
  // при n_probes = 0 і noise = 0.
  function startTrust() { return trustFrom(0, 0); }

  // ------------------------------------------------------------------
  // §3 — trust і режим прескрипції
  // ------------------------------------------------------------------

  function trustFrom(nProbes, noise) {
    var n = (isNum(nProbes) && nProbes > 0) ? Math.floor(nProbes) : 0;
    var z = isNum(noise) ? clamp(noise, 0, 1) : 0;
    return fix6(clamp(TRUST_BASE + TRUST_PER_PROBE * n - TRUST_NOISE_WEIGHT * z, TRUST_MIN, TRUST_MAX));
  }

  // Сміття на вході → «об'єктивний». Це найобережніший режим: вагу веде факт,
  // а не самозвіт. Мовчазний NaN тут коштував би неправильної ваги в залі.
  function modeFor(trust) {
    var t = isNum(trust) ? trust : 0;
    if (t < MODE_OBJECTIVE_BELOW) return "objective";
    if (t <= MODE_MIXED_UP_TO) return "mixed";
    return "autoreg";
  }

  // §3, джерело 3: узгодженість e1RM. На вхід — ряд точок однієї вправи в
  // хронологічному порядку: [{ w, e1rm }, ...] або масив таких рядів.
  // Порівнюються лише СУСІДНІ точки з однаковою вагою («без зміни ваги»).
  // ⚑ §3 не задає шкалу `noise`; беремо частку шумних пар — вона в [0,1],
  // тобто рівно та шкала, у якій множник 0.3 має сенс.
  function noiseFromInfo(input) {
    var series = (input && input.length && Array.isArray(input[0])) ? input : [input || []];
    var pairs = 0, noisy = 0;
    for (var s = 0; s < series.length; s++) {
      var row = series[s] || [];
      for (var i = 1; i < row.length; i++) {
        var a = row[i - 1], b = row[i];
        if (!a || !b) continue;
        if (!isNum(a.e1rm) || a.e1rm <= 0 || !isNum(b.e1rm) || b.e1rm <= 0) continue;
        if (!isNum(a.w) || !isNum(b.w)) continue;
        if (Math.abs(a.w - b.w) > GRID_EPS) continue;   // вага змінилась — не сигнал
        pairs++;
        if (Math.abs(b.e1rm - a.e1rm) / a.e1rm > NOISE_E1RM_JUMP) noisy++;
      }
    }
    return {
      value: pairs ? fix6(noisy / pairs) : 0,
      pairs: pairs, noisy: noisy,
      code: pairs ? "OK" : "NO_DATA"
    };
  }

  function noiseFrom(input) { return noiseFromInfo(input).value; }

  // ------------------------------------------------------------------
  // §3, джерело 1 — AMRAP-проба
  // ------------------------------------------------------------------

  // Нормалізована копія секції calibration (форма — docs/DATA.md). Вхід
  // НІКОЛИ не мутується: калібрування читають кілька механізмів одразу.
  function normCalibration(cal) {
    var c = (cal && typeof cal === "object") ? cal : {};
    return {
      rirBias: isNum(c.rirBias) ? fix6(clamp(c.rirBias, BIAS_MIN, BIAS_MAX)) : BIAS_START_NOVICE,
      trust: isNum(c.trust) ? fix6(clamp(c.trust, TRUST_MIN, TRUST_MAX)) : TRUST_BASE,
      probes: Array.isArray(c.probes) ? c.probes.slice() : []
    };
  }

  //   { ok, code, pred, actual, err }
  //   code: OK | BAD_TARGET | BAD_RIR | BAD_ACTUAL | ZERO_REPS
  //         | REPORTED_OUT_OF_RANGE (ok: true)
  //
  // ⚑ ZERO_REPS: проба з нулем повторів — не вимір максимуму, а зірваний сет
  // (не та вага, зупинка, помилка вводу). Такий «e» зсунув би bias на всю
  // величину прогнозу, тому проба відхиляється, а калібрування лишається як є.
  function probeErrorInfo(probe) {
    var o = probe || {};
    var out = { ok: false, code: "BAD_TARGET", pred: null, actual: null, err: null };
    if (!isNum(o.repsTarget) || o.repsTarget < 1) return out;
    if (!isNum(o.reportedRir) || o.reportedRir < 0) { out.code = "BAD_RIR"; return out; }
    if (!isNum(o.actualReps)) { out.code = "BAD_ACTUAL"; return out; }
    var pred = o.repsTarget + o.reportedRir;
    if (o.actualReps < 1) {
      return { ok: false, code: "ZERO_REPS", pred: pred, actual: o.actualReps, err: null };
    }
    return {
      ok: true,
      code: (o.reportedRir > RIR_REPORTED_MAX) ? "REPORTED_OUT_OF_RANGE" : "OK",
      pred: pred, actual: o.actualReps, err: fix6(o.actualReps - pred)
    };
  }

  // Проба → нове калібрування.
  //   applyProbe(calibration, { date, exerciseId, repsTarget, reportedRir, actualReps }, { noise })
  //
  // Повертає новий об'єкт calibration (вхідний не змінюється) і повний слід
  // рішення: звідки й куди поїхав bias, чи впрілась стеля ±0.5 за пробу.
  function applyProbe(cal, probe, opts) {
    var o = opts || {};
    var c = normCalibration(cal);
    var pe = probeErrorInfo(probe);

    if (!pe.ok) {
      return {
        ok: false, code: pe.code, ruleId: "RIR_PROBE_REJECTED",
        calibration: c, probe: null, err: pe.err, target: null, capped: false,
        biasFrom: c.rirBias, biasTo: c.rirBias, trustFrom: c.trust, trustTo: c.trust
      };
    }

    var p = probe || {};
    var rec = {
      date: (p.date === undefined) ? null : p.date,
      exerciseId: (p.exerciseId === undefined) ? null : p.exerciseId,
      pred: pe.pred, actual: pe.actual, err: pe.err
    };
    var probes = c.probes.concat([rec]);

    // §3: bias = median(останні 5 e)
    var errs = [];
    for (var i = Math.max(0, probes.length - PROBE_WINDOW); i < probes.length; i++) {
      errs.push(probes[i] && probes[i].err);
    }
    var target = median(errs);
    if (target === null) target = c.rirBias;   // жодного придатного e — стоїмо

    // §3: зміна не більше ±0.5 за одну пробу
    var capped = Math.abs(target - c.rirBias) > PROBE_MAX_STEP + 1e-12;
    var biasTo = fix6(clamp(
      clamp(target, c.rirBias - PROBE_MAX_STEP, c.rirBias + PROBE_MAX_STEP),
      BIAS_MIN, BIAS_MAX
    ));

    var noise = isNum(o.noise) ? o.noise : 0;
    var trustTo = trustFrom(probes.length, noise);

    return {
      ok: true, code: "OK", ruleId: "RIR_PROBE",
      calibration: { rirBias: biasTo, trust: trustTo, probes: probes },
      probe: rec, err: pe.err, target: target, capped: capped,
      biasFrom: c.rirBias, biasTo: biasTo, trustFrom: c.trust, trustTo: trustTo
    };
  }

  // §3: «раз на 7–10 днів». Планувальна порада, не арифметика — тому чисте
  // число днів, без роботи з календарем.
  function probeDue(daysSinceLast) {
    if (!isNum(daysSinceLast) || daysSinceLast < 0) return "unknown";
    if (daysSinceLast < PROBE_MIN_DAYS) return "no";
    if (daysSinceLast <= PROBE_MAX_DAYS) return "due";
    return "overdue";
  }

  // ------------------------------------------------------------------
  // §3, джерело 2 — rep-drop-off між сетами при однаковій вазі
  // ------------------------------------------------------------------
  //
  //   { ok, applies, code, dropOff, delta }
  //   code: OK | BAD_INPUT | ZERO_REPS | DIFF_WEIGHT | NO_RIR | NOT_RIR0
  //         | NORMAL_DROPOFF
  //
  // ⚑ «Заявлено RIR 0» читається з ПЕРШОГО сета пари: саме він стверджує, що
  // запасу не лишилось, і саме це твердження перевіряє другий сет.
  // Від'ємне падіння (другий сет дав більше) теж спрацьовує — це той самий
  // сигнал, тільки сильніший.
  function dropOffInfo(setA, setB) {
    var bad = { ok: false, applies: false, code: "BAD_INPUT", dropOff: null, delta: 0 };
    if (!setA || !setB || typeof setA !== "object" || typeof setB !== "object") return bad;
    if (!isNum(setA.reps) || !isNum(setB.reps)) return bad;
    if (!isNum(setA.w) || !isNum(setB.w)) return bad;
    if (setA.reps <= 0) {
      return { ok: false, applies: false, code: "ZERO_REPS", dropOff: null, delta: 0 };
    }
    if (Math.abs(setA.w - setB.w) > GRID_EPS) {
      // §3 визначає сигнал ЛИШЕ при однаковій вазі: інакше падіння повторів
      // пояснюється вагою, а не запасом.
      return { ok: true, applies: false, code: "DIFF_WEIGHT", dropOff: null, delta: 0 };
    }
    var d = fix6((setA.reps - setB.reps) / setA.reps);
    var rr = ("rirReported" in setA) ? setA.rirReported : null;
    if (!isNum(rr)) {
      return { ok: false, applies: false, code: "NO_RIR", dropOff: d, delta: 0 };
    }
    if (rr !== 0) {
      return { ok: true, applies: false, code: "NOT_RIR0", dropOff: d, delta: 0 };
    }
    if (d >= DROPOFF_FLAT) {
      return { ok: true, applies: false, code: "NORMAL_DROPOFF", dropOff: d, delta: 0 };
    }
    return { ok: true, applies: true, code: "OK", dropOff: d, delta: DROPOFF_BIAS_STEP };
  }

  // Сигнал м'який: рухає bias на 0.25 і НЕ чіпає trust та probes. Довіру
  // піднімає тільки проба (§3, джерело 1) — це й є різниця між виміром і
  // непрямою ознакою.
  function applyDropOff(cal, setA, setB) {
    var c = normCalibration(cal);
    var info = dropOffInfo(setA, setB);
    if (!info.applies) {
      return {
        ok: info.ok, code: info.code, applies: false, dropOff: info.dropOff,
        ruleId: null, calibration: c,
        biasFrom: c.rirBias, biasTo: c.rirBias, trustFrom: c.trust, trustTo: c.trust
      };
    }
    var biasTo = fix6(clamp(c.rirBias + DROPOFF_BIAS_STEP, BIAS_MIN, BIAS_MAX));
    return {
      ok: true, code: "OK", applies: true, dropOff: info.dropOff,
      ruleId: "RIR_DROPOFF",
      calibration: { rirBias: biasTo, trust: c.trust, probes: c.probes },
      biasFrom: c.rirBias, biasTo: biasTo, trustFrom: c.trust, trustTo: c.trust
    };
  }

  // ------------------------------------------------------------------
  // §3 / §0 на рівні збереженої сесії (етап 2, 2026-10-06)
  // ------------------------------------------------------------------
  //
  // Раніше сесія лише дописувалась в історію: калібрування й e1RM після неї
  // не оновлювались ніколи, хоча всі механізми нижче вже були. Тут —
  // склейка готових функцій під форму сесії з docs/DATA.md, без нових
  // формул.

  //   sessionDropOff(cal, session) → { ok, calibration, applied, changed, ruleId }
  //
  // §3, джерело 2: сусідні пари сетів кожної вправи → applyDropOff.
  // ⚑ рішення реалізації: не більше ОДНОГО кроку +0.25 на вправу за сесію.
  // §3 називає сигнал м'яким і не каже, скільки разів його можна взяти з
  // однієї вправи; кілька сетів «RIR 0» з однаковими повторами — це одне
  // твердження людини про цю вагу, а не кілька незалежних. Без обмеження
  // сесія з п'яти вправ по три сети зсувала б bias на +2.5 — більше, ніж
  // AMRAP-проба має право зсунути за п'ять проб.
  function sessionDropOff(cal, session) {
    var c = normCalibration(cal);
    var applied = [];
    var entries = (session && Array.isArray(session.entries)) ? session.entries : [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var sets = (e && Array.isArray(e.sets)) ? e.sets : [];
      for (var j = 1; j < sets.length; j++) {
        var r = applyDropOff(c, sets[j - 1], sets[j]);
        if (!r.applies) continue;
        c = r.calibration;
        applied.push({ exerciseId: e.exerciseId || null, dropOff: r.dropOff, biasFrom: r.biasFrom, biasTo: r.biasTo });
        break;   // ⚑ один сигнал на вправу за сесію
      }
    }
    return {
      ok: true, calibration: c, applied: applied, changed: applied.length > 0,
      ruleId: applied.length ? "RIR_DROPOFF" : null
    };
  }

  //   sessionE1rm(e1rmMap, session, { index | exercises, at }) → { ok, e1rm, updated }
  //
  // §0: найкраща оцінка e1RM із сетів вправи (e1rmForSet: n = reps + RIR_eff,
  // стеля n ≤ 12, для власної ваги оцінки немає — §0.2), далі асиметричне
  // згладжування smoothInfo від попереднього значення. Запис — рівно чотири
  // поля docs/DATA.md: value, updatedAt, confidence (лишається попередня:
  // сесія без проби довіру §3 не змінює), source: "measured".
  // Вхідна мапа не мутується.
  function sessionE1rm(map, session, opts) {
    var o = opts || {};
    var idx = o.index || null;
    var k;
    if (!idx) {
      idx = {};
      var lib = Array.isArray(o.exercises) ? o.exercises : [];
      for (k = 0; k < lib.length; k++) if (lib[k] && lib[k].id) idx[lib[k].id] = lib[k];
    }
    var out = {};
    if (map && typeof map === "object") {
      for (k in map) if (Object.prototype.hasOwnProperty.call(map, k)) out[k] = map[k];
    }
    var at = (typeof o.at === "string" && o.at) ? o.at : null;
    var updated = [];
    var entries = (session && Array.isArray(session.entries)) ? session.entries : [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      var id = e && e.exerciseId;
      var ex = id ? idx[id] : null;
      if (!ex) continue;
      var best = null;
      var sets = Array.isArray(e.sets) ? e.sets : [];
      for (var j = 0; j < sets.length; j++) {
        var r = e1rmForSet(sets[j], ex);
        if (r.ok && (best === null || r.value > best)) best = r.value;
      }
      if (best === null) continue;
      var rec = out[id];
      var prev = (rec && isNum(rec.value) && rec.value > 0) ? rec.value : null;
      var sm = smoothInfo(prev, best);
      out[id] = {
        value: fix6(sm.value),
        updatedAt: at,
        confidence: (rec && isNum(rec.confidence)) ? rec.confidence : null,
        source: "measured"
      };
      updated.push({ exerciseId: id, from: prev, to: out[id].value, measured: fix6(best), direction: sm.direction });
    }
    return { ok: true, e1rm: out, updated: updated };
  }

  //   experienceFromCalibration(cal) → { level, code, probes, medianErr }
  //
  // §3.1 (ЕВРИСТИКА, етап 2): рівень підготовки не питається — це похідна
  // калібрування. Вибірка — помилки останніх PROBE_WINDOW AMRAP-проб (та
  // сама, з якої §3 рахує bias), але без стелі ±0.5: стеля обмежує темп
  // ЗМІНИ bias, а не саме свідчення.
  //   проб < EXP_MIN_PROBES               → level null, «ще визначається»
  //   медіана e ≤ EXP_INTERMEDIATE_MAX_E  → "intermediate"
  //   інакше                              → "novice"
  // Значення — з docs/DATA.md (novice | intermediate). Пороги в ALGO.md §3.1.
  var EXP_MIN_PROBES = 3;            // §3.1 евристика
  var EXP_INTERMEDIATE_MAX_E = 2;    // ⚑ §3.1 евристика (етап 5: теза «досвідчені — на 1–2» прибрана)

  function experienceFromCalibration(cal) {
    var c = normCalibration(cal);
    var errs = [];
    for (var i = Math.max(0, c.probes.length - PROBE_WINDOW); i < c.probes.length; i++) {
      var p = c.probes[i];
      if (p && isNum(p.err)) errs.push(p.err);
    }
    if (errs.length < EXP_MIN_PROBES) {
      return { level: null, code: "CALIBRATING", probes: errs.length, medianErr: null, need: EXP_MIN_PROBES };
    }
    var m = median(errs);
    return {
      level: m <= EXP_INTERMEDIATE_MAX_E ? "intermediate" : "novice",
      code: "OK", probes: errs.length, medianErr: fix6(m), need: EXP_MIN_PROBES
    };
  }

  // ------------------------------------------------------------------
  // §2 — рішення прогресії (double / лінійна за фактичними повторами)
  // ------------------------------------------------------------------
  //
  // Потрібне тут, бо на ньому стоять два з трьох режимів §3: об'єктивний веде
  // вагу ТІЛЬКИ цим рішенням, змішаний бере його половиною. Повний §2
  // (лічильник miss між сесіями, драбина плато §6) живе не тут — цей виклик
  // лише каже, що робити з наступною сесією, і піднімає прапорець `miss`.
  //
  // opts: { weight, setsReps: [..], repsMin, repsMax, lastRirEff, targetRir,
  //         step, doubleStep, bodyweight }
  //   doubleStep — вето §3 «RIR_eff ≥ 3 → подвійний крок» (лише об'єктивний
  //                режим; у решті режимів запас уже врахований через %1RM)
  //   bodyweight — §2.1: `weight` — це додатковий вантаж, і 0 законний.
  //                Саме тут живе перехід «стеля повторів → +крок вантажу»:
  //                ADVANCE додає `step` до 0 і повертає повтори на `repsMin`,
  //                тобто окремої гілки для цього не треба — правило §2 уже
  //                таке. Змінюється рівно одне: нижня межа `weight`.
  //
  //   { ok, code, decision, ruleId, weight, repsTarget, miss, fact, rirEff }
  //   decision: ADVANCE | CONSOLIDATE | GROW | MISS

  function progressionDecision(opts) {
    var o = opts || {};
    var out = {
      ok: false, code: "BAD_INPUT", decision: null, ruleId: null,
      weight: null, repsTarget: null, miss: false, fact: null, rirEff: null
    };
    var sets = Array.isArray(o.setsReps) ? o.setsReps : null;
    if (!sets || !sets.length) { out.code = "NO_HISTORY"; return out; }

    var bw = (o.bodyweight === true) || isBodyweight(o.exercise);
    // §2.1: «вантажу не було» і «вагу не ввели» — це для такої вправи одне й
    // те саме, і означає воно 0, а не помилку. Для решти вправ 0 лишається
    // помилкою: штанга без ваги не існує.
    var wPrev = bw ? (isNum(o.weight) ? o.weight : 0) : o.weight;
    if (!isNum(wPrev) || (bw ? wPrev < 0 : wPrev <= 0)) { out.code = "BAD_WEIGHT"; return out; }

    if (!isNum(o.repsMin) || !isNum(o.repsMax) || o.repsMin < 1 || o.repsMax < o.repsMin) {
      out.code = "BAD_RANGE"; return out;
    }

    // «Факт» діапазону — НАЙГІРШИЙ сет: double progression закривається лише
    // тоді, коли reps_max дали ВСІ сети (§2).
    var fact = null;
    for (var i = 0; i < sets.length; i++) {
      if (!isNum(sets[i]) || sets[i] < 0) { out.code = "BAD_REPS"; return out; }
      if (fact === null || sets[i] < fact) fact = sets[i];
    }

    // §9.2, те саме правило заповнення: RIR не введений → цільовий RIR тижня.
    // ⚑ Немає й цілі — беремо 0: це блокує ADVANCE, тобто помилка йде в бік
    // «не додати вагу», а не «додати без підстав».
    var rirEffVal = isNum(o.lastRirEff) ? o.lastRirEff
      : (isNum(o.targetRir) ? o.targetRir : 0);
    var step = isNum(o.step) ? o.step : 0;

    out.ok = true;
    out.code = "OK";
    out.fact = fact;
    out.rirEff = rirEffVal;

    var allMax = fact >= o.repsMax;

    if (allMax && rirEffVal >= 1) {
      var mult = (o.doubleStep && rirEffVal >= VETO_DOUBLE_STEP_RIR) ? 2 : 1;
      out.decision = "ADVANCE";
      out.ruleId = (mult === 2) ? "ADVANCE_DOUBLE_STEP" : "ADVANCE_DOUBLE";
      out.weight = fixKg(wPrev + mult * step);
      out.repsTarget = o.repsMin;
      return out;
    }
    if (allMax) {
      // RIR_eff = 0 — вето §3: підвищення заблоковане, ціль та сама.
      out.decision = "CONSOLIDATE";
      out.ruleId = "CONSOLIDATE_RIR0";
      out.weight = fixKg(wPrev);
      out.repsTarget = o.repsMax;
      return out;
    }
    if (fact >= o.repsMin) {
      out.decision = "GROW";
      out.ruleId = "GROW_REPS";
      out.weight = fixKg(wPrev);
      out.repsTarget = Math.min(fact + 1, o.repsMax);
      return out;
    }
    out.decision = "MISS";
    out.ruleId = "MISS_BELOW_RANGE";
    out.weight = fixKg(wPrev);         // §2: НЕ знижувати вагу одразу
    out.repsTarget = o.repsMin;
    out.miss = true;
    return out;
  }

  // ------------------------------------------------------------------
  // §3 — три режими прескрипції
  // ------------------------------------------------------------------
  //
  // opts: {
  //   trust, e1rm, repsTarget, targetRir,
  //   sAdj  — §11.2, 1.00 для 1-ї вправи сесії
  //   grid  — сітка §1
  //   prev: { weight, setsReps, lastRirEff, repsMin, repsMax, step }
  //   bodyweight / exercise — §2.1, вправа без зовнішньої ваги
  // }
  //
  //   objective (<0.45)   base = вага прогресії §2 (RIR лише як вето)
  //   mixed (0.45…0.7)    base = 50/50 (вага §1 через %1RM, вага прогресії)
  //   autoreg (>0.7)      base = вага §1 через %1RM
  //
  // §2.1 — четвертий шлях, поза трьома режимами §3: у вправи з власною вагою
  // немає e1RM (§0.2), тому гілки «через %1RM» не існує взагалі, при
  // будь-якому `trust`. Лишається сама прогресія §2, і базою стає додатковий
  // вантаж: немає історії → 0, тобто «сьогодні працюєш власною вагою».
  //
  // Спільне для всіх трьох: раз помножили на S_adj, раз округлили (§1, §11.4).
  //
  // ⚑ Порожня історія: `prev` немає → рахувати «за фактичними повторами»
  // нема з чого. Замість відмови віддаємо вагу §1 з кодом NO_PREV — інакше
  // перша сесія власника не має ваги взагалі. Прапорець видно в `why`.

  function prescribe(opts) {
    var o = opts || {};
    var out = {
      ok: false, code: "BAD_INPUT", mode: null, ruleId: null,
      decision: null, repsTarget: null, n: null, branch: null,
      trust: null, tAdj: null, sAdj: null,
      rirBase: null, doubleBase: null, base: null,
      raw: null, weight: null, rounding: null, progression: null, why: null,
      bodyweight: false, highN: false
    };

    var bw = (o.bodyweight === true) || isBodyweight(o.exercise);
    var trust = isNum(o.trust) ? clamp(o.trust, TRUST_MIN, 1) : 0;
    var mode = modeFor(trust);
    var sAdj = isNum(o.sAdj) ? o.sAdj : 1;
    var ta = tAdj(trust);

    out.mode = mode;
    out.trust = trust;
    out.tAdj = ta;
    out.sAdj = sAdj;
    out.bodyweight = bw;

    // 1. Гілка прогресії §2 — вона ж задає ціль повторів наступної сесії.
    var prog = null;
    if (o.prev && typeof o.prev === "object") {
      prog = progressionDecision({
        weight: o.prev.weight,
        setsReps: o.prev.setsReps,
        repsMin: o.prev.repsMin,
        repsMax: o.prev.repsMax,
        lastRirEff: o.prev.lastRirEff,
        targetRir: o.targetRir,
        step: o.prev.step,
        doubleStep: (mode === "objective"),
        bodyweight: bw
      });
      out.progression = prog;
      if (prog.ok) {
        out.decision = prog.decision;
        out.doubleBase = prog.weight;
      }
    }

    var repsT = (prog && prog.ok) ? prog.repsTarget : o.repsTarget;
    if (!isNum(repsT) || repsT < 1) { out.code = "BAD_REPS_TARGET"; return out; }
    var n = repsT + (isNum(o.targetRir) ? o.targetRir : 0);
    var p = pct1rmInfo(n);
    out.repsTarget = repsT;
    out.n = n;
    if (p.ok) out.branch = p.branch;

    // 2. Гілка §1 — %1RM по тій самій двогілковій інверсії, без окремої таблиці.
    // §2.1: для вправи з власною вагою цієї гілки немає — навіть якщо в
    // metrics випадково лежить число, воно порахуване не з тієї величини.
    if (!bw && isNum(o.e1rm) && o.e1rm > 0 && p.ok) {
      out.rirBase = o.e1rm * p.value * ta;
    }

    // 3. Змішування за режимом.
    var base = null;
    var code = "OK";
    var ruleId = null;
    // Етап 3: при n > 12 сет не оновлює e1RM (§0), тож e1RM цієї вправи для
    // такого діапазону застиглий за побудовою — він міг лишитись з іншої
    // цілі. Є історія — вагу веде сама прогресія §2 (спершу повтори, потім
    // вага; ACSM 2009) при будь-якому trust; немає — e1RM лишається тільки
    // стартовою точкою, як і раніше.
    var highN = !bw && isNum(n) && n > E1RM_MAX_N;
    out.highN = highN;
    if (highN && out.doubleBase !== null) {
      ruleId = "PRESCRIBE_HIGH_N";
      base = out.doubleBase;
    } else if (bw) {
      // §2.1: вантаж веде тільки §2. Порожня історія — це не відмова, а
      // нормальний старт: власна вага без вантажу.
      ruleId = "PRESCRIBE_BODYWEIGHT";
      if (out.doubleBase !== null) {
        base = out.doubleBase;
      } else {
        base = 0;
        code = "NO_PREV";
      }
    } else if (mode === "objective") {
      ruleId = "PRESCRIBE_OBJECTIVE";
      if (out.doubleBase !== null) {
        base = out.doubleBase;
      } else if (out.rirBase !== null) {
        base = out.rirBase; code = "NO_PREV";
      }
    } else if (mode === "mixed") {
      ruleId = "PRESCRIBE_MIXED";
      if (out.doubleBase !== null && out.rirBase !== null) {
        base = 0.5 * (out.rirBase + out.doubleBase);
      } else if (out.rirBase !== null) {
        base = out.rirBase; code = "NO_PREV";
      } else if (out.doubleBase !== null) {
        base = out.doubleBase; code = "NO_E1RM";
      }
    } else {
      ruleId = "PRESCRIBE_AUTOREG";
      if (out.rirBase !== null) {
        base = out.rirBase;
      } else if (out.doubleBase !== null) {
        base = out.doubleBase; code = "NO_E1RM";
      }
    }

    out.ruleId = ruleId;
    if (base === null) {
      out.code = (prog && !prog.ok) ? prog.code : "NO_BASIS";
      out.why = {
        ruleId: ruleId, mode: mode,
        inputs: { trust: trust, e1rm: isNum(o.e1rm) ? o.e1rm : null, n: n, sAdj: sAdj }
      };
      return out;
    }

    // §1 + §11.4: множники незалежні, округлення РІВНО ОДИН РАЗ, після обох.
    //
    // §2.1: S_adj до додаткового вантажу НЕ застосовується. Причина та сама,
    // що й у e1RM: S_adj — це відсоток від УСЬОГО навантаження підходу, а
    // вантаж — його маленька частина. 0.95 від 5 кг пояса після округлення
    // вниз дає 3.75 кг, тобто −25% замість −5%; при вантажі 0 множник узагалі
    // ні на що не діє. Внутрішньосесійна втома в таких вправах виходить у
    // повтори (§2) і в цільовий RIR, а не в вагу.
    var raw = bw ? base : base * sAdj;
    out.base = base;
    out.raw = raw;
    out.ok = true;
    out.code = code;

    if (o.grid && o.grid.kind && o.grid.kind !== "none") {
      var r = roundDown(raw, o.grid);
      out.rounding = r;
      out.weight = r.weight;
      if (!r.ok) { out.ok = false; out.code = r.code; }
    } else {
      out.weight = raw;
    }

    out.why = {
      ruleId: ruleId, mode: mode,
      inputs: {
        trust: trust, e1rm: bw ? null : (isNum(o.e1rm) ? o.e1rm : null),
        n: n, repsTarget: repsT, tAdj: ta, sAdj: sAdj,
        sAdjApplied: !bw,                 // §2.1
        highN: highN,                     // етап 3: n > 12 — без %1RM
        bodyweight: bw,                   // §2.1: вага — це додатковий вантаж
        decision: out.decision,
        prevWeight: (o.prev && isNum(o.prev.weight)) ? o.prev.weight
          : (bw ? 0 : null),
        note: (code === "OK") ? null : code
      }
    };
    return out;
  }

  // §3, авторегуляція: сет 1 дав RIR на 2+ вище цілі → +2.5–5% негайно.
  // §11.4: застосовується ПІСЛЯ S_adj і має пріоритет (факт сильніший за
  // прогноз), тому на вхід іде вже готовий `raw` з prescribe().
  //
  // ⚑ §3 дає діапазон «+2.5–5%», не число. Розкладаємо детерміновано по
  // самому надлишку: рівно 2 → 2.5%, 3 і більше → 5%. Обидва кінці діапазону
  // §3 використані, проміжних значень не вигадуємо.
  function sessionCorrection(opts) {
    var o = opts || {};
    var out = {
      applies: false, code: "OK", ruleId: null, mode: null,
      excess: null, bump: 0, raw: isNum(o.raw) ? o.raw : null,
      weight: null, rounding: null
    };
    if (!isNum(o.raw) || o.raw <= 0) { out.code = "BAD_INPUT"; return out; }

    var mode = modeFor(isNum(o.trust) ? o.trust : 0);
    out.mode = mode;

    if (!isNum(o.firstSetRirEff) || !isNum(o.targetRir)) { out.code = "NO_RIR"; return out; }
    var excess = o.firstSetRirEff - o.targetRir;
    out.excess = excess;

    if (mode !== "autoreg") { out.code = "MODE_OFF"; return out; }
    if (excess < AUTOREG_RIR_EXCESS) { out.code = "NO_EXCESS"; return out; }

    var bump = (excess >= AUTOREG_RIR_EXCESS + 1) ? AUTOREG_BUMP_HI : AUTOREG_BUMP_LO;
    var raw = o.raw * (1 + bump);
    out.applies = true;
    out.ruleId = "RIR_AUTOREG_BUMP";
    out.bump = bump;
    out.raw = raw;

    if (o.grid && o.grid.kind && o.grid.kind !== "none") {
      var r = roundDown(raw, o.grid);
      out.rounding = r;
      out.weight = r.weight;
      if (!r.ok) out.code = r.code;
    } else {
      out.weight = raw;
    }
    return out;
  }

  // ==================================================================
  // §2 / §6 / §6.1 — лічильники між сесіями і драбина плато
  // ==================================================================
  //
  // Крок 6 закрив саме РІШЕННЯ §2 (ADVANCE / CONSOLIDATE / GROW / MISS) —
  // воно дивиться рівно на одну минулу сесію й не пам'ятає нічого. Те, що
  // §2 дописує в кінці («miss++; при miss == 2 → драбина плато §6»), вимагає
  // стану, який переживає сесії. Він живе тут.
  //
  // Числа — з docs/ALGO.md дослівно:
  //   §2    miss == 2 → драбина плато; вагу НЕ знижувати одразу;
  //   §6    плато = 3 сесії поспіль без приросту (Δe1RM ≤ 0 І повтори не зросли);
  //         5 щаблів строго за порядком, кожен наступний — тільки якщо
  //         попередній не дав;
  //   §6    щабель 2 — зсув діапазону 6–10 → 10–15 (або → 4–6, якщо застій у
  //         повторах, а не у вазі), 2 тижні, РОЗРИВАЄ e1RM-тренд (§0.1);
  //   §6    щабель 3 — технічна варіація при −10% ваги, 2 тижні, e1RM окремо;
  //   §6    щабель 4 — ранній дельоуд (форсований T2) + ретест на 95%;
  //   §6    щабель 5 — заміна anchor з переносом e1RM (§5);
  //   §6.1  щабель 1 ≤ 2 тижні; після — примусово на 2 (або 3, якщо 2 вже був
  //         у цьому мезоциклі), НАВІТЬ якщо є запас до MAV_eff; додані сети
  //         знімаються;
  //   §6.1  Δповторів > 0 І Δвага = 0 три сесії поспіль — це НЕ прогрес;
  //         щабель 1 блокується до кінця мезоцикла; виняток — факт уже на
  //         reps_max і чекає ADVANCE;
  //   §10.2 щабель 1 заблокований, якщо обсяг м'яза ≥ MAV_eff.
  //
  // Сховище — docs/DATA.md → `metrics.plateau[exerciseId]`. Той самий слот,
  // що вже описаний ескізом `{ streak, step }`; поля дописані, форма та сама.
  // Усі функції ЧИСТІ: читають переданий `metrics`, повертають НОВИЙ об'єкт.
  // Запис у сховище — справа UI-кроку через Store.setMetrics (store.js не
  // чіпаємо: він і так возить metrics як непрозорий JSON).
  //
  // Позначкою «⚑ рішення реалізації» помічено те, про що ALGO.md мовчить.

  var PLATEAU_STREAK = 3;         // §6: 3 сесії поспіль без приросту
  var MISS_TO_LADDER = 2;         // §2: при miss == 2 → драбина плато
  var STEP1_MAX_WEEKS = 2;        // §6.1: щабель 1 активний ≤ 2 тижні
  var STEP_MAX_WEEKS = 2;         // §6: щаблі 2 і 3 — «2 тижні»
  var REPS_CREEP_SESSIONS = 3;    // §6.1: 3 сесії поспіль повзучих повторів
  var TECH_WEIGHT_DROP = 0.10;    // §6, щабель 3: −10% ваги
  var RETEST_PCT = 0.95;          // §6, щабель 4: ретест на 95% застряглої ваги
  var LADDER_LAST_STEP = 5;       // §6: щаблів рівно 5
  var ANCHOR_MIN_RIR = 1;         // §4: anchor ніколи не йде до відмови

  // §6, щабель 3: «пауза 2 с АБО темп 3-0-1». Обидва варіанти §6, свого не
  // додаємо — вибір лишається за власником, алгоритм лише пропонує пару.
  var TECH_VARIANTS = ["pause_2s", "tempo_3_0_1"];

  // Драбина діапазонів для щабля 2. Числа — з §2 (силовий anchor 4–6,
  // гіпертрофійний anchor 6–10) і §6 (6–10 → 10–15). Обидва приклади §6
  // лежать на цій драбині як сусідні пари: 6–10 → 10–15 угору,
  // 6–10 → 4–6 вниз.
  var RANGE_LADDER = [[4, 6], [6, 10], [10, 15]];

  function nonNegInt(x) {
    return (isNum(x) && x > 0) ? Math.floor(x) : 0;
  }

  // ------------------------------------------------------------------
  // Запис стану вправи (docs/DATA.md → metrics.plateau[exerciseId])
  // ------------------------------------------------------------------

  function emptyPlateau() {
    return {
      streak: 0,          // §6: сесій поспіль без приросту
      miss: 0,            // §2: лічильник MISS МІЖ СЕСІЯМИ
      step: 0,            // 0 = драбина не активна, 1…5 — щабель §6
      stepWeeks: 0,       // §6.1: тижнів на поточному щаблі
      repsCreep: 0,       // §6.1: сесій поспіль «повтори ростуть, вага стоїть»
      weightMoved: 0,     // скільки разів вага рухалась усередині застою
      step1Blocked: false,// §6.1: щабель 1 заблокований до кінця мезоцикла
      stepsUsed: [],      // §6.1: які щаблі вже були в ЦЬОМУ мезоциклі
      mesoId: null,       // до якого мезоцикла прив'язані прапорці вище
      range: null,        // діапазон після зсуву §6, щабель 2
      lastE1rm: null,     // база для Δe1RM
      lastWeight: null,
      lastReps: null
    };
  }

  function normPlateau(rec) {
    var r = (rec && typeof rec === "object") ? rec : {};
    var i, s;

    var used = [];
    if (Array.isArray(r.stepsUsed)) {
      for (i = 0; i < r.stepsUsed.length; i++) {
        s = r.stepsUsed[i];
        if (isNum(s) && s >= 1 && s <= LADDER_LAST_STEP && used.indexOf(Math.floor(s)) < 0) {
          used.push(Math.floor(s));
        }
      }
      used.sort(function (a, b) { return a - b; });
    }

    var range = null;
    if (Array.isArray(r.range) && r.range.length === 2 &&
        isNum(r.range[0]) && isNum(r.range[1]) &&
        r.range[0] >= 1 && r.range[1] >= r.range[0]) {
      range = [r.range[0], r.range[1]];
    }

    return {
      streak: nonNegInt(r.streak),
      miss: nonNegInt(r.miss),
      step: clamp(nonNegInt(r.step), 0, LADDER_LAST_STEP),
      stepWeeks: nonNegInt(r.stepWeeks),
      repsCreep: nonNegInt(r.repsCreep),
      weightMoved: nonNegInt(r.weightMoved),
      step1Blocked: r.step1Blocked === true,
      stepsUsed: used,
      mesoId: (r.mesoId === undefined) ? null : r.mesoId,
      range: range,
      lastE1rm: (isNum(r.lastE1rm) && r.lastE1rm > 0) ? r.lastE1rm : null,
      // §2.1: 0 — законна остання вага (вправа з власною вагою, вантажу ще
      // не було). Відкидати її як «немає даних» означало б, що перехід
      // «0 → перший блін» ніколи не видно лічильникам §6.
      lastWeight: (isNum(r.lastWeight) && r.lastWeight >= 0) ? r.lastWeight : null,
      lastReps: (isNum(r.lastReps) && r.lastReps >= 0) ? r.lastReps : null
    };
  }

  // metrics → запис вправи. Вхід НІКОЛИ не мутується.
  function plateauFrom(metrics, exerciseId) {
    var m = (metrics && typeof metrics === "object") ? metrics : {};
    var p = (m.plateau && typeof m.plateau === "object") ? m.plateau : {};
    return normPlateau(p[exerciseId]);
  }

  // запис вправи → НОВИЙ metrics. Сусідні секції (e1rm, weeklyVolume,
  // fatigue) переносяться як є — тут не місце їх переписувати.
  function plateauInto(metrics, exerciseId, rec) {
    var m = (metrics && typeof metrics === "object") ? metrics : {};
    var out = {}, k;
    for (k in m) if (Object.prototype.hasOwnProperty.call(m, k)) out[k] = m[k];
    var p = (m.plateau && typeof m.plateau === "object") ? m.plateau : {};
    var np = {};
    for (k in p) if (Object.prototype.hasOwnProperty.call(p, k)) np[k] = p[k];
    np[exerciseId] = normPlateau(rec);
    out.plateau = np;
    return out;
  }

  // §5: «Новий рух — новий ряд вимірів, тому лічильник miss (§2) і позиція в
  // драбині плато (§6) для нього стартують з нуля.»
  function plateauReset(metrics, exerciseId) {
    return plateauInto(metrics, exerciseId, emptyPlateau());
  }

  // ------------------------------------------------------------------
  // §6 — вибір щабля
  // ------------------------------------------------------------------

  // Чому щабель недоступний. null = доступний.
  function stepBlockReason(c, s, opts) {
    var o = opts || {};
    if (s === 1) {
      if (c.step1Blocked) return "STEP1_CREEP_BLOCKED";      // §6.1
      if (o.volumeBlocked === true) return "STEP1_VOLUME_BLOCKED"; // §10.2
      if (o.mavRoom === false) return "STEP1_NO_MAV_ROOM";   // §6: «якщо є запас до MAV_eff»
      return null;
    }
    // §6.1: «на крок 2 (або 3, якщо крок 2 уже був у цьому мезоциклі)»
    if ((s === 2 || s === 3) && c.stepsUsed.indexOf(s) >= 0) return "STEP_ALREADY_USED";
    return null;
  }

  function pickStep(c, from, opts) {
    var skipped = [];
    for (var s = Math.max(1, from); s <= LADDER_LAST_STEP; s++) {
      var why = stepBlockReason(c, s, opts);
      if (!why) return { step: s, skipped: skipped };
      skipped.push({ step: s, code: why });
    }
    // Вище 5 щаблів немає: §6 закінчується заміною anchor'а.
    return { step: LADDER_LAST_STEP, skipped: skipped };
  }

  function setStep(c, s) {
    c.step = s;
    c.stepWeeks = 0;
    if (s >= 1 && c.stepsUsed.indexOf(s) < 0) {
      c.stepsUsed.push(s);
      c.stepsUsed.sort(function (a, b) { return a - b; });
    }
    return c;
  }

  // ------------------------------------------------------------------
  // §2 / §6 / §6.1 — одна сесія вправи в лічильники
  // ------------------------------------------------------------------
  //
  // obs: {
  //   decision   — ADVANCE | CONSOLIDATE | GROW | MISS (з progressionDecision)
  //   e1rm       — значення тренду ПІСЛЯ цієї сесії (§0)
  //   weight     — w_base сесії (§11.4: саме база, не знижена S_adj денна)
  //   reps       — факт діапазону (найгірший сет, як у §2)
  //   repsMax    — верх діапазону; потрібен для винятку §6.1
  //   mesoId     — мезоцикл (docs/DATA.md → program.mesoId)
  //   mavRoom, volumeBlocked — чи доступний щабель 1 (§6, §10.2)
  // }
  //
  //   { ok, code, ruleId, record, trigger, streak, miss, repsCreep, step,
  //     dE1rm, noProgress, plateau, entered, skipped }
  //   trigger: null | "STREAK" | "MISS" | "REPS_CREEP"

  function plateauObserve(rec, obs) {
    var o = obs || {};
    var c = normPlateau(rec);
    var out = {
      ok: false, code: "BAD_INPUT", ruleId: null, record: c,
      trigger: null, streak: c.streak, miss: c.miss, repsCreep: c.repsCreep,
      step: c.step, dE1rm: null, noProgress: false, plateau: false,
      entered: false, skipped: []
    };

    var dec = o.decision;
    if (dec !== null && dec !== undefined &&
        ["ADVANCE", "CONSOLIDATE", "GROW", "MISS"].indexOf(dec) < 0) {
      out.code = "BAD_DECISION";
      return out;
    }

    // ⚑ Зміна мезоцикла скидає рівно ті прапорці, які §6.1 сам обмежує
    // словами «в цьому мезоциклі» / «до кінця мезоцикла». streak, miss і
    // позиція на драбині — властивості ВПРАВИ, не мезоцикла, тому лишаються.
    if (o.mesoId !== undefined && o.mesoId !== null &&
        c.mesoId !== null && o.mesoId !== c.mesoId) {
      c.step1Blocked = false;
      c.stepsUsed = [];
    }
    if (o.mesoId !== undefined && o.mesoId !== null) c.mesoId = o.mesoId;

    var bw = (o.bodyweight === true) || isBodyweight(o.exercise);
    // Етап 3: діапазон, з якого e1RM не оновлюється (n > 12, §0), міряється
    // так само, як власна вага (§2.1): вагою й повторами, а не Δe1RM. Інакше
    // dE завжди null, і такі вправи ніколи не потрапили б у драбину.
    var loadBased = bw || o.loadBased === true;

    var e = (!loadBased && isNum(o.e1rm) && o.e1rm > 0) ? o.e1rm : null;
    var w = isNum(o.weight) && (bw ? o.weight >= 0 : o.weight > 0) ? o.weight : null;
    var reps = isNum(o.reps) ? o.reps : null;

    var dE = (e !== null && c.lastE1rm !== null) ? fix6(e - c.lastE1rm) : null;
    var repsGrew = (reps !== null && c.lastReps !== null) && reps > c.lastReps;
    var weightSame = (w !== null && c.lastWeight !== null) &&
      Math.abs(w - c.lastWeight) <= GRID_EPS;
    var weightChanged = (w !== null && c.lastWeight !== null) && !weightSame;
    var weightGrew = (w !== null && c.lastWeight !== null) && w > c.lastWeight + GRID_EPS;

    // §6: «Плато = 3 сесії поспіль без приросту (Δe1RM ≤ 0 І повтори не
    // зросли)». Першої точки порівнювати нема з чим — вона не «без приросту»,
    // вона просто перша.
    //
    // §2.1: у вправи з власною вагою e1RM немає (§0.2), і на дослівному
    // правилі §6 `dE === null` завжди, тобто щабель STREAK не спрацював би
    // ніколи — підтягування могли б стояти на 8 повторах роками. Тому для
    // таких вправ місце Δe1RM займає та сама величина, якою вимірюється їхній
    // прогрес: додатковий вантаж. «Без приросту» = вантаж не зріс І повтори
    // не зросли. Це не нове правило, а те саме §6 у власних одиницях.
    var first, noProgress;
    if (loadBased) {
      first = (c.lastReps === null && c.lastWeight === null);
      noProgress = !first && !weightGrew && !repsGrew;
    } else {
      first = (dE === null);
      noProgress = !first && dE <= 0 && !repsGrew;
