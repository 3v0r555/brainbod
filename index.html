  function getSettings() {
    try {
      return (window.Store && Store.getSection("settings")) || {};
    } catch (e) { return {}; }
  }

  function saveSettingsPatch(patch) {
    try {
      if (!window.Store || typeof Store.setSection !== "function") return false;
      var cur = getSettings();
      for (var k in patch) {
        if (patch.hasOwnProperty(k)) cur[k] = patch[k];
      }
      Store.setSection("settings", cur);
      return true;
    } catch (e) { return false; }
  }

  // ------------------------------------------------------------------
  // Обладнання: постійний набір + тимчасове зняття на сьогодні
  // ------------------------------------------------------------------
  //
  // Два різні поняття, які легко сплутати, і саме тому вони в різних полях:
  //   settings.equipment      — що є в залі ВЗАГАЛІ (онбординг + картка в
  //                             Налаштуваннях). Змінюється рідко;
  //   settings.equipmentToday — чого сьогодні немає під рукою (турнік у дощ,
  //                             зайнята стійка). Живе рівно один календарний
  //                             день — тим самим правилом, що й draftWorkout
  //                             (isSameLocalDay: не сьогоднішній запис
  //                             викидається мовчки).
  //
  // Алгоритм (js/algo-program.js → equipmentOk) чекає МАСИВ рядків або
  // не-масив; не-масив там означає «фільтра немає, доступне все». Порожній
  // масив означає протилежне — недоступне НІЧОГО, тобто порожня сесія. Тому
  // порожнеча тут ніде не доїжджає до алгоритму як [] : або конкретний
  // список, або null.

  function equipmentList() {
    var s = getSettings();
    if (!Array.isArray(s.equipment)) return [];
    return s.equipment.filter(function (x) { return typeof x === "string" && x; });
  }

  // Постійний набір у вигляді, який розуміє алгоритм. null = «ще не
  // налаштовано» = доступне все: рівно так застосунок поводився до появи цієї
  // картки, і мовчазна зміна поведінки на старих станах була б гіршою за
  // відсутність фільтра.
  function equipmentOrNull() {
    var list = equipmentList();
    return list.length ? list : null;
  }

  // Зняте на сьогодні. Не сьогоднішній запис — викидається, як чернетка.
  function equipmentOffToday() {
    try {
      var rec = getSettings().equipmentToday;
      if (!rec || !Array.isArray(rec.ids) || !rec.ids.length || !rec.at) return [];
      if (!isSameLocalDay(rec.at, new Date().toISOString())) {
        saveSettingsPatch({ equipmentToday: null });
        return [];
      }
      return rec.ids.slice();
    } catch (e) { return []; }
  }

  function setEquipmentOffToday(ids) {
    var clean = [];
    (ids || []).forEach(function (id) { if (id && clean.indexOf(id) === -1) clean.push(id); });
    return saveSettingsPatch({
      equipmentToday: clean.length ? { at: new Date().toISOString(), ids: clean } : null
    });
  }

  // Список, з якого взагалі можна щось знімати сьогодні: постійний набір, а
  // поки він не заданий — усе, що є в базі вправ.
  function equipmentPool() {
    return equipmentOrNull() || equipmentIdsFromDb();
  }

  // Ефективний набір на сьогодні = постійний МІНУС знятий. Саме він іде в
  // generateSession() і в скоринг §5.2 — постійні налаштування при цьому не
  // змінюються жодним записом.
  function effectiveEquipment() {
    var off = equipmentOffToday();
    if (!off.length) return equipmentOrNull();
    var pool = equipmentPool();
    var out = pool.filter(function (id) { return off.indexOf(id) === -1; });
    // Порожньо не буває: зняти все екран не дає. Але стан міг прийти імпортом
    // з іншого пристрою — тоді краще проігнорувати зняття, ніж віддати
    // алгоритму [] і отримати сесію без жодної вправи.
    return out.length ? out : equipmentOrNull();
  }

  // Дзеркало AlgoProgram.equipmentOk (js/algo-program.js): рядок і входження в
  // список; масив там не приймається взагалі. Своєї логіки тут бути не може —
  // інакше екран показував би одне, а генератор рахував інше.
  function exAvailable(ex, eff) {
    if (!Array.isArray(eff)) return true;
    var e = ex && ex.equipment;
    if (typeof e !== "string") return false;
    return eff.indexOf(e) >= 0;
  }

  // §5: anchor-слоти живуть у program.anchors і заблоковані на мезоцикл.
  // generateSession() їх САМА не обирає — приймає готовими (`o.anchors`), і без
  // них у сесії немає жодного anchor'а взагалі: перевірено 2026-08-03, усі
  // items виходили kind:"assistance". Тому набір обирається один раз
  // (pickAnchors, §5) і зберігається; далі його тримає anchor-lock.
  function ensureAnchors() {
    try {
      if (!window.Store || !window.AlgoProgram || typeof AlgoProgram.pickAnchors !== "function") {
        return null;
      }
      var program = Store.getSection("program") || {};
      var cur = program.anchors;
      var hasCur = (Array.isArray(cur) && cur.length > 0) ||
        (cur && typeof cur === "object" && !Array.isArray(cur) && Object.keys(cur).length > 0);
      if (hasCur) return cur;
      var res = AlgoProgram.pickAnchors({
        exercises: getExerciseLibrary(), equipment: equipmentOrNull()
      });
      program.anchors = res.anchors;
      Store.setSection("program", program);
      return res.anchors;
    } catch (e) { return null; }
  }

  // Постійний набір змінився → §5 дозволяє замінити anchor з причиною
  // EQUIPMENT. Рішення приймає pickAnchors(), якій віддаємо поточні слоти як
  // `current`: усе, що ще доступне, вона лишає на місці (anchor-lock).
  function repickAnchors() {
    try {
      if (!window.Store || !window.AlgoProgram || typeof AlgoProgram.pickAnchors !== "function") {
        return;
      }
      var program = Store.getSection("program") || {};
      var res = AlgoProgram.pickAnchors({
        exercises: getExerciseLibrary(),
        equipment: equipmentOrNull(),
        current: program.anchors
      });
      program.anchors = res.anchors;
      Store.setSection("program", program);
    } catch (e) { /* лишаємо попередній набір — гірше було б стерти його */ }
  }

  // ------------------------------------------------------------------
  // Етап 8 — біль і «не пропонувати» (ALGO §14)
  // ------------------------------------------------------------------
  //
  // Рішення приймає алгоритм: AlgoProgram.activeAvoid (які позначки діють
  // сьогодні) і AlgoProgram.avoidReasonOf (чи відсіяна вправа). Тут лише
  // запис позначок у settings.pain і показ. Позначка «лише сьогодні» несе
  // локальну дату й назавтра перестає діяти сама (і прибирається при
  // наступному записі).

  var PAIN_DISCLAIMER = "Це не медична порада; гострий, сильний або тривалий біль — до лікаря.";
  var painScope = "today";   // що обрано в перемикачі «Лише сьогодні / Постійно»

  function localDay(d) {
    var x = d || new Date();
    function p2(n) { return (n < 10 ? "0" : "") + n; }
    return x.getFullYear() + "-" + p2(x.getMonth() + 1) + "-" + p2(x.getDate());
  }

  function getPain() {
    var p = getSettings().pain || {};
    return {
      zones: Array.isArray(p.zones) ? p.zones.slice() : [],
      exercises: Array.isArray(p.exercises) ? p.exercises.slice() : []
    };
  }

  function livePainMark(m, today) {
    return !!m && (m.scope === "always" || (m.scope === "today" && m.day === today));
  }

  function savePain(p) {
    var today = localDay();
    var clean = {
      zones: p.zones.filter(function (m) { return livePainMark(m, today); }),
      exercises: p.exercises.filter(function (m) { return livePainMark(m, today); })
    };
    return saveSettingsPatch({ pain: clean });
  }

  function painMarkOf(list, key, val) {
    var today = localDay();
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i][key] === val && livePainMark(list[i], today)) return list[i];
    }
    return null;
  }

  // scope: "today" | "always" | null (зняти)
  function setZonePain(zone, scope) {
    var p = getPain();
    p.zones = p.zones.filter(function (m) { return !m || m.zone !== zone; });
    if (scope) p.zones.push({ zone: zone, scope: scope, day: localDay() });
    return savePain(p);
  }

  function setExerciseAvoid(id, scope) {
    var p = getPain();
    p.exercises = p.exercises.filter(function (m) { return !m || m.id !== id; });
    if (scope) p.exercises.push({ id: id, scope: scope, day: localDay() });
    return savePain(p);
  }

  function currentAvoid() {
    try {
      if (!window.AlgoProgram || typeof AlgoProgram.activeAvoid !== "function") return null;
      return AlgoProgram.activeAvoid(getPain(), localDay());
    } catch (e) { return null; }
  }

  function zoneLabel(z) {
    var names = (window.AlgoProgram && AlgoProgram.ZONE_NAME) || {};
    var n = names[z] || z;
    return n.charAt(0).toUpperCase() + n.slice(1);
  }

  function scopeLabel(sc) { return sc === "always" ? "постійно" : "лише сьогодні"; }

  function painScopeRow(onChange) {
    var row = onbChipRow();
    [["today", "Лише сьогодні"], ["always", "Постійно"]].forEach(function (opt) {
      row.appendChild(onbChip(opt[1], painScope === opt[0], function () {
        painScope = opt[0];
        onChange();
      }));
    });
    return row;
  }

  // Картка «Щось болить?» — на «Сьогодні» і в «Ще». Зміна позначок скидає
  // ще не почату чернетку (як і зміна обладнання): сесія збереться заново.
  function renderPainCard(container, screenId) {
    if (!window.AlgoProgram || !Array.isArray(AlgoProgram.JOINT_ZONES)) return;
    var card = makeCard();
    card.appendChild(makeSectionTitle("Щось болить?"));
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-2)";
    hint.textContent = "Позначте, що болить, — вправи, які навантажують це місце, не пропонуватимуться, " +
      "а замість них буде схожа вправа без нього.";
    card.appendChild(hint);
    var disc = document.createElement("p");
    disc.className = "pain-disclaimer";
    disc.style.marginBottom = "var(--space-3)";
    disc.style.fontWeight = "700";
    disc.textContent = PAIN_DISCLAIMER;
    card.appendChild(disc);

    function rerender() { renderScreen(screenId); }
    card.appendChild(painScopeRow(rerender));

    var pain = getPain();
    var row = onbChipRow();
    row.style.marginTop = "var(--space-2)";
    AlgoProgram.JOINT_ZONES.forEach(function (z) {
      var mark = painMarkOf(pain.zones, "zone", z);
      row.appendChild(onbChip(zoneLabel(z), !!mark, function () {
        var r = setZonePain(z, mark ? null : painScope);
        if (r === false) { window.alert("Не вдалось зберегти позначку."); return; }
        dropUntouchedDraft();
        rerender();
      }));
    });
    card.appendChild(row);

    // Активні позначки — з терміном дії і кнопкою «Зняти».
    var lib = exIndexOf(getExerciseLibrary());
    var active = [];
    var today = localDay();
    pain.zones.forEach(function (m) {
      if (livePainMark(m, today)) active.push({ text: "Болить: " + zoneLabel(m.zone).toLowerCase() + " — " + scopeLabel(m.scope),
        off: function () { return setZonePain(m.zone, null); } });
    });
    pain.exercises.forEach(function (m) {
      if (!livePainMark(m, today)) return;
      var nm = lib[m.id] ? lib[m.id].name : m.id;
      active.push({ text: "Не пропонувати: «" + nm + "» — " + scopeLabel(m.scope),
        off: function () { return setExerciseAvoid(m.id, null); } });
    });
    if (active.length) {
      var t = document.createElement("p");
      t.style.fontWeight = "700";
      t.style.marginTop = "var(--space-4)";
      t.textContent = "Діє зараз";
      card.appendChild(t);
      active.forEach(function (a) {
        var r = document.createElement("div");
        r.className = "list-row";
        var p = document.createElement("p");
        p.className = "text-dim";
        p.textContent = a.text;
        r.appendChild(p);
        var b = document.createElement("button");
        b.type = "button";
        b.className = "btn btn-secondary";
        b.textContent = "Зняти";
        b.addEventListener("click", function () {
          if (a.off() === false) { window.alert("Не вдалось зняти позначку."); return; }
          dropUntouchedDraft();
          rerender();
        });
        r.appendChild(b);
        card.appendChild(r);
      });
    }
    // Редизайн фаза Б: на «Сьогодні» — згорнуто в один рядок (розгорнуто,
    // якщо позначки діють). Уміст той самий.
    if (screenId === "home") foldCard(card, "Щось болить?" + (active.length ? " · діє: " + active.length : ""), active.length > 0);
    container.appendChild(card);
  }

  // Переносить уміст картки (крім першого заголовка) у згортку.
  function foldCard(card, title, open) {
    var kids = card.children.slice ? card.children.slice() : Array.prototype.slice.call(card.children);
    var fold = document.createElement("details");
    fold.className = "fold";
    if (open) { fold.open = true; fold.setAttribute("open", ""); }
    var sum = document.createElement("summary");
    sum.className = "fold-sum";
    sum.textContent = title;
    fold.appendChild(sum);
    kids.forEach(function (k, i) {
      card.removeChild(k);
      if (i === 0 && k.tagName === "H2") return;
      fold.appendChild(k);
    });
    card.appendChild(fold);
  }

  // Перемикання йде ЧЕРЕЗ AlgoProgram.modeSwitch (§13.4) — вона може
  // відхилити перемикання (дебаунс 28 днів) або сказати, що стрибок через
  // два кроки закриває мезоцикл достроково. У settings пишемо тільки те,
  // що ця функція дозволила; текст пояснення — її, не свій.
  function tryModeSwitch(target) {
    try {
      if (!window.AlgoProgram || typeof AlgoProgram.modeSwitch !== "function") {
        window.alert("Перемикання режиму недоступне: алгоритм не завантажений.");
        return;
      }
      var settings = getSettings();
      var program = (window.Store && Store.getSection("program")) || {};
      var calibration = (window.Store && Store.getSection("calibration")) || {};
      var nowIso = new Date().toISOString();
      var daysSince = null;
      if (settings.modeSwitchedAt) {
        daysSince = Math.floor((Date.now() - new Date(settings.modeSwitchedAt).getTime()) / 86400000);
      }
      // Евристика: окремого календаря тренувальних тижнів застосунок не
      // веде, тому межею тижня трактуємо dayIndex === 1 поточного шаблону.
      var atWeekBoundary = program.dayIndex === 1;

      var plan = AlgoProgram.modeSwitch({
        from: settings.mode, to: target,
        daysSinceLastSwitch: daysSince,
        atWeekBoundary: atWeekBoundary,
        trust: isNum(calibration.trust) ? calibration.trust : null
      });

      window.alert(plan.why || "Перемикання оброблено.");

      if (plan.ok && plan.code !== "DEBOUNCE" && plan.code !== "SAME_MODE") {
        saveSettingsPatch({ mode: plan.to, modeSwitchedAt: nowIso });
      }
      renderScreen("settings");
    } catch (e) {
      window.alert("Помилка перемикання режиму: " + (e && e.message ? e.message : String(e)));
    }
  }

  var goalDraft = null;   // незастосовані галочки в Налаштуваннях

  function renderModeCard(container) {
    var settings = getSettings();
    var card = makeCard();
    card.appendChild(makeSectionTitle("Цілі тренувань"));

    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = (settings.mode
      ? "Зараз: " + (MODE_INFO[settings.mode] ? MODE_INFO[settings.mode].label : settings.mode) + ". "
      : "Цілі не обрано — діапазони й обсяг за замовчуванням, а відпочинок рахується як для сили + гіпертрофії. ") +
      "Позначте одну або кілька — повтори, обсяг і відпочинок підлаштуються самі.";
    card.appendChild(hint);

    var goals = goalDraft || (settings.mode ? goalsOf(settings.mode) : ["str", "hyp"]);
    renderGoalRows(card, goals, function (key) {
      var next = toggleGoal(goals, key);
      if (!next) return;
      goalDraft = next;
      renderScreen("settings");
    });

    var target = modeOfGoals(goals);
    var nums = target ? modeNumbersLine(target) : null;
    var sum = document.createElement("p");
    sum.className = "text-dim";
    sum.textContent = (target && MODE_INFO[target] ? "Разом: " + MODE_INFO[target].label + ". " : "") + (nums || "");
    card.appendChild(sum);
    if (goals.length === 1 && goals[0] === "end") {
      var en = document.createElement("p");
      en.className = "text-faint";
      en.textContent = END_ONLY_NOTE;
      card.appendChild(en);
    }
    if (target && target !== settings.mode) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn btn-primary";
      btn.style.marginTop = "var(--space-3)";
      btn.textContent = "Застосувати цілі";
      btn.addEventListener("click", function () { goalDraft = null; tryModeSwitch(target); });
      card.appendChild(btn);
    }

    container.appendChild(card);
  }

  // ---------- Етап 3, п.6: розклад і стеля часу на кожен день ----------
  var WEEKDAY_SHORT = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
  var WEEKDAY_FULL = ["понеділок", "вівторок", "середа", "четвер", "п'ятниця", "субота", "неділя"];
  // Крок і межа степера хвилин — ті самі, що були в картці бюджету (5 і 240).
  var BUDGET_STEP_MIN = 5;
  var BUDGET_MAX_MIN = 240;
  var BUDGET_CEILING_NOTE = "Хвилини — це максимум, а не план: програма ставить стільки підходів, " +
    "скільки потрібно для ваших цілей, а скорочує лише тоді, коли не вміщається, — спершу " +
    "допоміжні вправи, основні не чіпає.";
  // ACSM 2009 (Progression Models in Resistance Training, MSSE 41:687–708):
  // 2–3 дні/тиждень для початківців, 3–4 — для середнього рівня (~6 місяців
  // регулярних тренувань). Посилання — docs/ALGO.md, §13.5 «Розклад».
  var FREQ_NOTE = "Скільки днів: Американський коледж спортивної медицини (ACSM, 2009) радить " +
    "2–3 тренування на тиждень на початку і 3–4 — приблизно після пів року регулярних тренувань.";

  // Дні поза межами схем §7 (менше двох) живуть лише в чернетці — у сховище
  // потрапляє тільки розклад, з якого можна зібрати програму.
  var scheduleDraft = null;

  function trainWord(n) { return n >= 5 ? "тренувань" : "тренування"; }

  function copyBudgets(b) {
    var o = {};
    for (var k in b) if (b.hasOwnProperty(k)) o[k] = b[k];
    return o;
  }

  function scheduleBounds() {
    var C = coreC();
    return {
      lo: isNum(C.ONBOARD_DAYS_MIN) ? C.ONBOARD_DAYS_MIN : 2,
      hi: isNum(C.ONBOARD_DAYS_MAX) ? C.ONBOARD_DAYS_MAX : 5
    };
  }

  function budgetStepper(label, val, onSet) {
    var cur = (isNum(val) && val > 0) ? val : 0;
    // «—» замість «без обмеження»: довгий текст ламав рядок на телефоні.
    return stepperRow(label, cur,
      function (v) { return v > 0 ? String(v) : "—"; },
      function () { onSet(Math.max(0, cur - BUDGET_STEP_MIN)); },
      function () { onSet(Math.min(BUDGET_MAX_MIN, cur + BUDGET_STEP_MIN)); }).row;
  }

  function dayBudgetText(bud) {
    if (!bud) return "";
    var wd = isNum(bud.weekday) ? WEEKDAY_FULL[bud.weekday - 1] : null;
    var day = wd ? "Сьогодні " + wd : "Сьогодні";
    var lim = bud.budgetMin ? "максимум " + bud.budgetMin + " хв." : "без обмеження за часом.";
    if (bud.source === "schedule") return day + " — у розкладі, " + lim;
    if (bud.source === "unplanned") {
      return day + " — не в розкладі, але тренуватись можна; " +
        (bud.budgetMin ? "ліміт для інших днів — " + bud.budgetMin + " хв." : "без обмеження за часом.");
    }
    return day + ": " + lim;
  }

  // Спільний редактор для онбордингу й Налаштувань: чіпи днів + ліміт на
  // кожен обраний день. sched = { days, budgets }; onChange(next).
  function renderScheduleEditor(card, sched, defBudget, onChange) {
    var bd = scheduleBounds();
    var days = sched.days.slice();
    var row = onbChipRow();
    WEEKDAY_SHORT.forEach(function (lab, i) {
      var d = i + 1;
      var on = days.indexOf(d) >= 0;
      row.appendChild(onbChip(lab, on, function () {
        var next = { days: days.slice(), budgets: copyBudgets(sched.budgets || {}) };
        if (on) {
          next.days.splice(next.days.indexOf(d), 1);
          delete next.budgets[String(d)];
        } else {
          if (next.days.length >= bd.hi) {
            window.alert("Програма має схеми на " + bd.lo + "–" + bd.hi + " тренувань на тиждень. " +
              "Зніміть один із днів, а в додатковий день тренуватись можна й без розкладу.");
            return;
          }
          next.days.push(d);
          next.days.sort(function (a, b) { return a - b; });
          // Новий день успадковує загальний ліміт (старий budgetMin): розклад
          // з'являється без втрати того, що людина вже налаштувала.
          next.budgets[String(d)] = (isNum(defBudget) && defBudget > 0) ? defBudget : null;
        }
        onChange(next);
      }));
    });
    card.appendChild(row);

    if (days.length < bd.lo) {
      onbNote(card, days.length
        ? "Позначте ще " + (bd.lo - days.length) + " — програма розрахована щонайменше на " + bd.lo + " тренування на тиждень."
        : "Позначте дні, коли реально можете тренуватись (від " + bd.lo + " до " + bd.hi + ").", "warn");
      return;
    }
    try {
      var t = AlgoProgram.templateFor(days.length);
      onbNote(card, days.length + " " + trainWord(days.length) + " на тиждень. Схема: " +
        t.days.map(function (f) { return FOCUS_LABEL[f] || f; }).join(" · ") +
        ". Хвилини на кожен день нижче; «—» — без обмеження за часом.");
    } catch (e) { /* без підказки, редактор лишається робочим */ }

    days.forEach(function (d) {
      card.appendChild(budgetStepper(WEEKDAY_SHORT[d - 1] + ", хвилин", sched.budgets ? sched.budgets[String(d)] : null,
        function (v) {
          var next = { days: days.slice(), budgets: copyBudgets(sched.budgets || {}) };
          next.budgets[String(d)] = v > 0 ? v : null;
          onChange(next);
        }));
    });
  }

  function renderBudgetCard(container) {
    var settings = getSettings();
    var card = makeCard();
    card.appendChild(makeSectionTitle("Розклад і час на тренування"));

    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "У які дні ви можете тренуватись і скільки хвилин максимум на кожен. " + BUDGET_CEILING_NOTE;
    card.appendChild(hint);

    var saved = (window.AlgoCore && typeof AlgoCore.normSchedule === "function")
      ? AlgoCore.normSchedule(settings.schedule) : null;
    if (!saved && !scheduleDraft) {
      var dpw = isNum(settings.daysPerWeek) ? settings.daysPerWeek : 4;
      onbNote(card, "Розклад ще не задано: зараз програма на " + dpw + " " + trainWord(dpw) +
        " на тиждень, а ліміт нижче діє в будь-який день («—» — без обмеження).");
    }
    var bd = scheduleBounds();
    renderScheduleEditor(card, scheduleDraft || saved || { days: [], budgets: {} }, settings.budgetMin, function (next) {
      if (next.days.length >= bd.lo && next.days.length <= bd.hi) {
        scheduleDraft = null;
        // daysPerWeek виводиться з розкладу. Посеред тижня це безпечно:
        // generateSession обмежує день схеми, programAfterSession закриває тиждень.
        saveSettingsPatch({ schedule: next, daysPerWeek: next.days.length });
      } else {
        scheduleDraft = next;
      }
      renderScreen("settings");
    });

    var other = budgetStepper(saved ? "Інші дні, хвилин" : "Хвилин", settings.budgetMin, function (v) {
      saveSettingsPatch({ budgetMin: v > 0 ? v : null });
      renderScreen("settings");
    });
    other.style.marginTop = "var(--space-3)";
    card.appendChild(other);
    if (saved) onbNote(card, "Тренуватись можна й у день поза розкладом — тоді діє цей ліміт.");

    try {
      onbNote(card, dayBudgetText(AlgoProgram.budgetForDate(settings, new Date())));
    } catch (e) { /* без рядка про сьогодні */ }

    var fq = document.createElement("p");
    fq.className = "text-faint";
    fq.style.marginTop = "var(--space-2)";
    fq.textContent = FREQ_NOTE;
    card.appendChild(fq);
    container.appendChild(card);
  }

  // Банер стану сховища: future / corrupt / unavailable / onError.
  function renderStoreBanner(container) {
    var status = storeInitResult ? storeInitResult.status : null;
    var warning = storeInitResult ? storeInitResult.warning : null;

    var messages = [];
    if (status === "future" || status === "corrupt") {
      messages.push({
        text: (warning && warning.message) ||
          "Запис у сховище заблоковано. Зробіть експорт зараз.",
        danger: true
      });
    } else if (status === "unavailable") {
      messages.push({
        text: (warning && warning.message) ||
          "Сховище браузера недоступне — дані НЕ зберігаються.",
        danger: true
      });
    }
    if (storeErrorMsg) {
      messages.push({ text: storeErrorMsg, danger: true });
    }

    if (messages.length === 0) {
      return;
    }

    var card = makeCard();
    card.style.borderColor = "var(--color-danger)";
    messages.forEach(function (m) {
      var p = document.createElement("p");
      p.style.color = "var(--color-danger)";
      p.style.fontWeight = "700";
      p.textContent = m.text;
      card.appendChild(p);
    });
    container.appendChild(card);
  }

  // Обладнання (етап 2): постійний набір і «сьогодні немає». Ідентифікатори
  // беруться з бази вправ (equipmentIdsFromDb), підписи — EQUIPMENT_LABEL.
  // Поки набір не задано, доступне все (equipmentOrNull) — тому й чіпи в
  // такому разі всі ввімкнені, а зняття одного лишає решту.
  // Зміна постійного набору перевибирає anchor'и через pickAnchors (§5,
  // причина EQUIPMENT): усе, що лишилось доступним, стоїть на місці.
  function renderEquipmentCard(container) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Обладнання"));
    var all = equipmentIdsFromDb();
    var base = equipmentOrNull() || all.slice();

    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "Що є у вашому залі. Від цього залежать вправи в тренуваннях, зокрема основні.";
    card.appendChild(hint);

    var row = onbChipRow();
    all.forEach(function (id) {
      var on = base.indexOf(id) >= 0;
      row.appendChild(onbChip(EQUIPMENT_LABEL[id] || id, on, function () {
        var next = base.slice();
        var i = next.indexOf(id);
        if (i >= 0) {
          if (next.length === 1) {
            window.alert("Хоча б один пункт має лишитись — інакше програму нема з чого зібрати.");
            return;
          }
          next.splice(i, 1);
        } else {
          next.push(id);
        }
        next.sort();
        var r = saveSettingsPatch({ equipment: next });
        if (r === false) {
          window.alert("Не вдалось зберегти набір обладнання.");
          return;
        }
        // Знятий постійно пункт не може лишатись «знятим на сьогодні».
        var off = equipmentOffToday().filter(function (x) { return next.indexOf(x) >= 0; });
        setEquipmentOffToday(off);
        repickAnchors();
        dropUntouchedDraft();
        renderScreen("settings");
      }));
    });
    card.appendChild(row);

    var todayTitle = document.createElement("p");
    todayTitle.style.fontWeight = "700";
    todayTitle.style.marginTop = "var(--space-4)";
    todayTitle.textContent = "Сьогодні немає під рукою";
    card.appendChild(todayTitle);

    var todayHint = document.createElement("p");
    todayHint.className = "text-dim";
    todayHint.style.marginBottom = "var(--space-3)";
    todayHint.textContent = "Лише на сьогодні: зайнятий тренажер, дощ над турніком. " +
      "Основні вправи від цього не змінюються, завтра позначка зникне сама.";
    card.appendChild(todayHint);

    var pool = equipmentPool();
    var offNow = equipmentOffToday();
    var row2 = onbChipRow();
    pool.forEach(function (id) {
      var isOff = offNow.indexOf(id) >= 0;
      row2.appendChild(onbChip(EQUIPMENT_LABEL[id] || id, isOff, function () {
        var next = offNow.slice();
        var i = next.indexOf(id);
        if (i >= 0) next.splice(i, 1);
        else {
          if (next.length + 1 >= pool.length) {
            window.alert("Зняти все не можна — тоді тренуванню нема з чого скластись.");
            return;
          }
          next.push(id);
        }
        setEquipmentOffToday(next);
        dropUntouchedDraft();
        renderScreen("settings");
      }));
    });
    card.appendChild(row2);
    container.appendChild(card);
  }

  // Етап 6: маса тіла — НЕОБОВ'ЯЗКОВЕ поле (docs/DATA.md → settings.bodyMassKg).
  // Потрібна лише «Прогресу» (ALGO §0.3): оцінка максимуму для віджимань і
  // підтягувань. На ваги в тренуванні не впливає. null = не вказано.
  var BODY_MASS_START = 70;   // ⚑ інтерфейс: з чого починає перший дотик степера

  function bodyMassOf(settings) {
    return (window.AlgoCore && typeof AlgoCore.normBodyMass === "function")
      ? AlgoCore.normBodyMass(settings && settings.bodyMassKg) : null;
  }

  // Степер у стилі онбордингу (без клавіатури): −10 / −1 / значення / +1 / +10.
  function bodyMassRow(value, onSet) {
    var C = coreC();
    var lo = isNum(C.BODY_MASS_MIN) ? C.BODY_MASS_MIN : 30;
    var hi = isNum(C.BODY_MASS_MAX) ? C.BODY_MASS_MAX : 250;
    return probeWeightRow("Вага тіла, кг", value, 1, function (v) {
      var next = isNum(value) ? v : BODY_MASS_START;
      onSet(Math.min(hi, Math.max(lo, Math.round(next * 10) / 10)));
    });
  }

  function renderBodyMassCard(container) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Вага тіла"));
    var cur = bodyMassOf(getSettings());
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "Необов'язково. Якщо вказати, «Прогрес» покаже оцінку максимуму для віджимань і " +
      "підтягувань (частка ваги тіла + вантаж). На ваги в тренуваннях не впливає. Зберігається лише на " +
      "цьому пристрої.";
    card.appendChild(hint);
    card.appendChild(bodyMassRow(cur, function (v) {
      if (saveSettingsPatch({ bodyMassKg: v }) === false) {
        window.alert("Не вдалось зберегти вагу тіла.");
        return;
      }
      renderScreen("settings");
    }));
    if (cur !== null) {
      var clr = document.createElement("button");
      clr.type = "button";
      clr.className = "btn btn-secondary";
      clr.style.marginTop = "var(--space-3)";
      clr.textContent = "Не вказувати";
      clr.addEventListener("click", function () {
        if (saveSettingsPatch({ bodyMassKg: null }) === false) {
          window.alert("Не вдалось зберегти.");
          return;
        }
        renderScreen("settings");
      });
      card.appendChild(clr);
    } else {
      card.appendChild(makeStatusLine("Не вказано — «Прогрес» показує для цих вправ лише повтори.", false));
    }
    container.appendChild(card);
  }

  // §3.1 (етап 2): рівень не питається — показуємо, що про нього вже відомо
  // з калібрування, і як він уточнюється.
  function renderLevelCard(container) {
    if (!window.AlgoCore || typeof AlgoCore.experienceFromCalibration !== "function") return;
    var card = makeCard();
    card.appendChild(makeSectionTitle("Рівень підготовки"));
    var cal = (window.Store && Store.getSection("calibration")) || {};
    var lvl = AlgoCore.experienceFromCalibration(cal);
    var p = document.createElement("p");
    p.className = "text-dim";
    if (!lvl.level) {
      p.textContent = "Визначається автоматично, питати не будемо. Раз на 7–10 днів останній " +
        "підхід однієї основної вправи буде «на максимум» — так застосунок звіряє ваше відчуття " +
        "запасу з фактом. Проб: " + lvl.probes + " з " + lvl.need + ". До того ваги ведуться " +
        "обережно — за фактичними повторами.";
    } else {
      p.textContent = "За " + lvl.probes + " пробами: " +
        (lvl.level === "intermediate"
          ? "ваша оцінка запасу близька до факту — рівень упевнений."
          : "запас у підходах зазвичай більший, ніж здається, — рівень початковий.") +
        " Уточнюється далі з кожною пробою.";
    }
    card.appendChild(p);
    if (isNum(cal.rirBias)) {
      var b = document.createElement("p");
      b.className = "text-faint";
      b.style.marginTop = "var(--space-2)";
      b.textContent = "Поправка до вашої оцінки запасу повторів: " +
        (cal.rirBias > 0 ? "+" : "") + (Math.round(cal.rirBias * 100) / 100) + ".";
      card.appendChild(b);
    }
    container.appendChild(card);
  }

  // Набір обладнання змінився → сьогоднішня чернетка зібрана під старий.
  // Без жодного виконаного сета вона викидається, і тренування збереться
  // заново; почату не чіпаємо — там уже записані підходи.
  function dropUntouchedDraft() {
    try {
      var d = workoutState || loadDraft();
      if (!d || !d.ok) return;
      var touched = (d.items || []).some(function (it) {
        return (it.sets || []).some(function (s) { return s && s.done; });
      });
      if (touched) return;
      workoutState = null;
      detailIndex = null;
      anchorOverrideOpen = false;
      clearDraft();
    } catch (e) { /* чернетка лишиться як була — гірше було б зламати екран */ }
  }

  // ------------------------------------------------------------------
  // Етап 4: «Чому так?», екран «Джерела», частини тренування, зарядка
  // ------------------------------------------------------------------
  //
  // Посилання — звичайні <a target=_blank rel=noopener>: відкриваються в
  // браузері лише за дотиком людини, сам застосунок нічого не завантажує
  // (CLAUDE.md, правило 3; docs/РІШЕННЯ.md). Дані — js/sources.js.

  var PART_LABELS = { warmup: "Розминка", main: "Основна частина", cooldown: "Заминка" };
  var PART_ORDER = ["warmup", "main", "cooldown"];

  function bbSources() {
    return (window.BB_SOURCES && Array.isArray(window.BB_SOURCES.list)) ? window.BB_SOURCES : null;
  }
  function sourceById(id) {
    var s = bbSources();
    if (!s) return null;
    for (var i = 0; i < s.list.length; i++) if (s.list[i].id === id) return s.list[i];
    return null;
  }
  function topicById(id) {
    var s = bbSources();
    if (!s || !Array.isArray(s.topics)) return null;
    for (var i = 0; i < s.topics.length; i++) if (s.topics[i].id === id) return s.topics[i];
    return null;
  }
  function sourceHref(s) {
    if (!s) return null;
    if (s.doi) return "https://doi.org/" + s.doi;
    return s.url || null;
  }
  function makeSourceLink(s) {
    var href = sourceHref(s);
    if (!href) return null;
    var a = document.createElement("a");
    a.className = "src-link";
    a.setAttribute("href", href);
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
    a.textContent = s.doi ? "doi:" + s.doi : "відкрити";
    return a;
  }
  function renderSourceEntry(parent, s) {
    var p = document.createElement("p");
    p.className = "src-entry";
    var t = document.createElement("span");
    t.textContent = s.cite + (s.kind ? " [" + s.kind + "]" : "") + " ";
    p.appendChild(t);
    var a = makeSourceLink(s);
    if (a) p.appendChild(a);
    parent.appendChild(p);
  }

  // Згортний блок «Чому так?»: короткі пояснення + повні довідки + перехід
  // на екран «Джерела».
  function renderWhy(container, topicId) {
    var t = topicById(topicId);
    if (!t) return;
    var det = document.createElement("details");
    det.className = "workout-why-details";
    var sum = document.createElement("summary");
    sum.textContent = "Чому так?";
    det.appendChild(sum);
    var box = document.createElement("div");
    box.className = "workout-why";
    (t.text || []).forEach(function (par) {
      var p = document.createElement("p");
      p.className = "text-dim";
      p.style.marginBottom = "var(--space-2)";
      p.textContent = par;
      box.appendChild(p);
    });
    var h = document.createElement("p");
    h.className = "text-faint";
    h.textContent = "Джерела:";
    box.appendChild(h);
    (t.refs || []).forEach(function (id) {
      var s = sourceById(id);
      if (s) renderSourceEntry(box, s);
    });
    var all = document.createElement("button");
    all.type = "button";
    all.className = "btn btn-secondary";
    all.style.marginTop = "var(--space-2)";
    all.textContent = "Усі джерела";
    all.addEventListener("click", function () { location.hash = "#sources"; });
    // В онбордингу екран «Джерела» ще недоступний (майстер стоїть замість
    // усього інтерфейсу) — кнопка нічого б не зробила.
    if (!onboardingNeeded()) box.appendChild(all);
    det.appendChild(box);
    sheetify(det, t.title || "Чому так?");
    container.appendChild(det);
  }

  function renderSourcesScreen(container) {
    var src = bbSources();
    var intro = makeCard();
    var ip = document.createElement("p");
    ip.className = "text-dim";
    ip.textContent = src
      ? "На чому стоять правила програми. Посилання відкриваються в браузері, лише коли ви на них натискаєте, — сам застосунок нічого не завантажує. У квадратних дужках позначено джерела без рецензування. Посилання перевірено " + src.checked + "."
      : "Список джерел недоступний.";
    intro.appendChild(ip);
    container.appendChild(intro);
    if (!src) return;
    (src.topics || []).forEach(function (t) {
      var card = makeCard();
      card.appendChild(makeSectionTitle(t.title));
      (t.refs || []).forEach(function (id) {
        var s = sourceById(id);
        if (s) renderSourceEntry(card, s);
      });
      container.appendChild(card);
    });
    var back = document.createElement("button");
    back.type = "button";
    back.className = "btn btn-secondary";
    back.textContent = "Назад до налаштувань";
    back.addEventListener("click", function () { location.hash = "#settings"; });
    container.appendChild(back);
  }

  function renderDrillList(card, plan) {
    var gen = document.createElement("p");
    gen.style.fontWeight = "700";
    gen.textContent = "1. " + plan.generalMin + " хв легкого кардіо: швидка ходьба, велотренажер, скакалка — до легкого поту.";
    card.appendChild(gen);
    var head = document.createElement("p");
    head.style.fontWeight = "700";
    head.style.marginTop = "var(--space-2)";
    head.textContent = "2. Динамічні вправи (≈" + plan.drillSec + " с кожна):";
    card.appendChild(head);
    var ul = document.createElement("ul");
    ul.className = "warmup-list";
    plan.drills.forEach(function (d) {
      var li = document.createElement("li");
      li.textContent = d.name + " — " + d.dose;
      ul.appendChild(li);
    });
    card.appendChild(ul);
  }

  // Зарядка: стан тільки в пам'яті; ні генератора, ні запису, день програми
  // не рухається.
  function renderRechargeScreen(container) {
    var sessions = [];
    try { sessions = (window.Store && Store.getSessions()) || []; } catch (e) { sessions = []; }
    var plan = AlgoProgram.warmupPlan({
      focus: "full", equipment: effectiveEquipment(), sessionCount: sessions.length,
      count: AlgoProgram.C.RECHARGE_DRILLS
    });
    var card = makeCard();
    card.appendChild(makeSectionTitle("Зарядка ≈" + plan.min + " хв"));
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "Для дня, коли повного тренування не буде. Нічого не записується, програма не зсувається.";
    card.appendChild(hint);
    renderDrillList(card, plan);
    renderWhy(card, "recharge");
    var done = document.createElement("button");
    done.type = "button";
    done.className = "btn btn-primary";
    done.style.marginTop = "var(--space-3)";
    done.textContent = "Готово";
    done.addEventListener("click", function () { location.hash = "#home"; });
    card.appendChild(done);
    container.appendChild(card);
  }

  // Налаштування: частини тренування назавжди (settings.parts).
  function renderPartsCard(container) {
    var settings = getSettings();
    var parts = AlgoCore.normParts(settings.parts);
    var card = makeCard();
    card.appendChild(makeSectionTitle("Частини тренування"));
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "Що входить у кожне тренування. Розминка й заминка рахуються в ліміт часу. " +
      "На одне тренування частину можна вимкнути прямо на екрані тренування.";
    card.appendChild(hint);
    var row = onbChipRow();
    PART_ORDER.forEach(function (k) {
      row.appendChild(onbChip(PART_LABELS[k], parts[k], function () {
        var next = { warmup: parts.warmup, main: parts.main, cooldown: parts.cooldown };
        next[k] = !next[k];
        saveSettingsPatch({ parts: next });
        renderScreen("settings");
      }));
    });
    card.appendChild(row);
    var pp = AlgoProgram.partsPlan({ parts: parts, budgetMin: null });
    onbNote(card, "Розминка ≈" + AlgoProgram.partsPlan({ parts: { warmup: true } }).warmupMin +
      " хв, заминка " + AlgoProgram.C.COOLDOWN_MIN + " хв" +
      (pp.parts.cooldown ? "" : " (зараз вимкнена — користі для відновлення не доведено)") + ".");
    renderWhy(card, "warmup");
    container.appendChild(card);
  }

  function renderSourcesCard(container) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Джерела"));
    var p = document.createElement("p");
    p.className = "text-dim";
    p.style.marginBottom = "var(--space-3)";
    p.textContent = "Дослідження й рекомендації, на яких стоять правила програми, — з повними довідками й посиланнями.";
    card.appendChild(p);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-secondary";
    b.textContent = "Відкрити джерела";
    b.addEventListener("click", function () { location.hash = "#sources"; });
    card.appendChild(b);
    container.appendChild(card);
  }

  function anySetDone() {
    if (!workoutState || !Array.isArray(workoutState.items)) return false;
    return workoutState.items.some(function (it) {
      return (it.sets || []).some(function (s) { return !!s.done; });
    });
  }

  // Тренування: частини на сьогодні. Поки жодного підходу не записано,
  // сесія перебудовується (ліміт часу для основної частини змінюється);
  // після — лише ховаємо/показуємо розминку й заминку.
  function renderPartsToggle(container) {
    var parts = workoutState.parts || AlgoCore.normParts(null);
    var started = anySetDone();
    var card = makeCard();
    card.classList.add("parts-card");
    var t = document.createElement("p");
    t.className = "set-label";
    t.textContent = "Сьогодні в тренуванні";
    card.appendChild(t);
    var row = onbChipRow();
    PART_ORDER.forEach(function (k) {
      var locked = started && k === "main";
      var chip = onbChip(PART_LABELS[k], parts[k], function () {
        if (locked) return;
        var next = { warmup: parts.warmup, main: parts.main, cooldown: parts.cooldown };
        next[k] = !next[k];
        if (!started) {
          var st = buildWorkoutState(workoutState.readiness, next);
          if (st && st.ok) workoutState = st;
        } else {
          workoutState.parts = next;
          var db = workoutState.dayBudget;
          workoutState.partsPlan = AlgoProgram.partsPlan({ parts: next, budgetMin: db ? db.budgetMin : null });
        }
        persistDraft();
        renderScreen("workout");
      });
      if (locked) chip.disabled = true;
      row.appendChild(chip);
    });
    card.appendChild(row);
    if (started) onbNote(card, "Підходи вже записані, тож основну частину не вимкнути.");
    container.appendChild(card);
  }

  function renderWarmupCard(container) {
    var plan = workoutState.warmup;
    if (!plan || !plan.drills) return;
    var card = makeCard();
    // Згорнуто, щойно почались робочі підходи: розминка вже позаду.
    var fold = document.createElement("details");
    fold.className = "fold";
    if (!anySetDone()) fold.open = true;
    if (fold.open) fold.setAttribute("open", "");
    var fs = document.createElement("summary");
    fs.className = "fold-sum";
    fs.textContent = "Розминка ≈" + plan.min + " хв";
    fold.appendChild(fs);
    renderDrillList(fold, plan);
    var sp = document.createElement("p");
    sp.className = "text-dim";
    sp.style.marginTop = "var(--space-2)";
    sp.textContent = "3. Перед першою важкою вправою — 1–2 легші підходи (вказані в її картці), відпочинок між ними до 2 хв.";
    fold.appendChild(sp);
    renderWhy(fold, "warmup");
    card.appendChild(fold);
    container.appendChild(card);
  }

  function renderCooldownCard(container) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Заминка (за бажанням) — " +
      (isNum(workoutState.cooldownMin) ? workoutState.cooldownMin : 5) + " хв"));
    var p = document.createElement("p");
    p.className = "text-dim";
    p.textContent = "Спокійна ходьба або легка розтяжка — якщо вам так приємніше. " +
      "Чесно: на відновлення й біль у м'язах наступного дня заминка, за даними досліджень, не впливає.";
    card.appendChild(p);
    renderWhy(card, "cooldown");
    container.appendChild(card);
  }

  function renderDeloadWhyCard(container) {
    var card = makeCard();
    var p = document.createElement("p");
    p.style.fontWeight = "700";
    p.textContent = WEEK_EVENT_TEXT.DELOAD_STARTED;
    card.appendChild(p);
    renderWhy(card, "deload");
    container.appendChild(card);
  }

  function renderNoMainCard(container) {
    var card = makeCard();
    var p = document.createElement("p");
    p.className = "text-dim";
    p.style.marginBottom = "var(--space-3)";
    var on = PART_ORDER.filter(function (k) { return k !== "main" && workoutState.parts[k]; })
      .map(function (k) { return PART_LABELS[k].toLowerCase(); });
    p.textContent = "Основна частина сьогодні вимкнена" + (on.length ? " — лише " + on.join(" і ") + "." : ".") +
      " Такий день не записується в історію і не зсуває програму.";
    card.appendChild(p);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-primary";
    b.textContent = "Завершити без запису";
    b.addEventListener("click", function () {
      workoutState = null;
      readinessAnswer = undefined;
      detailIndex = null;
      anchorOverrideOpen = false;
      clearDraft();
      location.hash = "#home";
    });
    card.appendChild(b);
    container.appendChild(card);
  }

  // ------------------------------------------------------------------
  // Етап 8: резервна копія без акаунта. Логіка файлу (конверт, контрольна
  // сума, шифрування паролем) — у js/store.js (exportBackup/inspectBackup/
  // importBackup); тут лише показ. Жодних мережевих запитів.
  // ------------------------------------------------------------------

  function shortDate(iso) {
    if (typeof iso !== "string" || iso.length < 10) return "—";
    var p = iso.slice(0, 10).split("-");
    return p.length === 3 ? (p[2] + "." + p[1] + "." + p[0]) : iso;
  }

  function sessionsWord(n) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return "тренування";
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "тренування";
    return "тренувань";
  }

  function summaryText(sm) {
    if (!sm) return "—";
    if (!sm.sessions) return "тренувань немає";
    var t = sm.sessions + " " + sessionsWord(sm.sessions) + ", " + sm.sets + " підх.";
    if (sm.firstDate) t += " (" + shortDate(sm.firstDate) + " — " + shortDate(sm.lastDate) + ")";
    return t;
  }

  function makeTextInput(type, placeholder) {
    var inp = document.createElement("input");
    inp.type = type;
    inp.placeholder = placeholder;
    inp.setAttribute("aria-label", placeholder);
    inp.setAttribute("autocomplete", "new-password");
    inp.style.display = "block";
    inp.style.width = "100%";
    inp.style.boxSizing = "border-box";
    inp.style.padding = "var(--space-2)";
    inp.style.marginBottom = "var(--space-2)";
    inp.style.fontSize = "inherit";
    return inp;
  }

  function setStatus(line, text, isError) {
    line.textContent = text;
    line.style.display = "";
    line.style.color = isError ? "var(--color-danger)" : "var(--color-success)";
  }

  function readFileText(file) {
    if (file && typeof file.text === "function") return file.text();
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(String(reader.result || "")); };
      reader.onerror = function () { reject(new Error("read")); };
      reader.readAsText(file);
    });
  }

  // Тихе нагадування на «Сьогодні»: раз на Store.EXPORT_REMINDER_EVERY
  // збережених тренувань без копії (⚑ евристика, docs/DATA.md п.4).
  function renderBackupReminder(container) {
    if (!window.Store || typeof Store.needsExportReminder !== "function") return;
    var due = false;
    try { due = Store.needsExportReminder() && !Store.isLocked(); } catch (e) { due = false; }
    if (!due) return;
    var m = {};
    try { m = Store.meta() || {}; } catch (e) { m = {}; }
    var n = m.sessionsSinceExport || 0;
    var card = makeCard();
    card.className = "card backup-reminder";
    var p = document.createElement("p");
    p.className = "text-dim";
    p.textContent = "Після останньої резервної копії — " + n + " " + sessionsWord(n) +
      ". Дані є лише в цьому браузері; збережіть копію у файл.";
    card.appendChild(p);
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-secondary";
    b.style.marginTop = "var(--space-2)";
    b.textContent = "Зберегти копію";
    b.addEventListener("click", function () { location.hash = "#settings"; });
    card.appendChild(b);
    container.appendChild(card);
  }

  function renderBackupCards(container, locked) {
    // ---- Зберегти копію ----
    var exportCard = makeCard();
    exportCard.className = "card backup-card";
    exportCard.appendChild(makeSectionTitle("Резервна копія"));

    var exportHint = document.createElement("p");
    exportHint.className = "text-dim";
    exportHint.style.marginBottom = "var(--space-3)";
    exportHint.textContent = locked
      ? "Запис заблоковано, але дані все одно можна вивезти — саме зараз це варто зробити."
      : "Дані зберігаються лише в цьому браузері, акаунта немає. Збережіть копію у файл — на випадок " +
        "втрати телефона чи очищення браузера. Файл нікуди не надсилається.";
    exportCard.appendChild(exportHint);

    var meta = {};
    try { meta = Store.meta() || {}; } catch (e) { meta = {}; }
    if (!locked) {
      var since = meta.sessionsSinceExport || 0;
      exportCard.appendChild(makeStatusLine(meta.lastExportAt
        ? ("Остання копія: " + shortDate(meta.lastExportAt) + ". Після неї: " + since + " " + sessionsWord(since) + ".")
        : "Копію ще не зберігали.", false));
    }

    var exportStatus = makeStatusLine("");
    exportStatus.style.display = "none";

    function showExportStatus(text, isError) { setStatus(exportStatus, text, isError); }

    function getExportJSON() {
      // При future/corrupt звичайний exportJSON недоступний — беремо сирі дані.
      if (locked && window.Store && typeof Store.getBlockedRaw === "function") {
        var raw = Store.getBlockedRaw();
        if (raw) return raw;
      }
      return Store.exportJSON();
    }

    var pw1 = null, pw2 = null;
    if (!locked) {
      var pwHint = document.createElement("p");
      pwHint.className = "text-faint";
      pwHint.style.margin = "var(--space-3) 0 var(--space-2)";
      pwHint.textContent = "Пароль — необов'язково. Він ніде не зберігається: якщо забудете, файл не відкрити.";
      exportCard.appendChild(pwHint);
      pw1 = makeTextInput("password", "Пароль (необов'язково)");
      pw1.className = "backup-pw";
      pw2 = makeTextInput("password", "Повторіть пароль");
      pw2.className = "backup-pw2";
      exportCard.appendChild(pw1);
      exportCard.appendChild(pw2);
    }

    var btnRow = document.createElement("div");
    btnRow.style.display = "flex";
    btnRow.style.flexDirection = "column";
    btnRow.style.gap = "var(--space-3)";
    btnRow.style.marginTop = "var(--space-2)";

    var btnFile = document.createElement("button");
    btnFile.type = "button";
    btnFile.className = "btn btn-primary";
    btnFile.textContent = "Зберегти копію у файл";
    btnFile.addEventListener("click", function () {
      try {
        if (locked) {
          var raw = getExportJSON();
          var blob = new Blob([raw], { type: "application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "brainbod-blocked-" + Date.now() + ".json";
          a.style.display = "none";
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }, 0);
          showExportStatus("Файл збережено (сирі дані, запис заблоковано).", false);
          return;
        }
        var p1 = pw1.value || "", p2 = pw2.value || "";
        if (p1 !== p2) {
          showExportStatus("Паролі не збігаються.", true);
          return;
        }
        showExportStatus(p1 ? "Шифруємо…" : "Готуємо файл…", false);
        Store.exportBackup({ password: p1 || null }).then(function (res) {
          if (!res.ok && res.code === "NO_CRYPTO" && !p1) {
            // Без вбудованої криптографії (не https) — старий файл без суми.
            var old = Store.downloadFile();
            showExportStatus(old.ok ? ("Файл \"" + old.filename + "\" збережено (без контрольної суми).")
              : ("Не вдалось зберегти файл (" + old.code + ")."), !old.ok);
            return;
          }
          if (!res.ok) { showExportStatus(res.message || "Не вдалось створити копію.", true); return; }
          var d = Store.downloadText(res.text, res.filename);
          if (d.ok) {
            pw1.value = ""; pw2.value = "";
            showExportStatus("Файл \"" + res.filename + "\" збережено" + (res.encrypted ? " (з паролем)" : "") +
              ": " + summaryText(res.summary) + ".", false);
          } else {
            showExportStatus("Не вдалось зберегти файл (" + d.code + ").", true);
          }
        });
      } catch (e) {
        showExportStatus("Помилка збереження у файл.", true);
      }
    });
    var btnClip = document.createElement("button");
    btnClip.type = "button";
    btnClip.className = "btn btn-secondary";
    btnClip.textContent = "Копіювати в буфер";
    btnClip.addEventListener("click", function () {
      try {
        if (locked) {
          var raw = getExportJSON();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(raw).then(function () {
              showExportStatus("Скопійовано в буфер (сирі дані).", false);
            }, function () {
              showExportStatus("Не вдалось скопіювати.", true);
            });
          } else {
            showExportStatus("Буфер обміну недоступний у цьому браузері.", true);
          }
        } else {
          Store.copyToClipboard().then(function (res) {
            if (res.ok) {
              showExportStatus("Скопійовано в буфер.", false);
            } else {
              showExportStatus("Не вдалось скопіювати (" + res.code + ").", true);
            }
          });
        }
      } catch (e) {
        showExportStatus("Помилка копіювання в буфер.", true);
      }
    });

    btnRow.appendChild(btnFile);
    btnRow.appendChild(btnClip);
    exportCard.appendChild(btnRow);
    if (!locked) {
      exportCard.appendChild(makeStatusLine("«Копіювати в буфер» дає дані без пароля і без контрольної суми.", false));
    }
    exportCard.appendChild(exportStatus);
    container.appendChild(exportCard);

    // ---- Відновити з копії ----
    var importCard = makeCard();
    importCard.className = "card restore-card";
    importCard.appendChild(makeSectionTitle("Відновити з копії"));

    var importWarn = document.createElement("p");
    importWarn.style.color = "var(--color-danger)";
    importWarn.style.marginBottom = "var(--space-3)";
    importWarn.textContent =
      "Відновлення ЗАМІНЮЄ всі поточні дані даними з файлу. Спершу покажемо, що у файлі, — " +
      "нічого не зміниться, доки ви не підтвердите.";
    importCard.appendChild(importWarn);

    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "application/json,.json";
    fileInput.className = "restore-file";
    fileInput.style.marginBottom = "var(--space-3)";
    var pwIn = makeTextInput("password", "Пароль (якщо файл захищено)");
    pwIn.className = "restore-pw";
    pwIn.setAttribute("autocomplete", "current-password");

    var importStatus = makeStatusLine("");
    importStatus.style.display = "none";
    function showImportStatus(text, isError) { setStatus(importStatus, text, isError); }

    var preview = document.createElement("div");
    preview.className = "restore-preview";

    var btnCheck = document.createElement("button");
    btnCheck.type = "button";
    btnCheck.className = "btn btn-secondary";
    btnCheck.textContent = "Перевірити файл";
    btnCheck.addEventListener("click", function () {
      preview.innerHTML = "";
      var file = fileInput.files && fileInput.files[0];
      if (!file) { showImportStatus("Спочатку оберіть файл.", true); return; }
      showImportStatus("Перевіряємо…", false);
      var text = null;
      readFileText(file).then(function (t) {
        text = t;
        return Store.inspectBackup(t, { password: pwIn.value || "" });
      }).then(function (r) {
        if (!r.ok) { showImportStatus(r.message || ("Файл не підходить (" + r.code + ")."), true); return; }
        importStatus.style.display = "none";
        renderRestorePreview(preview, r, file.name, function () {
          showImportStatus("Відновлюємо…", false);
          return Store.importBackup(text, { password: pwIn.value || "", confirmed: true }).then(function (res) {
            if (res.ok) {
              preview.innerHTML = "";
              showImportStatus("Дані відновлено: " + summaryText(res.summary) + ". Оновлюємо екран…", false);
              setTimeout(function () {
                initStore();
                renderScreen("settings");
              }, 600);
            } else {
              showImportStatus(res.message || ("Помилка відновлення (" + res.code + ")."), true);
            }
          });
        });
      }, function () {
        showImportStatus("Не вдалось прочитати файл.", true);
      });
    });

    importCard.appendChild(fileInput);
    importCard.appendChild(pwIn);
    importCard.appendChild(btnCheck);
    importCard.appendChild(importStatus);
    importCard.appendChild(preview);
    container.appendChild(importCard);

    renderPersistCard(container);
  }

  // Попередній перегляд: що у файлі і що зараз. Кнопка заміни неактивна,
  // доки не поставлено позначку — без неї дані не перетираються.
  function renderRestorePreview(box, r, fileName, onConfirm) {
    var cur = Store.currentSummary();
    var lines = [
      "Файл: " + fileName,
      "У файлі: " + summaryText(r.summary) + (r.exportedAt ? ("; збережено " + shortDate(r.exportedAt)) : "") + ".",
      r.checksumOk === true ? "Контрольна сума збігається — файл не змінено."
        : "Старий формат без контрольної суми — цілісність перевірити не можна.",
      r.encrypted ? "Файл був захищений паролем — пароль підійшов." : null,
      "Зараз у застосунку: " + summaryText(cur) + "."
    ];
    for (var i = 0; i < lines.length; i++) {
      if (!lines[i]) continue;
      var p = document.createElement("p");
      p.className = i === 0 ? "text-faint" : "text-dim";
      p.style.marginTop = "var(--space-2)";
      p.textContent = lines[i];
      box.appendChild(p);
    }
    if ((r.summary.sessions || 0) < (cur.sessions || 0) || (r.summary.lastDate || "") < (cur.lastDate || "")) {
      box.appendChild(makeStatusLine("У файлі менше або старіші тренування, ніж зараз: новіші записи зникнуть.", true));
    }
    var lab = document.createElement("label");
    lab.style.display = "block";
    lab.style.margin = "var(--space-3) 0";
    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "restore-ok";
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(" Так, замінити мої поточні дані даними з файлу"));
    box.appendChild(lab);
    var go = document.createElement("button");
    go.type = "button";
    go.className = "btn btn-primary";
    go.textContent = "Замінити дані";
    go.disabled = true;
    cb.addEventListener("change", function () { go.disabled = !cb.checked; });
    go.addEventListener("click", function () {
      if (!cb.checked || go.disabled) return;
      go.disabled = true;
      onConfirm();
    });
    box.appendChild(go);
  }

  // navigator.storage.persist(): попросити браузер не стирати дані сам.
  function renderPersistCard(container) {
    if (!window.Store || !Store.persist) return;
    var card = makeCard();
    card.className = "card persist-card";
    card.appendChild(makeSectionTitle("Щоб браузер не стер дані"));
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "Коли бракує місця, браузер може сам очистити дані сайтів. Можна попросити його " +
      "не робити цього з нашими даними. Це не замінює резервну копію.";
    card.appendChild(hint);
    var st = makeStatusLine("", false);
    card.appendChild(st);
    var supported = Store.persist.supported();
    if (!supported) {
      st.textContent = "Цей браузер такого не вміє — тим важливіша резервна копія.";
      container.appendChild(card);
      return;
    }
    var known = Store.persist.status();
    st.textContent = known.granted ? "Зараз: браузер погодився не стирати дані." : "Зараз: браузер може стерти дані.";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn btn-secondary";
    btn.textContent = "Попросити браузер не стирати дані";
    btn.style.display = known.granted ? "none" : "";
    btn.addEventListener("click", function () {
      Store.persist.request({ force: true }).then(function (r) {
        if (r.granted) {
          setStatus(st, "Браузер погодився не стирати дані.", false);
          btn.style.display = "none";
        } else {
          setStatus(st, "Браузер поки відмовив. Це не помилка — спробуємо ще після наступних тренувань.", false);
        }
      });
    });
    card.appendChild(btn);
    Store.persist.isPersisted().then(function (v) {
      if (v) {
        st.textContent = "Зараз: браузер погодився не стирати дані.";
        btn.style.display = "none";
      }
    });
    container.appendChild(card);
  }

    // ---- Версія ----
    var versionCard = makeCard();
    versionCard.appendChild(makeSectionTitle("Про застосунок"));

    versionRow.className = "text-dim";
    versionRow.textContent = "Версія: " + APP_VERSION;
    versionCard.appendChild(versionRow);
    container.appendChild(versionCard);

    // ---- Оновити застосунок (аварійна кнопка) ----
    var updateCard = makeCard();
    updateCard.appendChild(makeSectionTitle("Оновити застосунок"));

    var updateHint = document.createElement("p");
    updateHint.className = "text-faint";
    updateHint.style.marginBottom = "var(--space-3)";
    updateHint.textContent =
      "Скидає кеш коду застосунку (Service Worker), якщо стара версія залипла. " +
      "Дані тренувань зберігаються окремо (localStorage) і від цього не зникають.";
    updateCard.appendChild(updateHint);

    var updateStatus = makeStatusLine("");
    updateStatus.style.display = "none";

    var btnUpdate = document.createElement("button");
    btnUpdate.type = "button";
    btnUpdate.className = "btn btn-secondary";
    btnUpdate.textContent = "Оновити застосунок";
    btnUpdate.addEventListener("click", function () {
      updateStatus.style.display = "";
      updateStatus.style.color = "var(--color-text-dim)";
      updateStatus.textContent = "Оновлюємо…";
      var tasks = [];
      try {
        if (window.caches && caches.keys) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            })
          );
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) { return r.unregister(); }));
            })
          );
        }
      } catch (e) { /* продовжуємо, reload все одно спрацює */ }

      Promise.all(tasks).then(function () {
        location.reload();
      }, function () {
        location.reload();
      });
    });

    updateCard.appendChild(btnUpdate);
    updateCard.appendChild(updateStatus);
    container.appendChild(updateCard);
  }

  // Середня дельта — бічна «шапка» плеча на обох видах.
  var BM_SIDE = "M23 52 C22 46 26 42 31 42 L29 50 Z";
  var BM_ZONE_CLASS = { low: "bm-hot", partial: "bm-mid", working: "bm-cold", fresh: "bm-cold" };

  function bodyMapClass(zones, key) {
    if (key.charAt(0) === "_") return "bm-base";
    return BM_ZONE_CLASS[zones[key]] || "bm-base";
  }

  function renderBodyMap(zones, opts) {
    var o = opts || {};
    var svg = svgEl("svg", { viewBox: "0 0 250 240", "class": "bodymap", role: "img",
      "aria-label": o.label || "Мапа м'язів: колір — готовність" });
    function figure(x0, parts, sideKey) {
      var g = svgEl("g", { transform: "translate(" + x0 + ",0)" });
      g.appendChild(svgEl("ellipse", { cx: 60, cy: 17, rx: 11, ry: 13, "class": "bm-base" }));
      g.appendChild(svgEl("path", { d: "M54 29 L66 29 L67 38 L53 38 Z", "class": "bm-base" }));
      [false, true].forEach(function (mirror) {
        var h = svgEl("g", mirror ? { transform: "translate(120,0) scale(-1,1)" } : {});
        for (var k in parts) {
          if (!parts.hasOwnProperty(k)) continue;
          h.appendChild(svgEl("path", { d: parts[k], "class": "bm-part " + bodyMapClass(zones, k) }));
        }
        h.appendChild(svgEl("path", { d: BM_SIDE, "class": "bm-part " + bodyMapClass(zones, sideKey) }));
        g.appendChild(h);
      });
      return g;
    }
    svg.appendChild(figure(0, BM_FRONT, "side_delt"));
    svg.appendChild(figure(130, BM_BACK, "side_delt"));
    var t1 = svgEl("text", { x: 60, y: 238, "text-anchor": "middle", "class": "bm-cap" });
    t1.textContent = "спереду";
    var t2 = svgEl("text", { x: 190, y: 238, "text-anchor": "middle", "class": "bm-cap" });
    t2.textContent = "ззаду";
    svg.appendChild(t1);
    svg.appendChild(t2);

  // Той самий виклик recoveryState, що на «Тренуванні» й «Обсязі».
  function recoveryNow() {
    var settings = Store.getSection("settings") || {};
    var exercises = Store.getSection("exercises");
    if (!exercises || !exercises.length) exercises = window.EX_DB || [];
    var sessions = Store.getSessions() || [];
    var program = Store.getSection("program") || {};
    var metrics = Store.getSection("metrics") || {};
    var idx = exIndexOf(exercises);
    var daysPerWeek = isNum(program.daysPerWeek) ? program.daysPerWeek
      : (isNum(settings.daysPerWeek) ? settings.daysPerWeek : 4);
    var dayIndex = isNum(program.dayIndex) ? program.dayIndex : 1;
    var nowIso = new Date().toISOString();
    var volumeDone = AlgoProgram.weeklyVolume(sessions, {
      weekKey: AlgoProgram.isoWeekKey(nowIso.slice(0, 10)), mesoId: program.mesoId, exercises: exercises, index: idx
    });
    return AlgoProgram.recoveryState({
      sessions: sessions, exercises: exercises, index: idx, nowH: nowIso,
      fatigue: metrics.fatigue, daysPerWeek: daysPerWeek, volumeDone: volumeDone,
      sessionsLeft: Math.max(1, daysPerWeek - dayIndex + 1),
      mode: settings.mode || undefined
    });
  }

  // Карта зон {м'яз: zone} і висновок одним рядком.
  function recoverySummary(rec) {
    var zones = {}, tired = [];
    var names = AlgoProgram.MUSCLE_NAME || {};
    (AlgoProgram.MUSCLES || []).forEach(function (k) {
      var m = (rec && rec.muscles && rec.muscles[k]) || {};
      zones[k] = rec && rec.cold ? "cold" : (m.zone || "unknown");
      if (zones[k] === "low" || zones[k] === "partial") tired.push(names[k] || k);
    });
    var line;
    if (rec && rec.cold) line = "Історії ще мало — стан м'язів з'явиться після кількох тренувань.";
    else if (!tired.length) line = "Усі м'язи готові.";
    else line = "Відновлюються: " + tired.join(", ") + ".";
    return { zones: zones, line: line, cold: !!(rec && rec.cold) };
  }

  // ------------------------------------------------------------------
  // Екран Active Workout
  // ------------------------------------------------------------------
  //
  // generateSession() (js/algo-program.js) НЕ будує стан відновлення сам —
  // приймає готовий recoveryState/recovery. Тут ми на відкритті екрана
  // рахуємо його через AlgoProgram.recoveryState({sessions, nowH, ...}),
  // яка вже реалізує §9.2/§9.3 (борг втоми, розпад) і §9.8 (холодний старт)
  // — окремо ці формули тут не переписуються.

  var workoutState = null; // тримається в пам'яті; дзеркалиться в Store (draftWorkout)
  var readinessAnswer; // undefined = ще не питали цього заходу; number 1..5 | null (пропущено)
  var DRAFT_SECTION = "draftWorkout";

  // Крок 10a — деталь вправи / swap. Локальний (не персистований) UI-стан:
  // detailIndex — який item з workoutState.items відкритий; anchorOverrideOpen —
  // чи натиснута кнопка ризикованої заміни anchor'а на цьому екрані.
  var detailIndex = null;
  var anchorOverrideOpen = false;
  // Редизайн фаза Б: який рядок підходу розгорнуто вручну ("i:s"; "none" —
  // усі згорнуті; null — розгорнуто поточний). Лише в пам'яті.
  var openSetKey = null;
  var scrollToCurrent = false;
  var restTick = 0;

  // Поточний підхід — перший незаписаний у порядку вправ.
  function currentSetPos() {
    if (!workoutState || !workoutState.items) return null;
    for (var i = 0; i < workoutState.items.length; i++) {
      var sets = workoutState.items[i].sets || [];
      for (var j = 0; j < sets.length; j++) if (!sets[j].done) return { item: i, set: j };
    }
    return null;
  }

  function fmtKg(v) {
    if (!isNum(v)) return "—";
    return String(Math.round(v * 100) / 100);
  }

  // «Ще змогли б» — 6 сегментів 0…5+ (ціль 49px на 390px). 6 — рідкісне
  // значення (розвантаження) — підсвічується як «5+» і не змінюється, поки
  // не обрати інше.
  function rirSegments(value, onPick) {
    var row = document.createElement("div");
    row.className = "rir-seg";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Ще змогли б, повторів");
    [0, 1, 2, 3, 4, 5].forEach(function (v) {
      var b = document.createElement("button");
      b.type = "button";
      var on = v === 5 ? value >= 5 : value === v;
      b.className = "rir-seg-btn" + (on ? " is-on" : "");
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.textContent = v === 5 ? "5+" : String(v);
      b.addEventListener("click", function () { onPick(v === 5 && value >= 5 ? value : v); });
      row.appendChild(b);
    });
    return row;
  }

  function isNum(v) { return typeof v === "number" && isFinite(v); }

  // Той самий календарний день локально (не UTC) — щоб чернетка, почата
  // ввечері, спокійно переживала північ, а вчорашня кинута чернетка не
  // підхоплювалась мовчки як сьогоднішнє тренування.
  function isSameLocalDay(isoA, isoB) {
    try {
      var a = new Date(isoA);
      var b = new Date(isoB);
      return a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    } catch (e) {
      return false;
    }
  }

  // Чернетка активного тренування: readiness уже питали, сесію вже
  // згенеровано — при відновленні НЕ перегенеровуємо (склад вправ мав би
  // лишитись той самий).
  function loadDraft() {
    try {
      if (!window.Store || typeof Store.getSection !== "function") return null;
      var draft = Store.getSection(DRAFT_SECTION);
      if (!draft || !draft.ok || !Array.isArray(draft.items) || !draft.startedAt) return null;
      if (draft.finished) return null;
      if (!isSameLocalDay(draft.startedAt, new Date().toISOString())) {
        // Застаріла (не сьогоднішня) чернетка — прибираємо мовчки, не
        // підхоплюємо як актуальне тренування.
        clearDraft();
        return null;
      }
      return draft;
    } catch (e) {
      return null;
    }
  }

  function persistDraft() {
    try {
      if (window.Store && typeof Store.setSection === "function" && workoutState) {
        Store.setSection(DRAFT_SECTION, workoutState);
      }
    } catch (e) { /* не критично — стан лишається в пам'яті */ }
  }

  function clearDraft() {
    try {
      if (window.Store && typeof Store.setSection === "function") {
        Store.setSection(DRAFT_SECTION, null);
      }
    } catch (e) { /* ігноруємо */ }
  }

  function exIndexOf(exercises) {
    var idx = {};
    var arr = Array.isArray(exercises) ? exercises : [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] && arr[i].id) idx[arr[i].id] = arr[i];
    }
    return idx;
  }

  // Останній відомий сет по кожній вправі — вхід для §2/§3 прогресії.
  function buildPrevMap(sessions, idx) {
    var out = {};
    var arr = Array.isArray(sessions) ? sessions.slice() : [];
    arr.sort(function (a, b) {
      var da = (a && a.date) || "";
      var db = (b && b.date) || "";
      return da < db ? 1 : (da > db ? -1 : 0);
    });
    for (var i = 0; i < arr.length; i++) {
      var entries = (arr[i] && arr[i].entries) || [];
      // §4 (етап 3): дельоудна сесія — не робоча. Її легка вага не має
      // ставати базою прогресії після розвантаження.
      if (arr[i] && arr[i].deload === true) continue;
      for (var j = 0; j < entries.length; j++) {
        var en = entries[j];
        if (!en || !en.exerciseId || out[en.exerciseId]) continue;
        var sets = en.sets || [];
        if (!sets.length) continue;
        var ex = idx[en.exerciseId] || {};
        var range = Array.isArray(ex.repRange) ? ex.repRange : [8, 12];
        var last = sets[sets.length - 1];
        var reps = [];
        for (var k = 0; k < sets.length; k++) {
          if (isNum(sets[k].reps)) reps.push(sets[k].reps);
        }
        if (!reps.length) continue;
        var plan = (en.plan && typeof en.plan === "object") ? en.plan : null;
        out[en.exerciseId] = {
          // Етап 3: який діапазон / щабель плато стояв у тій сесії.
          planRange: (plan && Array.isArray(plan.repRange)) ? plan.repRange.slice(0, 2) : null,
          plateauStep: (plan && isNum(plan.plateauStep)) ? plan.plateauStep : 0,
          retest: !!(plan && plan.retest),
          weight: last.w,
          setsReps: reps,
          repsMin: range[0],
          repsMax: range[1],
          lastRirEff: isNum(last.rirEff) ? last.rirEff : last.rirReported,
          step: isNum(ex.incrementKg) ? ex.incrementKg : 2.5
        };
      }
    }
    return out;
  }

  // Етап 2: програма з онбордингу — це лише {anchors}. Без mesoId/тижня/дня
  // перша сесія писалась би з mesoId: null, а наступні — уже з "m1", і
  // тижневий обсяг першого тижня розпадався б на два. Заповнюємо лише
  // відсутні поля; наявний стан не чіпаємо.
  function ensureProgramState() {
    try {
      if (!window.Store) return;
      var program = Store.getSection("program") || {};
      var changed = false;
      if (typeof program.mesoId !== "string" || !program.mesoId) { program.mesoId = "m1"; changed = true; }
      if (!isNum(program.weekIndex)) { program.weekIndex = 1; changed = true; }
      if (!isNum(program.dayIndex)) { program.dayIndex = 1; changed = true; }
      // Етап 10, §16: стани до цього етапу не мають program.cycles — один раз
      // рахуємо підсумок останнього завершеного циклу з історії.
      if (!Array.isArray(program.cycles) && typeof AlgoProgram.backfillCycles === "function") {
        var settingsB = getSettings();
        var exB = Store.getSection("exercises");
        if (!exB || !exB.length) exB = window.EX_DB || [];
        var bf = AlgoProgram.backfillCycles(program, {
          sessions: Store.getSessions() || [], exercises: exB,
          mode: settingsB.mode || undefined,
          daysPerWeek: isNum(program.daysPerWeek) ? program.daysPerWeek
            : (isNum(settingsB.daysPerWeek) ? settingsB.daysPerWeek : 4),
          plateau: (Store.getSection("metrics") || {}).plateau,
          pain: getPain(), today: localDay(),
          priority: AlgoProgram.normPriority(settingsB.priorityMuscles)
        });
        if (bf && bf.ok && bf.changed) { program = bf.program; changed = true; }
      }
      if (changed) Store.setSection("program", program);
    } catch (e) { /* без запису генератор однаково візьме дефолти */ }
  }

  // Етап 10: пріоритетні м'язи (settings) і рекомендація підсумку циклу
  // (program.cycles) — те, що йде в generateSession і weeklyTargets.
  function cycleInputsNow() {
    try {
      if (!window.AlgoProgram || typeof AlgoProgram.cycleInputs !== "function") return {};
      return AlgoProgram.cycleInputs(Store.getSection("program") || {}, getSettings()) || {};
    } catch (e) { return {}; }
  }

  function buildWorkoutState(readiness, partsOverride) {
    try {
      if (!window.AlgoProgram || !window.Store) {
        return { ok: false, error: "Алгоритм або сховище недоступні." };
      }
      ensureProgramState();
      var settings = Store.getSection("settings") || {};
      var exercises = Store.getSection("exercises");
      if (!exercises || !exercises.length) exercises = window.EX_DB || [];
      var sessions = Store.getSessions() || [];
      var program = Store.getSection("program") || {};
      var metrics = Store.getSection("metrics") || {};
      var calibration = Store.getSection("calibration") || {};
      var idx = exIndexOf(exercises);

      var daysPerWeek = isNum(program.daysPerWeek) ? program.daysPerWeek
        : (isNum(settings.daysPerWeek) ? settings.daysPerWeek : 4);
      var week = isNum(program.weekIndex) ? program.weekIndex : 1;
      var dayIndex = isNum(program.dayIndex) ? program.dayIndex : 1;

      var nowIso = new Date().toISOString();
      var weekKey = AlgoProgram.isoWeekKey(nowIso.slice(0, 10));
      var volumeDone = AlgoProgram.weeklyVolume(sessions, {
        weekKey: weekKey, mesoId: program.mesoId, exercises: exercises, index: idx
      });

      // §9 — стан відновлення на момент відкриття екрана. Готова функція
      // AlgoProgram.recoveryState() сама рахує §9.3 (fatigueDebt/nowH) і
      // §9.8 (холодний старт при порожній історії) — окремо не переписуємо.
      // mode, а не volumeScale: 1 — інакше scaleFrom() ігнорує режим і §10
      // працює на немасштабованому коридорі всупереч §13.2 ALGO.md.
      var rec = AlgoProgram.recoveryState({
        sessions: sessions, exercises: exercises, index: idx, nowH: nowIso,
        fatigue: metrics.fatigue, daysPerWeek: daysPerWeek,
        volumeDone: volumeDone,
        sessionsLeft: Math.max(1, daysPerWeek - dayIndex + 1),
        mode: settings.mode || undefined
      });

      // Крок 14: онбординг без жодної придатної проби ставить
      // settings.onboarding.easyStart — «перша сесія навмисно легка, RIR 4»
      // (docs/PLAN.md, таблиця ризиків; число — AlgoCore.C.EASY_START_RIR).
      // Діє рівно до першої збереженої сесії: далі хвилю RIR веде §4.
      var easyStart = !!(settings.onboarding && settings.onboarding.easyStart) &&
        sessions.length === 0;
