      for (mm = 0; mm < volume.length; mm++) {
        if (volume[mm].zone === "in") { rampOffset[volume[mm].muscle] = CYCLE_RAMP_STEP; raised.push(volume[mm].muscle); }
      }
    }
    var volCode = raised.length ? "UP" : (fatigueEnd ? "RESET_FATIGUE" : (regularity < CYCLE_REG_GOOD ? "SAME_IRREGULAR" : "SAME"));
    var next = {
      forMesoId: nextMesoId(meso),
      keepAnchors: anchorIds.slice(),
      rotateOut: rotateOut,
      judged: judged.length,
      rampOffset: rampOffset,
      volume: volCode,
      raised: raised
    };
    next.why = {
      ruleId: "CYCLE_NEXT",
      inputs: { volume: volCode, rotateOut: rotateOut.slice(), judged: judged.length, regularity: regularity,
        anchorsUp: up.length, anchorsKnown: known.length, end: endCode },
      text: whyCycleNext(next, rotateOut, idx, regularity),
      short: shortCycleNext(next, rotateOut)
    };

    var num = /(\d+)$/.exec(meso);
    return {
      ok: true, code: "OK",
      mesoId: meso, number: num ? +num[1] : null,
      at: (typeof o.at === "string" && o.at) ? o.at : (work[work.length - 1].endedAt || work[work.length - 1].date),
      startedAt: work[0].date, endedAt: work[work.length - 1].date,
      weeks: weeks, sessions: work.length, planned: planned, regularity: regularity,
      setsDoneFrac: pSum > 0 ? fix2(gSum / pSum) : null,
      deloadSessions: deloadN,
      anchors: anchors, volume: volume, plateau: plateau,
      pain: { zones: av.zones.slice(), ids: av.ids.slice() },
      end: { code: endCode, trigger: trigger, fired: fired },
      priority: pm.list.slice(),
      next: next,
      backfill: o.backfill === true,
      applies: o.applies !== false
    };
  }

  function shortCycleNext(next, rotateOut) {
    var a = "Основні вправи лишаються.";
    var b = rotateOut.length
      ? " " + cap(rotateOut.length + " " + exWord(rotateOut.length)) + " без приросту — заміню на інші для того ж м'яза."
      : " Допоміжні теж лишаються — вони росли.";
    var c = next.volume === "UP" ? " Обсяг стартує на крок вище."
      : (next.volume === "RESET_FATIGUE" ? " Обсяг — знову з нижньої точки: цикл закінчила втома."
        : " Обсяг — як цього разу.");
    return a + b + c;
  }

  function whyCycleNext(next, rotateOut, idx, regularity) {
    var names = rotateOut.map(function (id) { return (idx[id] && idx[id].name) || id; });
    var first = names.length
      ? "Без приросту за цикл: " + names.join(", ") + "."
      : "Усі допоміжні вправи, про які є дані, за цикл росли.";
    var second = "Основні вправи не міняються — на них тримається вимір прогресу; допоміжні міняю лише ті, що стояли, і не більше половини: помірна, продумана зміна вправ може допомогти, надмірна — шкодить (Kassiano 2022), а постійний набір не гірший за змінний (Kassiano 2025).";
    var third;
    if (next.volume === "UP") third = "Цикл був регулярним, основні вправи росли, втома не зупинила — тож обсяг для " + next.raised.length + " м'язів стартує на крок вище: більше підходів дає більше росту (Pelland 2026).";
    else if (next.volume === "RESET_FATIGUE") third = "Цикл закінчила втома, тож обсяг знову з нижньої точки, як і задумано (Bell 2025).";
    else if (next.volume === "SAME_IRREGULAR") third = "Виконано " + Math.round(regularity * 100) + "% запланованих тренувань — спершу регулярність, обсяг лишаю як був.";
    else third = "Обсяг лишаю як був: для підвищення потрібні і ріст основних вправ, і регулярність, і жодних сигналів утоми.";
    return first + " " + second + " " + third;
  }

  //   cycleInputs(program, settings) → { priority, rotateOut, rampOffset, fromMesoId }
  // Що з підсумку й налаштувань іде в generateSession СЬОГОДНІ. Одна функція
  // для UI і для смоуку — щоб шов не розходився.
  function cycleInputs(program, settings) {
    var p = (program && typeof program === "object") ? program : {};
    var st = (settings && typeof settings === "object") ? settings : {};
    var pr = normPriority(st.priorityMuscles);
    var cur = (typeof p.mesoId === "string" && p.mesoId) ? p.mesoId : "m1";
    var cycles = Array.isArray(p.cycles) ? p.cycles : [];
    var rec = null;
    for (var i = cycles.length - 1; i >= 0; i--) {
      var c = cycles[i];
      if (c && c.next && c.next.forMesoId === cur && c.applies !== false) { rec = c; break; }
    }
    var ro = (rec && Array.isArray(rec.next.rotateOut) && rec.next.rotateOut.length) ? rec.next.rotateOut.slice() : undefined;
    var off;
    if (rec && rec.next.rampOffset && typeof rec.next.rampOffset === "object") {
      for (var m in rec.next.rampOffset) {
        if (has(rec.next.rampOffset, m) && isMuscleKey(m) && isNum(rec.next.rampOffset[m]) && rec.next.rampOffset[m] > 0) {
          off = off || {};
          off[m] = rec.next.rampOffset[m];
        }
      }
    }
    return { priority: pr.length ? pr : undefined, rotateOut: ro, rampOffset: off, fromMesoId: rec ? rec.mesoId : null };
  }

  function appendCycle(prev, summary) {
    var arr = Array.isArray(prev) ? prev.filter(function (c) { return c && c.mesoId !== summary.mesoId; }) : [];
    arr.push(summary);
    return arr.slice(-CYCLES_KEEP);
  }

  //   backfillCycles(program, { sessions, exercises|index, mode, daysPerWeek,
  //                             plateau, pain, today, priority })
  //     → { ok, changed, program }
  // Етап 10: у станах до цього етапу `program.cycles` немає. Тоді один раз
  // рахуємо підсумок ОСТАННЬОГО завершеного циклу з історії сесій (міграції
  // схеми не треба: поле необов'язкове). Рекомендація діє, лише якщо поточний
  // цикл ще не почався; інакше — тільки для показу (applies: false).
  function backfillCycles(program, opts) {
    var p = (program && typeof program === "object") ? program : {};
    if (Array.isArray(p.cycles)) return { ok: true, changed: false, program: p };
    var o = opts || {};
    var cur = (typeof p.mesoId === "string" && p.mesoId) ? p.mesoId : "m1";
    var all = Array.isArray(o.sessions) ? o.sessions : [];
    var prev = null, prevKey = "", curHas = false;
    for (var i = 0; i < all.length; i++) {
      var s = all[i];
      if (!s || typeof s.mesoId !== "string" || !s.mesoId) continue;
      if (s.mesoId === cur) { curHas = true; continue; }
      var k = sessionOrderKey(s);
      if (k > prevKey) { prevKey = k; prev = s.mesoId; }
    }
    var out = {};
    for (var key in p) if (has(p, key)) out[key] = p[key];
    out.cycles = [];
    if (prev) {
      var cs = cycleSummary({
        sessions: all, index: o.index, exercises: o.exercises, mesoId: prev, anchors: p.anchors,
        mode: o.mode, daysPerWeek: o.daysPerWeek, plateau: o.plateau, pain: o.pain, today: o.today,
        priority: o.priority, lastWeek: p.lastWeek, backfill: true, applies: !curHas
      });
      if (cs.ok) {
        cs.next.forMesoId = cur;
        out.cycles = [cs];
      }
    }
    return { ok: true, changed: true, program: out };
  }

  // ==================================================================
  // Міст до algo-core.js (§1, §2, §3) — ваги для згенерованої сесії
  // ==================================================================
  //
  // Сама арифметика живе в AlgoCore і НЕ дублюється тут.
  //   ctx: { e1rm: {id: value}, trust, targetRir, settings,
  //          prev: {id: {weight, setsReps, repsMin, repsMax, lastRirEff, step}},

        "id": "goals",
        "title": "Цілі: повтори, відпочинок, підходи",
        "text": [
          "Повтори, відпочинок і кількість підходів для кожної цілі взято з позиції ACSM (2009) і таблиць NSCA: сила — важкі підходи по 1–6 повторів і довгий відпочинок (3–5 хв), м'язи — 6–12 повторів і 1–2 хв, витривалість — легша вага, понад 15 повторів і коротка пауза.",
          "Новіша позиція ACSM (2026, огляд оглядів): силу найбільше підсилює важча вага (від 80% максимуму), м'язи — більший обсяг (від 10 підходів на тиждень).",
          "Ціна силового режиму — час: за однакового обсягу силовий протокол дав більше сили за схожого росту м'язів, але тренування тривало 70 хв замість 17 (Schoenfeld 2014). Довший відпочинок (3 хв проти 1) дав більше і сили, і м'язів (Schoenfeld 2016)."
        ],

        "id": "warmup",
        "title": "Розминка",
        "text": [
          "Розминка з двох частин, як радить NSCA: 5–10 хв легкого кардіо і динамічні вправи, потім 1–2 легші підходи першої важкої вправи. Ми беремо нижню межу — 5 хв.",
          "Огляди: розминка покращила результат у 79% досліджених показників (Fradkin 2010); розминка з навантаженням підвищує силу верху тіла (McCrary 2015); загальна + специфічна розминка (8 повторів з ~50% максимуму, 3 повтори з ~70%) дала +8,4% максимуму в жимі ногами (Abad 2011).",
          "Статична розтяжка до 60 с на м'яз майже не впливає на силу (−1,1%), динамічна — трохи допомагає (+1,3%) (Behm 2016). Тому в розминці — динамічні вправи.",
          "Чесно: який саме набір динамічних вправ і скільки повторів — наш вибір, дослідження конкретного набору не дають."
        ],

        "text": [
          "Раз на цикл (після 4 тижнів, або раніше за ознаками втоми) — тиждень розвантаження. Як радять Bell та співавт. (2025): удвічі менше підходів і більший запас повторів за тієї самої ваги. Вагу при цьому не знижуємо: знижувати і вагу, і повтори одночасно автори не радять.",

<script>
// ui.js — каркас застосунку: hash-роутер + рендер екранів.
// Класичний скрипт (НЕ type="module"). Без залежностей.

(function () {
  "use strict";

  // Версію штампує build.ps1 у <meta name="app-version" content="...">
  // (index.html → сюди підставляється __APP_VERSION__). У непобудованому
  // джерелі такого meta-тега нема — тоді лишається значення для розробки.
  var APP_VERSION = "0.1.0-dev";
  try {
    var verMeta = document.querySelector('meta[name="app-version"]');
    if (verMeta && verMeta.content && verMeta.content.indexOf("__APP_VERSION__") === -1) {
      APP_VERSION = verMeta.content;
    }
  } catch (e) { /* ігноруємо — лишається dev-значення */ }
  window.APP_VERSION = APP_VERSION;

  // ------------------------------------------------------------------
  // Store: ініціалізація один раз при старті + підписка на помилки
  // ------------------------------------------------------------------
  var storeInitResult = null;
  var storeErrorMsg = null; // остання помилка з Store.onError()

  function initStore() {
    try {
      if (window.Store && typeof Store.init === "function") {
        storeInitResult = Store.init();
        if (typeof Store.onError === "function") {
          Store.onError(function (err) {
            storeErrorMsg = (err && err.message) ? err.message : "Помилка сховища.";
            if (getScreenIdFromHash() === "settings") {
              renderScreen("settings");
            }
          });
        }
      }
    } catch (e) {
      storeInitResult = {
        ok: false, status: "unavailable", state: null,
        warning: { code: "INIT_THROW", message: "Не вдалось ініціалізувати сховище." }
      };
    }
  }

  // ------------------------------------------------------------------
  // Опис екранів: hash -> { title, nav (пункт нижньої навігації або null) }
  // ------------------------------------------------------------------
  var SCREENS = {
    "home": { title: "Сьогодні", navId: "home" },
    "workout": { title: "Тренування", navId: null },
    "exercise": { title: "Вправи", navId: "exercise" },
    "volume": { title: "Обсяг", navId: "volume" },
    "progress": { title: "Прогрес", navId: "progress" },
    "settings": { title: "Налаштування", navId: "settings" },
    // Етап 4: без власної вкладки — вхід з «Ще» і з «Сьогодні».
    "sources": { title: "Джерела", navId: "settings" },
    "recharge": { title: "Зарядка", navId: "home" }
  };

  var DEFAULT_SCREEN = "home";

  var NAV_ITEMS = [
    { id: "home", hash: "home", svg: "today", label: "Сьогодні" },
    { id: "exercise", hash: "exercise", svg: "list", label: "Вправи" },
    { id: "volume", hash: "volume", svg: "volume", label: "Обсяг" },
    { id: "progress", hash: "progress", svg: "progress", label: "Прогрес" },
    { id: "settings", hash: "settings", svg: "more", label: "Ще" }
  ];

  var mainEl = null;
  var navEl = null;
  var navButtons = {};

  // ------------------------------------------------------------------
  // Роутер
  // ------------------------------------------------------------------

  function getScreenIdFromHash() {
    var raw = (location.hash || "").replace(/^#/, "");
    if (SCREENS.hasOwnProperty(raw)) {
      return raw;
    }
    return DEFAULT_SCREEN;
  }

  function renderScreen(screenId) {
    var meta = SCREENS[screenId] || SCREENS[DEFAULT_SCREEN];

    if (mainEl) {
      mainEl.innerHTML = "";

      // Крок 14: поки онбординг не пройдений, майстер стоїть ЗАМІСТЬ усього
      // інтерфейсу — включно з нижньою навігацією. Інакше перший запуск дає
      // порожні екрани обсягу/прогресу й тренування на дефолтних налаштуваннях.
      if (onboardingNeeded()) {
        setNavVisible(false);
        renderOnboarding(mainEl);
        return;
      }
      setNavVisible(true);

      var title = document.createElement("h1");
      title.className = "screen-title";
      title.textContent = meta.title;
      mainEl.appendChild(title);

      if (screenId === "settings") {
        renderSettingsScreen(mainEl);
      } else if (screenId === "workout") {
        renderWorkoutScreen(mainEl);
      } else if (screenId === "home") {
        renderHomeScreen(mainEl);
      } else if (screenId === "volume") {
        renderVolumeScreen(mainEl);
      } else if (screenId === "sources") {
        renderSourcesScreen(mainEl);
      } else if (screenId === "recharge") {
        renderRechargeScreen(mainEl);
      } else if (screenId === "progress") {
        renderProgressScreen(mainEl);
      } else {
        var stub = document.createElement("p");
        stub.className = "screen-stub";
        // Етап 3: новий користувач не має бачити голе «у розробці» —
        // кажемо, де ця інформація є вже зараз.
        stub.textContent = "Розділ ще в роботі. Вправи підбираються автоматично під ваші цілі й обладнання; " +
          "замінити вправу можна під час тренування — у її деталях.";
        mainEl.appendChild(stub);
      }
    }

    // Підсвітити активний пункт нижньої навігації (якщо є)
    for (var key in navButtons) {
      if (navButtons.hasOwnProperty(key)) {
        var btn = navButtons[key];
        var isActive = key === screenId;
        btn.classList.toggle("is-active", isActive);
        if (isActive) {
          btn.setAttribute("aria-current", "page");
        } else {
          btn.removeAttribute("aria-current");
        }
      }
    }
  }

  function router() {
    var screenId = getScreenIdFromHash();
    renderScreen(screenId);
  }

  // ------------------------------------------------------------------
  // Побудова каркаса: нижня навігація + область екрана
  // ------------------------------------------------------------------

  function buildShell() {
    var root = document.getElementById("app");
    if (!root) {
      return;
    }

    var shell = document.createElement("div");
    shell.className = "app-shell";

    var main = document.createElement("main");
    main.className = "app-main";
    main.id = "app-main";

    var nav = document.createElement("nav");
    nav.className = "bottom-nav";

    NAV_ITEMS.forEach(function (item) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-item";
      btn.dataset.hash = item.hash;

      var iconEl = document.createElement("span");
      iconEl.className = "nav-item-icon";
      iconEl.appendChild(makeIcon(item.svg));

      var labelEl = document.createElement("span");
      labelEl.textContent = item.label;

      btn.appendChild(iconEl);
      btn.appendChild(labelEl);

      btn.addEventListener("click", function () {
        location.hash = "#" + item.hash;
      });

      nav.appendChild(btn);
      navButtons[item.hash] = btn;
    });

    shell.appendChild(main);
    shell.appendChild(nav);
    root.appendChild(shell);

    mainEl = main;
    navEl = nav;
  }

  // Онбординг ховає нижню навігацію цілком. Разом з нею йде й нижній відступ
  // під неї — інакше на екрані майстра лишається порожня смуга у 64px.
  function setNavVisible(on) {
    try {
      if (navEl) navEl.style.display = on ? "" : "none";
      if (mainEl) mainEl.classList.toggle("app-main--no-nav", !on);
    } catch (e) { /* косметика — не привід валити рендер */ }
  }

  // ------------------------------------------------------------------
  // Реєстрація Service Worker (не має ламати сторінку, якщо недоступний)
  // ------------------------------------------------------------------

  function registerServiceWorker() {
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("./sw.js", { updateViaCache: "none" })
          .catch(function () {
            /* локально/без https — очікувано, ігноруємо */
          });
      }
    } catch (e) {
      /* нічого не робимо: SW не критичний для роботи UI */
    }
  }

  // ------------------------------------------------------------------
  // Екран Settings / Data
  // ------------------------------------------------------------------

  function makeCard() {
    var card = document.createElement("div");
    card.className = "card";
    return card;
  }

  function makeSectionTitle(text) {
    var h = document.createElement("h2");
    h.style.fontSize = "var(--font-size-lg)";
    h.style.marginBottom = "var(--space-3)";
    h.textContent = text;
    return h;
  }


  // ------------------------------------------------------------------
  // Редизайн, фаза Б (docs/ДИЗАЙН-концепти.md, напрям C «Гібрид»).
  // Лише відображення: іконки, нижня панель «Чому так?», великі числа.
  // Жодних нових чисел алгоритму тут немає.
  // ------------------------------------------------------------------
  var UI_SVG_NS = "http://www.w3.org/2000/svg";
  var ICON_PATHS = {
    today: ["M4 9.5h16", "M8 3v4", "M16 3v4", "M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"],
    list: ["M5 7h14", "M5 12h14", "M5 17h9"],
    volume: ["M6 19v-8", "M12 19V5", "M18 19v-6"],
    progress: ["M4 17l5-5 4 3 7-8"],
    more: ["M5.5 12h.01", "M12 12h.01", "M18.5 12h.01"],
    info: ["M12 11v5.5", "M12 7.6h.01", "M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18z"],
    check: ["M5 12.5l4.5 4.5L19 7.5"],
    chev: ["M9 6l6 6-6 6"],
    down: ["M6 9l6 6 6-6"],
    close: ["M6 6l12 12", "M18 6L6 18"]
  };
  function makeIcon(name, cls) {
    var svg = document.createElementNS(UI_SVG_NS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("class", "icon" + (cls ? " " + cls : ""));
    (ICON_PATHS[name] || []).forEach(function (d) {
      var path = document.createElementNS(UI_SVG_NS, "path");
      path.setAttribute("d", d);
      svg.appendChild(path);
    });
    return svg;
  }

  // «Чому так?» / «Докладніше» — нижня панель (bottom sheet). Вміст лишається
  // в тому самому <details> (тексти, джерела, data-rule-id нікуди не
  // переїжджають), CSS лише показує відкритий блок панеллю знизу екрана.
  // Закрити — тап по затемненню або кнопка «Зрозуміло».
  function sheetify(det, title) {
    if (!det) return det;
    det.classList.add("why-sheet");
    var kids = (det.children || []).slice ? det.children.slice() : Array.prototype.slice.call(det.children);
    var panel = document.createElement("div");
    panel.className = "why-panel";
    var grab = document.createElement("div");
    grab.className = "why-grab";
    panel.appendChild(grab);
    if (title) {
      var h = document.createElement("h3");
      h.className = "why-title";
      h.textContent = title;
      panel.appendChild(h);
    }
    kids.forEach(function (k) {
      if (k.tagName === "SUMMARY") return;
      det.removeChild(k);
      panel.appendChild(k);
    });
    var close = document.createElement("button");
    close.type = "button";
    close.className = "btn btn-secondary why-close";
    close.textContent = "Зрозуміло";
    close.addEventListener("click", function () { det.open = false; det.removeAttribute("open"); });
    panel.appendChild(close);
    var scrim = document.createElement("div");
    scrim.className = "why-scrim";
    scrim.addEventListener("click", function () { det.open = false; det.removeAttribute("open"); });
    det.appendChild(scrim);
    det.appendChild(panel);
    return det;
  }

  // Велике число з −/+ (цілі 56px) і правкою тапом: тап по числу відкриває
  // поле вводу з цифровою клавіатурою. onSet отримує число або null.
  function bigNumber(opts) {
    var wrap = document.createElement("div");
    wrap.className = "bignum";
    var dec = document.createElement("button");
    dec.type = "button";
    dec.className = "bignum-btn";
    dec.setAttribute("aria-label", "Менше: " + opts.label);
    dec.textContent = "−";
    dec.addEventListener("click", opts.onDec);
    var mid = document.createElement("div");
    mid.className = "bignum-mid";
    var val = document.createElement("button");
    val.type = "button";
    val.className = "bignum-val";
    val.setAttribute("aria-label", opts.label + ": " + opts.text + ". Торкніться, щоб ввести");
    val.textContent = opts.text;
    var lab = document.createElement("span");
    lab.className = "bignum-lab";
    lab.textContent = opts.label;
    val.addEventListener("click", function () {
      if (!opts.onSet) return;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.className = "bignum-input";
      inp.setAttribute("inputmode", opts.decimal ? "decimal" : "numeric");
      inp.setAttribute("aria-label", opts.label);
      inp.value = isNum(opts.raw) ? String(opts.raw) : "";
      var doneEdit = false;
      function commit() {
        if (doneEdit) return;
        doneEdit = true;
        var v = parseFloat(String(inp.value).replace(",", "."));
        opts.onSet(isFinite(v) ? v : null);
      }
      inp.addEventListener("blur", commit);
      inp.addEventListener("keydown", function (e) {
        if (e && e.key === "Enter") { inp.blur(); }
      });
      mid.replaceChild ? mid.replaceChild(inp, val) : null;
      if (inp.focus) inp.focus();
      if (inp.select) inp.select();
    });
    mid.appendChild(val);
    mid.appendChild(lab);
    var inc = document.createElement("button");
    inc.type = "button";
    inc.className = "bignum-btn";
    inc.setAttribute("aria-label", "Більше: " + opts.label);
    inc.textContent = "+";
    inc.addEventListener("click", opts.onInc);
    wrap.appendChild(dec);
    wrap.appendChild(mid);
    wrap.appendChild(inc);
    return wrap;
  }

  // Перемикає галочку; останню зняти не можна (повертає null).
  function toggleGoal(goals, key) {
    var next = goals.slice();
    var i = next.indexOf(key);
    if (i >= 0) {
      if (next.length === 1) {
        window.alert("Хоча б одна ціль має лишитись.");

  function fmtRest(sec) {
    return (sec >= 120 && sec % 60 === 0) ? (sec / 60) + " хв" : sec + " с";
  }

  // Числа колонки дослівно з AlgoProgram.modeParams — повтори й відпочинок

        " · на один м'яз " + r.isolation[0] + "–" + r.isolation[1] + ", " + fmtRest(s.isolation) + ".";

  // r2 (крок 8): плитка вибору — уся плитка є кнопкою; галочка, назва,
