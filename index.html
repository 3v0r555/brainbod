<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="app-version" content="0.4.0+2026102010">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainBod</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B0D10">
<style>
/* ==========================================================================
   app.css — базова CSS-система застосунку
   Темна тема (зал, погане світло), кнопки >=48px, dvh, safe-area.
   Без анімацій-прикрас: лише миттєві переходи стану (0s / instant swap).
   ========================================================================== */

:root {
  /* --- Кольори (редизайн фаза Б, напрям C «Гібрид»: docs/ДИЗАЙН-концепти.md) ---
     Один акцент — лайм. Червоний — лише попередження. Контраст (WCAG 2.x,
     tools/design-concepts/contrast.js):
       текст #F2F3F5 на картці #15181D — 16:1;  --color-text-dim — 6.8:1;
       --color-text-faint #8A9099 на картці — 5.5:1 (було #6b6e76 — 3.15:1);
       темний текст на лаймовій кнопці — 15.2:1 (було білий на #4f8cff — 3.22:1). */
  --color-bg: #0B0D10;
  --color-bg-elevated: #1C2026;   /* вкладені панелі, чипи, степери */
  --color-bg-card: #15181D;
  --color-border: #23272E;        /* тонкі рамки (Linear) */
  --color-border-strong: #2E333B; /* межі кнопок-контурів */
  --color-text: #F2F3F5;
  --color-text-dim: #9AA1AB;
  --color-text-faint: #8A9099;
  --color-accent: #C6F432;
  --color-accent-press: #A9D41F;
  --color-accent-text: #0B0D10;   /* текст на акцентній заливці */
  --color-danger: #FF5A5F;
  --color-success: #C6F432;       /* «добре» = той самий акцент, другого зеленого немає */
  --color-warn: #E8B339;
  /* Мапа тіла — лише стан м'язів, більше ніде (концепт C). */
  --color-map-hot: #FF7A45;
  --color-map-cold: #4C7DFF;
  --color-map-base: #2A2F37;

  /* --- Відступи (8pt grid) --- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* --- Радіуси --- */
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  /* --- Типографіка ---
     Текст: 13 (підписи) / 15 (довгі пояснення) / 17 (основний) / 20 (заголовок
     картки) / 32 (заголовок екрана). Числа — окремий моно-шрифт і два розміри
     «великих цифр». Було 7 розмірів у змінних + «сирі» 11/12 px. */
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, Consolas, monospace;
  --font-size-xs: 13px;
  --font-size-sm: 15px;
  --font-size-md: 17px;           /* була в ужитку (.contrib-row-primary), але не оголошена */
  --font-size-base: 17px;
  --font-size-lg: 20px;
  --font-size-xl: 32px;
  --font-size-2xl: 32px;
  --font-size-number: 56px;       /* вага/повтори — головні цифри екрана */
  --font-size-display: 72px;      /* одне число-герой на екран */

  /* --- Розміри інтерактивних елементів --- */
  --tap-min: 48px;
  --tap-big: 56px;
  --tap-main: 60px;               /* головна дія екрана, внизу, на всю ширину */
  --nav-height: 64px;
}

/* --- Скидання --- */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: 1.4;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

h1, h2, h3, p, ul, li {
  margin: 0;
  padding: 0;
}

button {
  font-family: inherit;
  color: inherit;
}

/* ==========================================================================
   Розкладка застосунку
   ========================================================================== */

.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

.app-main {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: var(--space-4);
  padding-bottom: calc(var(--nav-height) + var(--space-5) + env(safe-area-inset-bottom));
  max-width: 640px;
  margin-left: auto;
  margin-right: auto;
  width: 100%;
  box-sizing: border-box;
}

/* ==========================================================================
   Типографія екранів
   ========================================================================== */

.screen-title {
  font-size: var(--font-size-xl);
  font-weight: 700;
  margin-bottom: var(--space-4);
}

.screen-stub {
  color: var(--color-text-dim);
  font-size: var(--font-size-base);
  padding: var(--space-5) 0;
}

.number-display {
  font-family: var(--font-mono);
  font-size: var(--font-size-number);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

/* ==========================================================================
   Картка
   ========================================================================== */

.card {
  background: var(--color-bg-card);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}

/* ==========================================================================
   Ряд списку
   ========================================================================== */

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-height: var(--tap-min);
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--color-border);
}

.list-row:last-child {
  border-bottom: none;
}

/* ==========================================================================
   Чип
   ========================================================================== */

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-min);
  min-width: var(--tap-min);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-pill);
  border: 1px solid var(--color-border);
  background: var(--color-bg-elevated);
  color: var(--color-text);
  font-size: var(--font-size-base);
}

.chip[aria-pressed="true"],
.chip.is-active {
  background: var(--color-accent);
  color: var(--color-accent-text);
  border-color: var(--color-accent);
  font-weight: 700; /* не лише колір — і накреслення */
}

/* ==========================================================================
   ±-степер
   ========================================================================== */

.stepper {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.stepper-btn {
  width: var(--tap-min);
  height: var(--tap-min);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-bg-elevated);
  color: var(--color-text);
  font-size: var(--font-size-lg);
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stepper-btn:active {
  background: var(--color-bg-card);
}

.stepper-value {
  font-family: var(--font-mono);
  min-width: 64px;
  text-align: center;
  font-size: var(--font-size-lg);
  font-variant-numeric: tabular-nums;
  font-weight: 700;
}

/* ==========================================================================
   Кнопки: первинна / вторинна
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--tap-min);
  width: 100%;
  padding: var(--space-3) var(--space-5);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  font-size: var(--font-size-base);
  font-weight: 700;
}

.btn-primary {
  background: var(--color-accent);
  color: var(--color-accent-text);
}

.btn-primary:active {
  background: var(--color-accent-press);
}

.btn-secondary {
  background: transparent;
  border-color: var(--color-border-strong);
  color: var(--color-text);
}

.btn-secondary:active {
  background: var(--color-bg-elevated);
}

/* ==========================================================================
   Нижня навігація
   ========================================================================== */

/* Навігація прибита до низу ЕКРАНА, а не до кінця документа. Без position:
   fixed вона лишалась останнім блоком сторінки: на телефоні різниці майже не
   було, а на десктопі кнопки з'являлись, тільки коли доскролиш до самого
   низу. Фон тягнеться на всю ширину вікна, а самі кнопки тримаються тієї ж
   колонки 640px, що й контент (padding-inline рахує поля). */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: flex;
  flex-shrink: 0;
  background: var(--color-bg-elevated);
  border-top: 1px solid var(--color-border);
  padding-bottom: env(safe-area-inset-bottom);
  padding-inline: max(0px, calc((100% - 640px) / 2));
}

.nav-item {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: var(--nav-height);
  background: transparent;
  border: none;
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}

.nav-item-icon {
  font-size: var(--font-size-lg);
  line-height: 1;
}

.nav-item.is-active {
  color: var(--color-text);
  font-weight: 700;
  border-top: 3px solid var(--color-accent); /* не лише колір — і лінія */
}

/* ==========================================================================
   Дрібниці
   ========================================================================== */

.text-dim {
  color: var(--color-text-dim);
}

.text-faint {
  color: var(--color-text-faint);
  font-size: var(--font-size-xs);
}

/* Пояснення прескрипції (§8/§12) під карткою вправи на екрані тренування —
   крок 12 MVP. Видиме без тапу (в цьому весь сенс §8), але виразно тонше за
   основний контент картки, щоб не відсувати кнопки логування за екран. */
.workout-why {
  margin: 0 0 var(--space-2);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
  line-height: 1.45;
}

/* Режимне пояснення — та сама вага, лише тонка лаймова позначка зліва. */
.workout-why--mode {
  padding-left: var(--space-2);
  border-left: 2px solid var(--color-accent);
}

/* Згортання технічного тексту (§8/§13.1, крок «short») — один перемикач на
   картку, а не по одному на абзац. */
.workout-why-details {
  margin: 0 0 var(--space-2);
}

.workout-why-details > summary {
  display: flex;
  align-items: center;
  min-height: var(--tap-min);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
  cursor: pointer;
  list-style: none;
}

.workout-why-details > summary::-webkit-details-marker {
  display: none;
}

.workout-why-details > summary::before {
  content: "▸";
  margin-right: var(--space-2);
}

.workout-why-details[open] > summary::before {
  content: "▾";
}

.workout-why-details .workout-why {
  margin-top: 0;
}

/* ==========================================================================
   Екран «Тіло» (Обсяг) — крок 11
   ========================================================================== */

/* Порожній стан і словник термінів — по одному разу на екран, у верхній
   картці. Раніше те саме дублювалось у кожному з 12 рядків. */

.vol-note {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-left: 3px solid var(--color-accent);
  border-radius: var(--radius-sm);
  background: var(--color-bg-elevated);
  color: var(--color-text-dim);
  font-size: var(--font-size-sm);
}

.vol-legend-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  width: 100%;
  min-height: var(--tap-min);
  margin-top: var(--space-1);
  padding: 0;
  background: transparent;
  border: none;
  color: var(--color-text-dim);
  font-size: var(--font-size-sm);
  text-align: left;
  cursor: pointer;
}

.vol-legend {
  padding: var(--space-3);
  background: var(--color-bg-elevated);
  border-radius: var(--radius-md);
}

.vol-legend p {
  margin-bottom: var(--space-2);
  color: var(--color-text-dim);
  font-size: var(--font-size-sm);
}

.vol-legend p:last-child {
  margin-bottom: 0;
}

.vol-legend b {
  color: var(--color-text);
}

.vol-week-note {
  margin-top: var(--space-2);
  color: var(--color-text-dim);
  font-size: var(--font-size-sm);
}

/* --- Рядок м'яза --- */

.vol-row {
  border-bottom: 1px solid var(--color-border);
  padding: var(--space-2) 0;
}

.vol-row:last-child {
  border-bottom: none;
}

/* Сітка, а не flex: назва може стискатись до трьох крапок, бейдж і стрілка
   лишаються цілими, а підрядок займає ВСЮ ширину — тому не тисне сам себе
   у три рядки, як було на 430px. */
.vol-row-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  column-gap: var(--space-2);
  row-gap: 2px;
  min-height: var(--tap-min);
  cursor: pointer;
}

.vol-name {
  grid-column: 1;
  grid-row: 1;
  font-weight: 700;
  font-size: var(--font-size-base);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vol-sub {
  grid-column: 1 / -1;
  grid-row: 2;
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}

.vol-chev {
  grid-column: 3;
  grid-row: 1 / -1;
  align-self: center;
  width: 16px;
  text-align: center;
  color: var(--color-text-dim);
  font-size: var(--font-size-base);
  line-height: 1;
}

.vol-badge {
  grid-column: 2;
  grid-row: 1;
  justify-self: end;
  padding: 2px var(--space-2);
  border-radius: var(--radius-pill);
  font-size: var(--font-size-xs);
  font-weight: 700;
  white-space: nowrap;
  color: var(--color-text-dim);
  background: color-mix(in srgb, var(--color-text) 10%, transparent);
}

.vol-zone-fresh {
  color: var(--color-success);
  background: color-mix(in srgb, var(--color-success) 16%, transparent);
}

.vol-zone-working {
  color: var(--color-accent);
  background: color-mix(in srgb, var(--color-accent) 18%, transparent);
}

.vol-zone-partial {
  color: var(--color-warn);
  background: color-mix(in srgb, var(--color-warn) 16%, transparent);
}

.vol-zone-low {
  color: var(--color-danger);
  background: color-mix(in srgb, var(--color-danger) 16%, transparent);
}

.vol-zone-cold {
  color: var(--color-text-dim);
}

/* --- Смуга обсягу --- */

.vol-bar-wrap {
  margin-top: var(--space-2);
}

/* Доріжка завжди нейтральна. Колір несе тільки заповнення — і лише воно
   каже, тривожно чи ні. Раніше вся доріжка світилась червоним на «нижче
   MEV», тобто на нормальному старті. */
.vol-bar-track {
  position: relative;
  height: 8px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--color-text) 9%, transparent);
  overflow: hidden;
}

.vol-bar-fill {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  border-radius: var(--radius-pill);
  background: var(--color-accent);
  min-width: 3px;
}

.vol-bar-fill--below-mev {
  background: var(--color-accent);
}

.vol-bar-fill--mev-mav {
  background: var(--color-success);
}

.vol-bar-fill--mav-mrv {
  background: var(--color-warn);
}

.vol-bar-fill--at-mrv {
  background: var(--color-danger);
}

/* Риски MEV/MAV — світла лінія з темною облямівкою. Так вона читається і на
   темній порожній доріжці, і поверх будь-якої заливки (синьої, зеленої,
   жовтої, червоної), не потребуючи окремого кольору під кожну зону.
   ⚑ Була спроба через mix-blend-mode: difference — на темній доріжці риска
   виходила темною на темному й фактично зникала. Не повертати. */
.vol-bar-mark {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
  transform: translateX(-1px);
}

.vol-detail {
  margin-top: var(--space-3);
  padding: var(--space-3);
  background: var(--color-bg-elevated);
  border-radius: var(--radius-md);
}

.vol-detail p {
  margin-bottom: var(--space-2);
  font-size: var(--font-size-sm);
  color: var(--color-text-dim);
}

.vol-detail p:last-child {
  margin-bottom: 0;
}

/* Блок "Що працює" на екрані деталі вправи — розклад внеску по м'язах
   (§9.1 canonical keys). Основні читаються сильніше за другорядні: більший
   розмір і насичений колір проти приглушеного дрібного тексту. */
.contrib-group-title {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: var(--space-1);
}

.contrib-group-title:not(:first-child) {
  margin-top: var(--space-2);
}

.contrib-row {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-1);
}

.contrib-row-primary {
  font-size: var(--font-size-md);
  font-weight: 700;
  color: var(--color-text);
}

.contrib-row-secondary {
  font-size: var(--font-size-sm);
  color: var(--color-text-dim);
}

.contrib-note {
  margin-top: var(--space-2);
}

/* ==========================================================================
   Онбординг — крок 14
   ========================================================================== */

/* Майстер стоїть замість усього інтерфейсу, разом з нижньою навігацією.
   Без цього під ним лишається порожня смуга у висоту схованої панелі. */
.app-main--no-nav {
  padding-bottom: calc(var(--space-5) + env(safe-area-inset-bottom));
}

/* ⚑ Без text-transform: uppercase. У «КРОК 1 З 5» велика «З» читається як
   цифра 3 — перевірено на знімку, рядок виходив «КРОК 1 3 5». */
.onb-progress {
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
  letter-spacing: 0.02em;
}

/* Смужка кроків: пройдене — акцентом, решта — приглушено. Читається одним
   поглядом і не займає рядка тексту. */
.onb-bar {
  display: flex;
  gap: var(--space-1);
  margin: var(--space-2) 0 var(--space-4);
}

.onb-bar-seg {
  flex: 1 1 0;
  height: 4px;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--color-text) 12%, transparent);
}

.onb-bar-seg.is-done {
  background: var(--color-accent);
}

.onb-hint {
  margin-bottom: var(--space-3);
  font-size: var(--font-size-sm);
}

.card > .onb-hint:last-child {
  margin-bottom: 0;
}

.onb-option-sub {
  margin-bottom: var(--space-3);
}

.onb-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

/* Відповідь системи на введене — окремим блоком, а не текстом урозсип:
   на кроці проби це головне, заради чого людина дивиться на екран. */
.onb-note {
  margin-top: var(--space-3);
  padding: var(--space-3);
  border-left: 3px solid var(--color-text-faint);
  border-radius: var(--radius-sm);
  background: var(--color-bg-elevated);
  color: var(--color-text-dim);
  font-size: var(--font-size-sm);
}

.onb-note--ok {
  border-left-color: var(--color-success);
  color: var(--color-text);
}

.onb-note--warn {
  border-left-color: var(--color-warn);
  color: var(--color-text);
}

.onb-note + .btn,
.onb-note + .onb-note {
  margin-top: var(--space-3);
}

.onb-option-name {
  font-weight: 700;
  font-size: var(--font-size-base);
  margin-bottom: var(--space-1);
}

.onb-option .btn {
  margin-top: var(--space-3);
}

.onb-option.is-selected {
  border-color: var(--color-accent);
}

/* Ряд ваги на пробі: чотири кнопки навколо числа не влазять у 430px рядком
   із підписом, тому підпис іде окремим рядком зверху. */
.onb-weight {
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

/* Права кромка — та сама, що в рядків «Повтори» і «Запас» нижче. Через
   space-between п'ять кнопок розповзались по всій ширині картки, і на
   десктопі ряд ваги переставав читатись як один елемент керування. */
.onb-weight > .stepper {
  justify-content: flex-end;
  flex-wrap: wrap;
}

.stepper-btn--wide {
  width: auto;
  min-width: var(--tap-min);
  padding: 0 var(--space-2);
  font-size: var(--font-size-base);
}

/* Назва зверху, результат знизу. Спроба покласти їх у рядок «зліва назва —
   справа число» на 430px усе одно переносилась, і перенесений рядок ставав
   на всю ширину — тобто вирівнювання праворуч виглядало як помилка. */
.onb-summary-row {
  flex-direction: column;
  align-items: stretch;
  gap: var(--space-1);
}

.onb-summary-row .text-dim {
  font-size: var(--font-size-sm);
}

/* Навігація майстра: «Далі» — головна дія, тому ширша за «Назад». */
.onb-nav {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-5);
}

.onb-nav .btn {
  flex: 1 1 0;
}

.onb-nav .btn-primary {
  flex: 2 1 0;
}


/* Етап 4: джерела й розминка */
.src-entry {
  margin: 0 0 var(--space-2);
  font-size: var(--font-size-sm, 0.875rem);
  color: var(--color-text-dim, inherit);
  overflow-wrap: anywhere;
}
.src-link {
  color: var(--color-accent);
  text-decoration: underline;
  overflow-wrap: anywhere;
}
.warmup-list {
  margin: var(--space-1) 0 0;
  padding-left: 1.25em;
}
.warmup-list li {
  margin-bottom: var(--space-1);
}

/* Етап 5: довідки в «Чому так?» — тим самим шрифтом, що й пояснення */
.workout-why .src-entry {
  font-size: inherit;
  line-height: inherit;
}

/* Етап 5: екран «Прогрес» (SVG і CSS вручну) */
.prog-big {
  margin: 0 0 var(--space-2);
  font-size: var(--font-size-lg);
  font-weight: 700;
}
.prog-ex-name {
  margin: 0 0 var(--space-2);
  font-size: var(--font-size-base);
}
.prog-cycle {
  display: flex;
  gap: var(--space-1);
  margin: var(--space-2) 0 var(--space-3);
}
.prog-cycle-seg {
  flex: 1 1 0;
  height: 10px;
  border-radius: var(--radius-pill);
  background: var(--color-bg-elevated);
  border: 1px solid var(--color-border);
}
.prog-cycle-seg.is-deload {
  flex-grow: 0.6;
  border-style: dashed;
}
.prog-cycle-seg.is-done {
  background: var(--color-text-faint);
}
.prog-cycle-seg.is-current {
  background: var(--color-accent);
  border-color: var(--color-accent);
}
.prog-chart {
  display: block;
  width: 100%;
  height: auto;
  margin: var(--space-2) 0;
}
.prog-line {
  fill: none;
  stroke: var(--color-accent);
  stroke-width: 2.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.prog-dot {
  fill: var(--color-accent);
}
.prog-grid {
  stroke: var(--color-border);
  stroke-width: 1;
}
.prog-axis {
  fill: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.prog-bars {
  display: flex;
  gap: var(--space-1);
  align-items: flex-end;
  margin: var(--space-3) 0 var(--space-2);
}
.prog-bar-col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.prog-bar-col p {
  margin: 0;
}
.prog-bar-val {
  font-size: var(--font-size-xs);
  color: var(--color-text-dim);
}
.prog-bar-track {
  width: 100%;
  height: 96px;
  display: flex;
  align-items: flex-end;
  background: var(--color-bg-elevated);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.prog-bar-fill {
  width: 100%;
  min-height: 3px;
  background: var(--color-text-faint);
}
.prog-bar-fill.is-zero {
  min-height: 0;
}
.prog-bar-col.is-current .prog-bar-fill {
  background: var(--color-accent);
}
.prog-bar-col .prog-bar-lbl {
  margin-top: var(--space-1);
  font-size: var(--font-size-xs);
  color: var(--color-text-dim);
}
.prog-bar-sub {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* ==========================================================================
   Редизайн, фаза Б (2026-10-19) — напрям C «Гібрид»
   docs/ДИЗАЙН-концепти.md. Тут лише вигляд; алгоритм і тексти не чіпаються.
   ========================================================================== */

.icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex: none;
}
.num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
}

/* --- Нижня навігація: SVG-іконки, активний пункт — лаймова іконка --- */
.bottom-nav {
  background: var(--color-bg);
  border-top-color: var(--color-border);
}
.nav-item {
  font-size: var(--font-size-xs);
  border-top: 3px solid transparent;
}
.nav-item.is-active {
  border-top-color: transparent;
}
.nav-item.is-active .icon {
  color: var(--color-accent);
}
.nav-item-icon {
  display: flex;
}

/* --- Заголовки екранів і карток --- */
.screen-title {
  font-size: var(--font-size-xl);
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin-top: var(--space-4);
}
.card {
  border-radius: var(--radius-lg);
}

/* --- Чипи: активний — лайм із темним текстом --- */
.chip {
  background: transparent;
  border-color: var(--color-border-strong);
}

/* --- Нижня панель «Чому так?» / «Докладніше» --- */
.why-sheet > summary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--tap-min);
  padding: 0 var(--space-1);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.why-sheet > summary::before,
.why-sheet[open] > summary::before {
  content: "i";
  display: inline-grid;
  place-items: center;
  width: 20px;
  height: 20px;
  margin-right: 0;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  font: 700 12px/1 var(--font-sans);
}
.why-scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(0, 0, 0, 0.6);
}
.why-panel {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 41;
  max-width: 640px;
  max-height: 82dvh;
  margin: 0 auto;
  overflow-y: auto;
  padding: var(--space-2) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));
  background: var(--color-bg-card);
  border-top: 1px solid var(--color-border-strong);
  border-radius: 20px 20px 0 0;
  color: var(--color-text);
}
.why-grab {
  width: 40px;
  height: 5px;
  margin: 0 auto var(--space-4);
  border-radius: 3px;
  background: var(--color-border-strong);
}
.why-title {
  margin-bottom: var(--space-3);
  font-size: var(--font-size-lg);
  font-weight: 700;
}
.why-panel .workout-why {
  border-left: 0;
  padding: 0;
  font-size: var(--font-size-sm);
  line-height: 1.5;
}
.why-panel .text-dim {
  font-size: var(--font-size-sm);
  line-height: 1.5;
}
.why-close {
  margin-top: var(--space-4);
  min-height: var(--tap-big);
}
@media (prefers-reduced-motion: no-preference) {
  .why-sheet[open] > .why-panel { animation: why-up 0.18s ease-out; }
  @keyframes why-up { from { transform: translateY(24px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}

/* --- Велике число з −/+ і правкою тапом --- */
.bignum {
  display: grid;
  grid-template-columns: var(--tap-big) 1fr var(--tap-big);
  align-items: center;
  gap: var(--space-2);
}
.bignum-btn {
  width: var(--tap-big);
  height: var(--tap-big);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong);
  background: var(--color-bg-elevated);
  color: var(--color-text);
  font-size: 28px; /* знак −/+ — іконка, не текст */
  line-height: 1;
}
.bignum-btn:active { background: var(--color-border-strong); }
.bignum-mid {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}
.bignum-val,
.bignum-input {
  width: 100%;
  min-height: var(--tap-big);
  padding: 0;
  border: 0;
  border-bottom: 2px dashed #3A4049;
  background: transparent;
  color: var(--color-text);
  font: 700 var(--font-size-number)/1 var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
  text-align: center;
}
.bignum-input {
  border-bottom-color: var(--color-accent);
  outline: none;
}
.bignum-lab {
  margin-top: var(--space-1);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}

/* --- Тренування: картка вправи, рядки підходів, поточний підхід --- */
.ex-card.is-current {
  border-color: var(--color-border-strong);
}
.ex-card.is-done .ex-title {
  color: var(--color-text-dim);
}
.ex-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: var(--tap-min);
}
.ex-title {
  font-size: var(--font-size-lg);
  font-weight: 700;
  line-height: 1.25;
  cursor: pointer;
}
.ex-chev {
  color: var(--color-text-dim);
}
.ex-meta {
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  margin-bottom: var(--space-2);
}
.ex-line {
  margin-bottom: var(--space-2);
  font-size: var(--font-size-xs);
}
/* Згорнута картка: лише назва, зведення і рядки підходів. */
.ex-card:not(.is-current) .ex-extra {
  display: none;
}
.ex-extra .workout-why {
  margin-bottom: var(--space-1);
}
.set-list {
  margin-top: var(--space-1);
}
.set-row {
  border-top: 1px solid var(--color-border);
}
.set-line {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 52px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--color-text);
  text-align: left;
  font-size: var(--font-size-base);
}
.set-n {
  width: 18px;
  color: var(--color-text-dim);
}
.set-wr {
  flex: 1 1 auto;
}
.set-rir {
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.set-ok {
  color: var(--color-accent);
  stroke-width: 2.6;
}
.set-chev {
  color: var(--color-text-dim);
}
.set-row:not(.is-done):not(.is-current) .set-wr {
  color: var(--color-text-dim);
}
.set-row.is-current .set-n,
.set-row.is-current .set-wr {
  color: var(--color-text);
  font-weight: 700;
}
.set-edit {
  display: none;
}
.set-row.is-open .set-edit {
  display: block;
  margin: 0 calc(-1 * var(--space-2)) var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-bg-elevated);
}
.set-row.is-open .bignum + .bignum {
  margin-top: var(--space-3);
}
.set-label {
  margin: 0 0 var(--space-2);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.set-edit .set-label:not(:first-child) {
  margin-top: var(--space-4);
}
.set-edit .workout-why {
  margin-bottom: var(--space-2);
}
.rir-seg {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.rir-seg-btn {
  min-height: var(--tap-big);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border-strong);
  background: transparent;
  color: var(--color-text-dim);
  font: 700 var(--font-size-base) var(--font-mono);
}
.rir-seg-btn.is-on {
  background: var(--color-text);
  border-color: var(--color-text);
  color: var(--color-bg);
}
.btn-main {
  min-height: var(--tap-main);
  margin-top: var(--space-4);
}

/* --- Відпочинок: смуга з кільцем над нижньою навігацією --- */
.rest-dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + var(--space-2));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  max-width: 624px;
  margin: 0 var(--space-2);
  padding: var(--space-2) var(--space-3) var(--space-2) var(--space-2);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-bg-card);
}
@media (min-width: 656px) {
  .rest-dock { margin: 0 auto; }
}
.rest-ring {
  width: 60px;
  height: 60px;
  flex: none;
}
.rest-ring-bg,
.rest-ring-fg {
  fill: none;
  stroke-width: 6;
}
.rest-ring-bg { stroke: var(--color-border-strong); }
.rest-ring-fg {
  stroke: var(--color-accent);
  stroke-linecap: round;
}
.rest-mid {
  flex: 1 1 auto;
  min-width: 0;
}
.rest-cap {
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.rest-time {
  font-size: var(--font-size-xl);
  font-weight: 700;
  line-height: 1.1;
}
.rest-btn {
  width: auto;
  white-space: nowrap;
  padding: 0 var(--space-3);
  font-size: var(--font-size-xs);
}
.rest-spacer {
  height: 96px;
}
@media (prefers-reduced-motion: no-preference) {
  .rest-ring-fg { transition: stroke-dashoffset 0.9s linear; }
}

/* --- Число-герой (хвилини на тренуванні й «Сьогодні») --- */
.hero-num {
  font-size: var(--font-size-display);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.04em;
}
.hero-unit {
  font-family: var(--font-sans);
  font-size: var(--font-size-lg);
  font-weight: 400;
  letter-spacing: 0;
  color: var(--color-text-dim);
}
.hero-sub {
  margin-top: var(--space-2);
  font-size: var(--font-size-base);
}
.hero-card > .text-faint,
.hero-card > .text-dim {
  margin-top: var(--space-1);
}
.parts-card .onb-chips {
  margin-bottom: 0;
}

/* --- Згортка (розминка тощо): заголовок-рядок із шевроном --- */
.fold > .fold-sum {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: var(--tap-min);
  font-size: var(--font-size-lg);
  font-weight: 700;
  list-style: none;
  cursor: pointer;
}
.fold > .fold-sum::-webkit-details-marker { display: none; }
.fold > .fold-sum::after {
  content: "";
  width: 10px;
  height: 10px;
  margin-right: 6px;
  border-right: 2px solid var(--color-text-dim);
  border-bottom: 2px solid var(--color-text-dim);
  transform: rotate(45deg);
}
.fold[open] > .fold-sum::after {
  transform: rotate(-135deg);
}
.fold[open] > .fold-sum {
  margin-bottom: var(--space-2);
}

/* --- «Сьогодні» --- */
.today-card {
  padding-top: var(--space-3);
}
.today-pos .text-dim {
  font-size: var(--font-size-xs);
}
.today-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-3);
}
.today-focus {
  font-size: var(--font-size-xl);
  font-weight: 700;
  line-height: 1.1;
  margin-bottom: var(--space-1);
}
.today-min {
  font-size: var(--font-size-number);
  white-space: nowrap;
}
.plan-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 52px;
  border-bottom: 1px solid var(--color-border);
}
.plan-card > .plan-row:first-child {
  margin-top: calc(-1 * var(--space-2));
}
.plan-name {
  flex: 1 1 auto;
  min-width: 0;
}
.plan-val {
  color: var(--color-text-dim);
  white-space: nowrap;
}
.plan-more > .fold-sum {
  font-size: var(--font-size-base);
  font-weight: 400;
  color: var(--color-text-dim);
}
.pill {
  padding: 2px 7px;
  border: 1px solid var(--color-accent);
  border-radius: var(--radius-sm);
  color: var(--color-accent);
  font-size: var(--font-size-xs);
  font-weight: 700;
  white-space: nowrap;
}
.today-actions {
  margin-bottom: var(--space-4);
}
.today-actions .btn-main {
  margin-top: 0;
}

/* --- Мапа тіла --- */
.bodymap {
  display: block;
  width: 270px;
  max-width: 82%;
  height: auto;
  margin: 0 auto;
}
.bm-part {
  stroke: var(--color-bg-card);
  stroke-width: 1.6;
}
.bm-base { fill: var(--color-map-base); }
.bm-hot { fill: var(--color-map-hot); }
.bm-mid { fill: #B87793; }
.bm-cold { fill: var(--color-map-cold); }
.bm-cap {
  fill: var(--color-text-dim);
  font-size: 11px; /* ⚑ підпис усередині SVG, масштабується разом із мапою */
}
.bm-line {
  margin-top: var(--space-3);
  font-size: var(--font-size-base);
}
.bm-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2) var(--space-4);
  margin-top: var(--space-2);
  color: var(--color-text-dim);
  font-size: var(--font-size-xs);
}
.bm-key {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.bm-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: var(--color-map-base);
}
.bm-dot.bm-hot { background: var(--color-map-hot); }
.bm-dot.bm-mid { background: #B87793; }
.bm-dot.bm-cold { background: var(--color-map-cold); }

/* --- Підсумок циклу --- */
.cyc-head {
  margin-top: var(--space-3);
  font-size: var(--font-size-base);
}
.cyc-head-num {
  font-size: var(--font-size-xl);
  font-weight: 700;
  color: var(--color-accent);
}
.cyc-segs {
  display: flex;
  gap: 3px;
  margin-top: var(--space-3);
}
.cyc-seg {
  flex: 1 1 0;
  height: 8px;
  border-radius: 2px;
  background: var(--color-map-base);
}
.cyc-seg.is-on { background: var(--color-text); }
.cyc-reg { margin-top: var(--space-1); font-size: var(--font-size-xs); }
.cyc-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  padding: 10px 0;
  border-bottom: 1px solid var(--color-border);
}

// store.js — сховище BrainBod.

// Підключається ПЕРЕД ui.js.

// Рішення, під які написано (docs/STATE.md → «Рішення, які вже прийняті»):
//   * робочі дані — localStorage, тому основний API СИНХРОННИЙ;
//   * IndexedDB — тільки під rolling backup (async, best-effort, ніколи не

//   * усі ключі з префіксом "bb:" — на github.io origin спільний для всіх

//   * кожен запис у try/catch, QuotaExceededError — окремий сценарій виходу

// Форма стану — docs/DATA.md.

(function (global) {
  "use strict";

  // ------------------------------------------------------------------
  // Константи
  // ------------------------------------------------------------------

  var PREFIX = "bb:";
  var DEFAULT_SCHEMA_VERSION = 1; // поточна версія схеми в КОДІ (docs/DATA.md)
  var SCHEMA_VERSION = DEFAULT_SCHEMA_VERSION;

    state: PREFIX + "state",
    meta: PREFIX + "meta",
    sessionPrefix: PREFIX + "s_", // append-only копія сесії: bb:s_<id>
    backupPrefix: PREFIX + "bk:"  // резервний rolling backup у localStorage
  };

  // Заміряна місткість localStorage на Chrome Android (docs/STATE.md,
  // «Заміри й факти з перевірок»): 4.98 МБ.
  var LS_CAPACITY_BYTES = Math.round(4.98 * 1024 * 1024); // 5221580
  var LS_WARN_RATIO = 0.8; // з 80% зайнятого — попередження в UI

  var BACKUP_KEEP = 3;
  // Резервний режим (немає IndexedDB): знімки їдять той самий бюджет

  var BACKUP_KEEP_LS = 1;
  var BACKUP_LS_MAX_BYTES = 512 * 1024;

  var PERSIST_RETRY_MS = 14 * 24 * 60 * 60 * 1000;

  var storage = null;        // абстракція над localStorage (підмінна в тестах)
  var storageChecked = false;
  var cache = null;          // останній успішно збережений стан (об'єкт)
  var initResult = null;     // результат останнього init()
  var lock = null;           // { code, message } — писати заборонено
  var blockedRaw = null;     // сирий рядок, який ми відмовились відкрити
  var rescueJSON = null;     // JSON стану, який не вдалось записати
  var errorHandlers = [];
  var backupModeForced = "auto"; // auto | idb | ls | none
  var persistImpl = null;    // підміна navigator.storage.persist у тестах

  // ------------------------------------------------------------------
  // Дрібні утиліти
  // ------------------------------------------------------------------

  function deepCopy(v) {
    return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  }

  // Канонічний JSON: ключі об'єктів відсортовані рекурсивно.
  // Потрібен, щоб export → import → export збігався побайтово незалежно від
  // порядку ключів, у якому дані потрапили в пам'ять.
  function canonical(v) {
    if (v === null || typeof v !== "object") {
      return JSON.stringify(v === undefined ? null : v);
    }
    if (Array.isArray(v)) {
      var items = [];
      for (var i = 0; i < v.length; i++) {
        items.push(canonical(v[i]));
      }
      return "[" + items.join(",") + "]";
    }
    var keys = Object.keys(v).sort();
    var parts = [];
    for (var j = 0; j < keys.length; j++) {
      var k = keys[j];
      if (v[k] === undefined) continue;
      if (typeof v[k] === "function") continue;
      parts.push(JSON.stringify(k) + ":" + canonical(v[k]));

    return "{" + parts.join(",") + "}";
  }

  function bytesOf(str) {
    return (str ? String(str).length : 0) * 2;
  }

  function nowISO() {
    return new Date().toISOString();
  }

    try {
      if (global.APP_VERSION) return String(global.APP_VERSION);
      if (global.document) {
        var m = global.document.querySelector('meta[name="app-version"]');
        if (m && m.content && m.content.indexOf("__") !== 0) return m.content;
      }
    } catch (e) { /* ігноруємо */ }
    return "0.0.0-dev";
  }

    if (!e) return false;
    return (
      e.name === "QuotaExceededError" ||
      e.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
      e.code === 22 ||
      e.code === 1014

    }

  // Доступ до сховища (усе — через ці 4 функції, щоб тест міг підмінити)
  // ------------------------------------------------------------------

  function getStorage() {
    if (storage) return storage;
    if (storageChecked) return null;
    storageChecked = true;
    try {
      var probeKey = PREFIX + "__probe";
      global.localStorage.setItem(probeKey, "1");
      global.localStorage.removeItem(probeKey);

    } catch (e) {

    }
    return storage;
  }

    var s = getStorage();
    if (!s) return null;
    try {
      return s.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function lsSetRaw(key, value) {
    var s = getStorage();
    if (!s) return { ok: false, code: "NO_STORAGE", error: null };
    try {
      s.setItem(key, value);
      return { ok: true, code: null, error: null };
    } catch (e) {
      return {
        ok: false,
        code: isQuotaError(e) ? "QUOTA" : "WRITE_FAILED",
        error: e
      };
    }
  }

  function lsDel(key) {
    var s = getStorage();
    if (!s) return false;
    try {
      s.removeItem(key);
      return true;
    } catch (e) {
      return false;
    }
  }

    var s = getStorage();
    var out = [];
    if (!s) return out;
    try {
      for (var i = 0; i < s.length; i++) {
        var k = s.key(i);
        if (k === null || k === undefined) continue;
        if (prefix && String(k).indexOf(prefix) !== 0) continue;
        out.push(String(k));
      }
    } catch (e) { /* ігноруємо */ }
    return out;

  // ------------------------------------------------------------------

      if (SECTIONS[i] === name) return true;
    }
    return false;
  }

  // Доводить об'єкт до повного набору секцій ВЕРХНЬОГО рівня.
  // Всередину секцій не лізе навмисно: інакше export → import → export
  // перестав би збігатись побайтово, а чужі дані домішувались би дефолтами.
  function normalizeTop(s) {
    var base = emptyState();
    if (!s || typeof s !== "object") return base;
    for (var i = 0; i < SECTIONS.length; i++) {
      var name = SECTIONS[i];
      if (!(name in s) || s[name] === undefined) {
        s[name] = base[name];
      }
    }
    if (!Array.isArray(s.exercises)) s.exercises = [];
    if (!Array.isArray(s.sessions)) s.sessions = [];
    if (!Array.isArray(s.log)) s.log = [];
    if (!s.metrics || typeof s.metrics !== "object") s.metrics = base.metrics;
    if (!s.calibration || typeof s.calibration !== "object") s.calibration = base.calibration;
    if (!s.settings || typeof s.settings !== "object") s.settings = base.settings;
    if (!("exportedAt" in s)) s.exportedAt = null;
    if (!("appVersion" in s)) s.appVersion = appVersion();
    return s;
  }

  // ------------------------------------------------------------------
  // Мета-дані модуля (не частина стану застосунку)
  // ------------------------------------------------------------------

  function emptyMeta() {
    return {
      sessionsSaved: 0,
      sessionsSinceExport: 0,
      lastExportAt: null,
      lastSaveAt: null,
      backupSeq: 0,
      persist: { granted: false, asks: 0, lastAskedAt: null, supported: null }
    };
  }

  function readMeta() {
    var raw = lsGet(K.meta);
    if (!raw) return emptyMeta();
    try {
      var m = JSON.parse(raw);
      var base = emptyMeta();
      for (var k in base) {
        if (!(k in m)) m[k] = base[k];
      }
      if (!m.persist || typeof m.persist !== "object") m.persist = base.persist;
      return m;
    } catch (e) {
      return emptyMeta();
    }
  }

  function writeMeta(m) {
    return lsSetRaw(K.meta, JSON.stringify(m));
  }

  function patchMeta(fn) {
    var m = readMeta();
    fn(m);
    writeMeta(m); // мета не критична: провал запису не робимо помилкою рівня даних
    return m;
  }

  // ------------------------------------------------------------------
  // Ключ append-only копії сесії
  // ------------------------------------------------------------------

  function sessionKey(id) {
    var s = String(id);
    if (s.indexOf("s_") === 0) s = s.slice(2);
    return K.sessionPrefix + s; // bb:s_<id>, як у docs/DATA.md
  }

  function listSessionKeys() {
    return lsKeys(K.sessionPrefix).sort();
  }

  // ------------------------------------------------------------------
  // Міграції
  // ------------------------------------------------------------------
  //
  // Поточна схема — 1, тому реальний реєстр порожній. Рушій нижче тримає
  // повний ланцюг (v1→v2→v3→…): кожна міграція — окрема функція, ланцюг
  // проганяється послідовно. Коли схема зміниться, сюди додається один
  // запис { from, to, fn } і SCHEMA_VERSION росте на 1.
  //
  // Формат: { from: N, to: N+1, fn: function (s) { ...; return s; } }

  var DEFAULT_MIGRATIONS = [];
  var MIGRATIONS = DEFAULT_MIGRATIONS;

  function registryTarget(reg) {
    var t = 1;
    for (var i = 0; i < reg.length; i++) {
      if (reg[i].to > t) t = reg[i].to;
    }
    return t;
  }

  // Перевіряє, що ланцюг суцільний: 1 → 2 → … → target, без дір і дублів.
  function validateRegistry(reg, target) {
    reg = reg || MIGRATIONS;
    target = target || (reg === MIGRATIONS ? SCHEMA_VERSION : registryTarget(reg));
    var seen = {};
    for (var i = 0; i < reg.length; i++) {
      var m = reg[i];
      if (typeof m.fn !== "function") {
        return { ok: false, code: "NO_FN", at: m.from };
      }
      if (m.to !== m.from + 1) {
        return { ok: false, code: "NOT_STEPWISE", at: m.from };
      }
      if (seen[m.from]) {
        return { ok: false, code: "DUPLICATE", at: m.from };
      }
      seen[m.from] = true;
    }
    for (var v = 1; v < target; v++) {
      if (!seen[v]) return { ok: false, code: "GAP", at: v };
    }
    return { ok: true, code: null, at: null };
  }

  // Проганяє стан по ланцюгу міграцій. Не мутує вхідний об'єкт.
  // opts: { registry, target }
  function migrate(state, opts) {
    opts = opts || {};
    var reg = opts.registry || MIGRATIONS;
    var target = opts.target;
    if (target === undefined || target === null) {
      target = reg === MIGRATIONS ? SCHEMA_VERSION : registryTarget(reg);
    }

    var s = deepCopy(state);
    var v = s.schemaVersion;
    if (typeof v !== "number" || !isFinite(v)) {
      v = 1; // немає версії — вважаємо найпершою, інакше даних не врятувати
      s.schemaVersion = 1;
    }

    if (v > target) {
      return {
        ok: false, code: "SCHEMA_FUTURE", state: null,
        applied: [], from: v, to: target
      };
    }

    var applied = [];
    var guard = 0;
    while (v < target) {
      if (++guard > reg.length + 1) {
        return { ok: false, code: "MIGRATION_LOOP", state: null, applied: applied, from: v, to: target };
      }
      var m = null;
      for (var i = 0; i < reg.length; i++) {
        if (reg[i].from === v) { m = reg[i]; break; }
      }
      if (!m) {
        return { ok: false, code: "NO_MIGRATION", state: null, applied: applied, from: v, to: target };
      }
      var next;
      try {
        next = m.fn(s);
      } catch (e) {
        return { ok: false, code: "MIGRATION_FAILED", state: null, applied: applied, from: v, to: target, error: e };
      }
      s = next || s;
      v = m.to;
      s.schemaVersion = v;
      applied.push({ from: m.from, to: m.to });
    }

    return { ok: true, code: null, state: s, applied: applied, from: state.schemaVersion, to: target };
  }

  // ------------------------------------------------------------------
  // Звільнення місця під час QuotaExceededError
  // ------------------------------------------------------------------
  //
  // Порядок жертв (від найменш цінного):
  //   1. резервні знімки в localStorage (в IndexedDB копія лишається);
  //   2. append-only копії сесій, які ТОЧНО вже є в збереженому стані.
  // Головний стан і мета не чіпаються ніколи.
  //
  // Ключове: «безпечні» id беруться з ОСТАННЬОГО ЗБЕРЕЖЕНОГО стану, а не з
  // того, який ми зараз намагаємось записати. Інакше провал запису лишив би
  // сесію взагалі без жодної копії.

  function safeMirrorKeys() {
    // Джерело істини — саме СХОВИЩЕ, а не кеш: кеш уже містить сесію, яку ми
    // тільки намагаємось записати, і по ньому її копію можна було б видалити
    // до того, як вона реально збережена.
    var stored = null;
    var raw = lsGet(K.state);
    if (raw) {
      try { stored = JSON.parse(raw); } catch (e) { stored = null; }
    }
    if (!stored || !Array.isArray(stored.sessions)) return [];
    var have = {};
    for (var i = 0; i < stored.sessions.length; i++) {
      var s = stored.sessions[i];
      if (s && s.id) have[sessionKey(s.id)] = true;
    }
    var keys = listSessionKeys().filter(function (k) { return have[k]; });
    return keys; // відсортовані за ключем; id містять таймстамп → найстаріші перші
  }

  function writeWithRecovery(key, value) {
    var r = lsSetRaw(key, value);
    if (r.ok || r.code !== "QUOTA") return r;

    // Крок 1: викинути localStorage-бекапи.
    var bk = lsKeys(K.backupPrefix);
    if (bk.length) {
      for (var i = 0; i < bk.length; i++) lsDel(bk[i]);
      r = lsSetRaw(key, value);
      if (r.ok) { r.freed = "backups"; return r; }
      if (r.code !== "QUOTA") return r;
    }

    // Крок 2: по одній викидати дублікати сесій, які вже є в збереженому стані.
    var mirrors = safeMirrorKeys().filter(function (k) { return k !== key; });
    var freed = 0;
    for (var j = 0; j < mirrors.length && j < FREE_SPACE_MAX_STEPS; j++) {
      lsDel(mirrors[j]);
      freed++;
      r = lsSetRaw(key, value);
      if (r.ok) { r.freed = "mirrors:" + freed; return r; }
      if (r.code !== "QUOTA") return r;
    }

    return r; // QUOTA і після звільнення — вище рівнем вирішують, що робити
  }

  // ------------------------------------------------------------------
  // init / load / save
  // ------------------------------------------------------------------

  function makeWarning(code, message, extra) {
    var w = { code: code, message: message };
    if (extra) {
      for (var k in extra) w[k] = extra[k];
    }
    return w;
  }

  function setLock(code, message) {
    lock = { code: code, message: message };
  }

  function init(opts) {
    opts = opts || {};
    lock = null;
    blockedRaw = null;
    cache = null;

    var s = getStorage();
    if (!s) {
      cache = emptyState();
      initResult = {
        ok: false,
        status: "unavailable",
        state: cache,
        warning: makeWarning(
          "NO_STORAGE",
          "Сховище браузера недоступне — дані НЕ зберігаються. Експортуйте JSON вручну."
        )
      };
      return initResult;
    }

    var raw = lsGet(K.state);
    if (raw === null || raw === undefined || raw === "") {
      cache = null;
      initResult = { ok: true, status: "empty", state: emptyState(), warning: null };
      return initResult;
    }

    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      blockedRaw = raw;
      setLock("CORRUPT", "Збережені дані пошкоджені.");
      initResult = {
        ok: false,
        status: "corrupt",
        state: null,
        warning: makeWarning(
          "CORRUPT",
          "Збережені дані не читаються. Запис заблоковано, щоб не затерти залишки. " +
          "Збережіть сирий вміст і спробуйте відновитись із резервної копії."
        )
      };
      return initResult;
    }

    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      blockedRaw = raw;
      setLock("CORRUPT", "Збережені дані мають несподівану форму.");
      initResult = {
        ok: false, status: "corrupt", state: null,
        warning: makeWarning("CORRUPT", "Збережені дані мають несподівану форму. Запис заблоковано.")
      };
      return initResult;
    }

    var stored = parsed.schemaVersion;

    // Версія у сховищі ВИЩА за версію коду — запустилась стара версія
    // застосунку. Не відкривати молчки (docs/DATA.md → «Міграції»).
    if (typeof stored === "number" && stored > SCHEMA_VERSION) {
      blockedRaw = raw;
      setLock("SCHEMA_FUTURE", "Дані новішої версії застосунку.");
      initResult = {
        ok: false,
        status: "future",
        state: null,
        warning: makeWarning(
          "SCHEMA_FUTURE",
          "Дані збережені новішою версією застосунку (схема " + stored +
          ", ця версія розуміє " + SCHEMA_VERSION + "). Оновіть застосунок. " +
          "Запис заблоковано, щоб не зіпсувати дані.",
          { storedVersion: stored, currentVersion: SCHEMA_VERSION }
        )
      };
      return initResult;
    }

    var needMigration = !(typeof stored === "number" && stored === SCHEMA_VERSION);

    if (!needMigration) {
      cache = normalizeTop(parsed);
      initResult = { ok: true, status: "ok", state: cache, warning: null };
      return initResult;
    }

    // Перед міграцією — знімок «як було» (best-effort, не блокує).
    if (opts.backupBeforeMigrate !== false) {
      backupPush(parsed, { reason: "pre-migration" });
    }

    var res = migrate(parsed);
    if (!res.ok) {
      blockedRaw = raw;
      setLock("MIGRATION", "Не вдалось оновити схему даних.");
      initResult = {
        ok: false,
        status: "corrupt",
        state: null,
        warning: makeWarning(
          "MIGRATION_FAILED",
          "Не вдалось оновити схему даних (" + res.code + ", версія " + res.from + "). " +
          "Запис заблоковано. Дані на місці — зробіть експорт.",
          { storedVersion: res.from, currentVersion: SCHEMA_VERSION, reason: res.code }
        )
      };
      return initResult;
    }

    cache = normalizeTop(res.state);
    var saved = save(cache, { skipBackup: true });
    initResult = {
      ok: true,
      status: "migrated",
      state: cache,
      applied: res.applied,
      warning: saved.ok ? null : makeWarning(
        "MIGRATION_NOT_SAVED",
        "Схема оновлена в пам'яті, але записати не вдалось (" + saved.code + ")."
      )
    };
    return initResult;
  }

  function ensureInit() {
    if (!initResult) init();
    return initResult;
  }

  function currentState() {
    ensureInit();
    if (!cache) {
      var raw = lsGet(K.state);
      if (raw) {
        try {
          cache = normalizeTop(JSON.parse(raw));
        } catch (e) {
          cache = emptyState();
        }
      } else {
        cache = emptyState();
      }
    }
    return cache;
  }

  function load() {
    return deepCopy(currentState());
  }

  // Основний запис. Синхронний. Повертає { ok, code, bytes }.
  function save(state, opts) {
    opts = opts || {};

    if (lock && !opts.force) {
      var blocked = { ok: false, code: lock.code, message: lock.message };
      emit(blocked);
      return blocked;
    }

    var s = state || cache || emptyState();
    s = normalizeTop(s);
    s.schemaVersion = SCHEMA_VERSION;
    s.appVersion = appVersion();

    var json = canonical(s);
    var r = writeWithRecovery(K.state, json);

    if (r.ok) {
      cache = s;
      rescueJSON = null;
      patchMeta(function (m) {
        m.lastSaveAt = nowISO();
      });
      return { ok: true, code: null, bytes: bytesOf(json), freed: r.freed || null };
    }

    // Запис не пройшов. localStorage.setItem атомарний: попереднє значення
    // на місці, тому історія НЕ втрачена. Далі — сигнал нагору + аварійний
    // JSON для кнопки «скопіювати в буфер» (docs/DATA.md, стратегія п.1, 5).
    cache = s; // тримаємо в пам'яті, щоб UI було що врятувати
    rescueJSON = json;
    var err = {
      ok: false,
      code: r.code,
      message: r.code === "QUOTA"
        ? "Сховище переповнене — дані НЕ збережені. Історія на місці, але нові записи не проходять. Експортуйте JSON."
        : "Не вдалось записати дані в сховище. Історія на місці. Експортуйте JSON.",
      bytes: bytesOf(json),
      error: r.error || null
    };
    emit(err);
    return err;
  }

  // ------------------------------------------------------------------
  // Секційні аксесори
  // ------------------------------------------------------------------

  function getSection(name) {
    return deepCopy(currentState()[name]);
  }

  // Запис дозволений ТІЛЬКИ у відомі секції. Причина не формальна:
  // normalizeTop() зайві ключі верхнього рівня не видаляє, тому одна описка
  // в назві секції назавжди осіла б у стані й у кожному файлі експорту, а
  // прибрати її було б нічим. Помилка повертається кодом, а не throw'ом —
  // щоб поводитись так само, як save() при відмові сховища.
  function setSection(name, value, opts) {
    if (!isSection(name)) {
      return {
        ok: false, code: "UNKNOWN_SECTION",
        message: "Невідома секція стану: " + String(name) + "."
      };
    }
    var s = currentState();
    s[name] = deepCopy(value);
    return save(s, opts);
  }

  function resetSection(name, opts) {
    if (!isSection(name)) {
      return {
        ok: false, code: "UNKNOWN_SECTION",
        message: "Невідома секція стану: " + String(name) + "."
      };
    }
    var s = currentState();
    s[name] = emptyState()[name];
    return save(s, opts);
  }

  // --- сесії ---

  function getSessions() { return getSection("sessions"); }

  function getSession(id) {
    var list = currentState().sessions || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id === id) return deepCopy(list[i]);
    }
    return null;
  }

  // Додає сесію: спершу окрема append-only копія (маленька), потім головний
  // стан. Порядок навмисний — якщо головний запис упреться в квоту, сесія
  // все одно вже лежить окремим ключем.
  function appendSession(session, opts) {
    opts = opts || {};
    if (!session || !session.id) {
      return { ok: false, code: "BAD_SESSION", message: "Сесія без id." };
    }
    if (lock && !opts.force) {
      var blocked = { ok: false, code: lock.code, message: lock.message };
      emit(blocked);
      return blocked;
    }

    var mirror = writeWithRecovery(sessionKey(session.id), canonical(session));

    var s = currentState();
    if (!Array.isArray(s.sessions)) s.sessions = [];
    var replaced = false;
    for (var i = 0; i < s.sessions.length; i++) {
      if (s.sessions[i] && s.sessions[i].id === session.id) {
        s.sessions[i] = deepCopy(session);
        replaced = true;
        break;
      }
    }
    if (!replaced) s.sessions.push(deepCopy(session));

    var res = save(s, opts);
    res.mirror = mirror.ok;

    if (res.ok && !replaced) {
      patchMeta(function (m) {
        m.sessionsSaved = (m.sessionsSaved || 0) + 1;
        m.sessionsSinceExport = (m.sessionsSinceExport || 0) + 1;
      });
      if (opts.skipBackup !== true) {
        backupPush(s, { reason: "session" });
      }
      if (opts.skipPersist !== true) {
        persistAfterSession();
      }
    }
    return res;
  }

  function deleteSession(id, opts) {
    var s = currentState();
    var before = (s.sessions || []).length;
    s.sessions = (s.sessions || []).filter(function (x) {
      return !x || x.id !== id;
    });
    var res = save(s, opts);
    if (res.ok && s.sessions.length < before) {
      lsDel(sessionKey(id));
    }
    return res;
  }

  // Сесії, які лежать окремими ключами, але зникли з головного стану
  // (наслідок пошкодження головного об'єкта). Шлях відновлення.
  function orphanSessions() {
    var s = currentState();
    var have = {};
    var list = (s && s.sessions) || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id) have[sessionKey(list[i].id)] = true;
    }
    var out = [];
    var keys = listSessionKeys();
    for (var j = 0; j < keys.length; j++) {
      if (have[keys[j]]) continue;
      var raw = lsGet(keys[j]);
      if (!raw) continue;
      try { out.push(JSON.parse(raw)); } catch (e) { /* пропускаємо биту копію */ }
    }
    return out;
  }

  // --- журнал ---

  function appendLog(entry, opts) {
    var s = currentState();
    if (!Array.isArray(s.log)) s.log = [];
    var e = deepCopy(entry) || {};
    if (!e.ts) e.ts = Date.now();
    s.log.push(e);
    return save(s, opts);
  }

  // ------------------------------------------------------------------
  // Export / Import
  // ------------------------------------------------------------------

  function exportObject(opts) {
    opts = opts || {};
    var s = deepCopy(currentState());
    s = normalizeTop(s);
    s.schemaVersion = SCHEMA_VERSION;
    s.appVersion = opts.appVersion || appVersion();
    s.exportedAt = opts.at || nowISO();
    return s;
  }

  function exportJSON(opts) {
    return canonical(exportObject(opts));
  }

  function exportFilename(at) {
    var d = at ? new Date(at) : new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return "brainbod-" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" +
      p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".json";
  }

  // Канал 1: файл через Blob + <a download>. Перевірено на Chrome Android.
  function downloadFile(opts) {
    opts = opts || {};
    var json = opts.json || exportJSON(opts);
    var name = opts.filename || exportFilename(opts.at);
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = global.document.createElement("a");
      a.href = url;
      a.download = name;
      a.style.display = "none";
      global.document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try {
          global.document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) { /* ігноруємо */ }
      }, 0);
      markExported();
      return { ok: true, filename: name, bytes: bytesOf(json) };
    } catch (e) {
      return { ok: false, code: "DOWNLOAD_FAILED", error: e };
    }
  }

  // Канал 2: буфер обміну. Перевірено на Chrome Android; на iOS це головний
  // канал, бо файл приходить із генеричним ім'ям без розширення.
  function copyToClipboard(opts) {
    opts = opts || {};

        try {

          ta.setAttribute("readonly", "");

          ta.style.top = "-1000px";

    } catch (e) {

    }
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      return { ok: false, code: "NOT_STATE", message: "Це не файл стану BrainBod." };
    }
    if (!("schemaVersion" in parsed)) {

    }

        code: "SCHEMA_FUTURE",

    cache = next;

      var r = lsSetRaw(sessionKey(s.id), canonical(s));
      if (r.ok) written++;
      else if (r.code === "QUOTA") break;
    }
    return written;
  }

  // ------------------------------------------------------------------
  // Резервна копія у файл (етап 8, docs/DATA.md «Файл резервної копії»).
  // Конверт з версією формату, версією схеми і контрольною сумою SHA-256
  // даних; необов'язково — шифрування паролем (PBKDF2-SHA-256 → AES-GCM,
  // лише WebCrypto, без залежностей і без мережі). Імпорт — двокроковий:
  // inspectBackup() показує, що у файлі, importBackup() пише тільки з
  // { confirmed: true }.
  // ------------------------------------------------------------------

  var BACKUP_FORMAT = "brainbod-backup";
  var BACKUP_FORMAT_VERSION = 1;
  // OWASP Password Storage Cheat Sheet (переглянуто 2026-10-06):
  // «PBKDF2-HMAC-SHA256: 600,000 iterations».
  var PBKDF2_ITERATIONS = 600000;
  // NIST SP 800-132 §5.1: випадкова частина солі — щонайменше 128 біт.
  var PBKDF2_SALT_BYTES = 16;
  // NIST SP 800-38D §5.2.1.1: для IV рекомендовано 96 біт.
  var AES_GCM_IV_BYTES = 12;

      var c = global.crypto;

    } catch (e) { return null; }

  function utf8(str) { return new TextEncoder().encode(str); }
  function fromUtf8(buf) { return new TextDecoder("utf-8", { fatal: true }).decode(buf); }

  function toB64(bytes) {
    var u = new Uint8Array(bytes), out = "", CH = 0x8000;
    for (var i = 0; i < u.length; i += CH) {

    return global.btoa(out);
  }

    var u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

          { name: "PBKDF2", hash: "SHA-256", salt: salt, iterations: iterations },
          base, { name: "AES-GCM", length: 256 }, false, [usage]);
      });
  }

  // Короткий опис стану для попереднього перегляду (і файлу, і поточних даних).
  function backupSummary(state) {

    var dates = [], sets = 0;
    for (var i = 0; i < list.length; i++) {
      var x = list[i] || {};
      if (typeof x.date === "string") dates.push(x.date);
      var en = Array.isArray(x.entries) ? x.entries : [];
      for (var j = 0; j < en.length; j++) {
        sets += Array.isArray(en[j] && en[j].sets) ? en[j].sets.length : 0;
      }
    }
    dates.sort();
    return {
      sessions: list.length,
      sets: sets,
      firstDate: dates.length ? dates[0] : null,
      lastDate: dates.length ? dates[dates.length - 1] : null,
      hasProgram: !!state.program,
      schemaVersion: typeof state.schemaVersion === "number" ? state.schemaVersion : null

  }

  function currentSummary() {
    return backupSummary(currentState());
  }

  function backupErr(code, message, extra) {

    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) r[k] = extra[k];
    return r;

  // → Promise<{ ok, text, filename, encrypted, summary, checksum }>.
  // opts.password — непорожній рядок → файл шифрується. opts.state — для
  // тестів (інакше поточний стан). Нічого не пише в сховище, крім позначки
  // markExported() при opts.markExported !== false.
  function exportBackup(opts) {
    opts = opts || {};
    var sb = subtle();
    if (!sb) {
      return Promise.resolve(backupErr("NO_CRYPTO",
        "Браузер не дає вбудованого шифрування й контрольної суми (потрібен https)."));
    }
    var data = opts.state ? normalizeTop(deepCopy(opts.state)) : exportObject(opts);
    data.schemaVersion = typeof data.schemaVersion === "number" ? data.schemaVersion : SCHEMA_VERSION;
    var at = opts.at || nowISO();

    return sha256Hex(dataText).then(function (hex) {
      inner = {
        format: BACKUP_FORMAT,
        formatVersion: BACKUP_FORMAT_VERSION,
        schemaVersion: data.schemaVersion,
        appVersion: opts.appVersion || appVersion(),
        exportedAt: at,
        encrypted: false,
        summary: backupSummary(data),
        checksum: { alg: "SHA-256", of: "canonical(data)", value: hex },

      var salt = global.crypto.getRandomValues(new Uint8Array(PBKDF2_SALT_BYTES));

      var iters = opts.iterations || PBKDF2_ITERATIONS;
      return deriveKey(password, salt, iters, "encrypt").then(function (key) {
        return sb.encrypt({ name: "AES-GCM", iv: iv }, key, utf8(canonical(inner)));
      }).then(function (ct) {

        // лежать усередині шифру.
        return canonical({
          format: BACKUP_FORMAT,
          formatVersion: BACKUP_FORMAT_VERSION,
          exportedAt: at,
          encrypted: true,
          kdf: { name: "PBKDF2", hash: "SHA-256", iterations: iters, salt: toB64(salt) },
          cipher: { name: "AES-GCM", iv: toB64(iv) },

      if (opts.markExported !== false) markExported();

        ok: true, code: null, text: text,
        filename: exportFilename(at).replace(/\.json$/, password ? "-encrypted.json" : ".json"),
        encrypted: !!password, summary: inner.summary, checksum: inner.checksum.value
      };
    }, function (e) {
      return backupErr("EXPORT_FAILED", "Не вдалось створити резервну копію.", { error: e });
    });
  }

  function checkStateObject(data) {
    if (!data || typeof data !== "object" || Array.isArray(data) || !("schemaVersion" in data)) {
      return backupErr("NOT_STATE", "Це не файл з даними BrainBod.");
    }
    if (typeof data.schemaVersion === "number" && data.schemaVersion > SCHEMA_VERSION) {
      return backupErr("SCHEMA_FUTURE",
        "Файл збережений новішою версією застосунку (схема " + data.schemaVersion +
        ", ця версія розуміє " + SCHEMA_VERSION + "). Оновіть застосунок.",
        { storedVersion: data.schemaVersion, currentVersion: SCHEMA_VERSION });
    }
    return null;
  }

  // → Promise<{ ok, legacy, encrypted, checksumOk, summary, exportedAt, ... }>.
  // Нічого не пише. Помилки: BAD_JSON, NOT_STATE, FORMAT_FUTURE, NEED_PASSWORD,
  // BAD_PASSWORD, BAD_FILE, CHECKSUM_MISMATCH, SCHEMA_FUTURE, NO_CRYPTO.
  function inspectBackup(text, opts) {

      var parsed;
      try { parsed = JSON.parse(String(text)); }
      catch (e) { return backupErr("BAD_JSON", "Файл не читається — це не JSON."); }
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        return backupErr("NOT_STATE", "Це не файл з даними BrainBod.");
      }
      // Старий формат (до етапу 8): голий стан без конверта і без суми.
      if (parsed.format !== BACKUP_FORMAT) {
        var bad = checkStateObject(parsed);
        if (bad) return bad;
        return {
          ok: true, code: null, legacy: true, encrypted: false, checksumOk: null,
          summary: backupSummary(parsed), exportedAt: parsed.exportedAt || null,
          appVersion: parsed.appVersion || null, schemaVersion: parsed.schemaVersion,
          _dataText: canonical(parsed)
        };
      }
      if (typeof parsed.formatVersion !== "number" || parsed.formatVersion > BACKUP_FORMAT_VERSION) {
        return backupErr("FORMAT_FUTURE", "Файл створено новішою версією застосунку. Оновіть застосунок.");
      }
      if (!subtle()) {
        return backupErr("NO_CRYPTO", "Браузер не дає вбудованої перевірки контрольної суми (потрібен https).");
      }

        if (!pw) return backupErr("NEED_PASSWORD", "Файл захищено паролем. Введіть пароль.", { encrypted: true });
        var k = parsed.kdf || {}, c = parsed.cipher || {};

          typeof k.salt !== "string" || typeof c.iv !== "string" || typeof parsed.payload !== "string") {
          return backupErr("BAD_FILE", "Файл пошкоджено: бракує даних для розшифрування.", { encrypted: true });
        }
        var salt, iv, ct;
        try { salt = fromB64(k.salt); iv = fromB64(c.iv); ct = fromB64(parsed.payload); }
        catch (e) { return backupErr("BAD_FILE", "Файл пошкоджено.", { encrypted: true }); }
        innerP = deriveKey(pw, salt, it, "decrypt").then(function (key) {
          return subtle().decrypt({ name: "AES-GCM", iv: iv }, key, ct);

          catch (e) { return null; }

          return "BAD_PASSWORD";
        });

        innerP = Promise.resolve(parsed);
      }
      return innerP.then(function (inner) {
        var enc = parsed.encrypted === true;
        if (inner === "BAD_PASSWORD") {
          return backupErr("BAD_PASSWORD", "Пароль не підходить або файл пошкоджено.", { encrypted: true });
        }
        if (!inner || typeof inner !== "object" || inner.format !== BACKUP_FORMAT ||
          !inner.checksum || typeof inner.checksum.value !== "string") {
          return backupErr("BAD_FILE", "Файл пошкоджено.", { encrypted: enc });
        }

        return sha256Hex(dataText).then(function (hex) {

          }
          if (bad) return bad;
          return {
            ok: true, code: null, legacy: false, encrypted: enc, checksumOk: true,
            summary: backupSummary(inner.data), exportedAt: inner.exportedAt || null,
            appVersion: inner.appVersion || null, schemaVersion: inner.data.schemaVersion,
            _dataText: dataText
          };
        });
      });

      return backupErr("BAD_FILE", "Файл не вдалось перевірити.", { error: e });
    });

    return inspectBackup(text, opts).then(function (r) {

      if (opts.confirmed !== true) {

      if (res.ok) { res.summary = r.summary; res.legacy = r.legacy; res.encrypted = r.encrypted; }
      return res;
    });
  }

  // Канал 1 для конверта: файл через Blob + <a download>.
  function downloadText(text, filename) {
    try {
      var blob = new Blob([text], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = global.document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      global.document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { global.document.body.removeChild(a); URL.revokeObjectURL(url); } catch (e) { /* ігноруємо */ }
      }, 0);
      return { ok: true, filename: filename, bytes: bytesOf(text) };
    } catch (e) {
      return { ok: false, code: "DOWNLOAD_FAILED", error: e };
    }
  }

  // ------------------------------------------------------------------
  // clearAll — тільки свої ключі. На github.io origin спільний, чуже не чіпаємо.
  // ------------------------------------------------------------------

  function clearAll(opts) {
    opts = opts || {};
    var keys = lsKeys(PREFIX);
    var removed = 0;
    for (var i = 0; i < keys.length; i++) {
      if (opts.keepBackups && keys[i].indexOf(K.backupPrefix) === 0) continue;
      if (opts.keepMeta && keys[i] === K.meta) continue;
      if (lsDel(keys[i])) removed++;
    }
    cache = null;
    initResult = null;
    lock = null;
    blockedRaw = null;
    rescueJSON = null;
    return { ok: true, removed: removed };
  }

  // ------------------------------------------------------------------
  // navigator.storage.persist()
  // ------------------------------------------------------------------
  //
  // Запитується НЕ на старті, а після першої збереженої сесії: Chrome видає
  // постійне сховище за накопиченим engagement, а не на першу вимогу. На
  // замірі (docs/STATE.md) повернув false — це НЕ помилка, просто ще рано.
  // Тому запит повторюваний: раз на 14 днів, поки не granted.

  function persistSupported() {
    if (persistImpl) return true;
    try {
      return !!(global.navigator && global.navigator.storage &&
        typeof global.navigator.storage.persist === "function");
    } catch (e) {
      return false;
    }
  }

      supported: persistSupported(),
      granted: !!(m.persist && m.persist.granted),
      asks: (m.persist && m.persist.asks) || 0,
      lastAskedAt: (m.persist && m.persist.lastAskedAt) || null

  }

    return new Promise(function (resolve) {

            function (v) { resolve(!!v); },
            function () { resolve(false); }

          return;
        }
      } catch (e) { /* ігноруємо */ }
      resolve(false);
    });
  }

  function persistRequest(opts) {
    opts = opts || {};
    return new Promise(function (resolve) {
      var st = persistStatus();
      if (!st.supported) {
        resolve({ ok: true, granted: false, supported: false, skipped: true, reason: "unsupported" });
        return;
      }
      if (st.granted && !opts.force) {
        resolve({ ok: true, granted: true, supported: true, skipped: true, reason: "already" });
        return;
      }
      if (!opts.force && st.lastAskedAt) {

          return;

          m.persist.granted = !!granted;
          m.persist.asks = (m.persist.asks || 0) + 1;
          m.persist.lastAskedAt = nowISO();

        // сховище пізніше, за накопиченим engagement.

    var m = readMeta();
    if ((m.sessionsSaved || 0) < 1) {
      return Promise.resolve({ ok: true, granted: false, skipped: true, reason: "no-sessions" });
    }
    return persistRequest();
  }

  // ------------------------------------------------------------------
  // Місткість
  // ------------------------------------------------------------------

  function usage() {
    var keys = lsKeys(PREFIX);
    var bytes = 0;
    for (var i = 0; i < keys.length; i++) {
      var v = lsGet(keys[i]);
      bytes += bytesOf(keys[i]) + bytesOf(v);
    }
    return {
      keys: keys.length,
      bytes: bytes,
      capacity: LS_CAPACITY_BYTES,
      ratio: bytes / LS_CAPACITY_BYTES,
      warn: bytes / LS_CAPACITY_BYTES >= LS_WARN_RATIO
    };
  }

  function estimate() {
    return new Promise(function (resolve) {
      try {
        if (global.navigator && global.navigator.storage &&
          typeof global.navigator.storage.estimate === "function") {

            function (e) { resolve({ ok: true, quota: e.quota, usage: e.usage }); },
            function () { resolve({ ok: false }); }

          return;
        }
