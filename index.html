    // раніше за сигналом) → підсумок циклу і рекомендація на наступний.
    if (adv.event === "DELOAD_STARTED") {
      var csum = cycleSummary({
        sessions: sessions, index: idx, mesoId: st.mesoId, anchors: p.anchors, mode: o.mode,
        daysPerWeek: days, plateau: o.plateau, pain: o.pain, today: o.today, priority: o.priority,
        lastWeek: { mesoId: st.mesoId, trigger: check ? check.trigger : null, fired: check ? check.fired.slice() : [] },
        at: at
      });
      if (csum.ok) out.cycles = appendCycle(p.cycles, csum);
    }
    out.history = hist;
    out.lastWeek = {
      at: at, mesoId: st.mesoId, week: st.week, event: adv.event,
      deload: check ? check.deload : null,
      skipped: check ? check.skipped : false,
      trigger: check ? check.trigger : null,
      ruleId: check ? check.ruleId : null,
      fired: check ? check.fired.slice() : [],
      fatigue: F ? F.value : null,
      missRate: isNum(weekMiss) ? weekMiss : null,
      plateauForced: o.forcedT2 === true
    };
    return { ok: true, code: "OK", program: out, event: adv.event, weekEnded: true,
      check: check, advance: adv, fatigue: F };
  }

  // ---------- T2: Fatigue ≥ 70 два тижні поспіль ----------
  //
  //   deloadT2({ fatigueWeeks: [F_тиждень1, …], forced: bool })
  //
  // `forced` — вхід від §6, крок 4 драбини плато: `algo-core.js` віддає
  // `deload: { trigger: "T2", forced: true }`, і §10.3 наполягає, що це саме
  // форсований T2. Тут він приймається як є, без перерахунку втоми.
  function deloadT2(opts) {
    var o = opts || {};
    var arr = Array.isArray(o.fatigueWeeks) ? o.fatigueWeeks : [];
    var streak = 0;
    for (var i = arr.length - 1; i >= 0; i--) {
      if (isNum(arr[i]) && arr[i] >= FATIGUE_T2) streak++;
      else break;
    }
    var forced = o.forced === true;
    var byFatigue = streak >= T2_WEEKS;
    return {
      ok: true, code: "OK", trigger: "T2",
      triggered: byFatigue || forced,
      ruleId: null,                       // §12 не має запису під T2 — див. шапку
      reason: byFatigue ? "FATIGUE_STREAK" : (forced ? "PLATEAU_STEP4_DELOAD" : null),
      streak: streak, threshold: FATIGUE_T2, weeksNeeded: T2_WEEKS, forced: forced
    };
  }

  // ---------- T3: anchor'и не ростуть ----------
  //
  //   deloadT3({ gains: { id: [%, %, %] }, e1rm: { id: [v0, v1, …] } })
  //
  // `gains` — приріст e1RM у ВІДСОТКАХ по тижнях, найновіший останній.
  // `e1rm` — ряд значень e1RM по тижнях; відсотки рахуються з нього.
  // Anchor «застряг», якщо всі останні 3 тижні дали <0.5%.
  //
  // ⚑ §4 у псевдокоді T1 прирівнює «≥2 з 3 anchor'ів дали +≥0.5% за 3 тижні»
  // до «умова T3 явно НЕ виконана», тому «росте» тут = «не застряг», а не
  // окрема перевірка накопиченого відсотка. Anchor, у якого менше 3 тижнів
  // даних, не рахується ні застряглим, ні зростаючим — він `unknown`, і цього
  // достатньо, щоб T1 не пропустив дельоуд наосліп.
  function pctGains(series) {
    var out = [];
    if (!Array.isArray(series)) return out;
    for (var i = 1; i < series.length; i++) {
      var a = series[i - 1], b = series[i];
      if (!isNum(a) || !isNum(b) || a <= 0) { out.push(null); continue; }
      out.push(fix6((b - a) / a * 100));
    }
    return out;
  }

  function deloadT3(opts) {
    var o = opts || {};
    var gains = {};
    var id, i;
    if (o.e1rm && typeof o.e1rm === "object") {
      for (id in o.e1rm) if (has(o.e1rm, id)) gains[id] = pctGains(o.e1rm[id]);
    }
    if (o.gains && typeof o.gains === "object") {
      for (id in o.gains) if (has(o.gains, id)) gains[id] = Array.isArray(o.gains[id]) ? o.gains[id] : [];
    }

    var ids = Object.keys(gains).sort();
    var stalled = [], growing = [], unknown = [];
    for (i = 0; i < ids.length; i++) {
      var g = gains[ids[i]];
      var tail = g.slice(Math.max(0, g.length - T3_WEEKS));
      var full = tail.length >= T3_WEEKS, allLow = full;
      for (var k = 0; k < tail.length; k++) {
        if (!isNum(tail[k])) { full = false; allLow = false; break; }
        if (tail[k] >= T3_GAIN_PCT) allLow = false;
      }
      if (!full) unknown.push(ids[i]);
      else if (allLow) stalled.push(ids[i]);
      else growing.push(ids[i]);
    }

    return {
      ok: true, code: "OK", trigger: "T3",
      triggered: stalled.length >= T3_ANCHORS_MIN,
      ruleId: null,                       // §12 не має запису під T3
      stalled: stalled, growing: growing, unknown: unknown,
      anchors: ids.length,
      needStalled: T3_ANCHORS_MIN, ofAnchors: T3_ANCHORS_TOTAL,
      weeks: T3_WEEKS, gainPct: T3_GAIN_PCT
    };
  }

  // ---------- T4: самопочуття ----------
  //
  //   deloadT4({ readiness: [1..5, …], pain: ["id", { exerciseId }, …] })
  //
  // Плече A — середня готовність <3/5 за останні 3 сесії.
  // Плече B — «біль у суглобі» ≥2 разів за тиждень. §4: «Біль → дельоуд ПЛЮС
  // зняття конкретного руху», тому рухи, які несли прапорець, повертаються
  // у `remove`, відсортовані, з лічильником у `painByExercise`.
  function deloadT4(opts) {
    var o = opts || {};
    var arr = Array.isArray(o.readiness) ? o.readiness : [];
    var tail = [];
    for (var i = Math.max(0, arr.length - T4_SESSIONS); i < arr.length; i++) {
      if (isNum(arr[i])) tail.push(arr[i]);
    }
    var avg = null;
    if (tail.length >= T4_SESSIONS) {
      var s = 0;
      for (i = 0; i < tail.length; i++) s += tail[i];
      avg = fix6(s / tail.length);
    }
    var armA = avg !== null && avg < T4_READINESS;

    var flags = Array.isArray(o.pain) ? o.pain : [];
    var byEx = {};
    var count = 0;
    for (i = 0; i < flags.length; i++) {
      var f = flags[i];
      if (f === null || f === undefined) continue;
      var exId = (typeof f === "string") ? f : (f && typeof f.exerciseId === "string" ? f.exerciseId : null);
      count++;
      if (exId) byEx[exId] = (byEx[exId] || 0) + 1;
    }
    var armB = count >= T4_PAIN_FLAGS;
    var remove = armB ? Object.keys(byEx).sort() : [];

    return {
      ok: true, code: "OK", trigger: "T4",
      triggered: armA || armB,
      ruleId: null,                       // §12 не має запису під T4
      reason: armA ? "READINESS" : (armB ? "JOINT_PAIN" : null),
      avgReadiness: avg, sessions: tail.length,
      painFlags: count, painByExercise: byEx,
      remove: remove,
      readinessThreshold: T4_READINESS, painThreshold: T4_PAIN_FLAGS
    };
  }

  // ---------- T1: перевірка, не автомат ----------
  //
  //   deloadT1({ othersTriggered, growing, t1Skips })
  //
  // Псевдокод §4 дослівно:
  //   кінець тижня 4:
  //     жоден із T2…T5 не спрацював І умова T3 явно НЕ виконана
  //       → дельоуд ПРОПУСКАЄТЬСЯ, ruleId: DELOAD_T1_SKIPPED
  //     інакше
  //       → звичайний дельоуд, ruleId: DELOAD_T1
  // плюс обмеження: не більше двох пропусків поспіль; третій кінець тижня 4
  // підряд дає дельоуд безумовно.
  function deloadT1(opts) {
    var o = opts || {};
    var skips = isNum(o.t1Skips) ? Math.max(0, Math.floor(o.t1Skips)) : 0;
    var others = o.othersTriggered === true;
    var growing = o.growing === true;
    var limitHit = skips >= T1_MAX_SKIPS;
    var skip = !others && growing && !limitHit;
    return {
      ok: true, code: "OK", trigger: "T1",
      triggered: !skip,
      skipped: skip,
      ruleId: skip ? "DELOAD_T1_SKIPPED" : "DELOAD_T1",
      reason: skip ? "GROWING" : (limitHit ? "SKIP_LIMIT" : (others ? "OTHER_TRIGGER" : "NOT_GROWING")),
      forced: limitHit,
      t1Skips: skip ? skips + 1 : 0,
      maxSkips: T1_MAX_SKIPS
    };
  }

  // ---------- спільна точка входу ----------
  //
  //   deloadCheck({ week, boundary, t1Skips,
  //                 fatigueWeeks, forcedT2,          — T2
  //                 gains | e1rm,                    — T3
  //                 readiness, pain,                 — T4
  //                 mrvWeeks, entrySnapshots, volumeScale })   — T5
  //
  // T1 перевіряється лише на межі мезоциклу (кінець тижня 4 і кожен наступний
  // кінець тижня продовженого мезоциклу). T2–T5 живуть щотижня.
  //
  // `trigger` називає ПРИЧИНУ (перший спрацьований із T2…T5, інакше T1), а
  // `ruleId` — запис реєстру §12: на межі це завжди DELOAD_T1/DELOAD_T1_SKIPPED
  // (так приписує псевдокод §4), поза межею — DELOAD_T5_MRV або null.
  function deloadCheck(opts) {
    var o = opts || {};
    var week = isNum(o.week) ? Math.max(1, Math.floor(o.week)) : 1;
    var boundary = (o.boundary === true) ? true
      : (o.boundary === false) ? false
      : week >= MESO_ACCUM_WEEKS;

    var t2 = deloadT2({ fatigueWeeks: o.fatigueWeeks, forced: o.forcedT2 });
    var t3 = deloadT3({ gains: o.gains, e1rm: o.e1rm });
    var t4 = deloadT4({ readiness: o.readiness, pain: o.pain });
    var t5 = deloadT5({
      mrvWeeks: o.mrvWeeks, entrySnapshots: o.entrySnapshots, volumeScale: scaleFrom(o)
    });

    var others = [];
    if (t2.triggered) others.push("T2");
    if (t3.triggered) others.push("T3");
    if (t4.triggered) others.push("T4");
    if (t5.triggered) others.push("T5");

    // §4: «≥2 з 3 anchor'ів дали +≥0.5% за 3 тижні, тобто умова T3 явно НЕ
    // виконана». Саме «явно»: невідомість не рахується за зростання.
    var growing = t3.growing.length >= T3_ANCHORS_MIN;

    var t1 = null;
    var deload, trigger, ruleId, skipped = false, forced = false;
    var t1Skips = isNum(o.t1Skips) ? Math.max(0, Math.floor(o.t1Skips)) : 0;

    if (boundary) {
      t1 = deloadT1({ othersTriggered: others.length > 0, growing: growing, t1Skips: t1Skips });
      deload = t1.triggered;
      skipped = t1.skipped;
      forced = t1.forced;
      ruleId = t1.ruleId;
      trigger = others.length ? others[0] : "T1";
      t1Skips = t1.t1Skips;
    } else {
      deload = others.length > 0;
      trigger = deload ? others[0] : null;
      // §12 має запис лише під T5; для T2/T3/T4 чесніше null, ніж чужий ruleId.
      ruleId = (deload && others.indexOf("T5") >= 0) ? "DELOAD_T5_MRV" : null;
      if (deload) t1Skips = 0;
    }

    return {
      ok: true, code: "OK",
      week: week, boundary: boundary,
      deload: deload,
      skipped: skipped,
      forced: forced,
      trigger: trigger,
      ruleId: ruleId,
      fired: others,
      growing: growing,
      remove: (deload && t4.triggered) ? t4.remove.slice() : [],
      t1Skips: t1Skips,
      triggers: { T1: t1, T2: t2, T3: t3, T4: t4, T5: t5 }
    };
  }

  // ---------- прескрипція дельоуд-тижня (§4) ----------
  //
  //   deloadPrescription({ daysPerWeek, volumeScale, week4Targets,
  //                        items, workingWeight })
  //
  //     → { ok, code, ruleId, sets, factor, weightFactor, weight, targetRir,
  //         durationDays, items, totalBefore, totalAfter, shortfall }
  //
  // §4: сети = 50% від тижня 4, вага та сама (етап 4, Bell 2025), цільовий RIR 4,
  // anchor-рухи лишаються, допоміжка ріжеться першою, тривалість 5–7 днів.
  //
  // ⚑ «Допоміжка ріжеться першою» ALGO.md не деталізує. Порядок різання тут:
  // допоміжка з кінця списку до нуля, і лише якщо цього мало — anchor'и, але
  // не нижче ANCHOR_MIN_SETS (§9.7, виняток 2: викинути anchor = зламати
  // прогресію, заради якої існує §5).
  function deloadPrescription(opts) {
    var o = opts || {};
    var i;

    // Сети на м'яз: 50% від цілі тижня 4 тієї ж схеми.
    var base = (o.week4Targets && typeof o.week4Targets === "object")
      ? o.week4Targets
      : weeklyTargets({ daysPerWeek: o.daysPerWeek, week: MESO_ACCUM_WEEKS, volumeScale: scaleFrom(o) });
    var sets = {}, week4 = {};
    for (i = 0; i < MUSCLES.length; i++) {
      var m = MUSCLES[i];
      var t = base[m];
      var v = isNum(t) ? t : (t && isNum(t.value) ? t.value : 0);
      week4[m] = v;
      sets[m] = Math.floor(v * DELOAD_FACTOR + 1e-9);
    }

    // Вага: та сама робоча (DELOAD_LOAD_FACTOR = 1) — розвантаження йде
    // обсягом і запасом повторів (Bell 2025: −%ПМ АБО +RIR, не обидва).
    var weight = null;
    if (o.workingWeight && typeof o.workingWeight === "object") {
      weight = {};
      for (var id in o.workingWeight) {
        if (!has(o.workingWeight, id)) continue;
        var w = o.workingWeight[id];
        weight[id] = isNum(w) ? fix2(w * DELOAD_LOAD_FACTOR) : null;
      }
    } else if (isNum(o.workingWeight)) {
      weight = fix2(o.workingWeight * DELOAD_LOAD_FACTOR);
    }

    // Склад сесії: копія входу, сети зрізані, RIR 4 на всьому.
    var src = Array.isArray(o.items) ? o.items : [];
    var items = [];
    var totalBefore = 0;
    for (i = 0; i < src.length; i++) {
      var it = src[i] || {};
      var n = isNum(it.sets) ? Math.max(0, Math.floor(it.sets)) : 0;
      totalBefore += n;
      var isAnchor = (it.kind === "anchor") || (it.role === "anchor") || (it.isAnchor === true);
      var rir = anchorRirOf(DELOAD_RIR, isAnchor, false);
      items.push({
        exerciseId: it.exerciseId || it.id || null,
        kind: isAnchor ? "anchor" : "assist",
        setsBefore: n, sets: n,
        targetRir: rir.value,
        targetRirRuleId: rir.ruleId,
        weightFactor: DELOAD_LOAD_FACTOR,
        cut: 0, kept: true
      });
    }

    var goal = Math.floor(totalBefore * DELOAD_FACTOR + 1e-9);
    var need = totalBefore - goal;

    // Прохід 1 — допоміжка, з кінця (найдалі від anchor'а за пріоритетом §11.1).
    for (i = items.length - 1; i >= 0 && need > 0; i--) {
      if (items[i].kind === "anchor") continue;
      var take = Math.min(need, items[i].sets);
      items[i].sets -= take;
      items[i].cut += take;
      if (items[i].sets === 0) items[i].kept = false;
      need -= take;
    }
    // Прохід 2 — anchor'и, але не нижче аварійного мінімуму.
    for (i = items.length - 1; i >= 0 && need > 0; i--) {
      if (items[i].kind !== "anchor") continue;
      var room = items[i].sets - ANCHOR_MIN_SETS;
      if (room <= 0) continue;
      var take2 = Math.min(need, room);
      items[i].sets -= take2;
      items[i].cut += take2;
      need -= take2;
    }

    var totalAfter = 0;
    for (i = 0; i < items.length; i++) totalAfter += items[i].sets;

    return {
      ok: true, code: "OK",
      ruleId: "VOLUME_DELOAD",
      factor: DELOAD_FACTOR,
      sets: sets, week4: week4,
      weightFactor: DELOAD_LOAD_FACTOR,
      weight: weight,
      targetRir: DELOAD_RIR,
      durationDays: { min: DELOAD_DAYS_MIN, max: DELOAD_DAYS_MAX },
      items: items,
      totalBefore: totalBefore, totalAfter: totalAfter,
      goal: goal, shortfall: need
    };
  }

  // ==================================================================
  // §15 — останній підхід «N+» (етап 9, 2026-10-11)
  // ==================================================================
  //
  // Останній робочий підхід допоміжної вправи: «щонайменше N, далі скільки
  // вийде чисто, стоп за 1 повтор до відмови». Це НЕ підхід до відмови:
  // відмова не дає більше сили (Grgic 2022, Vieira 2021, Robinson 2024) і
  // майже нічого не додає до росту м'язів (Refalo 2023), а гостра втома після
  // неї майже вдвічі більша, ніж при запасі 1 (Refalo 2023b: −25% проти −13%).
  // Вигода — вимір: фактичні повтори близько до відмови точніше за самооцінку
  // (Halperin 2022, Zourdos 2021) і йдуть в оцінку максимуму (§0) та
  // прогресію (§2) — ідея APRE (Mann 2010; Suchomel 2021).
  var AMRAP_PLUS_STOP_RIR = 1;          // запас на «N+» (Refalo 2023b, Robinson 2024)
  // ⚑ Евристика: «N+» лише там, де план дня і так близько до відмови
  // (запас ≤ 2). Тиждень входу (запас 3) лишається легким, як задумано §4.
  var AMRAP_PLUS_MAX_TARGET_RIR = 2;

  function e1rmMaxN() {
    var A = global.AlgoCore;
    return (A && A.C && isNum(A.C.E1RM_MAX_N)) ? A.C.E1RM_MAX_N : 12;   // §0: n > 12 — без оцінки
  }

  //   amrapPlusPlan({ kind, exercise, repsTarget, targetRir, sets, deload,
  //                   easyStart, hasProbe, retest })
  //   → { ok, applies, code, ruleId, setIdx, minReps, stopRir, why }
  //
  // Чисте рішення: чи ставити «N+» на останній підхід цієї вправи. Коди
  // відмови: NO_SETS, DELOAD, EASY_START, PROBE (уже є проба §3), ANCHOR
  // (основні вправи: сила від близькості до відмови не росте — Robinson
  // 2024, а вимір дає рідкісна проба §3), RETEST (драбина плато, §6),
  // TIMED (вправа на час), HIGH_REPS (повтори + запас > 12: оцінки
  // максимуму нема, самооцінка гірша — §0, Halperin 2022), FAR_FROM_FAILURE.
  function amrapPlusPlan(o) {
    o = o || {};
    function no(code) {
      return { ok: true, applies: false, code: code, ruleId: null, setIdx: null,
        minReps: null, stopRir: null, why: null };
    }
    var sets = isNum(o.sets) ? Math.floor(o.sets) : 0;
    if (sets < 1) return no("NO_SETS");
    if (o.deload === true) return no("DELOAD");
    if (o.easyStart === true) return no("EASY_START");
    if (o.hasProbe === true) return no("PROBE");
    if (o.kind === "anchor") return no("ANCHOR");
    if (o.retest === true) return no("RETEST");
    var ex = o.exercise || {};
    var rr = ex.repRange;
    if (Array.isArray(rr) && rr[0] === null && rr[1] === null) return no("TIMED");
    if (!isNum(o.repsTarget) || o.repsTarget < 1) return no("TIMED");
    var tr = isNum(o.targetRir) ? o.targetRir : null;
    if (tr === null || tr > AMRAP_PLUS_MAX_TARGET_RIR) return no("FAR_FROM_FAILURE");
    if (o.repsTarget + tr > e1rmMaxN()) return no("HIGH_REPS");
    var n = Math.round(o.repsTarget);
    var short = "Останній підхід «" + n + "+»: щонайменше " + n +
      ", далі — скільки вийде чисто. Зупиніться, коли лишиться 1 повтор до відмови.";
    var text = "Це останній підхід вправи, а план дня і так близько до відмови (запас " + tr + "). " +
      "Правило: не менше " + n + " повторів, далі — поки техніка чиста; зупинка за 1 повтор до відмови, " +
      "не до відмови. Скільки вийшло — піде в оцінку максимуму й у вагу наступного разу.";
    return {
      ok: true, applies: true, code: "OK", ruleId: "AMRAP_PLUS",
      setIdx: sets - 1, minReps: n, stopRir: AMRAP_PLUS_STOP_RIR,
      why: { ruleId: "AMRAP_PLUS", short: short, text: text }
    };
  }

  // ---------- §4 ANCHOR_NO_FAILURE ----------
  //
  // Логіка живе в `algo-core.js` (`anchorRirInfo`) і тут НЕ дублюється —
  // цей шар лише не дає шляху через хвилю RIR її обійти. Резервна гілка
  // потрібна тому, що algo-program.js за задумом працює й без algo-core.js
  // (той підключається лише для мосту `prescribeSession`).
  function anchorRirOf(rir, isAnchor, isAmrapProbe) {
    var A = global.AlgoCore;
    if (A && typeof A.anchorRirInfo === "function") {
      return A.anchorRirInfo({ targetRir: rir, isAnchor: isAnchor === true, isAmrapProbe: isAmrapProbe === true });
    }
    if (!isNum(rir)) {
      return { ok: false, code: "BAD_RIR", value: null, from: null, raised: false, ruleId: null, isAnchor: isAnchor === true };
    }
    if (isAnchor !== true) {
      return { ok: true, code: "NOT_ANCHOR", value: rir, from: rir, raised: false, ruleId: null, isAnchor: false };
    }
    if (isAmrapProbe === true) {
      return { ok: true, code: "AMRAP_PROBE", value: rir, from: rir, raised: false, ruleId: null, isAnchor: true };
    }
    if (rir < ANCHOR_MIN_RIR) {
      return { ok: true, code: "OK", value: ANCHOR_MIN_RIR, from: rir, raised: true, ruleId: "ANCHOR_NO_FAILURE", isAnchor: true };
    }
    return { ok: true, code: "OK", value: rir, from: rir, raised: false, ruleId: null, isAnchor: true };
  }

  // ==================================================================
  // §11 — внутрішньосесійна втома й порядок вправ
  // ==================================================================

  // §11.1, групи. Порогом «суттєвого внеску» тут служить 0.5 (§11.1),
  // а НЕ 0.75 (§10.1) — це навмисно різні шкали.
  var ANCHOR_SUBORDER = { squat: 1, hinge: 1, hpress: 2, vpull: 3, vpress: 4 };

  // ⚑ ALGO.md називає групу 4 «литки, кор, фініш», але не каже, як її
  // впізнати. Беремо головний м'яз: литки або кор. Група 4 виграє в 2 і 3 —
  // інакше присідання на литках потрапляли б у «компаунд» і йшли перед
  // ізоляцією спини, а §11.1 ставить їх у кінець свідомо.
  var GROUP4_MUSCLES = { calves: true, core: true };

  function significantCount(ex) {
    var n = 0;
    for (var i = 0; i < MUSCLES.length; i++) if (isSignificant(ex, MUSCLES[i])) n++;
    return n;
  }

  function exerciseGroup(item, ex) {
    var e = ex || item;
    if (item && item.kind === "anchor") return 1;
    var mm = (item && item.mainMuscle) || mainMuscle(e);
    if (GROUP4_MUSCLES[mm]) return 4;
    var n = significantCount(e);
    if (n >= 2) return 2;
    if (n === 1) return 3;
    return 4;    // ⚑ нічого суттєвого — «фініш», у кінець
  }

  //   orderSession(items, { deficitNorm, exercises|index })
  //   Порядок §11.1 повністю детермінований: група → підслот anchor'а →
  //   спадання deficit_норм головного м'яза → exerciseId за зростанням.
  function orderSession(items, ctx) {
    var c = ctx || {};
    var idx = c.index || indexById(libraryOf(c.exercises));
    var dn = c.deficitNorm || {};
    var arr = Array.isArray(items) ? items.slice() : [];
    var meta = [];
    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      var ex = (it && it.contrib) ? it : (idx[it && it.exerciseId] || it);
      var mm = (it && it.mainMuscle) || mainMuscle(ex);
      var grp = exerciseGroup(it, ex);
      meta.push({
        it: it, ex: ex, i: i,
        group: grp,
        // §17: anchor'и першими (§11.1), одразу за ними — вправи на
        // пріоритетний м'яз, далі решта. Без пріоритету rank у всіх
        // не-anchor'ів однаковий — порядок той самий, що й був.
        rank: grp === 1 ? 0 : ((it && it.priority === true) ? 1 : 2),
        sub: (it && it.kind === "anchor") ? (ANCHOR_SUBORDER[it.slot] || 9) : 0,
        d: isNum(dn[mm]) ? dn[mm] : 0,
        hinge: !!(it && it.slot === "hinge"),
        id: (it && it.exerciseId) || ""
      });
    }
    meta.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      if (a.group !== b.group) return a.group - b.group;
      if (a.sub !== b.sub) return a.sub - b.sub;
      if (a.d !== b.d) return b.d - a.d;                       // більший дефіцит — вище
      if (a.hinge !== b.hinge) return a.hinge ? -1 : 1;        // §11.1: при рівності — шарнір
      return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
    });
    var out = [];
    for (i = 0; i < meta.length; i++) {
      meta[i].it.group = meta[i].group;
      meta[i].it.order = i + 1;
      out.push(meta[i].it);
    }
    return out;
  }

  //   sAdjFor(orderedItems, { targetRir, sAdjSlope, sAdjFloor, exercises|index })
  //
  //   A_m   = Σ (сети × c_m × eff(цільовий_RIR)) по вправах ВИЩЕ за порядком
  //   A(ex) = ( Σ_m c_m(ex) × A_m ) / ( Σ_m c_m(ex) )
  //   S_adj = clamp(1 − slope × A(ex), floor, 1.00)
  //
  // ⚑ Anchor-рухи ніколи не отримують S_adj < 1. Це не пом'якшення формули, а
  // пряма вимога §11.1 («умова того, щоб носії прогресії не отримували
  // S_adj < 1 ніколи») і §5.1, п. 3 («anchor-слот — це гарантоване перше
  // місце з S_adj = 1.00»). Сама формула §11.2 цього не дає, щойно anchor'ів
  // у сесії більше одного: другий і третій успадковують накопичення першого.
  // У накопичення A_m сети anchor'а входять як завжди — пришпилений лише його
  // власний множник. ruleId: ORDER_ANCHOR_FIRST.
  function sAdjFor(items, ctx) {
    var c = ctx || {};
    var idx = c.index || indexById(libraryOf(c.exercises));
    var slope = isNum(c.sAdjSlope) ? c.sAdjSlope : S_ADJ_SLOPE;
    var floorV = isNum(c.sAdjFloor) ? c.sAdjFloor : S_ADJ_FLOOR;
    var baseRir = isNum(c.targetRir) ? c.targetRir : DEFAULT_TARGET_RIR;
    var arr = Array.isArray(items) ? items : [];
    var A = zeroMap();
    var map = {};
    var rows = [];

    for (var i = 0; i < arr.length; i++) {
      var it = arr[i];
      var ex = (it && it.contrib) ? it : (idx[it && it.exerciseId] || it);
      var num = 0, den = 0, j, m, cm;
      for (j = 0; j < MUSCLES.length; j++) {
        m = MUSCLES[j];
        cm = cOf(ex, m);
        if (cm <= 0) continue;
        num += cm * A[m];
        den += cm;
      }
      var aEx = den > 0 ? fix6(num / den) : 0;
      var raw = fix6(clamp(1 - slope * aEx, floorV, 1));
      var isAnchor = !!(it && it.kind === "anchor");
      var s = isAnchor ? 1 : raw;
      map[it.exerciseId] = s;
      rows.push({
        exerciseId: it.exerciseId, order: i + 1, A: aEx, sAdj: s,
        raw: raw, anchorExempt: isAnchor && raw < 1,
        ruleId: s < 1 ? "INTRA_SESSION_FATIGUE" : "ORDER_ANCHOR_FIRST"
      });

      // Накопичення — ПІСЛЯ поточної вправи (§11.2: «стоять ВИЩЕ за порядком»).
      var rir = baseRir + (isNum(it.targetRirDelta) ? it.targetRirDelta : 0);
      var eff = effOfRir(rir);
      if (!isNum(eff)) eff = EFF_UNKNOWN;
      var sets = isNum(it.sets) ? it.sets : 0;
      for (j = 0; j < MUSCLES.length; j++) {
        m = MUSCLES[j];
        cm = cOf(ex, m);
        if (cm > 0) A[m] = fix6(A[m] + sets * cm * eff);
      }
    }
    return { ok: true, code: "OK", map: map, items: rows, accum: A, slope: slope, floor: floorV };
  }

  // ==================================================================
  // §5 — anchor-слоти і anchor-lock
  // ==================================================================

  function equipRank(ex) {
    var e = ex && ex.equipment;
    if (typeof e !== "string") return EQUIP_RANK_UNKNOWN;
    return has(EQUIP_RANK, e) ? EQUIP_RANK[e] : EQUIP_RANK_UNKNOWN;
  }

  function equipmentOk(ex, available) {
    if (!Array.isArray(available)) return true;   // фільтра немає — усе доступне
    var e = ex && ex.equipment;
    if (typeof e !== "string") return false;
    return available.indexOf(e) >= 0;
  }

  // Ранг кандидата в anchor: обладнання (див. EQUIP_RANK) → менший крок
  // ваги → id за зростанням. Детермінований повністю.
  function anchorRank(a, b) {
    var ra = equipRank(a), rb = equipRank(b);
    if (ra !== rb) return ra - rb;
    var ia = isNum(a.incrementKg) ? a.incrementKg : Infinity;
    var ib = isNum(b.incrementKg) ? b.incrementKg : Infinity;
    if (ia !== ib) return ia - ib;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  }

  function anchorCandidates(lib, pattern, available, exceptId) {
    var out = [];
    for (var i = 0; i < lib.length; i++) {
      var ex = lib[i];
      if (ex.pattern !== pattern) continue;
      if (ex.isAnchorCandidate !== true) continue;
      if (!equipmentOk(ex, available)) continue;
      if (exceptId && ex.id === exceptId) continue;
      out.push(ex);
    }
    out.sort(anchorRank);
    return out;
  }

  // Приймає і масив id (docs/DATA.md → program.anchors), і мапу {slot: id}.
  function normAnchors(anchors, index) {
    var out = {};
    if (!anchors) return out;
    var i, slot;
    if (Array.isArray(anchors)) {
      for (i = 0; i < anchors.length; i++) {
        var ex = index[anchors[i]];
        if (!ex) continue;
        slot = slotForPattern(ex.pattern);
        if (slot && !out[slot]) out[slot] = ex.id;
      }
      return out;
    }
    if (typeof anchors === "object") {
      for (i = 0; i < ANCHOR_SLOTS.length; i++) {
        slot = ANCHOR_SLOTS[i].slot;
        if (typeof anchors[slot] === "string" && index[anchors[slot]]) out[slot] = anchors[slot];
      }
    }
    return out;
  }

  function slotForPattern(pattern) {
    for (var i = 0; i < ANCHOR_SLOTS.length; i++) {
      if (ANCHOR_SLOTS[i].pattern === pattern) return ANCHOR_SLOTS[i].slot;
    }
    return null;
  }

  function slotDef(slot) {
    for (var i = 0; i < ANCHOR_SLOTS.length; i++) {
      if (ANCHOR_SLOTS[i].slot === slot) return ANCHOR_SLOTS[i];
    }
    return null;
  }

  // §5: anchor замінюється ТІЛЬКИ якщо (1) межа мезоцикла, (2) прапорець болю
  // ≥2 на цьому рухові, (3) обладнання недоступне 2 сесії поспіль,
  // (4) досягнуто кроку 5 драбини плато. Ніяких інших підстав немає.
  function anchorReplaceReason(exId, ex, o) {
    if (o.mesoBoundary === true) return "MESO_BOUNDARY";
    if (o.painFlags && isNum(o.painFlags[exId]) && o.painFlags[exId] >= 2) return "PAIN";
    if (o.equipmentMissing && isNum(o.equipmentMissing[exId]) && o.equipmentMissing[exId] >= 2) return "EQUIPMENT";
    if (o.plateauStep && isNum(o.plateauStep[exId]) && o.plateauStep[exId] >= 5) return "PLATEAU_STEP5";
    if (ex && !equipmentOk(ex, o.equipment)) return "EQUIPMENT";
    return null;
  }

  //   pickAnchors({ exercises, equipment, current, mesoBoundary,
  //                 painFlags, equipmentMissing, plateauStep })
  //   → { ok, anchors: {slot: id}, slots: [...], changed: bool }
  function pickAnchors(opts) {
    var o = opts || {};
    var lib = libraryOf(o.exercises);
    var index = indexById(lib);
    var current = normAnchors(o.current, index);
    var anchors = {};
    var slots = [];
    var changed = false;

    for (var i = 0; i < ANCHOR_SLOTS.length; i++) {
      var def = ANCHOR_SLOTS[i];
      var curId = current[def.slot] || null;
      var curEx = curId ? index[curId] : null;
      var reason = curEx ? anchorReplaceReason(curId, curEx, o) : null;

      if (curEx && !reason) {
        anchors[def.slot] = curId;
        slots.push({
          slot: def.slot, pattern: def.pattern, exerciseId: curId,
          ruleId: "ANCHOR_LOCKED", reason: null, replacedFrom: null,
          text: whyAnchorLocked(def, curEx),
          short: shortAnchorLocked(def, curEx)
        });
        continue;
      }

      var cands = anchorCandidates(lib, def.pattern, o.equipment, reason ? curId : null);
      if (!cands.length && curEx && reason !== "EQUIPMENT") {
        // Замінити нема на що — лишаємо як є, але кажемо про це кодом.
        anchors[def.slot] = curId;
        slots.push({
          slot: def.slot, pattern: def.pattern, exerciseId: curId,
          ruleId: "ANCHOR_LOCKED", reason: "NO_ALTERNATIVE", replacedFrom: null,
          text: whyAnchorLocked(def, curEx),
          short: shortAnchorLocked(def, curEx)
        });
        continue;
      }
      if (!cands.length) {
        slots.push({
          slot: def.slot, pattern: def.pattern, exerciseId: null,
          ruleId: "ANCHOR_NO_CANDIDATE", reason: reason, replacedFrom: curId, text: null, short: null
        });
        if (!def.optional) changed = true;
        continue;
      }

      var pick = cands[0];
      anchors[def.slot] = pick.id;
      changed = changed || (curId !== pick.id);
      slots.push({
        slot: def.slot, pattern: def.pattern, exerciseId: pick.id,
        ruleId: curId ? "ANCHOR_REPLACED" : "ANCHOR_PICKED",
        reason: reason, replacedFrom: curId || null,
        text: curId ? whyAnchorReplaced(def, pick, curEx, reason) : whyAnchorPicked(def, pick),
        short: curId ? shortAnchorReplaced(def, pick, curEx, reason) : shortAnchorPicked(def, pick)
      });
    }

    return { ok: true, code: "OK", anchors: anchors, slots: slots, changed: changed };
  }

  // ==================================================================
  // §5.2 — скоринг допоміжки
  // ==================================================================
  //
  //   score = 3 × deficit_норм(м'яз)
  //         + 1 × staleness(днів_без_цієї_вправи / 14)
  //         + equipment_ok
  //         − 2 × overlap_з_anchor
  //         − 3 × modeMismatch
  //
  // ⚑ ALGO.md не визначає ні шкалу staleness, ні спосіб рахувати overlap.
  //   staleness: clamp(днів / 14, 0, 1); вправа, якої не було ніколи, отримує
  //              1.0 — «максимально несвіжа» (інакше нова вправа програвала б
  //              старій назавжди);
  //   overlap:   частка роботи вправи, що лягає на м'язи, які anchor'и цього
  //              дня вже беруть ПРЯМО (c_m ≥ 0.75, §10.1). У [0,1], тому
  //              максимальний штраф — рівно −2, як і задумано формулою.

  function staleness(days) {
    if (!isNum(days)) return 1;                    // не бачили ніколи
    return fix6(clamp(days / STALENESS_DAYS, 0, 1));
  }

  // ------------------------------------------------------------------
  // Входи §5.2 і екрана «Тіло» з історії сесій (відкрите питання 8).
  // Раніше обидві мапи рахувались у js/ui.js окремо від алгоритму, і зміна
  // визначення тут мовчки розійшлася б з екраном. Тепер UI лише читає.
  // Час входить параметром (`now` — ISO-рядок або мс): Date.now тут немає.
  // ------------------------------------------------------------------

  function msOf(now) {
    if (isNum(now)) return now;
    if (typeof now === "string" && now) {
      var t = Date.parse(now);
      return isFinite(t) ? t : NaN;
    }
    return NaN;
  }

  //   staleDaysMap(sessions, now) → {exerciseId: днів без цієї вправи}
  // Вхід `staleDays` для scoreAssistance/rankAssistance/generateSession.
  // День сесії — поле `date`; сесія без дати рахується «сьогоднішньою»
  // (0 днів), як було в ui.js. Вправи, якої в історії немає, у мапі НЕМАЄ —
  // staleness() сама дасть їй 1.0. Майбутня дата → 0 днів, не від'ємне.
  // Без `now` — порожня мапа: час не вигадується.
  function staleDaysMap(sessions, now) {
    var out = {};
    var nowMs = msOf(now);
    if (!isFinite(nowMs)) return out;
    var arr = Array.isArray(sessions) ? sessions : [];
    for (var i = 0; i < arr.length; i++) {
      var s = arr[i];
      if (!s || !Array.isArray(s.entries)) continue;
      var dMs = s.date ? Date.parse(s.date) : nowMs;
      if (!isFinite(dMs)) continue;
      var days = Math.max(0, (nowMs - dMs) / 86400000);
      for (var j = 0; j < s.entries.length; j++) {
        var id = s.entries[j] && s.entries[j].exerciseId;
        if (!id) continue;
        if (!isNum(out[id]) || days < out[id]) out[id] = days;
      }
    }
    return out;
  }

  //   weekUsedIds(sessions, { weekKey, mesoId, anchors }) → [id, ...]
  //
  // §5.2 «ротація ніколи посеред тижня»: допоміжні вправи, які вже робились
  // у поточному тижні (той самий фільтр тижня/мезоцикла, що й weeklyVolume).
  // Anchor'и виключаються: вони не ротуються взагалі (§5), а їхня присутність
  // у списку зробила б generateSession() бонус «вже цього тижня» для
  // допоміжки на anchor-русі. Сесії без дати не потрапляють — тиждень
  // невідомий. Результат відсортований: однаковий вхід → однаковий вихід.
  function weekUsedIds(sessions, opts) {
    var o = opts || {};
    var skip = {};
    var an = o.anchors;
    var k;
    if (Array.isArray(an)) {
      for (k = 0; k < an.length; k++) if (typeof an[k] === "string") skip[an[k]] = true;
    } else if (an && typeof an === "object") {
      for (k in an) {
        if (Object.prototype.hasOwnProperty.call(an, k) && typeof an[k] === "string") skip[an[k]] = true;
      }
    }
    var seen = {}, out = [];
    var list = Array.isArray(sessions) ? sessions : [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!s || !Array.isArray(s.entries)) continue;
      if (o.weekKey) {
        if (typeof s.date !== "string" || isoWeekKey(s.date) !== o.weekKey) continue;
      }
      if (o.mesoId !== undefined && o.mesoId !== null && s.mesoId !== o.mesoId) continue;
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        var id = e && e.exerciseId;
        if (typeof id !== "string" || !id || skip[id] || seen[id]) continue;
        seen[id] = true;
        out.push(id);
      }
    }
    out.sort();
    return out;
  }

  //   lastWorkedHours(sessions, { now, exercises|index }) → {м'яз: годин тому}
  // «Востаннє навантажений» на екрані «Тіло»: найсвіжіша сесія, де вправа
  // дала м'язу будь-який (навіть непрямий) внесок c_m > 0. Це факт з
  // історії, а не формула ALGO.md — §9.3-розпад тут не рахується. Час
  // сесії — `endedAt`, без нього — `date`. Не навантаженого м'яза в мапі немає.
  function lastWorkedHours(sessions, opts) {
    var o = opts || {};
    var out = {};
    var nowMs = msOf(o.now);
    if (!isFinite(nowMs)) return out;
    var idx = o.index || indexById(o.exercises || global.EX_DB);
    var arr = Array.isArray(sessions) ? sessions : [];
    for (var i = 0; i < arr.length; i++) {
      var s = arr[i];
      if (!s || !Array.isArray(s.entries)) continue;
      var tMs = s.endedAt ? Date.parse(s.endedAt) : (s.date ? Date.parse(s.date) : NaN);
      if (!isFinite(tMs)) continue;
      var hAgo = (nowMs - tMs) / 3600000;
      for (var j = 0; j < s.entries.length; j++) {
        var entry = s.entries[j];
        var ex = entry && idx ? idx[entry.exerciseId] : null;
        var contrib = ex && ex.contrib;
        if (!contrib) continue;
        for (var m in contrib) {
          if (!Object.prototype.hasOwnProperty.call(contrib, m) || !(contrib[m] > 0)) continue;
          if (!(m in out) || hAgo < out[m]) out[m] = hAgo;
        }
      }
    }
    return out;
  }

  function anchorDirectMuscles(anchorExercises) {
    var out = {};
    var arr = Array.isArray(anchorExercises) ? anchorExercises : [];
    for (var i = 0; i < arr.length; i++) {
      for (var j = 0; j < MUSCLES.length; j++) {
        if (isDirect(arr[i], MUSCLES[j])) out[MUSCLES[j]] = true;
      }
    }
    return out;
  }

  function overlapWithAnchors(ex, directMap) {
    var total = contribSum(ex);
    if (total <= 0) return 0;
    var shared = 0;
    for (var i = 0; i < MUSCLES.length; i++) {
      if (directMap && directMap[MUSCLES[i]]) shared += cOf(ex, MUSCLES[i]);
    }
    return fix6(clamp(shared / total, 0, 1));
  }

  //   scoreAssistance(ex, {
  //     muscle,           — під який м'яз рахуємо дефіцит (без нього — головний)
  //     deficitNorm,      — мапа {м'яз: 0..1}
  //     staleDays,        — {exerciseId: днів без цієї вправи}
  //     equipment,        — доступне обладнання (null = все)
  //     anchorDirect,     — мапа прямих м'язів anchor'ів дня
  //     modeMismatch      — §13.3, дефолт false. Три форми, і всі три жили б
  //                         поруч однаково: `true` (штраф усім — легасі-
  //                         прапорець до §13), мапа {id: true} або функція
  //                         (ex) → bool. Мапа — те, що дає режим.
  //   })
  function mismatchFlag(ex, v) {
    if (v === true) return 1;
    if (typeof v === "function") return v(ex) ? 1 : 0;
    if (v && typeof v === "object") return (ex && v[ex.id]) ? 1 : 0;
    return 0;
  }

  function scoreAssistance(ex, ctx) {
    var c = ctx || {};
    var m = (c.muscle && isMuscleKey(c.muscle)) ? c.muscle : mainMuscle(ex);
    var dn = (c.deficitNorm && isNum(c.deficitNorm[m])) ? clamp(c.deficitNorm[m], 0, 1) : 0;
    var st = staleness(c.staleDays && ex ? c.staleDays[ex.id] : undefined);
    var eq = equipmentOk(ex, c.equipment) ? 1 : 0;
    var ov = overlapWithAnchors(ex, c.anchorDirect);
    var mm = mismatchFlag(ex, c.modeMismatch);     // §13.3
    var score = W_DEFICIT * dn + W_STALE * st + W_EQUIP * eq + W_OVERLAP * ov + W_MISMATCH * mm;
    return {
      exerciseId: ex ? ex.id : null,
      muscle: m,
      score: fix6(score),
      parts: {
        deficit: fix6(W_DEFICIT * dn), staleness: fix6(W_STALE * st),
        equipment: eq * W_EQUIP, overlap: fix6(W_OVERLAP * ov),
        modeMismatch: mm * W_MISMATCH
      },
      inputs: { deficitNorm: dn, stalenessRaw: st, equipmentOk: eq === 1, overlap: ov, modeMismatch: mm === 1 }
    };
  }

  // Ранжування списку кандидатів. Тайбрейк — exerciseId за зростанням (§11.1).
  function rankAssistance(list, ctx) {
    var arr = Array.isArray(list) ? list.slice() : [];
    var scored = [];
    for (var i = 0; i < arr.length; i++) scored.push(scoreAssistance(arr[i], ctx));
    scored.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.exerciseId < b.exerciseId ? -1 : (a.exerciseId > b.exerciseId ? 1 : 0);
    });
    return scored;
  }

  // ==================================================================
  // §7 — схема тижня
  // ==================================================================

  function templateFor(daysPerWeek) {
    var d = isNum(daysPerWeek) ? Math.floor(daysPerWeek) : 4;
    var code = "OK";
    if (d < MIN_DAYS) { d = MIN_DAYS; code = "DAYS_CLAMPED"; }
    if (d > MAX_DAYS) { d = MAX_DAYS; code = "DAYS_CLAMPED"; }
    var days;
    if (d === 2) days = ["full", "full"];
    else if (d === 3) days = ["full", "full", "full"];
    else if (d === 4) days = ["upper", "lower", "upper", "lower"];
    else days = ["upper", "lower", "upper", "lower", "weak"];
    var id = d === 2 ? "full_2" : d === 3 ? "full_3" : d === 4 ? "upper_lower_4" : "upper_lower_weak_5";
    return { id: id, daysPerWeek: d, days: days, code: code };
  }

  // ==================================================================
  // Етап 3, п.6 — розклад тижня і бюджет часу конкретного дня
  // ==================================================================
  // Розклад (settings.schedule, AlgoCore.normSchedule) — у які дні тижня
  // людина МОЖЕ тренуватись і скільки хвилин максимум на кожен. Програма
  // рухається сесіями, а не календарем (день схеми §7 = порядковий номер
  // тренування в тижні), тож розклад дає дві речі:
  //   • daysPerWeek = кількість днів (межі таблиці схем §7: MIN_DAYS…MAX_DAYS);
  //   • бюджет §13.5 на сьогодні — СТЕЛЯ: trimToBudget лише знімає сети,
  //     ніколи не додає (обсяг веде §10 і ціль, а не вільні хвилини).
  // Незапланований день: тренуватись можна, діє settings.budgetMin («інші
  // дні»). Розкладу нема — settings.budgetMin на будь-який день, як до етапу 3
  // (тому міграції не треба: старий стан поводиться побайтово так само).

  // ISO-день тижня за МІСЦЕВИМ часом пристрою: пн = 1 … нд = 7.
  function isoWeekday(date) {
    var d = (date instanceof Date) ? date : new Date(date === undefined ? Date.now() : date);
    if (isNaN(d.getTime())) return null;
    var w = d.getDay();
    return w === 0 ? 7 : w;
  }

  //   scheduleInfo(raw) → { ok, code (OK | TOO_FEW | TOO_MANY | NO_SCHEDULE),
  //                         schedule, count, daysPerWeek }
  function scheduleInfo(raw) {
    var A = global.AlgoCore;
    var s = (A && typeof A.normSchedule === "function") ? A.normSchedule(raw) : null;
    if (!s) return { ok: false, code: "NO_SCHEDULE", schedule: null, count: 0, daysPerWeek: null };
    var n = s.days.length;
    var code = n < MIN_DAYS ? "TOO_FEW" : (n > MAX_DAYS ? "TOO_MANY" : "OK");
    return { ok: code === "OK", code: code, schedule: s, count: n, daysPerWeek: clamp(n, MIN_DAYS, MAX_DAYS) };
  }

  //   budgetForDate(settings, date) → { budgetMin (хв | null = без обмеження),
  //     weekday, planned (true | false | null — розкладу нема),
  //     source: "schedule" | "unplanned" | "default" }
  function budgetForDate(settings, date) {
    var st = settings || {};
    var wd = isoWeekday(date);
    var def = (isNum(st.budgetMin) && st.budgetMin > 0) ? st.budgetMin : null;
    var info = scheduleInfo(st.schedule);
    var out = { budgetMin: def, weekday: wd, planned: null, source: "default" };
    if (!info.schedule || wd === null) return out;
    out.planned = info.schedule.days.indexOf(wd) >= 0;
    if (!out.planned) { out.source = "unplanned"; return out; }
    out.source = "schedule";
    out.budgetMin = info.schedule.budgets[String(wd)];
    return out;
  }

  function focusFor(daysPerWeek, dayIndex) {
    var t = templateFor(daysPerWeek);
    var i = clamp(isNum(dayIndex) ? Math.floor(dayIndex) : 1, 1, t.daysPerWeek);
    return t.days[i - 1];
  }

  // ==================================================================
  // §8 — тексти `why` (факт → правило → контекст)
  // ==================================================================

  function nm(m) { return MUSCLE_NAME[m] || m; }

  // Велика літера на початку речення. Довідник §9.1 лишається як є: назви
  // м'язів канонічні й пишуться з малої там, де стоять усередині речення, —
  // капіталізується саме перше слово готового тексту, а не сама назва.
  function cap(s) {
    var t = (s === null || s === undefined) ? "" : String(s);
    return t ? (t.charAt(0).toUpperCase() + t.slice(1)) : t;
  }

  // Рід/число назв §9.1. Потрібне тільки короткому рядку (`short`): він має
  // читатись як речення — «груди набрали», а не «груди набрав». Самі назви
  // довідника §9.1 не міняються, тут лише узгодження дієслова з ними.
  var MUSCLE_FORM = {
    chest: "pl", back: "f", quads: "m", hamstrings: "m", calves: "pl",
    glutes: "pl", front_delt: "f", side_delt: "f", rear_delt: "f",
    biceps: "m", triceps: "m", core: "m"
  };

  function vf(m, mSg, fSg, plural3) {
    var g = MUSCLE_FORM[m] || "m";
    return g === "pl" ? plural3 : (g === "f" ? fSg : mSg);
  }

  // Числівник української мови: 1 сет / 2–4 сети / 5+ сетів (з урахуванням
  // 11–14 і десятків). Потрібен, щоб тексти §8 читались як текст, а не як лог.
  function plural(n, one, few, many) {
    var a = Math.abs(Math.floor(n));
    var d10 = a % 10, d100 = a % 100;
    if (d100 >= 11 && d100 <= 14) return many;
    if (d10 === 1) return one;
    if (d10 >= 2 && d10 <= 4) return few;
    return many;
  }
  function setsWord(n) { return plural(n, "підхід", "підходи", "підходів"); }
  function daysWord(n) { return plural(n, "день", "дні", "днів"); }
  function exWord(n) { return plural(n, "вправа", "вправи", "вправ"); }

  function ctxText(st) {
    return "Тиждень " + st.week + "/5, день " + st.dayIndex + "/" + st.daysPerWeek +
      ", у сесії " + st.totalSets + " " + setsWord(st.totalSets) + ".";
  }

  function whyAnchorLocked(def, ex) {
    return cap("«" + ex.name + "» — основна вправа (" + def.name + ") цього циклу. " +
      "Основні вправи закріплені до кінця циклу, бо саме по них видно прогрес сили, " +
      "тому вправа не міняється. Замінюється лише на межі циклу, при болю, " +
      "відсутньому обладнанні або коли прогрес давно стоїть і інші способи вже спробувані.");
  }

  // §2.1: у вправі з власною вагою поправка на втому в вагу не йде взагалі
  // (S_adj — це відсоток від усього навантаження, а вантаж — його дрібна

      (bwFlag(ex)
        ? "Наступна прогресія рахується від повторів, ціль — запас " + rir + "."
        : "Наступна прогресія рахується від базової ваги, ціль — запас " + rir + "."));

  // ==================================================================
  // §13.1 / §13.3 / §13.4 — режими цілей
  // ==================================================================

  function isModeKey(m) {
    return typeof m === "string" && MODE_KEYS.indexOf(m) >= 0;
  }

  // Ключ режиму там, де режим ТОЧНО потрібен (перемикання §13.4):
  // невідоме значення → `hyb` (§13.1, «за замовчуванням hyb»).
  function resolveMode(m) { return isModeKey(m) ? m : MODE_DEFAULT; }

  function copyRange(r) { return [r[0], r[1]]; }

  // Параметри режиму. Режим НЕ заданий → `null`, і жодне правило §13 не
  // вмикається: поведінка лишається дорежимною. Це навмисно, а не забутий
  // дефолт — базова таблиця §7 відповідає `hyp` (volumeScale 1.00), а хвиля
  // RIR і S_adj у коді — `hyb`, тому «мовчазного hyb» не існує: будь-який
  // мовчазний дефолт змінив би числа комусь із трьох режимів.
  function modeParams(mode) {
    if (!isModeKey(mode)) return null;
    var s = MODE[mode];
    return {
      mode: mode,
      repRange: {
        anchorMain: copyRange(s.repRange.anchorMain),
        anchorSecondary: copyRange(s.repRange.anchorSecondary),
        assistance: copyRange(s.repRange.assistance),
        isolation: copyRange(s.repRange.isolation)
      },
      rirWave: s.rirWave.slice(),
      volumeScale: s.volumeScale,
      freqTargetPerMuscle: { min: s.freqTargetPerMuscle.min, max: s.freqTargetPerMuscle.max },
      restSec: { anchor: s.restSec.anchor, compound: s.restSec.compound, isolation: s.restSec.isolation },
      sAdjSlope: s.sAdjSlope,
      sAdjFloor: s.sAdjFloor,
      progression: {
        anchorMain: s.progression.anchorMain, anchorSecondary: s.progression.anchorSecondary,
        assistance: s.progression.assistance, isolation: s.progression.isolation
      }
    };
  }

  function volumeScaleOf(mode) {
    var s = MODE[mode];
    return s ? s.volumeScale : 1;
  }

  // §13.1 дає хвилю на 4 тижні накопичення; §4 очікує 5-й елемент —
  // дельоуд-тиждень. Він від режиму не залежить (RIR 4 у §4), тому
  // дописується тут, а не дублюється в трьох рядках таблиці.
  function rirWaveOf(mode) {
    var s = MODE[mode];
    if (!s) return RIR_WAVE.slice();
    return s.rirWave.concat([DELOAD_RIR]);
  }

  function modeRange(mode, role) {
    var s = MODE[mode];
    if (!s) return null;
    var r = s.repRange[role];
    return r ? copyRange(r) : null;
  }

  function restSecOf(mode, role) {
    var s = MODE[mode];
    if (!s) return null;
    var k = ROLE_REST_KEY[role];
    return k ? s.restSec[k] : null;
  }

  function progressionOf(mode, role) {
    var s = MODE[mode];
    if (!s) return null;
    return s.progression[role] || null;
  }

  // ---------- роль вправи (§13.1, блок «Ролі вправ») ----------
  //
  // Роль читається з місця вправи в сесії, а не з поля бази: та сама вправа
  // в anchor-слоті й у ролі допоміжки — різні рядки таблиці. Тому первинне
  // джерело — `item.kind`/`item.slot` генератора, і лише для «голої» вправи
  // з бібліотеки роль виводиться з групи §11.1.
  //
  //   група 2 (компаунд, ≥2 суттєвих внески)  → assistance
  //   групи 3 і 4 (ізоляція, литки, кор)      → isolation
  //
  // ⚑ Anchor з невідомим слотом — `anchorSecondary`: з двох anchor-рядків він
  // помірніший, і помилка йде в бік «не заганяти рух у трійку».
  function roleOf(item, ex) {
    var it = (item && typeof item === "object") ? item : {};
    var e = ex || it;
    if (it.kind === "anchor" || it.slot) {
      if (ANCHOR_SLOT_ROLE[it.slot]) return ANCHOR_SLOT_ROLE[it.slot];
      if (it.kind === "anchor") return "anchorSecondary";
    }
    var g = exerciseGroup(it.kind ? it : null, e);
    return (g === 2) ? "assistance" : "isolation";
  }

  // ---------- §13.3 effRange ----------

  function isRange(r) {
    return Array.isArray(r) && r.length === 2 && isNum(r[0]) && isNum(r[1]) &&
      r[0] >= 1 && r[1] >= r[0];
  }

  // Перетин двох діапазонів. Порожній → null. Вироджений (lo === hi) —
  // ЦІЛКОМ законний результат: це фіксована кількість повторів, а не помилка.
  //
  // ⚑ Розбіжність з прикладом §13.3, і вона свідома. Приклад там каже:
  // `str`, isolation 8–12, вправа 12–20 → «перетин порожній». Насправді
  // [12,20] ∩ [8,12] = [12,12] — перетин є, просто вироджений. Реалізуємо
  // ФОРМУЛУ (`intersect`), а не арифметику прикладу: інакше довелось би
  // оголосити порожнім будь-який дотик діапазонів краями, а це вже інше
  // правило, якого §13.3 не задає. Вироджений діапазон нешкідливий: §2
  // на `repsMin === repsMax` перетворюється на чисту лінійну прогресію.
  function intersectRange(a, b) {
    if (!isRange(a) || !isRange(b)) return null;
    var lo = Math.max(a[0], b[0]);
    var hi = Math.min(a[1], b[1]);
    return (lo <= hi) ? [lo, hi] : null;
  }

  //   effRange(ex|range, { mode, role, item })
  //
  //   effRange(ex) = intersect( ex.repRange, MODE.repRange[role(ex)] )
  //   перетин порожній → effRange(ex) = ex.repRange, modeMismatch = true
  //
  // ВПРАВА ВИГРАЄ — це про безпеку: `repRange` вправи ставиться з міркувань
  // техніки й суглобів, режим — це побажання користувача, і побажання не має
  // права загнати рух у діапазон, у якому він небезпечний або безглуздий.
  //
  //   code: OK | MODE_OFF | EMPTY | NO_REPS
  function effRange(exOrRange, opts) {
    var o = opts || {};
    var ex = (Array.isArray(exOrRange) || !exOrRange) ? null : exOrRange;
    var exRange = Array.isArray(exOrRange) ? exOrRange
      : (ex && Array.isArray(ex.repRange) ? ex.repRange : null);
    var role = o.role || roleOf(o.item || null, ex);
    var out = {
      ok: false, code: "NO_REPS", mode: isModeKey(o.mode) ? o.mode : null,
      role: role, exRange: isRange(exRange) ? copyRange(exRange) : null,
      modeRange: null, range: null, mismatch: false, degenerate: false, ruleId: null,
      restSec: null, progression: null
    };
    if (!isRange(exRange)) return out;          // планка, перенесення — не повтори

    if (!isModeKey(o.mode)) {                   // режим не заданий — нічого не міняється
      out.ok = true; out.code = "MODE_OFF";
      out.range = copyRange(exRange);
      return out;
    }
    out.modeRange = modeRange(o.mode, role);
    out.restSec = restSecOf(o.mode, role);
    out.progression = progressionOf(o.mode, role);

    var hit = intersectRange(exRange, out.modeRange);
    if (hit) {
      out.ok = true; out.code = "OK";
      out.range = hit;
      out.degenerate = (hit[0] === hit[1]);
      out.ruleId = "MODE_APPLIED";
      return out;
    }
    out.ok = true; out.code = "EMPTY";
    out.range = copyRange(exRange);             // вправа виграє
    out.mismatch = true;
    out.ruleId = "MODE_RANGE_MISMATCH";
    return out;
  }

  // §13.3: `modeMismatch` не викидає вправу, а дає їй штраф −3 у §5.2.
  function modeMismatch(ex, mode, role) {
    return effRange(ex, { mode: mode, role: role }).mismatch === true;
  }

  // Мапа {id: true} по бібліотеці — для скорингу й для §13.4.
  function modeMismatchMap(exercises, mode) {
    var lib = libraryOf(exercises);
    var out = {};
    for (var i = 0; i < lib.length; i++) {
      if (modeMismatch(lib[i], mode)) out[lib[i].id] = true;
    }
    return out;
  }

  // ---------- §7 / §13.1 freqTargetPerMuscle ----------
  //
  // §7 прямо каже: це ПОБАЖАННЯ розподілу, а не обмеження. «Конфлікт
  // розв'язується на користь таблиці [схем], бо кількість днів — факт, а
  // частота — ціль.» Тому тут рівно перевірка й нота, жодного впливу на вибір.

  function templateFrequency(daysPerWeek) {
    var tpl = templateFor(daysPerWeek);
    var out = zeroMap();
    for (var d = 0; d < tpl.days.length; d++) {
      var list = FOCUS_MUSCLES[tpl.days[d]] || MUSCLES;
      for (var i = 0; i < list.length; i++) {
        if (IS_MUSCLE[list[i]]) out[list[i]] += 1;
      }
    }
    return out;
  }

  function freqCheck(mode, daysPerWeek) {
    var s = MODE[mode];
    var freq = templateFrequency(daysPerWeek);
    var out = {
      ok: true, code: s ? "OK" : "MODE_OFF", mode: isModeKey(mode) ? mode : null,
      target: s ? { min: s.freqTargetPerMuscle.min, max: s.freqTargetPerMuscle.max } : null,
      frequency: freq, below: []
    };
    if (!s) return out;
    for (var i = 0; i < MUSCLES.length; i++) {
      if (freq[MUSCLES[i]] < s.freqTargetPerMuscle.min) out.below.push(MUSCLES[i]);
    }
    if (out.below.length) {
      out.ok = false;
      out.code = "TEMPLATE_WINS";
    }
    return out;
  }

  // ---------- §13.4 перемикання режиму ----------

  // §13.6: драбина двовимірна — «ціль anchor'ів» і «ціль решти ролей».
  // Для трьох базових колонок дає рівно стару драбину: str↔hyb 1,
  // hyb↔hyp 1, str↔hyp 2.
  function modeSteps(from, to) {
    var a = MODE_ROLE_GOALS[resolveMode(from)], b = MODE_ROLE_GOALS[resolveMode(to)];
    return (a.anchor !== b.anchor ? 1 : 0) + (a.rest !== b.rest ? 1 : 0);
  }

  // §13.6: галочки цілей → колонка MODE. Порядок і повтори не важать;
  // порожньо або невідома ціль → null (режим не задано).
  function modeFromGoals(goals) {
    if (!Array.isArray(goals) || !goals.length) return null;
    for (var i = 0; i < goals.length; i++) {
      if (GOALS.indexOf(goals[i]) < 0) return null;
    }
    var key = GOALS.filter(function (g) { return goals.indexOf(g) >= 0; }).join("+");
    return GOALS_MODE[key] || null;
  }

  // §13.6, міграція: старі str/hyb/hyp (і нові колонки) → галочки для показу.
  function goalsOfMode(mode) {
    return MODE_GOALS[mode] ? MODE_GOALS[mode].slice() : null;
  }

  //   modeSwitch({ from, to, daysSinceLastSwitch, atWeekBoundary, trust })
  //
  //   застосування — на МЕЖІ ТИЖНЯ, ніколи не посеред (та сама причина, що й
  //                  для ротації §5.2: тижневий облік обсягу §7);
  //   антидребезг  — мінімум 28 днів між перемиканнями;
  //   сусідні      — з початку наступного тижня, мезоцикл продовжується;
  //   через два кроки — мезоцикл закривається достроково + дельоуд §4.
  //
  // ⚑ `atWeekBoundary` за замовчуванням FALSE: якщо викликач не сказав, що
  // зараз межа тижня, перемикання ставиться в чергу на наступну межу, а не
  // застосовується посеред тижня. Помилка йде в бік «зачекати».
  //
  //   code: OK | BAD_MODE | SAME_MODE | DEBOUNCE
  function modeSwitch(opts) {
    var o = opts || {};
    var from = resolveMode(o.from);
    var to = isModeKey(o.to) ? o.to : null;
    var trustIn = isNum(o.trust) ? o.trust : null;
    var out = {
      ok: false, code: "BAD_MODE", from: from, to: to, steps: null,
      allowed: false, applyNow: false, scheduled: false, effectiveFrom: null,
      mesoCut: false, deload: false, keepAnchors: true,
      ruleId: null, ruleIds: [],
      trust: trustIn, trustCap: null, trustCapped: false,
      daysSinceLastSwitch: isNum(o.daysSinceLastSwitch) ? Math.floor(o.daysSinceLastSwitch) : null,
      daysLeft: null, minDays: MODE_SWITCH_MIN_DAYS,
      resets: null, keeps: null, why: null
    };
    if (!to) return out;

    var steps = modeSteps(from, to);
    out.steps = steps;
    if (steps === 0) {
      out.ok = true; out.code = "SAME_MODE";
      out.why = whyModeSwitch(out);
      return out;
    }

    // Антидребезг. Порога немає тільки тоді, коли перемикань ще не було
    // (`daysSinceLastSwitch` не переданий): рахувати 28 днів немає від чого.
    if (out.daysSinceLastSwitch !== null && out.daysSinceLastSwitch < MODE_SWITCH_MIN_DAYS) {
      out.ok = true; out.code = "DEBOUNCE";
      out.ruleId = "MODE_SWITCH_DEBOUNCE";
      out.ruleIds = ["MODE_SWITCH_DEBOUNCE"];
      out.daysLeft = MODE_SWITCH_MIN_DAYS - out.daysSinceLastSwitch;
      out.why = whyModeSwitch(out);
      return out;
    }

    out.ok = true; out.code = "OK";
    out.allowed = true;
    out.applyNow = (o.atWeekBoundary === true);
    out.scheduled = !out.applyNow;
    out.effectiveFrom = out.applyNow ? "this_week_start" : "next_week_start";
    out.mesoCut = steps >= 2;
    out.deload = out.mesoCut;
    out.keepAnchors = !out.mesoCut;
    out.ruleIds = ["MODE_SWITCH_SCHEDULED"];
    if (out.mesoCut) out.ruleIds.push("MODE_SWITCH_MESO_CUT");
    out.ruleId = out.mesoCut ? "MODE_SWITCH_MESO_CUT" : "MODE_SWITCH_SCHEDULED";

    out.trustCap = out.mesoCut ? MODE_TRUST_CAP_2 : MODE_TRUST_CAP_1;
    if (trustIn !== null) {
      out.trust = Math.min(trustIn, out.trustCap);
      out.trustCapped = out.trust < trustIn;
    }

    // §13.4, таблиця «що переживає перемикання, а що обнуляється».
    out.resets = {
      miss: "changed_effRange",           // тільки вправи, чий effRange змінився
      plateauLadder: "changed_effRange",  // позиція в драбині §6 — ті самі вправи
      step1Timeout: true,                 // лічильник PLATEAU_STEP1_TIMEOUT
      mrvWeeks: true
    };
    out.keeps = [
      "e1rm", "bias", "nProbes", "fatigue", "sessionHistory",
      "weeklyVolume", "trust"
    ];
    if (out.keepAnchors) out.keeps.push("anchors");
    out.why = whyModeSwitch(out);
    return out;
  }

  var MODE_NAME = {
    str: "силовий", hyb: "гібрид", hyp: "гіпертрофійний",
    se: "сила + витривалість", she: "сила + гіпертрофія + витривалість",
    he: "гіпертрофія + витривалість"
  };

  var ROLE_NAME = {
    anchorMain: "основна силова вправа", anchorSecondary: "основна вертикальна вправа",
    assistance: "допоміжна на кілька м'язів", isolation: "вправа на один м'яз"
  };

  function rangeText(r) { return isRange(r) ? (r[0] + "–" + r[1]) : "—"; }

  // §8: факт → правило → контекст.
  function whyMode(ex, er) {
    var nm = (ex && ex.name) ? ex.name : (er.exRange ? "вправа" : "вправа");
    var first = nm + ": власний діапазон " + rangeText(er.exRange) + ", режим " +
      (MODE_NAME[er.mode] || er.mode) + " для ролі «" + (ROLE_NAME[er.role] || er.role) +
      "» просить " + rangeText(er.modeRange) + ".";
    var second = er.mismatch
      ? "Перетин порожній, тому виграє вправа: її діапазон повторів поставлений з міркувань техніки й суглобів, а ціль — лише побажання щодо діапазону."
      : "Ціль не затирає вправу, а перетинається з нею, тому робочий діапазон — перетин двох.";
    // §13.3: «Anchor-слоти штрафом не зачіпаються: там вправа зафіксована на
    // мезоцикл, і §5 її не переобирає.» Тому й пояснення для них інше.
    var isAnchorRole = (er.role === "anchorMain" || er.role === "anchorSecondary");
    var third = er.mismatch
      ? (isAnchorRole
          ? ("Лишається " + rangeText(er.range) + "; основна вправа закріплена на цикл, тому переобирати нема чого.")
          : ("Лишається " + rangeText(er.range) + ", вправа обирається рідше (" + W_MISMATCH +
             " в оцінці вибору), але з бібліотеки не зникає."))
      : ("Робочий діапазон — " + rangeText(er.range) + ", пауза " + er.restSec + " с.");
    return cap(first + " " + second + " " + third);
  }

  // Той самий факт без §-посилань і слова «штраф»: людині потрібен діапазон.
  function shortMode(ex, er) {
    var reps = rangeText(er.range) + " " +
      plural(er.range && er.range[1], "повтор", "повтори", "повторів");
    return cap(er.mismatch
      ? ("Діапазон вправи й режиму не збіглись, тому лишаємо рідний для вправи — " + reps + ".")
      : ("У режимі «" + (MODE_NAME[er.mode] || er.mode) + "» тут " + reps +
         " і пауза " + er.restSec + " с між підходами."));
  }

  function whyModeSwitch(p) {
    var first = "Режим " + (MODE_NAME[p.from] || p.from) + " → " +
      (MODE_NAME[p.to] || p.to) + ", кроків переходу — " + p.steps + ".";
    var second, third;
    if (p.code === "SAME_MODE") {
      second = "Обрані цілі вже активні, тому перемикати нічого.";
      third = "Нічого не змінюється.";
    } else if (p.code === "DEBOUNCE") {
      second = "Захист від частих перемикань: між ними мінімум " + MODE_SWITCH_MIN_DAYS +
        " днів, бо помітна гіпертрофія починається приблизно після 18 сесій — раніше режим просто нічим оцінити.";
      third = "Від останнього перемикання минуло " + p.daysSinceLastSwitch +
        " днів, лишилось " + p.daysLeft + ".";
    } else {
      second = p.mesoCut
        ? "Стрибок через два кроки: поточний цикл закривається достроково, далі тиждень розвантаження і новий цикл уже з новими цілями."
        : "Сусідні режими: цикл продовжується, змінюються лише діапазони повторів і паузи.";
      third = "Застосування " + (p.applyNow ? "з початку цього тижня" : "з початку наступного тижня") +
        " (посеред тижня — ніколи), а довіра до твоїх оцінок запасу тимчасово обмежується до " + p.trustCap + ".";
    }
    return first + " " + second + " " + third;
  }

  // §13.4: `miss` і позиція в драбині плато обнуляються ДЛЯ ВПРАВ, чий
  // effRange змінився. Обидва лічильники вимірюють «вправа не росте В ЦЬОМУ
  // ДІАПАЗОНІ», і після зміни діапазону вимірюють щось інше.
  //
  // ⚑ `streak` і `lastE1rm` §13.4 у списку обнулення НЕ називає — лишаємо їх
  // як є. Це літеральне прочитання таблиці; про суперечність зі §0.1
  // («e1RM з нового діапазону не порівнюваний зі старим») — у звіті кроку.
  function plateauAfterModeSwitch(rec) {
    var A = global.AlgoCore;
    var c = A ? A.normPlateau(rec) : (rec || {});
    return {
      streak: c.streak,
      miss: 0,
      step: 0,
      stepWeeks: 0,
      repsCreep: 0,
      weightMoved: 0,
      step1Blocked: false,      // лічильник PLATEAU_STEP1_TIMEOUT
      stepsUsed: [],
      mesoId: c.mesoId,
      range: null,              // зсув діапазону §6, щабель 2 — теж позиція
      lastE1rm: c.lastE1rm,
      lastWeight: c.lastWeight,
      lastReps: c.lastReps
    };
  }

  //   modeRangeChanges(exercises, from, to, { anchors })
  //
  // Список вправ, чий `effRange` змінився при переході. `anchors` ({slot: id}
  // або масив id) потрібен, щоб anchor-рухи отримали свій рядок таблиці, а не
  // рядок допоміжки: §5 тримає їх у слотах на весь мезоцикл.
  function modeRangeChanges(exercises, from, to, opts) {
    var o = opts || {};
    var lib = libraryOf(exercises);
    var slotOf = {};
    if (o.anchors) {
      var am = normAnchors(o.anchors, indexById(lib));
      for (var k in am) if (has(am, k) && am[k]) slotOf[am[k]] = k;
    }
    var changed = [];
    var byId = {};
    for (var i = 0; i < lib.length; i++) {
      var ex = lib[i];
      var item = slotOf[ex.id] ? { kind: "anchor", slot: slotOf[ex.id] } : null;
      var role = roleOf(item, ex);
      var a = effRange(ex, { mode: from, role: role });
      var b = effRange(ex, { mode: to, role: role });
      var same = (a.range === null && b.range === null) ||
        (isRange(a.range) && isRange(b.range) && a.range[0] === b.range[0] && a.range[1] === b.range[1]);
      if (same) continue;
      changed.push(ex.id);
      byId[ex.id] = { role: role, from: a.range, to: b.range, mismatch: b.mismatch };
    }
    return { changed: changed, byId: byId, from: resolveMode(from), to: isModeKey(to) ? to : null };
  }

  //   applyModeSwitch({ plan, exercises, anchors, plateau, mrvWeeks, trust })
  //
  // Чистий перерахунок стану під план §13.4. Вхід НІКОЛИ не мутується.
  // Якщо план не дозволений (SAME_MODE / DEBOUNCE) — стан повертається як є.
  function applyModeSwitch(opts) {
    var o = opts || {};
    var plan = o.plan || modeSwitch(o);
    var srcPlateau = (o.plateau && typeof o.plateau === "object") ? o.plateau : {};
    var out = {
      ok: plan.ok, code: plan.code, plan: plan,
      changed: [], plateau: {}, mrvWeeks: null,
      trust: isNum(o.trust) ? o.trust : null
    };
    var k;
    for (k in srcPlateau) if (has(srcPlateau, k)) out.plateau[k] = srcPlateau[k];
    if (isNum(o.trust)) out.trust = o.trust;
    if (o.mrvWeeks) out.mrvWeeks = o.mrvWeeks;
    if (!plan.allowed) return out;

    var diff = modeRangeChanges(o.exercises, plan.from, plan.to, { anchors: o.anchors });
    out.changed = diff.changed.slice();
    for (var i = 0; i < diff.changed.length; i++) {
      out.plateau[diff.changed[i]] = plateauAfterModeSwitch(srcPlateau[diff.changed[i]]);
    }
    out.mrvWeeks = mrvWeeksReset();
    if (isNum(out.trust)) out.trust = Math.min(out.trust, plan.trustCap);
    return out;
  }

  // ==================================================================
  // §13.5 — бюджет часу сесії
  // ==================================================================
  //
  // Механізм принципово ІНШИЙ, ніж у §13.0–13.4, і змішувати їх не можна.
  // Режим — параметр НА ВХОДІ: він підміняє числа наявних правил (коридор
  // §7, діапазони §1/§2, хвиля RIR §4, S_adj §11.2) ще до того, як генератор
  // щось обрав. Бюджет — ніж НА ВИХОДІ: він знімає сети з УЖЕ згенерованого
  // плану й нічого не переобирає. §13.5, правило 1 забороняє перегенерацію
  // прямо: «інакше та сама сесія стрибала б цілком від зміни однієї цифри».
  //
  //   workSec(сет, ex) = 3 × reps_target(ex) + setupSec[role(ex)]
  //   T_вправи         = warmupSec[role] + сетів × ( workSec + MODE.restSec[role] )
  //   T_est            = Σ T_вправи − MODE.restSec[останньої вправи]
  //
  // Числа з §13.5 дослівно. Сам ALGO.md називає їх евристикою («не з
  // дослідження») і першими кандидатами на калібрування за реальними мітками
  // часу сесій — тому вони зібрані тут однією таблицею, а не розсипані по
  // формулі.

  var SEC_PER_REP = 3;

  var SETUP_SEC = {
    anchorMain: 30, anchorSecondary: 30, assistance: 20, isolation: 12
  };

  var WARMUP_SEC = {
    anchorMain: 240, anchorSecondary: 120, assistance: 60, isolation: 0
  };

  // ⚑ Запобіжник від зациклення. Кожен крок знімає рівно один сет, а сетів у
  // сесії ≤ SESSION_SET_CAP, тому реально межа недосяжна.
  var TRIM_GUARD = 500;

  function setupSecOf(role) { return has(SETUP_SEC, role) ? SETUP_SEC[role] : SETUP_SEC.isolation; }
  function warmupSecOf(role) { return has(WARMUP_SEC, role) ? WARMUP_SEC[role] : WARMUP_SEC.isolation; }
  function workSecOf(reps, role) {
    var r = (isNum(reps) && reps > 0) ? reps : 0;
    return SEC_PER_REP * r + setupSecOf(role);
  }

  // ⚑ `reps_target(ex)` з §13.5. На виході генератора конкретного числа
  // повторів ще немає — є діапазон, бо ціль повторів народжується в §2 уже
  // при прескрипції. Беремо НИЖНІЙ край робочого діапазону: рівно це віддає
  // в `AlgoCore.prescribe` міст `prescribeSession` (`repsTarget: range[0]`),
  // тож оцінка й прескрипція говорять про одне й те саме число.
  // Явна мапа `repsTarget` виграє: після прескрипції справжні цілі відомі, і
  // оцінку можна перерахувати точніше, не змінюючи правила.
  function repsTargetOf(item, ex, map) {
    var id = item && item.exerciseId;
    if (map && id && isNum(map[id]) && map[id] > 0) return map[id];
    if (item && isNum(item.repsTarget) && item.repsTarget > 0) return item.repsTarget;
    var r = (item && isRange(item.repRange)) ? item.repRange
      : ((ex && isRange(ex.repRange)) ? ex.repRange : null);
    // ⚑ Вправа без повторів (планка, перенесення) — §13.5 про неї мовчить.
    // Рахуємо їй лише setup: вигадувати тривалість утримання тут нічим.
    return r ? r[0] : 0;
  }

  function itemsOf(sessionOrItems) {
    if (Array.isArray(sessionOrItems)) return sessionOrItems;
    if (sessionOrItems && Array.isArray(sessionOrItems.items)) return sessionOrItems.items;
    return [];
  }

  function copyItem(it) {
    var out = {};
    for (var k in it) if (has(it, k)) out[k] = it[k];
    return out;
  }

  //   estimateDuration(session|items, { mode, exercises|index, repsTarget, budgetMin })
  //
  //   → { ok, code, sec, min, mode, restMode, restSource,
  //       budgetMin, budgetSec, over, overSec,
  //       items: [{ exerciseId, role, sets, reps, workSec, restSec, warmupSec, sec }] }
  //
  // ⚑ Режим не заданий → паузи беруться з `hyb` (§13.1: «MODE = {str|hyb|hyp},
  // за замовчуванням hyb»), і це видно в `restSource`. Це не суперечить
  // забороні «мовчазного hyb» у §13.0–13.4: там дефолт зсунув би ОБСЯГ і
  // ДІАПАЗОНИ, тобто саме тренування. Тут же йдеться лише про оцінку часу —
  // жодне число тренування від неї не змінюється, а без пауз оцінки не існує
  // взагалі.
  function estimateDuration(sessionOrItems, opts) {
    var o = opts || {};
    var src = itemsOf(sessionOrItems);
    var idx = o.index || indexById(libraryOf(o.exercises));
    var sessMode = (!Array.isArray(sessionOrItems) && sessionOrItems && isModeKey(sessionOrItems.mode))
      ? sessionOrItems.mode : null;
    var modeGiven = isModeKey(o.mode) ? o.mode : sessMode;
    var restMode = modeGiven || MODE_DEFAULT;
    var out = {
      ok: true, code: "OK", sec: 0, min: 0,
      mode: modeGiven, restMode: restMode,
      restSource: modeGiven ? "mode" : "default",
      budgetMin: null, budgetSec: null, over: false, overSec: 0,
      items: []
    };
    var total = 0, lastRest = 0;
    for (var i = 0; i < src.length; i++) {
      var it = src[i];
      var sets = setsOf(it);
      if (sets <= 0) continue;                 // вправи з 0 сетів у сесії немає
      var ex = (it && it.contrib) ? it : (idx[it && it.exerciseId] || it);
      var role = (it && typeof it.role === "string" && has(SETUP_SEC, it.role))
        ? it.role : roleOf(it, ex);
      var reps = repsTargetOf(it, ex, o.repsTarget);
      var work = workSecOf(reps, role);
      var rest = restSecOf(restMode, role);
      // Етап 4: розминку вимкнено — специфічних розминочних підходів немає.
      var warm = (o.warmup === false) ? 0 : warmupSecOf(role);
      var sec = warm + sets * (work + rest);
      total += sec;
      lastRest = rest;
      out.items.push({
        exerciseId: (it && it.exerciseId) || null, role: role, sets: sets,
        reps: reps, workSec: work, restSec: rest, warmupSec: warm, sec: sec
      });
    }
    if (out.items.length) total -= lastRest;   // §13.5: остання пауза не йде
    out.sec = Math.max(0, total);
    out.min = Math.round(out.sec / 60);
    if (isNum(o.budgetMin) && o.budgetMin > 0) {
      out.budgetMin = o.budgetMin;
      out.budgetSec = Math.round(o.budgetMin * 60);
      out.over = out.sec > out.budgetSec;
      out.overSec = out.over ? out.sec - out.budgetSec : 0;
    }
    return out;
  }

  // §13.5, «доступні до зрізу — усі, КРІМ…».
  //
  // 1. anchor-слоти (§5) — жодного сета, ніколи. Та сама причина, що й у
  //    §9.7, виняток 2: викинути anchor означає зламати прогресію, заради
  //    якої §5 існує. Бюджету не вистачає навіть на anchor'и — це не привід
  //    їх різати, це привід сказати правду (TIME_BUDGET_OVER).
  // 2. Сети, що тримають м'яз на MEV при спрацьованому RECOVERY_MEV_OVERRIDE
  //    (§9.7).
  //    ⚑ Порахувати «саме ті сети» нічим: у сесії немає розкладки «цей сет
  //    під MEV, а цей понад». Тому захист цілісний і свідомо консервативний —
  //    вправа, яка ПРЯМО (c ≥ 0.75, §10.1) б'є м'яз із MEV-override, до зрізу
  //    не допускається взагалі. Помилка йде в бік «не зняли зайвого», тобто
  //    на користь §9.7, а не проти нього.
  function trimmable(it, ex, mevSet) {
    if (!it || it.kind === "anchor") return false;
    if (setsOf(it) <= 0) return false;
    if (mevSet) {
      for (var i = 0; i < MUSCLES.length; i++) {
        if (mevSet[MUSCLES[i]] && isDirect(ex, MUSCLES[i])) return false;
      }
    }
    return true;
  }

  // §5.2: «Той самий скоринг задає порядок зрізання при нестачі часу (§13.5):
  // ріжеться знизу, з найнижчого score». Тайбрейк — позиція §11.1 з кінця:
  // при рівних score першою здає та вправа, що стоїть пізніше. Позиції
  // унікальні, тому порівняння повне й детермінізм гарантований.
  function cutsFirst(a, ia, b, ib) {
    // §17: при нестачі часу першими здають вправи НЕ на пріоритетний м'яз.
    var pa = !!(a && a.priority === true), pb = !!(b && b.priority === true);
    if (pa !== pb) return pb;
    var sa = isNum(a.score) ? a.score : -Infinity;
    var sb = isNum(b.score) ? b.score : -Infinity;
    if (sa !== sb) return sa < sb;
    return ia > ib;
  }

  // §13.5, підлога (правило 4): хто лишається, коли зріз дійшов би до нуля.
  // Правило дзеркальне до `cutsFirst`, окремого скорингу тут немає:
  //   • anchor (§5) виграє в будь-якого score — та сама причина, що й у §9.7,
  //     виняток 2. У самому зрізі ця гілка не спрацьовує, бо anchor і так
  //     нетрімабельний (сесія з anchor'ом до нуля не доходить), але правило
  //     мусить бути повним: підлога описана як «anchor, інакше найвищий score»
  //     і не залежить від того, хто саме її викликав;
  //   • далі — найвищий score §5.2, а при рівному score лишається та вправа,
  //     що стоїть РАНІШЕ (бо першою здає та, що стоїть пізніше).
  function keepsLast(a, ia, b, ib) {
    var aa = !!(a && a.kind === "anchor"), ab = !!(b && b.kind === "anchor");
    if (aa !== ab) return aa;
    return cutsFirst(b, ib, a, ia);          // b здає першою ⇒ лишається a
  }

  // Індекс вправи, яка лишиться останньою; −1, якщо сетів у сесії вже немає.
  function floorKeeper(list) {
    var best = -1;
    for (var i = 0; i < list.length; i++) {
      if (setsOf(list[i]) <= 0) continue;
      if (best < 0 || keepsLast(list[i], i, list[best], best)) best = i;
    }
    return best;
  }

  function whyTimeTrim(res) {
    var first = "Оцінка сесії — " + res.estBefore.min + " хв при бюджеті " + res.budgetMin + " хв.";
    var second = "Знімаю підходи з найменш потрібних допоміжних вправ, не чіпаючи основні: знято " +
      res.setsRemoved + " " + setsWord(res.setsRemoved) +
      (res.removed.length ? (", вправ прибрано — " + res.removed.length) : "") + ".";
    var third = "Вийшло ≈ " + res.est.min + " хв; зрізаний обсяг не рахується промахом і лишається дефіцитом тижня.";
    return cap(first + " " + second + " " + third);
  }

  function shortTimeTrim(res) {
    return cap("Щоб укластись у " + res.budgetMin + " хв, зняв " + res.setsRemoved + " " +
      setsWord(res.setsRemoved) + " — вийшло ≈ " + res.est.min + " хв.");
  }

  function whyTimeOver(res) {
    var first = "Не вкладаємось: ≈ " + res.est.min + " хв при бюджеті " + res.budgetMin + " хв.";
    var second = "Різати більше нічого — лишились основні вправи і підходи, що тримають м'язи на мінімальному корисному обсязі, а їх не знімаю.";
    var third = "Сесія віддається як є: чесний перебір кращий за зламану прогресію.";
    return cap(first + " " + second + " " + third);
  }

  function shortTimeOver(res) {
    return cap("Навіть у найкоротшому складі виходить ≈ " + res.est.min + " хв замість " +
      res.budgetMin + " хв — коротше вже нікуди.");
  }

  function whyTimeFloor(res) {
    var first = "Бюджет " + res.budgetMin + " хв не вміщає навіть однієї вправи: ≈ " +
      res.est.min + " хв — це вже найкоротший можливий склад.";
    var second = "Мінімум — одна вправа в сесії (" +
      (res.floor.reason === "anchor" ? "основна" : "найпотрібніша з допоміжних") +
      "), бо нуль вправ гірший за перевищений бюджет.";
    var third = "Сесія віддається як є, з чесно показаним перебором.";
    return cap(first + " " + second + " " + third);
  }

  function shortTimeFloor(res) {
    return cap("Бюджет " + res.budgetMin + " хв, коротше вже нікуди — лишив одну вправу, буде ≈ " +
      res.est.min + " хв.");
  }

  //   trimToBudget(session|items, { budgetMin, mode, exercises|index,
  //                                 repsTarget, mevOverride })
  //
  //   → { ok, code, items, estBefore, est, budgetMin, budgetSec,
  //       setsRemoved, trims: [{exerciseId, from, to, removed, score}],
  //       removed: [id], floor: null | {...}, notes: [...] }
  //
  //   code: NO_BUDGET (бюджету немає — нічого не сталося)
  //       | FITS      (вклались без зрізів)
  //       | TRIMMED   (зрізали і вклались)
  //       | OVER      (різати більше нічого, і все одно не вкладаємось —
  //                    або впершись у недоторканні сети, або в підлогу §13.5)
  //
  // `floor` заповнений тільки тоді, коли зріз зупинила підлога (правило 4):
  //   { ruleId: "TIME_BUDGET_FLOOR", exerciseId, name, kind, score,
  //     reason: "anchor" | "top_score" }
  // Порожня сесія неможлива за побудовою: остання вправа з останнім сетом
  // не знімається ніколи.
  //
  // Вхідний масив і вхідні item'и НЕ мутуються: сети міняються в копіях.
  function trimToBudget(sessionOrItems, opts) {
    var o = opts || {};
    var idx = o.index || indexById(libraryOf(o.exercises));
    var mevSet = (o.mevOverride && typeof o.mevOverride === "object") ? o.mevOverride : null;
    var mode = isModeKey(o.mode) ? o.mode
      : ((!Array.isArray(sessionOrItems) && sessionOrItems && isModeKey(sessionOrItems.mode))
        ? sessionOrItems.mode : null);
    var estOpts = { mode: mode, index: idx, repsTarget: o.repsTarget, warmup: o.warmup };

    var list = itemsOf(sessionOrItems).slice();
    var estBefore = estimateDuration(list, estOpts);
    var out = {
      ok: true, code: "NO_BUDGET", items: list,
      budgetMin: null, budgetSec: null,
      estBefore: estBefore, est: estBefore,
      setsRemoved: 0, trims: [], removed: [], floor: null, notes: []
    };
    if (!isNum(o.budgetMin) || o.budgetMin <= 0) return out;

    out.budgetMin = o.budgetMin;
    out.budgetSec = Math.round(o.budgetMin * 60);
    out.code = "FITS";

    var byId = {};
    var est = estBefore;
    var guard = 0;
    var i;
    while (est.sec > out.budgetSec && guard++ < TRIM_GUARD) {
      var pick = -1;
      for (i = 0; i < list.length; i++) {
        var it = list[i];
        var ex = (it && it.contrib) ? it : (idx[it && it.exerciseId] || it);
        if (!trimmable(it, ex, mevSet)) continue;
        if (pick < 0 || cutsFirst(it, i, list[pick], pick)) pick = i;
      }
      if (pick < 0) break;                     // різати нічого — TIME_BUDGET_OVER

      var cur = list[pick];
      // §13.5, правило 4 — підлога. Знімати останній сет останньої вправи
      // нікуди: сесія стала б порожньою. `floorKeeper` — та сама вправа, що
      // й `pick`, рівно тоді, коли інших вправ із сетами вже немає (мінімум
      // і максимум того самого порядку збігаються на одному елементі).
      if (setsOf(cur) <= 1 && floorKeeper(list) === pick) {
        out.floor = {
          ruleId: "TIME_BUDGET_FLOOR",
          exerciseId: cur.exerciseId || null, name: cur.name || null,
          kind: cur.kind || null,
          score: isNum(cur.score) ? cur.score : null,
          reason: (cur.kind === "anchor") ? "anchor" : "top_score"
        };
        break;
      }
