      var rec = byId[cur.exerciseId];
      if (!rec) {
        rec = {
          exerciseId: cur.exerciseId, name: cur.name || null,
          score: isNum(cur.score) ? cur.score : null,
          from: setsOf(cur), to: setsOf(cur), removed: 0
        };
        byId[cur.exerciseId] = rec;
        out.trims.push(rec);
      }
      var next = copyItem(cur);
      next.sets = setsOf(cur) - 1;
      rec.removed += 1;
      rec.to = next.sets;
      out.setsRemoved += 1;
      if (next.sets <= 0) {
        list.splice(pick, 1);                  // вправа з 0 сетів зникає із сесії
        out.removed.push(next.exerciseId);
      } else {
        next.timeTrim = {
          ruleId: "TIME_BUDGET_TRIM",
          from: rec.from, to: next.sets, removed: rec.removed
        };
        list[pick] = next;
      }
      est = estimateDuration(list, estOpts);
    }

    out.items = list;
    out.est = estimateDuration(list, {
      mode: mode, index: idx, repsTarget: o.repsTarget, budgetMin: o.budgetMin, warmup: o.warmup
    });
    if (out.setsRemoved > 0) {
      out.code = "TRIMMED";
      out.notes.push({
        code: "TIME_BUDGET_TRIM", ruleId: "TIME_BUDGET_TRIM",
        budgetMin: out.budgetMin, budgetSec: out.budgetSec,
        estBeforeMin: estBefore.min, estBeforeSec: estBefore.sec,
        estMin: out.est.min, estSec: out.est.sec,
        setsRemoved: out.setsRemoved,
        trims: out.trims.slice(), removed: out.removed.slice(),
        text: whyTimeTrim(out), short: shortTimeTrim(out)
      });
    }
    if (out.est.over) {
      out.code = "OVER";
      // Причина зупинки одна з двох, і вони взаємовиключні: або різати не
      // було чого (anchor'и §5 + сети під MEV §9.7), або зріз уперся в
      // підлогу §13.5. Текст `TIME_BUDGET_OVER` говорить саме про перше,
      // тому в разі підлоги замість нього йде чесний `TIME_BUDGET_FLOOR`.
      out.notes.push(out.floor ? {
        code: "TIME_BUDGET_FLOOR", ruleId: "TIME_BUDGET_FLOOR",
        budgetMin: out.budgetMin, budgetSec: out.budgetSec,
        estMin: out.est.min, estSec: out.est.sec, overSec: out.est.overSec,
        exerciseId: out.floor.exerciseId, reason: out.floor.reason,
        text: whyTimeFloor(out), short: shortTimeFloor(out)
      } : {
        code: "TIME_BUDGET_OVER", ruleId: "TIME_BUDGET_OVER",
        budgetMin: out.budgetMin, budgetSec: out.budgetSec,
        estMin: out.est.min, estSec: out.est.sec, overSec: out.est.overSec,
        text: whyTimeOver(out), short: shortTimeOver(out)
      });
    }
    return out;
  }

  // ==================================================================
  // §14 — Біль і виключені вправи (етап 8, 2026-10-06)
  // ==================================================================
  //
  // Це НЕ медична логіка і не реабілітація. Користувач сам позначає зону,
  // яка болить, або вправу, яку не пропонувати, — постійно чи лише на
  // сьогодні. Генератор лише фільтрує: вправа, що навантажує позначену зону
  // (поле `joints` у базі), не потрапляє в сесію; замість неї береться
  // вправа того самого руху / м'яза без цієї зони, з коротким «чому».
  // Діагнозів, шкал болю й протоколів тут немає свідомо (ALGO §14).
  //
  // ⚑ `joints` — класифікація укладача: які суглоби рухаються під
  //   навантаженням або тримають його (кінезіологія руху), а не виміряні
  //   сили в суглобах. Вправа без поля `joints` (власна, старий імпорт)
  //   зоною не відфільтровується — даних немає, вигадувати їх не можна.

  var JOINT_ZONES = ["knee", "hip", "ankle", "lumbar", "shoulder", "elbow", "wrist", "neck"];
  var ZONE_NAME = {
    knee: "коліно", hip: "тазостегновий суглоб", ankle: "гомілка", lumbar: "поперек",
    shoulder: "плече", elbow: "лікоть", wrist: "зап'ястя", neck: "шия"
  };
  var IS_ZONE = {};
  (function () { for (var z = 0; z < JOINT_ZONES.length; z++) IS_ZONE[JOINT_ZONES[z]] = true; })();
  var AVOID_SCOPES = { always: true, today: true };

  function isZone(z) { return IS_ZONE[z] === true; }

  // Масив валідних зон вправи (копія) або null, якщо поля немає.
  function jointsOf(ex) {
    if (!ex || !Array.isArray(ex.joints)) return null;
    var out = [];
    for (var i = 0; i < ex.joints.length; i++) {
      if (isZone(ex.joints[i]) && out.indexOf(ex.joints[i]) < 0) out.push(ex.joints[i]);
    }
    return out;
  }

  //   activeAvoid(pain, today) → { zones: [...], ids: [...] } | null
  // pain = { zones: [{ zone, scope: "always"|"today", day }],
  //          exercises: [{ id, scope, day }] }  (docs/DATA.md → settings.pain)
  // `today` — локальна дата "YYYY-MM-DD" від UI: позначка «лише сьогодні»
  // діє, поки її `day` збігається з сьогоднішнім. Date.now тут немає.
  function activeAvoid(pain, today) {
    var p = pain || {};
    var zones = [], ids = [];
    function live(mk) {
      if (!mk || !AVOID_SCOPES[mk.scope]) return false;
      return mk.scope === "always" || (typeof today === "string" && mk.day === today);
    }
    var zl = Array.isArray(p.zones) ? p.zones : [];
    for (var i = 0; i < zl.length; i++) {
      if (live(zl[i]) && isZone(zl[i].zone) && zones.indexOf(zl[i].zone) < 0) zones.push(zl[i].zone);
    }
    var el = Array.isArray(p.exercises) ? p.exercises : [];
    for (var j = 0; j < el.length; j++) {
      var id = el[j] && el[j].id;
      if (live(el[j]) && typeof id === "string" && id && ids.indexOf(id) < 0) ids.push(id);
    }
    if (!zones.length && !ids.length) return null;
    zones.sort(function (a, b) { return JOINT_ZONES.indexOf(a) - JOINT_ZONES.indexOf(b); });
    ids.sort();
    return { zones: zones, ids: ids };
  }

  function normAvoid(a) {
    var out = { zones: {}, ids: {}, zoneList: [], idList: [], any: false };
    if (!a || typeof a !== "object") return out;
    var i;
    var zl = Array.isArray(a.zones) ? a.zones : [];
    for (i = 0; i < zl.length; i++) {
      if (isZone(zl[i]) && !out.zones[zl[i]]) { out.zones[zl[i]] = true; out.zoneList.push(zl[i]); }
    }
    var il = Array.isArray(a.ids) ? a.ids : [];
    for (i = 0; i < il.length; i++) {
      if (typeof il[i] === "string" && il[i] && !out.ids[il[i]]) { out.ids[il[i]] = true; out.idList.push(il[i]); }
    }
    out.any = out.zoneList.length > 0 || out.idList.length > 0;
    return out;
  }

  //   avoidReasonOf(ex, avoid) → null | { code: "EXCLUDED" } | { code: "PAIN_ZONE", zones: [...] }
  // `avoid` — або сирий { zones, ids }, або вже нормований normAvoid().
  function avoidReasonOf(ex, avoid) {
    var av = (avoid && avoid.zoneList) ? avoid : normAvoid(avoid);
    if (!av.any || !ex) return null;
    if (av.ids[ex.id]) return { code: "EXCLUDED", zones: [] };
    var j = jointsOf(ex);
    if (!j) return null;
    var hit = [];
    for (var i = 0; i < j.length; i++) if (av.zones[j[i]]) hit.push(j[i]);
    return hit.length ? { code: "PAIN_ZONE", zones: hit } : null;
  }

  function zonesText(zones) {
    var names = [];
    for (var i = 0; i < zones.length; i++) names.push(ZONE_NAME[zones[i]] || zones[i]);
    if (names.length <= 1) return names.join("");
    return names.slice(0, -1).join(", ") + " і " + names[names.length - 1];
  }

  function avoidWhy(r) {
    if (!r) return "";
    if (r.code === "EXCLUDED") return "ви попросили її не пропонувати";
    return (r.zones.length > 1 ? "болять " : "болить ") + zonesText(r.zones);
  }

  function whyPainAnchorSwap(def, ex, oldEx, r) {
    var label = def && def.name ? def.name : "основний рух";
    return "«" + oldEx.name + "» сьогодні замінено на «" + ex.name + "»: " + avoidWhy(r) + ". " +
      "«" + ex.name + "» — той самий рух (" + label + "), але без навантаження на позначене. " +
      "Основна вправа циклу не змінилась: щойно знімете позначку, повернеться «" + oldEx.name + "».";
  }
  function shortPainAnchorSwap(def, ex, oldEx, r) {
    return "Замість «" + oldEx.name + "»: " + avoidWhy(r) + ".";
  }
  function whyPainAnchorSkip(def, oldEx, r) {
    return "Основної вправи «" + oldEx.name + "» сьогодні немає: " + avoidWhy(r) +
      ", а всі доступні вправи цього руху навантажують те саме.";
  }
  function whyPainAssistSwap(ex, oldEx, r) {
    return "«" + ex.name + "» замість «" + oldEx.name + "», яка підходила краще: " + avoidWhy(r) + ".";
  }
  function shortPainAssistSwap(ex, oldEx, r) {
    return "Замість «" + oldEx.name + "»: " + avoidWhy(r) + ".";
  }
  function whyPainFilter(av, hidden) {
    var parts = [];
    if (av.zoneList.length) parts.push((av.zoneList.length > 1 ? "болять " : "болить ") + zonesText(av.zoneList));
    if (av.idList.length) parts.push("не пропонувати: " + av.idList.length + " " + exWord(av.idList.length));
    var verb = (hidden % 10 === 1 && hidden % 100 !== 11) ? "Не пропонується " : "Не пропонуються ";
    return "Враховано: " + parts.join("; ") + ". " + verb + hidden + " " + exWord(hidden) +
      " з доступних. Це не медична порада; гострий, сильний або тривалий біль — до лікаря.";
  }

  // Заміна anchor'а на сьогодні: спершу кандидати в anchor того самого
  // патерну (§5, той самий ранг), потім — будь-яка інша вправа цього
  // патерну. Обидва — з доступного обладнання й без позначених зон.
  function painAnchorSubstitute(lib, pattern, equipment, exceptId, av, used) {
    var first = anchorCandidates(lib, pattern, equipment, exceptId);
    for (var i = 0; i < first.length; i++) {
      if (!used[first[i].id] && !avoidReasonOf(first[i], av)) return first[i];
    }
    var rest = [];
    for (var j = 0; j < lib.length; j++) {
      var ex = lib[j];
      if (ex.pattern !== pattern || ex.id === exceptId || ex.isAnchorCandidate === true) continue;
      if (ex.prehab === true || used[ex.id]) continue;
      if (!equipmentOk(ex, equipment) || avoidReasonOf(ex, av)) continue;
      rest.push(ex);
    }
    rest.sort(anchorRank);
    return rest.length ? rest[0] : null;
  }

  // ==================================================================
  // Генератор сесії (§7 + §5 + §5.2 + §9 + §10.2 + §11)
  // ==================================================================
  //
  //   generateSession({
  //     exercises,      — довідник (дефолт window.EX_DB)
  //     daysPerWeek,    — 2…5 (§7)
  //     dayIndex,       — 1…daysPerWeek
  //     week,           — 1…5 (5 = дельоуд)
  //     anchors,        — {slot: id} або масив id (§5, anchor-lock)
  //     volumeDone,     — {м'яз: сетів} уже набрано цього тижня
  //     sessionsLeft,   — залишок сесій у тижні, включно з цією
  //     ready,          — §9.7 ready_m напряму; якщо переданий, виграє завжди
  //     recovery,       — §9 мапа {м'яз: R_m 0..100} на початок сесії
  //     recoveryState,  — той самий стан, уже порахований recoveryState()
  //     targetRir,      — цільовий RIR сесії (§4/§9.2); дефолт — хвиля тижня
  //     sAdjSlope/Floor,— §11.2, дефолт hyb (0.007 / 0.95)
  //     staleDays,      — {id: днів} для staleness §5.2
  //     weekUsed,       — id допоміжки, уже використаної цього тижня (§5.2:
  //                       ротація ніколи посеред тижня)
  //     equipment,      — доступне обладнання; null = все
  //     mode,           — §13: "str" | "hyb" | "hyp" | "se" | "she" | "he" (§13.6); не заданий → §13 вимкнене
  //     volumeScale,    — §13.2 напряму; виграє над `mode`, дефолт 1.00
  //     modeMismatch,   — §13.3 напряму (глобальний прапорець); при заданому
  //                       `mode` не потрібен — штраф рахується по вправах
  //     budgetMin,      — §13.5: доступні хвилини. Не заданий → бюджет не
  //                       застосовується, поведінка тотожна попередній
  //     repsTarget      — §13.5: {id: повторів} для точнішої оцінки часу;
  //                       без неї береться нижній край робочого діапазону
  //     avoid           — §14: { zones: [...], ids: [...] } (activeAvoid).
  //                       Не заданий або порожній → поведінка тотожна попередній
  //   })
  //
  // §13: режим — це ПАРАМЕТР НА ВХОДІ, який підміняє числа вже наявних
  // правил (обсяг §7/§10, діапазони §1/§2, хвиля RIR §4, S_adj §11.2,
  // скоринг §5.2). Він нічого не ріже в результаті постфактум.
  //
  // Детермінований повністю: жодного Math.random і Date.now.

  function generateSession(opts) {
    var o = opts || {};
    var lib = libraryOf(o.exercises);
    var index = indexById(lib);

    // §13.1 — усі числа режиму беруться звідси; явно передані параметри
    // (volumeScale, rirWave, sAdjSlope/Floor) виграють над таблицею.
    var mp = modeParams(o.mode);
    var modeKey = mp ? mp.mode : null;
    // §13.3 — мапа {id: true} для скорингу §5.2. Anchor-слоти в пул допоміжки
    // не потрапляють, тому роль тут завжди assistance/isolation (§13.3:
    // «Anchor-слоти штрафом не зачіпаються»). Без режиму лишається легасі-
    // прапорець `o.modeMismatch` — точка розширення, яка була до §13.
    var mismatchArg = mp ? modeMismatchMap(lib, mp.mode) : (o.modeMismatch === true);

    var tpl = templateFor(o.daysPerWeek);
    var days = tpl.daysPerWeek;
    var dayIndex = clamp(isNum(o.dayIndex) ? Math.floor(o.dayIndex) : 1, 1, days);
    // §4 (крок 9): дельоуд — це СТАН, а не номер тижня. Без явного `deload`
    // поведінка та сама, що була: тиждень ≥5 вважається дельоудом.
    var rawWeek = isNum(o.week) ? Math.floor(o.week) : 1;
    var deloadNow = isDeloadWeek(rawWeek, o.deload);
    var week = deloadNow ? clamp(rawWeek, 1, DELOAD_WEEK) : clamp(rawWeek, 1, MESO_MAX_WEEK);
    var focus = tpl.days[dayIndex - 1];
    var sessionsLeft = isNum(o.sessionsLeft) ? Math.max(1, Math.floor(o.sessionsLeft)) : (days - dayIndex + 1);

    // §17 / §16 (етап 10): пріоритетні м'язи і рекомендація підсумку циклу.
    var prio = priorityMap(o.priority);
    var rotateOut = {};
    var rotateList = Array.isArray(o.rotateOut) ? o.rotateOut : [];
    for (var ro = 0; ro < rotateList.length; ro++) {
      if (typeof rotateList[ro] === "string" && rotateList[ro]) rotateOut[rotateList[ro]] = true;
    }
    var rotatedAway = [];
    var targets = weeklyTargets({
      daysPerWeek: days, week: week, volumeScale: scaleFrom(o), deload: deloadNow,
      priority: prio.list, rampOffset: o.rampOffset
    });
    var volumeDone = normVolume(o.volumeDone);
    var defs = deficits(volumeDone, targets);
    var dn = deficitNormMap(defs);

    var focusList = FOCUS_MUSCLES[focus] || MUSCLES;
    var inFocus = {};
    for (var f = 0; f < focusList.length; f++) inFocus[focusList[f]] = true;

    var notes = [];
    var i, m;

    // ---------- §9 — стан відновлення ----------
    //
    // Пріоритет входів навмисний: явна мапа `ready` виграє завжди (це та сама
    // точка розширення, що була в кроці 8, і вона не має мінятись під ногами
    // в того, хто нею вже користується). Повний режим §9 вмикається, коли
    // передані `recovery` (мапа R_m) або готовий `recoveryState`.
    var readyGiven = !!o.ready;
    var rec = null;
    if (o.recoveryState && o.recoveryState.muscles) rec = o.recoveryState;
    else if (o.recovery) {
      rec = recoveryFromR(o.recovery, {
        daysPerWeek: days, volumeDone: volumeDone,
        sessionsLeft: sessionsLeft, volumeScale: scaleFrom(o)
      });
    }

    function readyOf(m) {
      if (readyGiven) return isNum(o.ready[m]) ? clamp(o.ready[m], 0, 1) : 1;
      if (rec && rec.muscles[m]) return rec.muscles[m].ready;
      return 1;
    }

    // §9.7, крок 1 — жорсткий фільтр. При floor_днів = 1.0 (2 дні/тиждень)
    // він не застосовується взагалі: коридор і так зрізаний до MEV.
    var hardFilterOn = !!rec && !rec.cold && rec.readyFloor < 1;
    var mevMuscles = {};      // §9.7, виняток 1 — сети під ці м'язи §13.5 не ріже
    var blockDirect = {};     // §9.5 «не відновився» + §10.2 жорсткий стоп
    var directCapM = {};      // §9.5 «часткова»: max(2, ceil(MEV/4))
    var rirDelta = {};        // §9.5 / §9.7: цільовий RIR +1

    if (rec && !rec.cold) {
      for (i = 0; i < MUSCLES.length; i++) {
        m = MUSCLES[i];
        var stM = rec.muscles[m];
        if (!stM) continue;
        if (stM.mevOverride) {
          mevMuscles[m] = true;               // §13.5: ці сети до зрізу недоступні
          notes.push({ code: "RECOVERY_MEV_OVERRIDE", ruleId: "RECOVERY_MEV_OVERRIDE",
            muscle: m, r: stM.r, text: whyMevOverride(stM), short: shortMevOverride(stM) });
          continue;
        }
        // §10.2 — стоп від локального сигналу, а не від таблиці. Діє
        // незалежно від floor_днів: це правило §10, не §9.7.
        if (stM.hardStop) {
          blockDirect[m] = "VOLUME_AT_MRV_LOW_RECOVERY";
          notes.push({ code: "VOLUME_AT_MRV_LOW_RECOVERY", ruleId: "VOLUME_AT_MRV_LOW_RECOVERY",
            muscle: m, r: stM.r, volume: stM.volumeWeek, mrv: stM.mrv,
            text: whyMrvStop(stM), short: shortMrvStop(stM) });
        }
        if (!hardFilterOn) continue;
        if (stM.r < R_LOW) {
          blockDirect[m] = blockDirect[m] || "RECOVERY_LOW";
          notes.push({ code: "RECOVERY_LOW", ruleId: "RECOVERY_LOW",
            muscle: m, r: stM.r, text: whyRecoveryLow(stM), short: shortRecoveryLow(stM) });
        } else if (isNum(stM.directCap)) {
          directCapM[m] = stM.directCap;
          rirDelta[m] = 1;
          notes.push({ code: "RECOVERY_PARTIAL", ruleId: "RECOVERY_PARTIAL",
            muscle: m, r: stM.r, cap: stM.directCap,
            text: whyRecoveryPartial(stM, stM.directCap),
            short: shortRecoveryPartial(stM, stM.directCap) });
        }
      }
    } else if (rec && rec.cold) {
      notes.push({ code: "RECOVERY_COLD_START", ruleId: "RECOVERY_COLD_START" });
    }

    // §7 стеля прямих сетів, зрізана §9.5 для часткової зони.
    function capOf(mm) {
      return isNum(directCapM[mm]) ? Math.min(MUSCLE_DIRECT_CAP, directCapM[mm]) : MUSCLE_DIRECT_CAP;
    }

    // Вправа не ставиться, якщо вона прямо (c ≥ 0.75) б'є заблокований м'яз.
    // Непряма робота (c < 0.75) лишається дозволеною — §10.2 прямо цього
    // вимагає, інакше при 4–5 днях сусідні м'язи стають нетренованими.
    function hitsBlocked(ex) {
      for (var q = 0; q < MUSCLES.length; q++) {
        if (blockDirect[MUSCLES[q]] && isDirect(ex, MUSCLES[q])) return true;
      }
      return false;
    }

    // §7: greedy по (deficit / залишок_сесій_у_тижні) × ready_m
    var quota = {};
    for (i = 0; i < MUSCLES.length; i++) {
      m = MUSCLES[i];
      quota[m] = inFocus[m] ? fix6((defs[m].deficit / sessionsLeft) * readyOf(m)) : 0;
    }

    var items = [];
    var used = {};                 // exerciseId → true
    var directSets = zeroMap();
    var totalSets = 0;
    var volume = zeroMap();

    function applyPick(ex, sets, extra) {
      var it = {
        exerciseId: ex.id,
        name: ex.name,
        kind: extra.kind,
        slot: extra.slot || null,
        pattern: ex.pattern || null,
        equipment: ex.equipment || null,
        sets: sets,
        repRange: Array.isArray(ex.repRange) ? ex.repRange.slice() : null,
        incrementKg: isNum(ex.incrementKg) ? ex.incrementKg : null,
        // §2.1: вправа без зовнішньої ваги — поле ваги означає ТІЛЬКИ
        // додатковий вантаж. Прапорець їде разом з вправою, щоб екран не
        // перевіряв обладнання руками. Тут саме ПЕРЕНОС оголошеного поля, а
        // не друга копія предиката: розпізнавання за обладнанням живе рівно
        // в одному місці — AlgoCore.isBodyweight (§2.1).
        bodyweightBase: ex.bodyweightBase === true,
        contrib: contribOf(ex),
        mainMuscle: mainMuscle(ex),
        score: isNum(extra.score) ? extra.score : null,
        // §9.5 / §9.7: «цільовий RIR +1» у частковій зоні й на низькому anchor'і.
        targetRirDelta: isNum(extra.targetRirDelta) ? extra.targetRirDelta : 0,
        group: null, order: null, sAdj: 1, sAdjWhy: null,   // §11 — нижче
        // §13 — заповнюється нижче, тільки коли режим заданий.
        role: null, modeRange: null, modeMismatch: false, restSec: null, modeWhy: null,
        // §14 — заповнюється, лише коли фільтр болю змінив вибір.
        painSwap: null,
        // §17 — вправа на пріоритетний м'яз (не в розвантаження).
        priority: false, priorityMuscle: null, priorityWhy: null,
        why: extra.why || null
      };
      if (!deloadNow && prio.any) {
        var pmus = (extra.forMuscle && prio.map[extra.forMuscle]) ? extra.forMuscle
          : (prio.map[it.mainMuscle] ? it.mainMuscle : null);
        if (pmus) {
          it.priority = true;
          it.priorityMuscle = pmus;
          var tgt = targets[pmus];
          it.priorityWhy = {
            ruleId: "PRIORITY_MUSCLE",
            inputs: { muscle: pmus, target: tgt ? tgt.value : null, kind: extra.kind },
            text: whyPriorityItem(pmus, tgt, extra.kind),
            short: shortPriorityItem(pmus, extra.kind)
          };
        }
      }

      // §13.1 / §13.3 — режим підміняє діапазон повторів, ПЕРЕТИНАЮЧИСЬ із
      // діапазоном самої вправи. `it.repRange` далі читає prescribeSession
      // (§1), тому саме він має нести effRange, а не сирий ex.repRange.
      if (mp) {
        var role = roleOf(it, ex);
        var er = effRange(ex, { mode: mp.mode, role: role });
        it.role = role;
        it.modeRange = er.modeRange;
        it.restSec = er.restSec;
        if (er.range) it.repRange = er.range.slice();
        it.modeMismatch = er.mismatch === true;
        // §8 задає рівно три речення (факт → правило → контекст), тому §13
        // живе окремим полем, як і §11.2 `sAdjWhy`, а не четвертим реченням.
        it.modeWhy = {
          ruleId: er.ruleId || "MODE_APPLIED",
          inputs: {
            mode: mp.mode, role: role, effRange: it.repRange,
            exRange: er.exRange, modeRange: er.modeRange,
            restSec: er.restSec, progression: er.progression,
            modeMismatch: it.modeMismatch, degenerate: er.degenerate
          },
          text: whyMode(ex, er),
          short: shortMode(ex, er)
        };
        if (it.modeMismatch) {
          notes.push({
            code: "MODE_RANGE_MISMATCH", ruleId: "MODE_RANGE_MISMATCH",
            exerciseId: ex.id, role: role, mode: mp.mode,
            exRange: er.exRange, modeRange: er.modeRange,
            text: whyMode(ex, er), short: shortMode(ex, er)
          });
        }
      }
      items.push(it);
      used[ex.id] = true;
      totalSets += sets;
      addVolume(volume, ex, sets, volume);
      for (var k = 0; k < MUSCLES.length; k++) {
        var mm2 = MUSCLES[k];
        var c = cOf(ex, mm2);
        if (c <= 0) continue;
        if (c >= DIRECT_MIN) directSets[mm2] = fix2(directSets[mm2] + sets);
        quota[mm2] = fix6(Math.max(0, quota[mm2] - c * sets));
      }
      return it;
    }

    // ---------- 1. Anchor-слоти (§5) ----------
    var anchorMap = normAnchors(o.anchors, index);
    var slotsForDay = FOCUS_ANCHORS[focus] || [];
    var anchorExercises = [];
    var anchorPlan = [];
    // §14: біль / «не пропонувати». Порожньо — жодної гілки нижче не вмикає.
    var avoid = normAvoid(o.avoid);
    var painUsed = {};
    for (i = 0; i < slotsForDay.length; i++) {
      var slot = slotsForDay[i];
      var aid = anchorMap[slot];
      var aex = aid ? index[aid] : null;
      if (!aex) continue;
      if (!equipmentOk(aex, o.equipment)) {
        notes.push({ code: "ANCHOR_EQUIPMENT_MISSING", slot: slot, exerciseId: aid });
        continue;
      }
      var aReason = avoid.any ? avoidReasonOf(aex, avoid) : null;
      if (aReason) {
        var sdef = slotDef(slot);
        var sub = painAnchorSubstitute(lib, sdef ? sdef.pattern : aex.pattern, o.equipment, aid, avoid, painUsed);
        if (!sub) {
          notes.push({ code: "PAIN_ANCHOR_SKIPPED", ruleId: "PAIN_ANCHOR_SKIPPED", slot: slot,
            exerciseId: aid, reason: aReason.code, zones: aReason.zones.slice(),
            text: whyPainAnchorSkip(sdef, aex, aReason), short: whyPainAnchorSkip(sdef, aex, aReason) });
          continue;
        }
        painUsed[sub.id] = true;
        anchorExercises.push(sub);
        anchorPlan.push({ slot: slot, ex: sub, painFrom: aex, painReason: aReason });
        continue;
      }
      anchorExercises.push(aex);
      anchorPlan.push({ slot: slot, ex: aex });
    }
    var directMap = anchorDirectMuscles(anchorExercises);

    for (i = 0; i < anchorPlan.length; i++) {
      var ap = anchorPlan[i];
      // §9.7, виняток 2: anchor НІКОЛИ не викидається через R_m. При
      // R_m < 25 на його цільовому м'язі — 2 сети, цільовий RIR +1,
      // вага без змін. Викинути anchor = зламати прогресію, заради якої
      // існує §5.
      var aMain = mainMuscle(ap.ex);
      var aSt = (rec && !rec.cold && rec.muscles[aMain]) ? rec.muscles[aMain] : null;
      // ⚑ `hardFilterOn` тут не зайвий: виняток 2 — це виняток із ЖОРСТКОГО
      // ФІЛЬТРА §9.7, кроку 1. При floor_днів = 1.0 (2 дні/тиждень) крок 1 не
      // застосовується взагалі («recovery не фільтрує вибір узагалі»), тому й
      // різати anchor до 2 сетів немає від чого рятувати.
      var aLow = hardFilterOn && !!aSt && !aSt.mevOverride && aSt.r < R_LOW;
      var aWant = aLow ? ANCHOR_MIN_SETS : ANCHOR_SETS;
      var aSets = Math.min(aWant, SESSION_SET_CAP - totalSets);
      if (aSets <= 0) { notes.push({ code: "SESSION_SET_CAP", ruleId: "SESSION_SET_CAP", slot: ap.slot }); break; }
      if (ap.painFrom) {
        var pdef = slotDef(ap.slot);
        var pIt = applyPick(ap.ex, aSets, {
          kind: "anchor",
          slot: ap.slot,
          targetRirDelta: aLow ? 1 : 0,
          why: {
            ruleId: "PAIN_ANCHOR_SWAP",
            inputs: {
              slot: ap.slot, week: week, dayIndex: dayIndex, sets: aSets,
              replacedFrom: ap.painFrom.id, reason: ap.painReason.code, zones: ap.painReason.zones.slice()
            },
            text: whyPainAnchorSwap(pdef, ap.ex, ap.painFrom, ap.painReason),
            short: shortPainAnchorSwap(pdef, ap.ex, ap.painFrom, ap.painReason)
          }
        });
        pIt.painSwap = {
          ruleId: "PAIN_ANCHOR_SWAP", replacedId: ap.painFrom.id, replacedName: ap.painFrom.name,
          reason: ap.painReason.code, zones: ap.painReason.zones.slice(),
          text: pIt.why.text, short: pIt.why.short
        };
        continue;
      }
      applyPick(ap.ex, aSets, {
        kind: "anchor",
        slot: ap.slot,
        targetRirDelta: aLow ? 1 : 0,
        why: {
          ruleId: aLow ? "RECOVERY_ANCHOR_MIN" : "ANCHOR_LOCKED",
          inputs: {
            slot: ap.slot, week: week, dayIndex: dayIndex, sets: aSets,
            muscle: aMain, r: aSt ? aSt.r : null, targetRirDelta: aLow ? 1 : 0
          },
          text: aLow
            ? whyAnchorRecoveryMin(slotDef(ap.slot), ap.ex, aSt, aSets)
            : whyAnchorLocked(slotDef(ap.slot), ap.ex),
          short: aLow
            ? shortAnchorRecoveryMin(slotDef(ap.slot), ap.ex, aSt, aSets)
            : shortAnchorLocked(slotDef(ap.slot), ap.ex)
        }
      });
      if (aLow) {
        notes.push({ code: "RECOVERY_ANCHOR_MIN", ruleId: "RECOVERY_ANCHOR_MIN",
          slot: ap.slot, exerciseId: ap.ex.id, muscle: aMain, r: aSt.r, sets: aSets });
      }
    }

    // ---------- 2. Допоміжка (§5.2 + greedy §7) ----------
    // §7: стеля 10 прямих сетів на м'яз за сесію діє на ВСІ м'язи, які вправа
    // бере прямо, а не лише на той, під який її обрали. Інакше «трицепсова»
    // вправа з chest 1.0 тихо переповнює груди.
    function roomFor(ex) {
      var room = Infinity;
      for (var q = 0; q < MUSCLES.length; q++) {
        if (!isDirect(ex, MUSCLES[q])) continue;
        room = Math.min(room, capOf(MUSCLES[q]) - directSets[MUSCLES[q]]);
      }
      return room;
    }

    var blocked = {};
    var weekUsed = Array.isArray(o.weekUsed) ? o.weekUsed : [];
    var guard = 0;

    while (guard++ < MAX_PICKS) {
      if (totalSets >= SESSION_SET_CAP) {
        notes.push({ code: "SESSION_SET_CAP", ruleId: "SESSION_SET_CAP", totalSets: totalSets });
        break;
      }
      // Найбільший пріоритет §7. Тайбрейк — порядок ключів §9.1.
      var best = null, bestQ = 0;
      for (i = 0; i < MUSCLES.length; i++) {
        m = MUSCLES[i];
        if (!inFocus[m] || blocked[m] || blockDirect[m]) continue;
        if (quota[m] > bestQ) { bestQ = quota[m]; best = m; }
      }
      if (!best || bestQ < QUOTA_MIN) break;

      if (capOf(best) - directSets[best] <= 0) {
        blocked[best] = true;
        notes.push({ code: "MUSCLE_SET_CAP", ruleId: "MUSCLE_SET_CAP", muscle: best, directSets: directSets[best] });
        continue;
      }

      // Кандидати: суттєвий внесок у цільовий м'яз (§11.1, поріг 0.5),
      // не anchor цього дня, не вже в сесії, обладнання доступне.
      var pool = [];
      var painPool = [];               // §14: відсіяні болем — лише для «чому»
      for (i = 0; i < lib.length; i++) {
        var ex = lib[i];
        if (used[ex.id]) continue;
        if (!isSignificant(ex, best)) continue;
        if (!equipmentOk(ex, o.equipment)) continue;
        if (hitsBlocked(ex)) continue;      // §9.5 / §10.2 — прямі сети заборонені
        if (avoid.any && avoidReasonOf(ex, avoid)) { painPool.push(ex); continue; }
        pool.push(ex);
      }
      if (!pool.length) {
        blocked[best] = true;
        notes.push({ code: "NO_CANDIDATE", muscle: best });
        continue;
      }

      // §10.2: щойно тижневий обсяг м'яза дійшов до MAV_eff, нові сети йдуть
      // ТІЛЬКИ в anchor/компаунд, не в ізоляцію (у зоні ≥ MRV_eff — так само).
      // «Компаунд» тут — §11.1: ≥2 м'язи з суттєвим внеском (c_m ≥ 0.5).
      // ⚑ Через деффіцитний шлях ця гілка сьогодні недосяжна: ціль §4 сама
      // впирається в MAV_eff, тобто при обсязі ≥ MAV дефіцит уже нульовий.
      // Вона стає живою, щойно сети почнуть з'являтися з інших правил
      // (крок 1 драбини плато, §6) — і тоді правило §10.2 має вже діяти.
      var brakeM = volumeBrake(best, {
        volume: volumeDone[best],
        r: (rec && !rec.cold && rec.muscles[best]) ? rec.muscles[best].r : null,
        volumeScale: scaleFrom(o)
      });
      if (brakeM.anchorOnly) {
        var compound = [];
        for (i = 0; i < pool.length; i++) {
          if (significantCount(pool[i]) >= 2) compound.push(pool[i]);
        }
        if (!compound.length) {
          blocked[best] = true;
          notes.push({ code: brakeM.ruleId, ruleId: brakeM.ruleId, muscle: best,
            volume: brakeM.volume, mav: brakeM.mav, mrv: brakeM.mrv });
          continue;
        }
        pool = compound;
      }

      // §16: рекомендація підсумку циклу — частина допоміжки цього циклу
      // відпочиває. М'яка: якщо без неї кандидатів немає, лишаємо як є; і не
      // посеред тижня — уже використана цього тижня вправа не відсіюється.
      if (rotateList.length) {
        var fresh = [];
        for (i = 0; i < pool.length; i++) {
          if (!rotateOut[pool[i].id] || weekUsed.indexOf(pool[i].id) >= 0) fresh.push(pool[i]);
        }
        if (fresh.length && fresh.length < pool.length) {
          for (i = 0; i < pool.length; i++) {
            if (fresh.indexOf(pool[i]) < 0 && rotatedAway.indexOf(pool[i].id) < 0) rotatedAway.push(pool[i].id);
          }
          pool = fresh;
        }
      }

      // §5.2: ротація допоміжки — щотижня, але НІКОЛИ посеред тижня.
      // Якщо цього тижня м'яз уже обслуговувала вправа — беремо саме її.
      var rotationLocked = false;
      if (weekUsed.length) {
        var keep = [];
        for (i = 0; i < pool.length; i++) {
          if (weekUsed.indexOf(pool[i].id) >= 0) keep.push(pool[i]);
        }
        if (keep.length) { pool = keep; rotationLocked = true; }
      }

      var ranked = rankAssistance(pool, {
        muscle: best,
        deficitNorm: dn,
        staleDays: o.staleDays,
        equipment: o.equipment,
        anchorDirect: directMap,
        // §13.3: при заданому режимі штраф −3 рахується ПО ВПРАВІ (у когось
        // перетин порожній, у когось ні), а не одним прапорцем на всю сесію.
        modeMismatch: mismatchArg
      });
      var top = null, pickEx = null, capRoom = 0;
      for (i = 0; i < ranked.length; i++) {
        var cand = index[ranked[i].exerciseId];
        var r = roomFor(cand);
        if (r >= 1) { top = ranked[i]; pickEx = cand; capRoom = r; break; }
      }
      if (!pickEx) {
        blocked[best] = true;
        notes.push({ code: "MUSCLE_SET_CAP", ruleId: "MUSCLE_SET_CAP", muscle: best, directSets: directSets[best] });
        continue;
      }

      var want = Math.round(quota[best]);
      var sets = clamp(want, ASSIST_SETS_MIN, ASSIST_SETS_MAX);
      sets = Math.min(sets, SESSION_SET_CAP - totalSets, capRoom);
      if (sets <= 0) { blocked[best] = true; continue; }

      // §14: якщо без фільтра болю вище стояла б відсіяна вправа — кажемо
      // це прямо. Той самий скоринг §5.2, ті самі входи; на вибір не впливає.
      var painSwap = null;
      if (painPool.length) {
        var pr = rankAssistance(painPool, {
          muscle: best, deficitNorm: dn, staleDays: o.staleDays, equipment: o.equipment,
          anchorDirect: directMap, modeMismatch: mismatchArg
        });
        var pTop = pr.length ? pr[0] : null;
        if (pTop && (pTop.score > top.score || (pTop.score === top.score && pTop.exerciseId < top.exerciseId))) {
          var pEx = index[pTop.exerciseId];
          var pR = avoidReasonOf(pEx, avoid);
          painSwap = {
            ruleId: "PAIN_ASSIST_SWAP", replacedId: pEx.id, replacedName: pEx.name,
            reason: pR.code, zones: pR.zones.slice(),
            text: whyPainAssistSwap(pickEx, pEx, pR), short: shortPainAssistSwap(pickEx, pEx, pR)
          };
        }
      }

      var aIt = applyPick(pickEx, sets, {
        kind: "assistance",
        forMuscle: best,
        score: top.score,
        targetRirDelta: isNum(rirDelta[best]) ? rirDelta[best] : 0,
        why: {
          ruleId: rotationLocked ? "ASSIST_ROTATION_LOCKED" : "ASSIST_PICKED",
          inputs: {
            muscle: best, score: top.score, parts: top.parts,
            target: defs[best].target, done: defs[best].done, deficit: defs[best].deficit,
            sessionsLeft: sessionsLeft, week: week
          },
          text: whyAssist(pickEx, top, defs[best], sets, {
            week: week, dayIndex: dayIndex, daysPerWeek: days, totalSets: totalSets + sets
          }),
          short: shortAssist(pickEx, top, defs[best], sets, {
            week: week, dayIndex: dayIndex, daysPerWeek: days, totalSets: totalSets + sets
          })
        }
      });
      if (painSwap) aIt.painSwap = painSwap;
    }

    // §14: підсумок фільтра — одна нота на сесію, з дисклеймером.
    if (avoid.any) {
      var hidden = 0;
      for (i = 0; i < lib.length; i++) {
        if (equipmentOk(lib[i], o.equipment) && avoidReasonOf(lib[i], avoid)) hidden++;
      }
      notes.push({
        code: "PAIN_FILTER_APPLIED", ruleId: "PAIN_FILTER_APPLIED",
        zones: avoid.zoneList.slice(), ids: avoid.idList.slice(), hidden: hidden,
        text: whyPainFilter(avoid, hidden), short: whyPainFilter(avoid, hidden)
      });
    }

    // §17: одна нота на сесію — що діє пріоритет (або чому він на паузі).
    if (prio.any) {
      notes.push(deloadNow ? {
        code: "PRIORITY_PAUSED", ruleId: "PRIORITY_MUSCLE", muscles: prio.list.slice(),
        text: whyPriorityPaused(prio.list), short: shortPriorityPaused(prio.list)
      } : {
        code: "PRIORITY_APPLIED", ruleId: "PRIORITY_MUSCLE", muscles: prio.list.slice(),
        text: whyPriorityApplied(prio.list, targets), short: shortPriorityApplied(prio.list)
      });
    }
    if (rotatedAway.length) {
      rotatedAway.sort();
      notes.push({ code: "CYCLE_ROTATE", ruleId: "CYCLE_ROTATE", ids: rotatedAway.slice() });
    }

    var zones = corridorZones(volumeDone, { volumeScale: scaleFrom(o) });

    // ---------- 3. §11.1 — фіксований порядок вправ ----------
    // Виконавець генератора не має права сортувати як завгодно: від порядку
    // залежить S_adj. Anchor'и завжди першими (ORDER_ANCHOR_FIRST) — саме
    // тому носії прогресії ніколи не отримують S_adj < 1.
    items = orderSession(items, { deficitNorm: dn, index: index });

    // ---------- 3.5 §13.5 — бюджет часу сесії ----------
    // Ніж НА ВИХОДІ: склад уже обраний §7, режим уже підмінив числа
    // (§13.0–13.4), і бюджет лише знімає сети знизу скорингу §5.2. Нового
    // проходу генератора немає — §13.5, правило 1.
    //
    // Місце вибране навмисно. ПІСЛЯ §11.1, бо порядок потрібен двічі: щоб
    // знати останню вправу («остання пауза не йде») і щоб при рівних score
    // першою здавала та, що стоїть пізніше. ДО §11.2, бо S_adj має бути
    // порахований на тому складі, який власник реально зробить, — інакше
    // вправа несла б поправку на втому від сетів, яких у сесії вже немає.
    var budget = trimToBudget(items, {
      budgetMin: o.budgetMin, mode: modeKey, index: index,
      repsTarget: o.repsTarget, mevOverride: mevMuscles, warmup: o.warmup
    });
    if (budget.setsRemoved > 0) {
      // Перенумерація §11.1: сортування детерміноване й від сетів не
      // залежить, тому порядок той самий — просто без прибраних вправ і без
      // дірок у `order`.
      items = orderSession(budget.items, { deficitNorm: dn, index: index });
      totalSets = 0;
      volume = zeroMap();
      directSets = zeroMap();
      for (i = 0; i < items.length; i++) {
        var bex = index[items[i].exerciseId] || items[i];
        totalSets += items[i].sets;
        addVolume(volume, bex, items[i].sets, volume);
        for (var bm = 0; bm < MUSCLES.length; bm++) {
          if (isDirect(bex, MUSCLES[bm])) {
            directSets[MUSCLES[bm]] = fix2(directSets[MUSCLES[bm]] + items[i].sets);
          }
        }
      }
    }
    for (i = 0; i < budget.notes.length; i++) notes.push(budget.notes[i]);

    // §13.5, «Показ до старту — обов'язковий»: оцінка тривалості видається
    // ЗАВЖДИ, разом зі списком вправ, незалежно від того, заданий бюджет чи
    // ні. Мовчазне підрізання без показу — гірше за довгу сесію.
    var duration = estimateDuration(items, {
      mode: modeKey, index: index, repsTarget: o.repsTarget, budgetMin: o.budgetMin, warmup: o.warmup
    });
    // §13.5, правило 4: перевищення бюджету — частина відповіді, а не
    // побічний ефект. `overBudget` — той самий факт, що й `over`, але
    // названий як зовнішній контракт: UI читає його, щоб сказати «бюджет
    // M хв, коротше вже нікуди — буде ≈ estMin хв». `floor` пояснює, ЧОМУ
    // перевищення сталося (зріз зупинила підлога), і заповнений лише тоді.
    var timeBudget = (budget.budgetMin === null) ? null : {
      code: budget.code, budgetMin: budget.budgetMin, budgetSec: budget.budgetSec,
      estBeforeMin: budget.estBefore.min, estBeforeSec: budget.estBefore.sec,
      estMin: duration.min, estSec: duration.sec,
      over: duration.over, overSec: duration.overSec,
      overBudget: duration.over,
      floor: budget.floor,
      setsRemoved: budget.setsRemoved,
      trims: budget.trims.slice(), removed: budget.removed.slice()
    };

    // ---------- 4. §11.2 — S_adj ----------
    // §4 (крок 9): хвиля RIR знає про стан мезоциклу — продовжений мезоцикл
    // (DELOAD_T1_SKIPPED) лишається на нижній точці, а не з'їжджає в дельоуд.
    // §13.1: хвиля RIR і нахил S_adj — теж рядки таблиці режиму. Явно
    // передані значення виграють над таблицею (точки розширення до §13).
    var rirWave = Array.isArray(o.rirWave) ? o.rirWave : (mp ? rirWaveOf(mp.mode) : undefined);
    var targetRir = isNum(o.targetRir) ? o.targetRir
      : targetRirFor(week, { rirWave: rirWave, deload: deloadNow });
    if (!isNum(targetRir)) targetRir = DEFAULT_TARGET_RIR;
    var sa = sAdjFor(items, {
      index: index, targetRir: targetRir,
      sAdjSlope: isNum(o.sAdjSlope) ? o.sAdjSlope : (mp ? mp.sAdjSlope : undefined),
      sAdjFloor: isNum(o.sAdjFloor) ? o.sAdjFloor : (mp ? mp.sAdjFloor : undefined)
    });
    var anchorRaised = [];
    for (i = 0; i < items.length; i++) {
      var row = sa.items[i];
      items[i].sAdj = row.sAdj;
      if (items[i].why) items[i].why.inputs.sAdj = row.sAdj;

      // §4 ANCHOR_NO_FAILURE — остання застава: жоден шлях (хвиля тижня,
      // явний `targetRir`, дельоуд) не має права видати anchor'у ціль RIR 0.
      var wantRir = targetRir + items[i].targetRirDelta;
      var gate = anchorRirOf(wantRir, items[i].kind === "anchor", false);
      var effRir = isNum(gate.value) ? gate.value : wantRir;
      items[i].targetRir = effRir;
      items[i].targetRirRuleId = gate.ruleId;
      if (gate.raised) {
        anchorRaised.push(items[i].exerciseId);
        if (items[i].why) {
          items[i].why.inputs.targetRir = effRir;
          items[i].why.inputs.targetRirFrom = wantRir;
        }
        notes.push({
          code: "ANCHOR_NO_FAILURE", ruleId: "ANCHOR_NO_FAILURE",
          exerciseId: items[i].exerciseId, slot: items[i].slot,
          from: wantRir, to: effRir,
          text: whyAnchorNoFailure(items[i], wantRir, effRir),
          short: shortAnchorNoFailure(items[i], wantRir, effRir)
        });
      }

      // §11.2 живе окремим полем, а не четвертим реченням у `why`: §8 задає
      // рівно три речення (факт → правило → контекст), і ламати цю форму
      // заради поправки на втому не можна.
      items[i].sAdjWhy = row.sAdj < 1 ? {
        ruleId: "INTRA_SESSION_FATIGUE",
        inputs: {
          order: row.order, A: row.A, sAdj: row.sAdj,
          slope: sa.slope, floor: sa.floor,
          targetRir: effRir
        },
        text: whySAdj(index[items[i].exerciseId] || items[i], row, effRir),
        short: shortSAdj(index[items[i].exerciseId] || items[i], row, effRir)
      } : null;
    }

    // §13.1 / §7 — цільова частота на м'яз. Це ПОБАЖАННЯ розподілу: якщо
    // схема днів його не дає, виграє схема (§7), а режим лишає ноту.
    var freq = null;
    if (mp) {
      freq = freqCheck(mp.mode, days);
      notes.push({
        code: "MODE_APPLIED", ruleId: "MODE_APPLIED", mode: mp.mode,
        volumeScale: mp.volumeScale, sAdjSlope: mp.sAdjSlope, sAdjFloor: mp.sAdjFloor,
        rirWave: mp.rirWave.slice(), restSec: mp.restSec,
        freqTargetPerMuscle: mp.freqTargetPerMuscle
      });
      // ⚑ Без `ruleId`: реєстр §12 закритий, а окремого правила під цю
      // ситуацію в ньому немає — і не має бути, бо §7 уже вирішив конфлікт
      // на користь схеми днів. Це інформаційна нота, як ANCHOR_EQUIPMENT_MISSING.
      if (!freq.ok) {
        notes.push({
          code: "MODE_FREQ_TEMPLATE_WINS",
          mode: mp.mode, target: freq.target, daysPerWeek: days,
          muscles: freq.below.slice()
        });
      }
    }

    var sessionRule = focus === "weak" ? "WEAK_POINT_DAY" : "TEMPLATE_APPLIED";
    var out = {
      ok: true,
      code: tpl.code,
      template: tpl.id,
      focus: focus,
      daysPerWeek: days,
      dayIndex: dayIndex,
      week: week,
      deload: deloadNow,
      sessionsLeft: sessionsLeft,
      anchors: anchorMap,
      items: items,
      totalSets: totalSets,
      directSets: directSets,
      volume: volume,
      targets: targets,
      deficits: defs,
      // §5.2 (відкрите питання 8) — нормований дефіцит, яким скорилась
      // допоміжка, і мапа днів без вправи, яку генератор отримав (null — не
      // передана, staleness тоді 1.0 для всіх). UI бере їх звідси, не рахує.
      deficitNorm: dn,
      staleDays: o.staleDays || null,
      zones: zones,
      quotaLeft: quota,
      notes: notes,
      // §11.2 — готова мапа для prescribeSession / algo-core §1.
      sAdj: sa.map,
      targetRir: targetRir,
      targetRirDelta: rirDelta,
      anchorRirRaised: anchorRaised,
      recovery: rec ? rec.recovery : null,
      blockedDirect: blockDirect,
      // §17 / §16 — пріоритет і відпочинок частини допоміжки (етап 10).
      priority: prio.list.slice(),
      rotatedAway: rotatedAway.slice(),
      // §13 — режим сесії. null, якщо §13 вимкнене.
      mode: modeKey,
      modeParams: mp,
      frequency: freq,
      // §13.5 — оцінка тривалості (завжди) і звіт бюджету (null, якщо
      // `budgetMin` не заданий: бюджет не застосовується).
      duration: duration,
      timeBudget: timeBudget,
      why: {
        ruleId: sessionRule,
        inputs: {
          template: tpl.id, focus: focus, week: week,
          dayIndex: dayIndex, daysPerWeek: days,
          sessionsLeft: sessionsLeft, totalSets: totalSets,
          sessionCap: SESSION_SET_CAP, muscleDirectCap: MUSCLE_DIRECT_CAP,
          mode: modeKey,
          volumeScale: scaleFrom(o),
          readySource: o.ready ? "given" : (rec ? rec.source : "default"),
          // §9.9 — знімок готовності на початок сесії.
          recovery: rec ? recoverySnapshot(rec) : null,
          targetRir: targetRir,
          deload: deloadNow,
          // §13.5 — бюджет і оцінка у входах, щоб «чому вправ менше»
          // читалось з того самого місця, що й решта причин.
          budgetMin: timeBudget ? timeBudget.budgetMin : null,
          estMin: duration.min
        },
        text: whySession(tpl, focus, dayIndex, days, week, items.length, totalSets, sessionRule, deloadNow),
        short: shortSession(tpl, focus, dayIndex, days, week, items.length, totalSets, sessionRule, deloadNow)
      }
    };
    return out;
  }

  // ---------- §17 тексти (факт → правило → контекст) ----------
  function musclesText(list) {
    var n = [];
    for (var i = 0; i < list.length; i++) n.push(nm(list[i]));
    return n.length <= 1 ? n.join("") : n.slice(0, -1).join(", ") + " і " + n[n.length - 1];
  }
  function shortPriorityItem(m, kind) {
    return kind === "anchor"
      ? cap("Пріоритет — " + nm(m) + ": основна вправа на нього, як і була, стоїть першою.")
      : cap("Пріоритет — " + nm(m) + ": ця вправа одразу після основних і з більшим обсягом за тиждень.");
  }
  function whyPriorityItem(m, tgt, kind) {
    var first = cap(nm(m)) + " — ваш пріоритетний м'яз" +
      (tgt && isNum(tgt.value) ? ": ціль тижня " + tgt.value + " " + setsWord(tgt.value) : "") + ".";
    var second = kind === "anchor"
      ? "Основні вправи завжди йдуть першими, тож ця вже на найкращому місці."
      : "Вправи на нього стоять одразу після основних: що раніше в тренуванні, то більше повторів і краще росте сила саме в цій вправі (Simão 2012, Nunes 2021).";
    var third = "Для решти м'язів тим часом мінімальний корисний обсяг — він зберігає досягнуте, а час іде на пріоритет.";
    return first + " " + second + " " + third;
  }
  function shortPriorityApplied(list) {
    return cap("Пріоритет: " + musclesText(list) + ". Їм — більше підходів і місце одразу після основних вправ; решті — мінімум, що зберігає форму.");
  }
  function whyPriorityApplied(list, targets) {
    var parts = [];
    for (var i = 0; i < list.length; i++) {
      var t = targets && targets[list[i]];
      if (t && isNum(t.value)) parts.push(nm(list[i]) + " — " + t.value + " " + setsWord(t.value) + " за тиждень");
    }
    return cap("Обрано пріоритет: " + musclesText(list) + (parts.length ? " (" + parts.join(", ") + ")" : "") + ".") +
      " Більше підходів на тиждень дає більше росту, хоч кожен наступний додає менше (Pelland 2026); тому стеля — межа відновлення, а не нескінченність." +
      " Решта м'язів на мінімальному корисному обсязі: для збереження вистачає навіть третини звичного (Bickel 2011), а ліміт часу на день не змінюється.";
  }
  function shortPriorityPaused(list) {
    return cap("Тиждень розвантаження: пріоритет (" + musclesText(list) + ") на паузі, легше для всіх.");
  }
  function whyPriorityPaused(list) {
    return cap("Пріоритет обрано: " + musclesText(list) + ".") +
      " На тижні розвантаження обсяг знижено для всіх м'язів однаково (§4)." +
      " Після розвантаження пріоритет повернеться сам.";
  }

  var TEMPLATE_TEXT = {
    full_2: "повне тіло ×2, обсяг на мінімумі корисного",
    full_3: "повне тіло ×3, обсяг трохи вище мінімуму корисного",
    upper_lower_4: "верх/низ ×2, повний робочий обсяг",
    upper_lower_weak_5: "верх/низ/верх/низ + день слабкої ланки"
  };

  function whySession(tpl, focus, dayIndex, days, week, exCount, totalSets, ruleId, deload) {
    var first = "День " + dayIndex + " з " + days + ", фокус — " +
      (focus === "full" ? "повне тіло" : focus === "upper" ? "верх" : focus === "lower" ? "низ" : "слабка ланка") + ".";
    var second = ruleId === "WEAK_POINT_DAY"
      ? "П'ятий день не має основних вправ і повністю йде на найбільшу нестачу обсягу, тому склад підібрано під неї."
      : "Схема на " + days + " " + daysWord(days) + " — " + (TEMPLATE_TEXT[tpl.id] || tpl.id) +
        ", тому основні вправи йдуть першими, а решту добирає нестача обсягу.";
    // §4: після DELOAD_T1_SKIPPED тижнів у мезоциклі більше за 5, і писати
    // «5/5» було б брехнею — тому продовження називається продовженням.
    var label = (deload === false && week > MESO_ACCUM_WEEKS)
      ? ("Тиждень " + week + ", цикл продовжено")
      : ("Тиждень " + week + "/" + DELOAD_WEEK);
    var third = label + ", " + exCount + " " + exWord(exCount) + ", " +
      totalSets + " " + setsWord(totalSets) + " (стеля " + SESSION_SET_CAP + ").";
    return cap(first + " " + second + " " + third);
  }

  function shortSession(tpl, focus, dayIndex, days, week, exCount, totalSets, ruleId, deload) {
    var what = ruleId === "WEAK_POINT_DAY"
      ? "слабка ланка"
      : (focus === "full" ? "усе тіло" : focus === "upper" ? "верх" : focus === "lower" ? "низ" : "слабка ланка");
    return cap("День " + dayIndex + " з " + days + ", " + what + ": " +
      exCount + " " + exWord(exCount) + ", " + totalSets + " " + setsWord(totalSets) +
      (deload ? ", тиждень розвантаження" : "") + ".");
  }

  // ==================================================================
  // §4 — вага дельоуду в реальній сесії (етап 3)
  // ==================================================================
  //
  //   deloadWeightFor({ working, setsReps, lastRirEff, targetRir, grid, bodyweight })
  //   → { applied, code, ruleId, working, factor, weight, reps, rirAdd, targetRir }
  //   code: OK | GRID_FLOOR | NO_WORKING | <код roundDown>
  //
  // §4, етап 4 (Bell 2025, «A Practical Approach to Deloading», SCJ 48(4)):
  // інтенсивність знижується ОДНИМ способом — «зменшення повторів за тієї
  // самої абсолютної ваги, +1–3 RIR». Тому:
  //   вага   = робоча (вага останньої НЕ-дельоудної сесії, prev.weight; UI
  //            пропускає дельоудні сесії в buildPrevMap), на сітці — вниз;
  //   запас  = ціль дельоуду (RIR 4), але не більше ніж +3 до запасу минулої
  //            сесії (DELOAD_RIR_ADD_MAX);
  //   повтори = (повтори минулої сесії + її запас) − новий запас, ≥ 1.
  //            «Повтори + запас» — це повтори до відмови з тією ж вагою; на
  //            цьому стоїть усе §1/§3, нового правила тут немає.
  // ⚑ Запас минулої сесії невідомий → береться останній тиждень хвилі (RIR 1).
  // Вправи з власною вагою (§2.1): так само — доданий вантаж лишається.
  function deloadWeightFor(opts) {
    var o = opts || {};
    var A = global.AlgoCore;
    var out = {
      applied: false, code: "OK", ruleId: "DELOAD_WEIGHT", working: null,
      factor: DELOAD_LOAD_FACTOR, weight: null, reps: null, rirAdd: null, targetRir: null
    };
    var bw = o.bodyweight === true;
    if (!isNum(o.working) || o.working < 0 || (!bw && o.working <= 0)) { out.code = "NO_WORKING"; return out; }
    out.working = o.working;
    var w = o.working * DELOAD_LOAD_FACTOR;
    var g = o.grid;
    if (!bw && g && g.kind && g.kind !== "none" && A && typeof A.roundDown === "function") {
      var r = A.roundDown(w, g);
      if (!r.ok) { out.code = r.code; return out; }
      w = r.weight;
      if (r.code === "FLOOR") out.code = "GRID_FLOOR";
    }
    out.weight = fix2(w);

    var want = isNum(o.targetRir) ? o.targetRir : DELOAD_RIR;
    var base = isNum(o.lastRirEff) ? Math.max(0, o.lastRirEff) : RIR_WAVE[MESO_ACCUM_WEEKS - 1];
    var add = clamp(want - base, 0, DELOAD_RIR_ADD_MAX);
    out.rirAdd = add;
    out.targetRir = base + add;
    var best = null;
    if (Array.isArray(o.setsReps)) {
      for (var i = 0; i < o.setsReps.length; i++) {
        if (isNum(o.setsReps[i]) && (best === null || o.setsReps[i] > best)) best = o.setsReps[i];
      }
    }
    if (best !== null) out.reps = Math.max(1, Math.round(best + base - out.targetRir));
    out.applied = true;
    return out;
  }

  // ==================================================================
  // Етап 4 — частини тренування: розминка, заминка, зарядка
  // ==================================================================
  //
  // Джерела — js/sources.js (тема «warmup», «cooldown», «recharge») і
  // docs/ALGO.md §13.7. Числа без джерела позначені ⚑.

  var WARMUP_GENERAL_MIN = 5;        // NSCA: 5–10 хв легкого кардіо, нижня межа
  var WARMUP_DRILL_SEC = 30;         // ⚑ на одну динамічну вправу
  var WARMUP_DRILLS_PER_SESSION = 4; // ⚑ скільки динамічних вправ у розминці
  var COOLDOWN_MIN = 5;              // ⚑ нижня межа звичної практики 5–15 хв (Van Hooren 2018)
  var RECHARGE_DRILLS = 6;           // ⚑ вправ у «зарядці»
  // Abad 2011: специфічна розминка 8 повт × ~50% 1ПМ, 3 × ~70%, 2 хв між підходами.
  var SPECIFIC_WARMUP = [{ reps: 8, pct: 0.5 }, { reps: 3, pct: 0.7 }];
  var SPECIFIC_WARMUP_REST_SEC = 120;

  var LOWER_MUSCLES = { quads: true, hamstrings: true, calves: true, glutes: true };
  var UPPER_MUSCLES = { chest: true, back: true, front_delt: true, side_delt: true,
    rear_delt: true, biceps: true, triceps: true };

  // Набір динамічних вправ і дозування — ⚑ наш вибір (див. «Чому так?»).
  // focus: upper | lower | full; equipment: null (нічого не треба) | "band".
  var WARMUP_DRILLS = [
    { id: "jumping-jacks", name: "Стрибки «зірочка»", dose: "20 разів", focus: "full", equipment: null },
    { id: "arm-circles", name: "Кола руками", dose: "10 вперед і 10 назад", focus: "upper", equipment: null },
    { id: "leg-swing-front", name: "Махи ногою вперед-назад", dose: "по 10 кожною ногою", focus: "lower", equipment: null },
    { id: "cat-cow", name: "Кішка-корова", dose: "10 разів", focus: "full", equipment: null },
    { id: "arm-swings", name: "Махи руками перед собою («обійми»)", dose: "10 разів", focus: "upper", equipment: null },
    { id: "bw-squat", name: "Присідання з власною вагою", dose: "10 разів", focus: "lower", equipment: null },
    { id: "inchworm", name: "Гусениця (з нахилу руками вперед і назад)", dose: "5 разів", focus: "full", equipment: null },
    { id: "band-pull-apart", name: "Розведення гумки перед грудьми", dose: "15 разів", focus: "upper", equipment: "band" },
    { id: "leg-swing-side", name: "Махи ногою в сторони", dose: "по 10 кожною ногою", focus: "lower", equipment: null },
    { id: "lunge-twist", name: "Випади з поворотом корпусу", dose: "по 5 на кожну ногу", focus: "full", equipment: null },
    { id: "scap-pushup", name: "Віджимання лопатками (від стіни чи підлоги)", dose: "10 разів", focus: "upper", equipment: null },
    { id: "glute-bridge", name: "Сідничний міст", dose: "10 разів", focus: "lower", equipment: null },
    { id: "band-dislocate", name: "Прокручування гумки над головою", dose: "10 разів", focus: "upper", equipment: "band" },
    { id: "worlds-greatest", name: "Випад з розворотом руки вгору", dose: "по 5 на кожен бік", focus: "full", equipment: null }
  ];

  // Фокус розминки за складом сесії: прямі сети на низ / верх (§7 isDirect).
  //   → "upper" | "lower" | "full"
  function sessionFocus(sessionOrItems, opts) {
    var o = opts || {};
    var idx = o.index || indexById(libraryOf(o.exercises));
    var src = itemsOf(sessionOrItems);
    var lo = 0, up = 0;
    for (var i = 0; i < src.length; i++) {
      var it = src[i] || {};
      var ex = idx[it.exerciseId] || it;
      for (var m = 0; m < MUSCLES.length; m++) {
        if (!isDirect(ex, MUSCLES[m])) continue;
        if (LOWER_MUSCLES[MUSCLES[m]]) lo++;
        if (UPPER_MUSCLES[MUSCLES[m]]) up++;
      }
    }
    if (lo > 0 && up === 0) return "lower";
    if (up > 0 && lo === 0) return "upper";
    return "full";
  }

  // Загальна розминка: 5 хв кардіо + N динамічних вправ, з чергуванням.
  //   opts: { focus, equipment: [..] | null, sessionCount, count }
  //   Чергування детерміноване: зсув на count вправ за кожну збережену сесію.
  //   equipment null = невідомо, що є, — вправи з гумкою не пропонуємо.
  function warmupPlan(opts) {
    var o = opts || {};
    var focus = (o.focus === "upper" || o.focus === "lower") ? o.focus : "full";
    var eq = Array.isArray(o.equipment) ? o.equipment : null;
    var count = (isNum(o.count) && o.count > 0) ? Math.floor(o.count) : WARMUP_DRILLS_PER_SESSION;
    var pool = [];
    for (var i = 0; i < WARMUP_DRILLS.length; i++) {
      var d = WARMUP_DRILLS[i];
      if (d.equipment !== null && !(eq && eq.indexOf(d.equipment) >= 0)) continue;
      if (focus !== "full" && d.focus !== focus && d.focus !== "full") continue;
      pool.push(d);
    }
    var n = Math.min(count, pool.length);
    var shift = (isNum(o.sessionCount) && o.sessionCount > 0) ? Math.floor(o.sessionCount) : 0;
    var start = pool.length ? (shift * count) % pool.length : 0;
    var drills = [];
    for (var j = 0; j < n; j++) {
      var p = pool[(start + j) % pool.length];
      drills.push({ id: p.id, name: p.name, dose: p.dose, focus: p.focus, equipment: p.equipment });
    }
    var sec = WARMUP_GENERAL_MIN * 60 + n * WARMUP_DRILL_SEC;
    return {
      ok: true, focus: focus, generalMin: WARMUP_GENERAL_MIN,
      drills: drills, drillSec: WARMUP_DRILL_SEC, sec: sec, min: Math.ceil(sec / 60)
    };
  }

  // Сітка вправи — так само, як у prescribeSession (equipment-рядок → масив).
  function gridOfExercise(ex, settings) {
    var A = global.AlgoCore;
    if (!A || typeof A.gridFor !== "function" || !ex) return null;
    return A.gridFor({
      equipment: (typeof ex.equipment === "string") ? [ex.equipment] : ex.equipment,
      bodyweightBase: ex.bodyweightBase,
      incrementKg: isNum(ex.incrementKg) ? ex.incrementKg : null
    }, settings);
  }

  // Специфічна розминка перед важкою вправою (Abad 2011): 8 × 50%, 3 × 70%.
  //   opts: { working, e1rm, exercise, settings, grid, bodyweight }
  //   → { ok, code: OK|BODYWEIGHT|NO_WEIGHT|NONE_LIGHTER, base: e1rm|working, sets:[{reps, weight, pct}], restSec }
  //   Відсотки — від e1RM (§0), як у джерелі від 1ПМ. ⚑ e1RM немає — від
  //   робочої ваги (виходить легше, ніж у джерелі). Підходи, не легші за
  //   робочу вагу, відкидаються; вага — вниз по сітці залу.
  function specificWarmup(opts) {
    var o = opts || {};
    var A = global.AlgoCore;
    var out = { ok: false, code: "OK", base: null, sets: [], restSec: SPECIFIC_WARMUP_REST_SEC };
    if (o.bodyweight === true) { out.code = "BODYWEIGHT"; return out; }
    if (!isNum(o.working) || o.working <= 0) { out.code = "NO_WEIGHT"; return out; }
    var useE = isNum(o.e1rm) && o.e1rm > o.working;
    var base = useE ? o.e1rm : o.working;
    out.base = useE ? "e1rm" : "working";
    var g = o.grid || gridOfExercise(o.exercise, o.settings);
    var last = null;
    for (var i = 0; i < SPECIFIC_WARMUP.length; i++) {
      var w = base * SPECIFIC_WARMUP[i].pct;
      if (g && g.kind && g.kind !== "none" && A && typeof A.roundDown === "function") {
        var r = A.roundDown(w, g);
        if (!r.ok) continue;
        w = r.weight;
      }
      w = fix2(w);
      if (w <= 0 || w >= o.working - 1e-9 || (last !== null && Math.abs(w - last) < 1e-9)) continue;
      out.sets.push({ reps: SPECIFIC_WARMUP[i].reps, weight: w, pct: SPECIFIC_WARMUP[i].pct });
      last = w;
    }
    out.ok = out.sets.length > 0;
    if (!out.ok) out.code = "NONE_LIGHTER";
    return out;
  }

  // Скільки хвилин бюджету дня з'їдають розминка й заминка і скільки лишається
  // основній частині. Розминка й заминка входять у ліміт (етап 4).
  //   opts: { parts, budgetMin } → { parts, warmupMin, cooldownMin, mainBudgetMin }
  //   mainBudgetMin: null, якщо ліміту немає; інакше ≥ 1 (trimToBudget сам
  //   скаже «коротше вже нікуди»).
  function partsPlan(opts) {
    var o = opts || {};
    var A = global.AlgoCore;
    var parts = (A && typeof A.normParts === "function") ? A.normParts(o.parts)
      : { warmup: true, main: true, cooldown: false };
    var warmMin = parts.warmup
      ? WARMUP_GENERAL_MIN + Math.ceil(WARMUP_DRILLS_PER_SESSION * WARMUP_DRILL_SEC / 60) : 0;
    var coolMin = parts.cooldown ? COOLDOWN_MIN : 0;
    var main = null;
    if (isNum(o.budgetMin) && o.budgetMin > 0) main = Math.max(1, o.budgetMin - warmMin - coolMin);
    return { parts: parts, warmupMin: warmMin, cooldownMin: coolMin, mainBudgetMin: main };
  }

  // ==================================================================
  // Етап 5 — зведення для екрана «Прогрес»
  // ==================================================================
  //
  // Нових правил і чисел алгоритму тут немає, лише збирання вже наявного:
  //   e1RM сесії   — AlgoCore.e1rmForSet (§0: n = reps + RIR_eff, n ≤ 12,
  //                  вправи з власною вагою e1RM не мають, §0.2 — для них
  //                  ряд повторів);
  //   дельоуд      — сесії розвантаження в ряд e1RM не входять (§4: вони не
  //                  рухають e1RM);
  //   обсяг тижня  — кількість ЗАПИСАНИХ робочих підходів, кожен = 1 (одиниця
  //                  обсягу §7 — сет). Не дробовий обсяг по м'язах (той — на
  //                  «Обсязі»), розминочні підходи в сесію не пишуться взагалі;
  //   тиждень циклу — normMesoState (§4);
  //   власна вага  — етап 6, §0.3: якщо людина вказала масу тіла (у сесії —
  //                  знімок на момент тренування, інакше поточна з settings) і
  //                  вправа має виміряну частку `bwLoadFrac`, точка — оцінка
  //                  максимуму навантаження «частка × (тіло + вантаж)»
  //                  (AlgoCore.bodyweightE1rmForSet). Інакше — ряд повторів.
  // UI нічого не перераховує: лише малює те, що повернула ця функція.
  // Жодного Date.now — «сьогодні» входить параметром `now`.

  var PROGRESS_WEEKS = 8;          // ⚑ інтерфейс: скільки тижнів у стовпчиках
  var PROGRESS_MAX_EXERCISES = 5;  // = кількість anchor-слотів §5
  var PROGRESS_MAX_POINTS = 12;    // ⚑ інтерфейс: останніх сесій на графіку
  var PROGRESS_MIN_SESSIONS = 2;   // з однієї точки лінії не буває

  function isoDateShift(dateStr, days) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(dateStr || ""));
    if (!m) return null;
    var t = Date.UTC(+m[1], +m[2] - 1, +m[3]) + days * 86400000;
    return new Date(t).toISOString().slice(0, 10);
  }

  function sessionOrderKey(s) {
    return String((s && s.date) || "") + "|" + String((s && s.endedAt) || "");
  }

  function progressSummary(opts) {
    var o = opts || {};
    var core = global.AlgoCore || null;
    var list = Array.isArray(o.sessions) ? o.sessions : [];
    var sessions = [];
    for (var si = 0; si < list.length; si++) {
      if (list[si] && typeof list[si] === "object" && typeof list[si].date === "string") sessions.push(list[si]);
    }
    sessions.sort(function (a, b) {
      var ka = sessionOrderKey(a), kb = sessionOrderKey(b);
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });
    var idx = o.index || indexById(o.exercises || global.EX_DB);
    var program = (o.program && typeof o.program === "object") ? o.program : {};
    var e1rmNow = (o.metrics && o.metrics.e1rm && typeof o.metrics.e1rm === "object") ? o.metrics.e1rm : {};
    var canBw = !!(core && typeof core.bodyweightE1rmForSet === "function" && typeof core.normBodyMass === "function");
    var bodyMassNow = canBw ? core.normBodyMass(o.bodyMassKg) : null;

    // ---- які вправи показувати: anchor-слоти §5, інакше найчастіші ----
    var ids = [];
    var anchorMap = normAnchors(program.anchors, idx);
    for (var ai = 0; ai < ANCHOR_SLOTS.length; ai++) {
      var aid = anchorMap[ANCHOR_SLOTS[ai].slot];
      if (aid && ids.indexOf(aid) < 0) ids.push(aid);
    }
    var source = ids.length ? "anchors" : "frequent";
    if (!ids.length) {
      var count = {}, firstAt = {}, order = 0;
      for (var fi = 0; fi < sessions.length; fi++) {
        if (sessions[fi].deload === true) continue;
        var seen = {};
        var ents = Array.isArray(sessions[fi].entries) ? sessions[fi].entries : [];
        for (var fj = 0; fj < ents.length; fj++) {
          var fid = ents[fj] && ents[fj].exerciseId;
          if (!fid || seen[fid] || !idx[fid] || !setsOf(ents[fj])) continue;
          seen[fid] = true;
          count[fid] = (count[fid] || 0) + 1;
          if (!(fid in firstAt)) firstAt[fid] = order++;
        }
      }
      ids = Object.keys(count).filter(function (k) { return count[k] >= PROGRESS_MIN_SESSIONS; });
      ids.sort(function (a, b) { return (count[b] - count[a]) || (firstAt[a] - firstAt[b]); });
      ids = ids.slice(0, PROGRESS_MAX_EXERCISES);
    }

    // ---- ряд по кожній вправі ----
    var exOut = [];
    for (var ei = 0; ei < ids.length; ei++) {
      var ex = idx[ids[ei]];
      var bw = !!(core && core.isBodyweight && core.isBodyweight(ex));
      var frac = (bw && canBw && typeof core.bwLoadFracOf === "function") ? core.bwLoadFracOf(ex) : null;
      var points = [];
      var bwPoints = [];       // §0.3: та сама хронологія, але оцінка максимуму
      var bwMassSeen = false;  // хоч одна сесія мала відому масу тіла
      for (var sj = 0; sj < sessions.length; sj++) {
        var s = sessions[sj];
        if (s.deload === true) continue;
        var en = Array.isArray(s.entries) ? s.entries : [];
        var best = null, maxW = null, repsAtMax = null, bestReps = null, bestBw = null;
        var sessMass = (frac !== null) ? (core.normBodyMass(s.bodyMassKg) || bodyMassNow) : null;
        if (sessMass !== null) bwMassSeen = true;
        for (var k = 0; k < en.length; k++) {
          if (!en[k] || en[k].exerciseId !== ex.id || !Array.isArray(en[k].sets)) continue;
          for (var q = 0; q < en[k].sets.length; q++) {
            var set = en[k].sets[q];
            if (!set || !isNum(set.reps) || set.reps < 1) continue;
            if (isNum(set.w) && (maxW === null || set.w > maxW || (set.w === maxW && set.reps > repsAtMax))) {
              maxW = set.w; repsAtMax = set.reps;
            }
            if (bestReps === null || set.reps > bestReps) bestReps = set.reps;
            if (!bw && core) {
              var r = core.e1rmForSet(set, ex);
              if (r && r.ok && (best === null || r.value > best)) best = r.value;
            }
            if (sessMass !== null) {
              var rb = core.bodyweightE1rmForSet(set, ex, sessMass);
              if (rb && rb.ok && (bestBw === null || rb.value > bestBw)) bestBw = rb.value;
            }
          }
        }
        if (bestBw !== null) bwPoints.push({ date: s.date, value: fix2(bestBw), weight: maxW, reps: repsAtMax });
        var value = bw ? bestReps : best;
        if (value === null) continue;
        points.push({ date: s.date, value: fix2(value), weight: maxW, reps: repsAtMax });
      }
      // §0.3: ряд оцінки максимуму замість повторів — лише коли він є.
      // Чому його немає — кажемо явно (bwNote), а не мовчки малюємо повтори.
      var kind = bw ? "reps" : "e1rm";
      var bwNote = null;
      if (bw) {
        if (frac === null) bwNote = "NO_BW_FRACTION";
        else if (!bwMassSeen) bwNote = "NO_BODY_MASS";
        else if (!bwPoints.length) bwNote = "HIGH_REPS";
        else { kind = "e1rm_bw"; points = bwPoints; }
      }
      if (points.length > PROGRESS_MAX_POINTS) points = points.slice(points.length - PROGRESS_MAX_POINTS);
      var first = points.length ? points[0].value : null;
      var last = points.length ? points[points.length - 1].value : null;
      var rec = e1rmNow[ex.id];
      var current = bw ? last : ((rec && isNum(rec.value) && rec.value > 0) ? fix2(rec.value) : last);
      exOut.push({
        id: ex.id,
        name: ex.name || ex.id,
        kind: kind,
        bwFrac: frac,
        bwNote: bwNote,
        points: points,
        first: first,
        last: last,
        current: current,
        currentSource: (!bw && rec && isNum(rec.value) && rec.value > 0) ? "metrics" : "sessions",
        changePct: (points.length >= PROGRESS_MIN_SESSIONS && first > 0)
          ? Math.round((last - first) / first * 1000) / 10 : null,
        min: points.length ? Math.min.apply(null, points.map(function (p) { return p.value; })) : null,
        max: points.length ? Math.max.apply(null, points.map(function (p) { return p.value; })) : null
      });
    }

    // ---- тижні: робочі підходи й тренування ----
    var refDate = (typeof o.now === "string" && /^\d{4}-\d{2}-\d{2}/.test(o.now)) ? o.now.slice(0, 10)
      : (sessions.length ? sessions[sessions.length - 1].date : null);
    var weeks = [];
    if (refDate) {
      for (var w = PROGRESS_WEEKS - 1; w >= 0; w--) {
        var key = isoWeekKey(isoDateShift(refDate, -7 * w));
        if (key && (!weeks.length || weeks[weeks.length - 1].key !== key)) {
          weeks.push({ key: key, sessions: 0, sets: 0, deloadSessions: 0, current: w === 0 });
        }
      }
    }
    var byKey = {};
    for (var wi = 0; wi < weeks.length; wi++) byKey[weeks[wi].key] = weeks[wi];
    var setsTotal = 0;
    for (var tj = 0; tj < sessions.length; tj++) {
      var ss = sessions[tj];
      var n = 0;
      var es = Array.isArray(ss.entries) ? ss.entries : [];
      for (var tk = 0; tk < es.length; tk++) n += setsOf(es[tk]);
      setsTotal += n;
      var wk = byKey[isoWeekKey(ss.date)];
      if (!wk) continue;
      wk.sessions++;
      wk.sets += n;
      if (ss.deload === true) wk.deloadSessions++;
    }
    var maxSets = 0;
    for (var mw = 0; mw < weeks.length; mw++) if (weeks[mw].sets > maxSets) maxSets = weeks[mw].sets;

    // ---- тиждень циклу (§4) ----
    var known = isNum(program.weekIndex);
    var st = normMesoState({
      mesoId: program.mesoId, week: program.weekIndex, phase: program.phase, t1Skips: program.t1Skips
    });

    return {
      ok: true,
      code: sessions.length ? "OK" : "NO_SESSIONS",
      source: source,
      exercises: exOut,
      weeks: weeks,
      maxWeekSets: maxSets,
      totals: {
        sessions: sessions.length,
        sets: setsTotal,
        thisWeekSessions: weeks.length ? weeks[weeks.length - 1].sessions : 0
      },
      cycle: {
        known: known,
        mesoId: st.mesoId,
        week: st.week,
        phase: st.phase,
        deload: st.deload,
        accumWeeks: MESO_ACCUM_WEEKS,
        extended: st.phase === "accum" && st.week > MESO_ACCUM_WEEKS
      }
    };
  }

  // ==================================================================
  // §16 — підсумок циклу і рекомендація на наступний (етап 10)
  // ==================================================================
  //
  //   cycleSummary({ sessions, exercises|index, mesoId, anchors, mode,
  //                  daysPerWeek, plateau, pain, today, priority, lastWeek,
  //                  at, backfill, applies })
  //     → { ok, code, mesoId, number, startedAt, endedAt, weeks, sessions,
  //         planned, regularity, setsDoneFrac, deloadSessions,
  //         anchors: [{ id, name, kind, first, last, pct, status }],
  //         volume: [{ muscle, avg, mev, mav, mrv, zone, priority }],
  //         plateau: [{ id, name, step }], pain: { zones, ids },
  //         end: { code, trigger, fired }, priority, next, backfill, applies }
  //
  // Функція чиста: усе з входів, жодного Date.now. Числа — з тих самих
  // правил, що й решта (§0 e1RM, §7 обсяг дробом, §10 коридор, §4 поріг
  // «росте» +0.5%). Нових формул немає; евристики позначені ⚑ біля констант.
  function cycleWeekOf(s) { return isNum(s && s.week) ? Math.max(1, Math.floor(s.week)) : 1; }

  function exerciseSessionValue(session, ex, core) {
    var bw = !!(core && core.isBodyweight && core.isBodyweight(ex));
    var best = null;
    var en = Array.isArray(session.entries) ? session.entries : [];
    for (var k = 0; k < en.length; k++) {
      if (!en[k] || en[k].exerciseId !== ex.id || !Array.isArray(en[k].sets)) continue;
      for (var q = 0; q < en[k].sets.length; q++) {
        var st = en[k].sets[q];
        if (!st || !isNum(st.reps) || st.reps < 1) continue;
        var v = null;
        if (bw) v = st.reps;
        else if (core && core.e1rmForSet) {
          var r = core.e1rmForSet(st, ex);
          if (r && r.ok) v = r.value;
        }
        if (v !== null && (best === null || v > best)) best = v;
      }
    }
    return { value: best, kind: bw ? "reps" : "e1rm" };
  }

  function cycleTrend(work, ex, core) {
    var byWeek = {}, kind = null, n = 0;
    for (var i = 0; i < work.length; i++) {
      var r = exerciseSessionValue(work[i], ex, core);
      kind = kind || r.kind;
      if (r.value === null) continue;
      n++;
      var w = cycleWeekOf(work[i]);
      if (!(w in byWeek) || r.value > byWeek[w]) byWeek[w] = r.value;
    }
    var ws = Object.keys(byWeek).map(Number).sort(function (a, b) { return a - b; });
    var first = ws.length ? byWeek[ws[0]] : null;
    var last = ws.length ? byWeek[ws[ws.length - 1]] : null;
    var pct = (ws.length >= 2 && first > 0) ? Math.round((last - first) / first * 1000) / 10 : null;
    var status = pct === null ? "unknown"
      : (pct >= CYCLE_GAIN_PCT ? "up" : (pct <= -CYCLE_GAIN_PCT ? "down" : "flat"));
    return { kind: kind || "e1rm", first: first === null ? null : fix2(first),
      last: last === null ? null : fix2(last), pct: pct, status: status, sessions: n };
  }

  var CYCLE_END_CODE = { T1: "CALENDAR", T2: "FATIGUE", T3: "PLATEAU", T4: "READINESS", T5: "VOLUME" };

  function cycleSummary(opts) {
    var o = opts || {};
    var core = global.AlgoCore || null;
    var idx = o.index || indexById(libraryOf(o.exercises));
    var meso = (typeof o.mesoId === "string" && o.mesoId) ? o.mesoId : null;
    var all = Array.isArray(o.sessions) ? o.sessions : [];
    var list = [];
    for (var i = 0; i < all.length; i++) {
      if (all[i] && typeof all[i] === "object" && all[i].mesoId === meso && typeof all[i].date === "string") list.push(all[i]);
    }
    list.sort(function (a, b) {
      var ka = sessionOrderKey(a), kb = sessionOrderKey(b);
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });
    var work = [], deloadN = 0;
    for (i = 0; i < list.length; i++) { if (list[i].deload === true) deloadN++; else work.push(list[i]); }
    if (!meso || !work.length) return { ok: false, code: "NO_SESSIONS", mesoId: meso };

    var days = clamp(isNum(o.daysPerWeek) ? Math.floor(o.daysPerWeek) : 4, MIN_DAYS, MAX_DAYS);
    var weekSet = {};
    for (i = 0; i < work.length; i++) weekSet[cycleWeekOf(work[i])] = true;
    var weekNums = Object.keys(weekSet).map(Number).sort(function (a, b) { return a - b; });
    var weeks = weekNums[weekNums.length - 1];
    var planned = days * weeks;
    var regularity = fix2(Math.min(1, work.length / planned));
    var pSum = 0, gSum = 0;
    for (i = 0; i < work.length; i++) {
      var mi = sessionMissInfo(work[i]);
      if (mi.ok) { pSum += mi.planned; gSum += mi.good; }
    }

    // ---- основні вправи: найкращий тиждень першого проти останнього ----
    var anchorMap = normAnchors(o.anchors, idx);
    var anchorIds = [];
    // Якщо anchor'и не записані (старі стани) — для кожного слота §11.1
    // беремо вправу його патерну, яку робили найчастіше за цикл (рівність → id).
    var freq = {};
    for (i = 0; i < work.length; i++) {
      var ens = Array.isArray(work[i].entries) ? work[i].entries : [];
      var once = {};
      for (var e0 = 0; e0 < ens.length; e0++) {
        var xid = ens[e0] && ens[e0].exerciseId;
        if (xid && idx[xid] && !once[xid]) { once[xid] = true; freq[xid] = (freq[xid] || 0) + 1; }
      }
    }
    for (i = 0; i < ANCHOR_SLOTS.length; i++) {
      var aid = anchorMap[ANCHOR_SLOTS[i].slot];
      if (!aid) {
        var bestN = 0;
        for (var fid in freq) {
          if (!has(freq, fid) || idx[fid].pattern !== ANCHOR_SLOTS[i].pattern) continue;
          if (freq[fid] > bestN || (freq[fid] === bestN && fid < aid)) { bestN = freq[fid]; aid = fid; }
        }
        if (bestN < ROTATE_MIN_SESSIONS) aid = null;
      }
      if (aid && anchorIds.indexOf(aid) < 0) anchorIds.push(aid);
    }
    var anchors = [];
    for (i = 0; i < anchorIds.length; i++) {
      var ex = idx[anchorIds[i]];
      var tr = cycleTrend(work, ex, core);
      if (!tr.sessions) continue;
      anchors.push({ id: ex.id, name: ex.name || ex.id, kind: tr.kind, first: tr.first, last: tr.last,
        pct: tr.pct, status: tr.status });
    }

    // ---- обсяг: середнє за тиждень проти коридору §10 ----
    var pm = priorityMap(o.priority);
    var scale = scaleFrom({ mode: o.mode });
    var sum = zeroMap();
    for (var wi = 0; wi < weekNums.length; wi++) {
      var ofWeek = [];
      for (i = 0; i < work.length; i++) if (cycleWeekOf(work[i]) === weekNums[wi]) ofWeek.push(work[i]);
      var v = normVolume(weeklyVolume(ofWeek, { index: idx }));
      for (var mm = 0; mm < MUSCLES.length; mm++) sum[MUSCLES[mm]] += v[MUSCLES[mm]];
    }
    var volume = [];
    for (mm = 0; mm < MUSCLES.length; mm++) {
      var m = MUSCLES[mm];
      var c = effCorridor(m, scale);
      var avg = fix2(sum[m] / weekNums.length);
      volume.push({
        muscle: m, avg: avg, mev: c.mev, mav: c.mav, mrv: c.mrv,
        zone: avg < c.mev ? "below" : (avg < c.mav ? "in" : (avg < c.mrv ? "high" : "top")),
        priority: pm.map[m] === true
      });
    }

    // ---- допоміжка: хто стояв на місці — кандидати на заміну ----
    var accIds = [], seen = {};
    for (i = 0; i < work.length; i++) {
      var en = Array.isArray(work[i].entries) ? work[i].entries : [];
      for (var k = 0; k < en.length; k++) {
        var eid = en[k] && en[k].exerciseId;
        if (!eid || seen[eid] || !idx[eid] || anchorIds.indexOf(eid) >= 0) continue;
        seen[eid] = true;
        accIds.push(eid);
      }
    }
    var judged = [];
    for (i = 0; i < accIds.length; i++) {
      var t2 = cycleTrend(work, idx[accIds[i]], core);
      if (t2.sessions >= ROTATE_MIN_SESSIONS) judged.push({ id: accIds[i], pct: t2.pct, status: t2.status });
    }
    var stalled = judged.filter(function (j) { return j.status === "flat" || j.status === "down"; });
    stalled.sort(function (a, b) {
      var pa = isNum(a.pct) ? a.pct : 0, pb = isNum(b.pct) ? b.pct : 0;
      return (pa - pb) || (a.id < b.id ? -1 : (a.id > b.id ? 1 : 0));
    });
    var rotateMax = Math.floor(judged.length * ROTATE_MAX_FRAC);
    var rotateOut = stalled.slice(0, rotateMax).map(function (j) { return j.id; });

    // ---- плато й біль на момент підсумку ----
    var plateau = [];
    var pl = (o.plateau && typeof o.plateau === "object") ? o.plateau : {};
    var plIds = Object.keys(pl).sort();
    for (i = 0; i < plIds.length; i++) {
      var rec = (core && core.normPlateau) ? core.normPlateau(pl[plIds[i]]) : null;
      if (rec && rec.step >= 1 && idx[plIds[i]]) plateau.push({ id: plIds[i], name: idx[plIds[i]].name || plIds[i], step: rec.step });
    }
    var av = activeAvoid(o.pain, typeof o.today === "string" ? o.today : null) || { zones: [], ids: [] };

    // ---- чим закінчився ----
    var lw = (o.lastWeek && o.lastWeek.mesoId === meso) ? o.lastWeek : null;
    var fired = (lw && Array.isArray(lw.fired)) ? lw.fired.slice() : [];
    var trigger = lw ? (lw.trigger || null) : null;
    var endCode = trigger && CYCLE_END_CODE[trigger] ? CYCLE_END_CODE[trigger] : "UNKNOWN";
    var fatigueEnd = fired.indexOf("T2") >= 0 || fired.indexOf("T4") >= 0 || fired.indexOf("T5") >= 0;

    // ---- рекомендація ----
    var known = anchors.filter(function (a) { return a.status !== "unknown"; });
    var up = known.filter(function (a) { return a.status === "up"; });
    var good = !fatigueEnd && regularity >= CYCLE_REG_GOOD &&
      known.length > 0 && up.length * 2 >= known.length;
    var rampOffset = {};
    var raised = [];
    if (good) {
