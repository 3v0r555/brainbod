      var easyRir = (window.AlgoCore && AlgoCore.C && isNum(AlgoCore.C.EASY_START_RIR))
        ? AlgoCore.C.EASY_START_RIR : 4;

      // §5 / §5.2 / обладнання (етап 2, 2026-10-06). Ці входи готувались
      // хелперами вище, але до генератора не доходили: сесія збиралась з
      // усієї бази, без anchor'ів і без чергування допоміжки.
      //   anchors   — program.anchors (anchor-lock на мезоцикл, §5);
      //   equipment — постійний набір мінус зняте на сьогодні;
      //   staleDays — дні з останнього виконання (бонус свіжості §5.2);
      //   weekUsed  — допоміжка, що вже була цього тижня (без anchor'ів):
      //               «ротація ніколи посеред тижня».
      var anchors = ensureAnchors();
      var equipment = effectiveEquipment();
      var staleDays = AlgoProgram.staleDaysMap(sessions, nowIso);
      var weekUsed = AlgoProgram.weekUsedIds(sessions, {
        weekKey: weekKey, mesoId: program.mesoId, anchors: anchors
      });

      // Етап 3, п.6: бюджет СЬОГОДНІШНЬОГО дня з розкладу — стеля, а не
      // ціль; без розкладу — settings.budgetMin, як і було.
      var dayBudget = AlgoProgram.budgetForDate(settings, new Date());
      // Етап 4: частини тренування. Розминка й заминка входять у ліміт дня,
      // основній частині лишається решта (AlgoProgram.partsPlan).
      var parts = AlgoCore.normParts(partsOverride || settings.parts);
      var pp = AlgoProgram.partsPlan({ parts: parts, budgetMin: dayBudget.budgetMin });
      var ci = cycleInputsNow();

      var session = AlgoProgram.generateSession({
        exercises: exercises, daysPerWeek: daysPerWeek, week: week, dayIndex: dayIndex,
        anchors: anchors || undefined,
        equipment: equipment || undefined,
        staleDays: staleDays, weekUsed: weekUsed,
        // §4: дельоуд — СТАН (program.phase від programAfterSession), а не
        // номер тижня; без фази поведінка стара (тиждень ≥5 = дельоуд).
        deload: program.phase === "deload" ? true : (program.phase === "accum" ? false : undefined),
        volumeDone: volumeDone, recoveryState: rec,
        mode: settings.mode || undefined,
        budgetMin: pp.mainBudgetMin !== null ? pp.mainBudgetMin : undefined,
        warmup: parts.warmup,
        targetRir: easyStart ? easyRir : undefined,
        // Етап 8, §14: позначки «болить» / «не пропонувати», що діють сьогодні.
        avoid: currentAvoid() || undefined,
        // Етап 10, §16/§17: пріоритетний м'яз і рекомендація підсумку циклу.
        priority: ci.priority, rotateOut: ci.rotateOut, rampOffset: ci.rampOffset
      });
      if (!session || !session.ok) {
        return { ok: false, error: "Не вдалось згенерувати сесію." };
      }
      // §4: тиждень розвантаження — від генератора (фаза програми).
      var isDeload = session.deload === true;

      // §13.5: TIME_BUDGET_TRIM/OVER/FLOOR несуть готовий short+text §8 —
      // беремо їх з session.notes дослівно, не переписуємо.
      var timeBudgetNoteText = null;
      var timeBudgetNote = null;
      if (Array.isArray(session.notes)) {
        for (var ni = 0; ni < session.notes.length; ni++) {
          var note = session.notes[ni];
          if (note && (note.code === "TIME_BUDGET_TRIM" || note.code === "TIME_BUDGET_OVER" ||
              note.code === "TIME_BUDGET_FLOOR")) {
            timeBudgetNoteText = note.text;
            timeBudgetNote = note;
          }
        }
      }

      var trust = isNum(calibration.trust) ? calibration.trust : 0;
      var e1rm = {};
      if (metrics.e1rm) {
        for (var k in metrics.e1rm) {
          if (metrics.e1rm.hasOwnProperty(k) && metrics.e1rm[k] && isNum(metrics.e1rm[k].value)) {
            e1rm[k] = metrics.e1rm[k].value;
          }
        }
      }
      var prev = buildPrevMap(sessions, idx);

      // Етап 3: драбина плато (§6) у реальному циклі і prev у тому діапазоні,
      // який стоїть СЬОГОДНІ (effRange режиму або зсув щабля 2). Діапазон
      // змінився між сесіями → вага перераховується відношенням %1RM (§1) при
      // тому самому RIR, повтори — з нижньої межі.
      var plateauOf = {}, rangeAdj = {};
      var itemsForPresc = session.items.map(function (it) {
        var ex = idx[it.exerciseId] || {};
        var range = it.repRange || ex.repRange || null;
        var grid = AlgoCore.gridFor({
          equipment: (typeof ex.equipment === "string") ? [ex.equipment] : ex.equipment,
          bodyweightBase: ex.bodyweightBase, incrementKg: ex.incrementKg
        }, settings);
        var pv = prev[it.exerciseId] || null;
        var pp = null;
        if (!isDeload) {
          var rec = AlgoCore.plateauFrom(metrics, it.exerciseId);
          if (rec.step >= 1) {
            var isAnchor = it.kind === "anchor";
            pp = AlgoCore.plateauPrescribe(rec, {
              repRange: range, targetRir: session.targetRir, isAnchor: isAnchor,
              exercise: ex, weight: pv ? pv.weight : undefined, grid: grid
            });
            pp.isAnchor = isAnchor;
            pp.stepWeeks = rec.stepWeeks;
            // −10% щабля 3 — один раз, на вході; далі звичайна прогресія від
            // зниженої ваги (інакше кожна сесія різала б ще на 10%).
            pp.applyWeight = pp.action === "tech_variation" && !(pv && pv.plateauStep === 3);
            // Ретест 95% щабля 4 — один раз: anchor — після дельоуду (тиждень
            // на щаблі вже минув), допоміжка — одразу (дельоуд за неї не
            // форсується).
            pp.applyRetest = pp.action === "deload" && (isAnchor ? rec.stepWeeks >= 1 : true) &&
              !(pv && pv.retest);
            plateauOf[it.exerciseId] = pp;
          }
        }
        var eff = (pp && pp.action === "range_shift" && pp.applies && Array.isArray(pp.range)) ? pp.range : range;
        if (pv && Array.isArray(eff)) {
          var changed = !isDeload && Array.isArray(pv.planRange) &&
            (pv.planRange[0] !== eff[0] || pv.planRange[1] !== eff[1]);
          if (changed) {
            var rirC = isNum(session.targetRir) ? session.targetRir : 2;
            var f0 = AlgoCore.pct1rm(pv.planRange[0] + rirC), f1 = AlgoCore.pct1rm(eff[0] + rirC);
            var wAdj = null;
            if (isNum(pv.weight)) {
              if (AlgoCore.isBodyweight(ex)) wAdj = pv.weight;
              else if (isNum(f0) && isNum(f1) && f0 > 0) {
                var rr = AlgoCore.roundDown(pv.weight * f1 / f0, grid);
                wAdj = rr.ok ? rr.weight : null;
              }
            }
            rangeAdj[it.exerciseId] = { from: pv.planRange.slice(), to: eff.slice(), weight: wAdj };
            delete prev[it.exerciseId];
          } else {
            var np = {};
            for (var kq in pv) if (pv.hasOwnProperty(kq)) np[kq] = pv[kq];
            np.repsMin = eff[0];
            np.repsMax = eff[1];
            prev[it.exerciseId] = np;
          }
        }
        if (eff === range) return it;
        var cp = {};
        for (var kc in it) if (it.hasOwnProperty(kc)) cp[kc] = it[kc];
        cp.repRange = eff.slice();
        return cp;
      });

      var presc = AlgoProgram.prescribeSession({ items: itemsForPresc, sAdj: session.sAdj }, {
        exercises: exercises, e1rm: e1rm, trust: trust, targetRir: session.targetRir,
        settings: settings, prev: prev, sAdj: session.sAdj,
        deload: isDeload
      });

      var items = session.items.map(function (it, i) {
        var ex = idx[it.exerciseId] || {};
        var pItem = presc.ok ? presc.items[i] : null;
        var pr = pItem ? pItem.prescription : null;
        var range = (itemsForPresc[i] && itemsForPresc[i].repRange) || it.repRange || ex.repRange || [8, 12];
        var incrementKg = isNum(ex.incrementKg) ? ex.incrementKg : 2.5;
        var setsCount = isNum(it.sets) ? it.sets : 3;
        var pl = plateauOf[it.exerciseId] || null;
        var adj = rangeAdj[it.exerciseId] || null;
        var wPlan = (pr && isNum(pr.weight)) ? pr.weight : null;
        var repsPlan = (pr && isNum(pr.repsTarget)) ? pr.repsTarget : range[0];
        if (adj) {
          if (isNum(adj.weight)) wPlan = adj.weight;
          repsPlan = range[0];
        }
        if (pl && pl.applyWeight && isNum(pl.weight)) wPlan = pl.weight;
        if (pl && pl.applyRetest && isNum(pl.retestWeight)) {
          wPlan = (wPlan === null) ? pl.retestWeight : Math.min(wPlan, pl.retestWeight);
        }
        if (pl && pl.action === "add_set" && isNum(pl.addSets)) setsCount += pl.addSets;
        var setsLog = [];
        for (var s = 0; s < setsCount; s++) {
          setsLog.push({
            w: wPlan,
            reps: repsPlan,
            rir: (pItem && pItem.deload && isNum(pItem.deload.targetRir)) ? pItem.deload.targetRir
              : (isNum(session.targetRir) ? session.targetRir : 2),
            done: false
          });
        }
        return {
          exerciseId: it.exerciseId,
          name: ex.name || it.exerciseId,
          cues: Array.isArray(ex.cues) ? ex.cues : [],
          incrementKg: incrementKg,
          repRange: range,
          kind: it.kind || null,          // "anchor" | "assistance" — §5/§5.2
          // Етап 4: специфічна розминка (Abad 2011) — лише перед anchor'ом.
          warmupSets: (it.kind === "anchor") ? AlgoProgram.specificWarmup({
            working: wPlan, e1rm: (e1rm && isNum(e1rm[it.exerciseId])) ? e1rm[it.exerciseId] : null,
            exercise: ex, settings: settings, bodyweight: AlgoCore.isBodyweight(ex)
          }) : null,
          slot: it.slot || null,          // anchor-слот (тільки для kind==="anchor")
          // §2.1: власна вага — вага-поле означає тільки додатковий вантаж.
          // Беремо AlgoCore.isBodyweight(ex) як джерело істини, а не it/ex
          // напряму: резервне розпізнавання за обладнанням теж має спрацювати.
          bodyweightBase: (window.AlgoCore && typeof AlgoCore.isBodyweight === "function")
            ? AlgoCore.isBodyweight(ex) : !!(it.bodyweightBase || ex.bodyweightBase),
          pattern: it.pattern || null,
          mainMuscle: it.mainMuscle || null,
          // Блок "Що працює" на екрані деталі — повний розклад внеску по
          // м'язах, не лише mainMuscle. Той самий трюк, що й з `why`:
          // не переписане тут поле до екрана просто не доїде.
          contrib: (ex.contrib && typeof ex.contrib === "object") ? ex.contrib : null,
          timeTrim: it.timeTrim || null,   // §13.5: зрізано бюджетом часу
          // §13.1/§13.5: пауза між сетами саме цієї вправи (anchor /
          // компаунд / ізоляція × режим). Раніше таймер брав одне число на
          // всі вправи, і воно розходилось з оцінкою тривалості.
          restSec: restForItem(it, ex, settings),
          // §8: пояснення прескрипції приходить готовим від generateSession
          // (факт → правило → контекст, рівно 3 речення). Тут його треба саме
          // перенести: цей map будує НОВИЙ об'єкт, і все, що не переписане
          // явно, для екрана просто не існує — так `why` і губився.
          why: it.why || null,
          // §13.1: окреме поле, окремий рядок на екрані — щоб не додавати
          // четверте речення в `why` і не ламати §8.
          modeWhy: it.modeWhy || null,
          // Етап 8, §14: заміна через біль / «не пропонувати» з коротким «чому».
          painSwap: it.painSwap || null,
          // Етап 10, §17: вправа на пріоритетний м'яз.
          priority: it.priority === true,
          priorityWhy: it.priorityWhy || null,
          // Етап 3: дельоуд (§4) — що зроблено з вагою; план — для запису
          // в сесію (частка невиконаного, §6 / fatigueIndex).
          deload: (pItem && pItem.deload) ? pItem.deload : null,
          planSets: setsCount,
          planRir: (pItem && pItem.deload && isNum(pItem.deload.targetRir)) ? pItem.deload.targetRir
            : (isNum(session.targetRir) ? session.targetRir : 2),
          planWeight: wPlan,
          plateau: pl ? {
            step: pl.step, action: pl.action, applies: pl.applies, isAnchor: pl.isAnchor,
            range: pl.range, rangeFrom: pl.rangeFrom, addSets: pl.addSets,
            applyWeight: !!pl.applyWeight, applyRetest: !!pl.applyRetest,
            stepWeeks: pl.stepWeeks
          } : null,
          rangeChange: adj ? { from: adj.from, to: adj.to } : null,
          sets: setsLog
        };
      });

      // §3, джерело 1: AMRAP-проба на останньому сеті однієї anchor-вправи.
      var probe = (program.phase === "deload" || isDeload) ? null : pickProbe(items, sessions, calibration, nowIso);
      if (probe) {
        items[probe.itemIdx].probe = probe;
        items[probe.itemIdx].sets[probe.setIdx].rir = 0;
        items[probe.itemIdx].sets[probe.setIdx].amrap = true;
      }

      // Етап 9, §15: останній підхід «N+». Рішення — AlgoProgram.amrapPlusPlan
      // (алгоритм), тут лише переносимо його в стан екрана.
      if (typeof AlgoProgram.amrapPlusPlan === "function") {
        items.forEach(function (item) {
          var last = item.sets.length ? item.sets[item.sets.length - 1] : null;
          var ap = AlgoProgram.amrapPlusPlan({
            kind: item.kind, exercise: idx[item.exerciseId] || {},
            repsTarget: last ? last.reps : null, targetRir: item.planRir,
            sets: item.sets.length, deload: isDeload || !!item.deload,
            easyStart: !!easyStart, hasProbe: !!item.probe,
            retest: !!(item.plateau && item.plateau.applyRetest)
          });
          if (!ap.applies) return;
          item.amrapPlus = { minReps: ap.minReps, stopRir: ap.stopRir, setIdx: ap.setIdx, why: ap.why };
          item.sets[ap.setIdx].amrapPlus = true;
          item.sets[ap.setIdx].rir = ap.stopRir;
        });
      }

      // §5.2 скоринг для swap: нормований дефіцит по м'язах на момент старту
      // сесії. generateSession віддає рівно ту мапу, якою скорив допоміжку
      // сам (session.deficitNorm) — UI її лише читає (відкрите питання 8).
      var deficitNorm = (session.deficitNorm && typeof session.deficitNorm === "object")
        ? session.deficitNorm : {};

      return {
        ok: true,
        finished: false,
        items: items,
        cursor: 0,
        startedAt: nowIso,
        mesoId: program.mesoId || null,
        week: week,
        dayIndex: dayIndex,
        readiness: (isNum(readiness) ? readiness : null),
        restSeconds: isNum(settings.restDefault) ? settings.restDefault : 120,
        restEndTs: null,
        deficitNorm: deficitNorm,
        // §13.5: показ тривалості до старту — обов'язковий, звідси й беремо.
        duration: session.duration || null,
        timeBudget: session.timeBudget || null,
        dayBudget: dayBudget,
        timeBudgetNoteText: timeBudgetNoteText,
        timeBudgetNote: timeBudgetNote,
        // §8: пояснення дня — короткий рядок для людини + технічний текст
        // під «докладніше». Раніше рахувалось алгоритмом і губилось тут.
        sessionWhy: session.why || null,
        // Етап 8, §14: підсумок фільтра болю і пропущені основні рухи.
        painNotes: (session.notes || []).filter(function (n) {
          return n && (n.ruleId === "PAIN_FILTER_APPLIED" || n.ruleId === "PAIN_ANCHOR_SKIPPED");
        }).map(function (n) { return { ruleId: n.ruleId, short: n.short, text: n.text }; }),
        // Етап 10, §17: нота про пріоритет (діє / на паузі в розвантаження).
        priorityNote: (session.notes || []).filter(function (n) {
          return n && (n.code === "PRIORITY_APPLIED" || n.code === "PRIORITY_PAUSED");
        }).map(function (n) { return { code: n.code, ruleId: n.ruleId, short: n.short, text: n.text }; })[0] || null,
        // Крок 14: обидва поля треба саме ПЕРЕНЕСТИ — цей об'єкт будується
        // з нуля, і все, чого тут немає, для екрана не існує (так уже губились
        // `why`, `sessionWhy`, `bodyweightBase`).
        easyStart: easyStart,
        easyStartRir: easyStart ? easyRir : null,
        deload: isDeload,
        // Етап 4: частини тренування й розминка дня (стан — у чернетці).
        parts: parts,
        partsPlan: pp,
        warmup: AlgoProgram.warmupPlan({
          focus: AlgoProgram.sessionFocus(session, { exercises: exercises }),
          equipment: equipment, sessionCount: sessions.length
        }),
        cooldownMin: AlgoProgram.C.COOLDOWN_MIN
      };
    } catch (e) {
      return { ok: false, error: "Помилка побудови сесії: " + (e && e.message ? e.message : String(e)) };
    }
  }

  // §3, джерело 1: «раз на 7–10 днів, останній сет ОДНІЄЇ anchor-вправи —
  // зроби максимум». Прогноз pred = reps_target + RIR_reported береться з
  // попередньої сесії цієї вправи, тому проба ставиться лише там, де
  // сьогоднішня вага збігається з вагою того сету: на іншій вазі прогноз
  // нічого не прогнозує. Збігу немає — сьогодні без проби, probeDue
  // лишиться «overdue» і спробуємо наступного разу. На порожній історії
  // прогнозу немає взагалі.
  function pickProbe(items, sessions, calibration, nowIso) {
    try {
      if (!window.AlgoCore || typeof AlgoCore.probeDue !== "function") return null;
      if (!sessions || !sessions.length) return null;
      var probes = (calibration && Array.isArray(calibration.probes)) ? calibration.probes : [];
      var last = probes.length ? probes[probes.length - 1] : null;
      if (last && typeof last.date === "string") {
        var days = (Date.parse(nowIso) - Date.parse(last.date)) / 86400000;
        var due = AlgoCore.probeDue(days);
        if (due !== "due" && due !== "overdue") return null;
      }
      for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.kind !== "anchor" || !it.sets.length) continue;
        var lastSet = it.sets[it.sets.length - 1];
        var prevSet = lastLoggedSet(sessions, it.exerciseId);
        if (!prevSet || !isNum(lastSet.w)) continue;
        if (Math.abs(prevSet.w - lastSet.w) > 1e-6) continue;
        return {
          itemIdx: i, setIdx: it.sets.length - 1,
          repsTarget: prevSet.reps, reportedRir: prevSet.rirReported, weight: prevSet.w
        };
      }
      return null;
    } catch (e) { return null; }
  }

  // Останній звичайний (не проба) сет вправи в історії, з повторами,
  // заявленим RIR і вагою.
  function lastLoggedSet(sessions, exId) {
    for (var i = sessions.length - 1; i >= 0; i--) {
      var s = sessions[i];
      if (!s || !Array.isArray(s.entries)) continue;
      for (var j = 0; j < s.entries.length; j++) {
        var e = s.entries[j];
        if (!e || e.exerciseId !== exId || !Array.isArray(e.sets)) continue;
        for (var k = e.sets.length - 1; k >= 0; k--) {
          var st = e.sets[k];
          if (st && !st.isAmrapProbe && isNum(st.reps) && st.reps > 0 &&
              isNum(st.rirReported) && isNum(st.w)) return st;
        }
      }
    }
    return null;
  }

  // §3, джерело 3: шум самозвіту = частка стрибків e1RM >7% між сусідніми
  // сесіями при тій самій вазі (noiseFromInfo). Ряди — по anchor-вправах:
  // перший звичайний сет кожної сесії.
  function probeNoise(sessions, idx) {
    try {
      var program = Store.getSection("program") || {};
      var an = program.anchors || {};
      var ids = Array.isArray(an) ? an.slice() : Object.keys(an).map(function (k) { return an[k]; });
      var series = ids.map(function (id) {
        var ex = idx[id];
        var row = [];
        if (!ex) return row;
        sessions.forEach(function (s) {
          (s && Array.isArray(s.entries) ? s.entries : []).forEach(function (e) {
            if (!e || e.exerciseId !== id || !Array.isArray(e.sets)) return;
            var first = null;
            for (var k = 0; k < e.sets.length; k++) {
              if (e.sets[k] && !e.sets[k].isAmrapProbe) { first = e.sets[k]; break; }
            }
            if (!first) return;
            var r = AlgoCore.e1rmForSet(first, ex);
            if (r.ok) row.push({ w: first.w, e1rm: r.value });
          });
        });
        return row;
      });
      return series.length ? AlgoCore.noiseFromInfo(series).value : 0;
    } catch (e) { return 0; }
  }

  // Після збереження сесії (етап 2): програма (§4), калібрування (§3),
  // e1RM (§0), рівень (§3.1). Кожен запис окремо в try/catch: сесія вже
  // збережена, і падіння похідного оновлення не має ні відкотити її, ні
  // заблокувати вихід з тренування.
  // Етап 3: порядок — e1RM (§0) → облік плато (§2/§6) → тижневий такт плато
  // → програма (§4, з форсованим T2 від щабля 4) → калібрування (§3).
  function afterSessionSaved(session, probe) {
    var lib = getExerciseLibrary();
    var idx = exIndexOf(lib);
    var sessions = (Store.getSessions && Store.getSessions()) || [];
    var settings = getSettings();
    var program0 = Store.getSection("program") || {};
    var days = isNum(program0.daysPerWeek) ? program0.daysPerWeek
      : (isNum(settings.daysPerWeek) ? settings.daysPerWeek : 4);
    try {
      var metricsE = Store.getSection("metrics") || {};
      // ⚑ Дельоудна сесія тренд e1RM не рухає (ALGO §4, етап 3).
      var mE = (session.deload === true) ? null
        : AlgoCore.sessionE1rm(metricsE.e1rm, session, { index: idx, at: session.endedAt });
      if (mE && mE.updated && mE.updated.length) {
        metricsE.e1rm = mE.e1rm;
        Store.setSection("metrics", metricsE);
      }
    } catch (e) { /* e1RM лишається попереднім */ }
    var forcedT2 = false;
    try {
      forcedT2 = plateauAfterSession(session, program0, days, idx);
    } catch (e) { /* лічильники плато лишаються попередніми */ }
    try {
      var r = AlgoProgram.programAfterSession(program0, {
        session: session, sessions: sessions, daysPerWeek: days, index: idx,
        mode: settings.mode || undefined, forcedT2: forcedT2,
        // Етап 10, §16: для підсумку циклу (пишеться на початку розвантаження).
        plateau: (Store.getSection("metrics") || {}).plateau,
        pain: getPain(), today: localDay(),
        priority: AlgoProgram.normPriority(settings.priorityMuscles)
      });
      if (r && r.ok) Store.setSection("program", r.program);
    } catch (e) { /* програма лишається на місці — наступна сесія та сама */ }
    try {
      var cal = Store.getSection("calibration") || {};
      var changed = false;
      if (probe) {
        var pr = AlgoCore.applyProbe(cal, probe, { noise: probeNoise(sessions, idx) });
        if (pr && pr.ok) { cal = pr.calibration; changed = true; }
      }
      // ⚑ Евристика (етап 3): сети дельоуду (RIR 4) не калібрують самозвіт —
      // далеко від відмови оцінка RIR найменш точна (Halperin 2022,
      // Zourdos 2021; «Джерела чисел»).
      var d = (session.deload === true) ? null : AlgoCore.sessionDropOff(cal, session);
      if (d && d.changed) { cal = d.calibration; changed = true; }
      if (changed) {
        Store.setSection("calibration", cal);
        var lvl = AlgoCore.experienceFromCalibration(cal);
        if (lvl && lvl.level && lvl.level !== settings.experience) saveSettingsPatch({ experience: lvl.level });
      }
    } catch (e) { /* калібрування лишається попереднім */ }
  }

  // Етап 3: облік плато після сесії + тижневий такт (§6.1) у кінці тижня.
  // Повертає true, якщо anchor цього тижня став на щабель 4 → форсований T2.
  //   metrics.plateauEnteredWeek[id] = "mesoId:тиждень", коли вправа стала на
  //   (новий) щабель. ⚑ Тиждень входу не рахується тижнем на щаблі: інакше
  //   щабель, отриманий у п'ятницю, «прожив би тиждень» за один день.
  function plateauAfterSession(session, program, days, idx) {
    var metrics = Store.getSection("metrics") || {};
    var e1 = {};
    var me = metrics.e1rm || {};
    for (var k in me) if (me.hasOwnProperty(k) && me[k] && isNum(me[k].value)) e1[k] = me[k].value;
    var res = AlgoCore.sessionPlateau(metrics, session, { index: idx, e1rm: e1 });
    var m = res.metrics || metrics;
    var tag = String(session.mesoId || program.mesoId || "") + ":" +
      String(isNum(session.week) ? session.week : (program.weekIndex || 1));
    var entered = {};
    var src = (m.plateauEnteredWeek && typeof m.plateauEnteredWeek === "object") ? m.plateauEnteredWeek : {};
    for (var ek in src) if (src.hasOwnProperty(ek)) entered[ek] = src[ek];
    (res.results || []).forEach(function (r) { if (r.entered) entered[r.exerciseId] = tag; });

    var anchors = program.anchors || {};
    var anchorIds = Array.isArray(anchors) ? anchors.slice()
      : Object.keys(anchors).map(function (s) { return anchors[s]; });
    var forced = false;
    var day = isNum(program.dayIndex) ? program.dayIndex : 1;
    var weekEnding = day >= days;
    if (weekEnding && program.phase !== "deload" && session.deload !== true) {
      var map = m.plateau || {};
      Object.keys(map).forEach(function (id) {
        var rec = AlgoCore.normPlateau(map[id]);
        if (rec.step === 0) return;
        if (entered[id] !== tag) {
          // «Щабель дав» = за тиждень не лишилось ні застою, ні повзучості,
          // ні промахів (⚑ евристика: §6 не каже, чим міряти тиждень).
          var wk = AlgoCore.plateauWeek(rec, {
            progressed: rec.streak === 0 && rec.repsCreep === 0 && rec.miss === 0
          });
          m = AlgoCore.plateauInto(m, id, wk.record);
          if (wk.advanced) entered[id] = tag;
          rec = wk.record;
        }
        if (rec.step === 4 && entered[id] === tag && anchorIds.indexOf(id) >= 0) forced = true;
      });
    }
    m.plateauEnteredWeek = entered;
    Store.setSection("metrics", m);
    return forced;
  }

  // §13.1: пауза — з таблиці MODE.restSec за роллю вправи (generateSession
  // кладе її в item.restSec, коли режим заданий). Режим не обрано → той самий
  // MODE_DEFAULT (hyb), яким рахується оцінка тривалості (restSource
  // "default"), — інакше таймер і «≈ N хв» розходились би. settings.restDefault
  // — лише запасний вихід, якщо алгоритм числа не дав.
  // Етап 3: нотатки плану на картці вправи — людськими словами, без номерів
  // параграфів алгоритму.
  function planNotesOf(item) {
    var out = [];
    var pl = item && item.plateau;
    if (pl) {
      if (pl.action === "add_set") {
        out.push("Прогрес на цій вправі застиг — додано один підхід. Якщо за два тижні не зрушить, спробуємо інший спосіб.");
      } else if (pl.action === "range_shift" && pl.applies && pl.range && pl.rangeFrom) {
        out.push("Прогрес застиг — тимчасово інший діапазон повторів: " + pl.range[0] + "–" + pl.range[1] +
          " замість " + pl.rangeFrom[0] + "–" + pl.rangeFrom[1] + ".");
      } else if (pl.action === "tech_variation") {
        out.push("Прогрес застиг — " + (pl.applyWeight ? "вага на 10% менша, зате " : "") +
          "кожне повторення з паузою 2 с у нижній точці або з повільним опусканням (3 с вниз, 1 с угору).");
      } else if (pl.action === "deload") {
        if (pl.applyRetest) {
          out.push((pl.isAnchor ? "Після розвантаження — перевірка: " : "Перевірка: ") +
            "вага 95% від тієї, на якій застряг. Якщо повтори підуть угору — застій позаду.");
        } else if (pl.isAnchor && !pl.stepWeeks) {
          out.push("Прогрес застиг надовго — наступний тиждень буде тижнем розвантаження.");
        }
      } else if (pl.action === "swap_anchor") {
        out.push("Прогрес на цій вправі стоїть давно, і інші способи вже спробувані — варто замінити її схожою вправою.");
      }
    }
    var rc = item && item.rangeChange;
    if (rc && rc.from && rc.to) {
      out.push("Діапазон повторів змінився (" + rc.from[0] + "–" + rc.from[1] + " → " + rc.to[0] + "–" +
        rc.to[1] + "), тож вагу перераховано під нові повтори.");
    }
    var d = item && item.deload;
    if (d) {
      if (d.applied) {
        out.push("Тиждень розвантаження: вага та сама, що й зазвичай, але повторів менше — запас " +
          (isNum(d.rirAdd) && d.rirAdd > 0 ? "більший на " + d.rirAdd : "більший") +
          ", а підходів удвічі менше. Це відновлення, а не перевірка сили.");
      } else {
        out.push("Тиждень розвантаження: менше підходів і більший запас повторів.");
      }
    }
    return out;
  }

  function restForItem(it, ex, settings) {
    if (it && isNum(it.restSec)) return it.restSec;
    try {
      var role = (it && it.role) || AlgoProgram.roleOf(it, ex);
      var mode = (AlgoProgram.C && AlgoProgram.C.MODE_DEFAULT) || "hyb";
      var r = AlgoProgram.restSecOf(mode, role);
      if (isNum(r)) return r;
    } catch (e) { /* нижче — запасне число */ }
    return (settings && isNum(settings.restDefault)) ? settings.restDefault : 120;
  }

  function stepperRow(label, value, fmt, onDec, onInc) {
    var row = document.createElement("div");
    row.className = "stepper";
    row.style.justifyContent = "space-between";
    row.style.marginBottom = "var(--space-2)";

    var lab = document.createElement("span");
    lab.className = "text-dim";
    lab.textContent = label;
    row.appendChild(lab);

    var wrap = document.createElement("div");
    wrap.className = "stepper";

    var dec = document.createElement("button");
    dec.type = "button";
    dec.className = "stepper-btn";
    dec.textContent = "−";
    dec.addEventListener("click", onDec);

    var val = document.createElement("span");
    val.className = "stepper-value";
    val.textContent = fmt(value);

    var inc = document.createElement("button");
    inc.type = "button";
    inc.className = "stepper-btn";
    inc.textContent = "+";
    inc.addEventListener("click", onInc);

    wrap.appendChild(dec);
    wrap.appendChild(val);
    wrap.appendChild(inc);
    row.appendChild(wrap);
    return { row: row, valEl: val };
  }

  function renderRestTimer(container) {
    if (!workoutState || !workoutState.restEndTs) return;
    var remaining = Math.max(0, Math.round((workoutState.restEndTs - Date.now()) / 1000));
    var total = isNum(workoutState.restTotalS) && workoutState.restTotalS > 0
      ? workoutState.restTotalS : Math.max(remaining, 1);
    var bar = document.createElement("div");
    bar.className = "rest-dock";
    bar.setAttribute("role", "timer");

    var R = 26, CIRC = 2 * Math.PI * R;
    var ring = svgEl("svg", { viewBox: "0 0 64 64", "class": "rest-ring", "aria-hidden": "true" });
    ring.appendChild(svgEl("circle", { cx: 32, cy: 32, r: R, "class": "rest-ring-bg" }));
    var arc = svgEl("circle", { cx: 32, cy: 32, r: R, "class": "rest-ring-fg",
      "stroke-dasharray": CIRC.toFixed(1), transform: "rotate(-90 32 32)" });
    ring.appendChild(arc);
    bar.appendChild(ring);

    var mid = document.createElement("div");
    mid.className = "rest-mid";
    var cap = document.createElement("p");
    cap.className = "rest-cap";
    cap.textContent = "Пауза " + mmss(total);
    var label = document.createElement("p");
    label.className = "rest-time num";
    mid.appendChild(cap);
    mid.appendChild(label);
    bar.appendChild(mid);

    function paint(rem) {
      label.textContent = mmss(rem);
      arc.setAttribute("stroke-dashoffset", (CIRC * (1 - Math.min(1, rem / total))).toFixed(1));
    }
    paint(remaining);

    var plus = document.createElement("button");
    plus.type = "button";
    plus.className = "btn btn-secondary rest-btn";
    plus.textContent = "+15 с";
    plus.addEventListener("click", function () {
      workoutState.restEndTs += 15000;
      workoutState.restTotalS = total + 15;
      persistDraft();
      renderScreen("workout");
    });
    bar.appendChild(plus);

    var skip = document.createElement("button");
    skip.type = "button";
    skip.className = "btn btn-secondary rest-btn";
    skip.textContent = "Пропустити";
    skip.addEventListener("click", function () {
      workoutState.restEndTs = null;
      persistDraft();
      renderScreen("workout");
    });
    bar.appendChild(skip);
    container.appendChild(bar);

    // Тік оновлює лише число й кільце, а не весь екран: інакше щосекунди
    // закривалась би нижня панель «Чому так?» і збивалось поле вводу.
    var my = ++restTick;
    function tick() {
      if (my !== restTick || !workoutState || !workoutState.restEndTs) return;
      if (bar.isConnected === false) return;
      var rem = Math.max(0, Math.round((workoutState.restEndTs - Date.now()) / 1000));
      if (rem <= 0) {
        workoutState.restEndTs = null;
        persistDraft();
        renderScreen("workout");
        return;
      }
      paint(rem);
      setTimeout(tick, 1000);
    }
    if (remaining > 0) setTimeout(tick, 1000);
    else workoutState.restEndTs = null;
  }

  function mmss(sec) {
    sec = Math.max(0, Math.round(sec));
    return Math.floor(sec / 60) + ":" + (sec % 60 < 10 ? "0" : "") + (sec % 60);
  }

  function computeRirEff(rirReported, calibration) {
    var bias = (calibration && isNum(calibration.rirBias)) ? calibration.rirBias : 0;
    var v = rirReported + bias;
    return Math.max(0, Math.min(6, v));
  }

  function finishWorkout() {
    if (!workoutState) return;
    try {
      var calibration = (window.Store && Store.getSection("calibration")) || {};
      var entries = [];
      var probeDone = null;
      var planSetsTotal = 0;
      for (var i = 0; i < workoutState.items.length; i++) {
        var it = workoutState.items[i];
        var loggedSets = [];
        planSetsTotal += isNum(it.planSets) ? it.planSets : it.sets.length;
        for (var s = 0; s < it.sets.length; s++) {
          var st = it.sets[s];
          if (!st.done) continue;
          var isProbe = !!(st.amrap && it.probe && it.probe.setIdx === s);
          loggedSets.push({
            w: st.w, reps: st.reps,
            rirReported: st.rir,
            // ⚑ AMRAP — підхід до відмови за побудовою: самозвіту тут немає,
            // тож і поправки bias до нього немає (§3 коригує саме самозвіт).
            rirEff: isProbe ? 0 : computeRirEff(st.rir, calibration),
            isAmrapProbe: isProbe,
            // Етап 9, §15: останній підхід «N+» (запас 1, не відмова) —
            // звичайний самозвіт, тому rirEff рахується як завжди.
            amrapPlus: (!isProbe && st.amrapPlus === true) ? true : undefined,
            failed: false,
            ts: Date.now()
          });
          // Проба дійсна, лише якщо вагу не міняли: прогноз був для неї.
          if (isProbe && isNum(st.w) && Math.abs(st.w - it.probe.weight) <= 1e-6) {
            probeDone = {
              date: workoutState.startedAt.slice(0, 10), exerciseId: it.exerciseId,
              repsTarget: it.probe.repsTarget, reportedRir: it.probe.reportedRir, actualReps: st.reps
            };
          }
        }
        if (loggedSets.length) {
          // Етап 3: що було заплановано — для частки невиконаного (§6,
          // fatigueIndex) і для обліку плато в тому діапазоні, який реально
          // стояв на екрані.
          entries.push({
            exerciseId: it.exerciseId, sets: loggedSets,
            plan: {
              sets: isNum(it.planSets) ? it.planSets : it.sets.length,
              repRange: Array.isArray(it.repRange) ? it.repRange.slice(0, 2) : null,
              targetRir: isNum(it.planRir) ? it.planRir : null,
              weight: isNum(it.planWeight) ? it.planWeight : null,
              plateauStep: (it.plateau && isNum(it.plateau.step)) ? it.plateau.step : 0,
              retest: !!(it.plateau && it.plateau.applyRetest)
            }
          });
        }
      }
      if (!entries.length) {
        window.alert("Жодного записаного підходу — нічого зберігати.");
        return;
      }
      var startedAt = new Date(workoutState.startedAt);
      var nowD = new Date();
      var dateStr = workoutState.startedAt.slice(0, 10);
      var durationMin = Math.max(1, Math.round((nowD.getTime() - startedAt.getTime()) / 60000));

      var session = {
        id: "s_" + Date.now(),
        date: dateStr,
        mesoId: workoutState.mesoId,
        week: workoutState.week,
        dayIndex: workoutState.dayIndex,
        readiness: isNum(workoutState.readiness) ? workoutState.readiness : null,
        durationMin: durationMin,
        endedAt: nowD.toISOString(),
        entries: entries,
        planSets: planSetsTotal,
        deload: workoutState.deload === true
      };
      // Етап 6: знімок маси тіла на момент тренування (docs/DATA.md →
      // sessions[].bodyMassKg) — щоб схуднення не переписувало минулі точки
      // «Прогресу». Не вказана — поля немає.
      var bmSnap = bodyMassOf(getSettings());
      if (bmSnap !== null) session.bodyMassKg = bmSnap;

      var res = Store.appendSession(session);
      if (!res || !res.ok) {
        window.alert("Не вдалось зберегти сесію: " + ((res && res.message) || "невідома помилка"));
        return;
      }
      afterSessionSaved(session, probeDone);
      workoutState = null;
      readinessAnswer = undefined;
      detailIndex = null;
      anchorOverrideOpen = false;
      clearDraft();
      location.hash = "#home";
    } catch (e) {
      window.alert("Помилка завершення тренування: " + (e && e.message ? e.message : String(e)));
    }
  }

  // Опитування готовності (DATA.md: readiness 1..5, §9.2/§4). Питаємо один
  // раз на захід, до генерації сесії — значення йде і в чернетку, і в
  // збережену сесію. Пропуск — явна кнопка, не мовчазна підстановка:
  // readiness лишається null, і fatigueIndex() (algo-program.js) вже вміє
  // це коректно ігнорувати (нульовий доданок + позначка "missing").
  function renderReadinessPrompt(container) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Як самопочуття?"));

    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-3)";
    hint.textContent = "1 — розбитий, 5 — свіжий. Впливає на розрахунок втоми.";
    card.appendChild(hint);

    var row = document.createElement("div");
    row.style.display = "flex";
    row.style.gap = "var(--space-2)";
    row.style.marginBottom = "var(--space-3)";
    row.style.flexWrap = "wrap";

    for (var v = 1; v <= 5; v++) {
      (function (val) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "btn btn-primary";
        b.style.flex = "1 1 auto";
        b.textContent = String(val);
        b.addEventListener("click", function () {
          readinessAnswer = val;
          renderScreen("workout");
        });
        row.appendChild(b);
      })(v);
    }
    card.appendChild(row);

    var skip = document.createElement("button");
    skip.type = "button";
    skip.className = "btn btn-secondary";
    skip.textContent = "Пропустити";
    skip.addEventListener("click", function () {
      readinessAnswer = null;
      renderScreen("workout");
    });
    card.appendChild(skip);

    container.appendChild(card);
  }

  // ------------------------------------------------------------------
  // Крок 10a — Exercise detail / Swap
  // ------------------------------------------------------------------

  function getExerciseLibrary() {
    try {
      var exercises = window.Store ? Store.getSection("exercises") : null;
      if (!exercises || !exercises.length) exercises = window.EX_DB || [];
      return exercises;
    } catch (e) {
      return window.EX_DB || [];
    }
  }

  // Днів без цієї вправи в історії (вхід staleDays для §5.2) рахує
  // AlgoProgram.staleDaysMap — тут своєї формули немає (відкрите питання 8).

  // Історія підходів по вправі: останні сесії, найновіші першими.
  function exerciseHistory(sessions, exerciseId, limit) {
    var arr = Array.isArray(sessions) ? sessions.slice() : [];
    arr.sort(function (a, b) {
      var da = (a && a.date) || "";
      var db = (b && b.date) || "";
      return da < db ? 1 : (da > db ? -1 : 0);
    });
    var out = [];
    for (var i = 0; i < arr.length && out.length < limit; i++) {
      var entries = (arr[i] && arr[i].entries) || [];
      for (var j = 0; j < entries.length; j++) {
        if (entries[j] && entries[j].exerciseId === exerciseId) {
          out.push({ date: arr[i].date, sets: entries[j].sets || [] });
          break;
        }
      }
    }
    return out;
  }

  function currentE1rm(exerciseId) {
    try {
      var metrics = window.Store ? Store.getSection("metrics") : null;
      var rec = metrics && metrics.e1rm && metrics.e1rm[exerciseId];
      return (rec && isNum(rec.value)) ? rec.value : null;
    } catch (e) {
      return null;
    }
  }

  // Заміна вправи в поточному item: нова вправа = новий ряд вимірів, тому
  // не переносимо прогрес попередньої (§5, «лічильник miss стартує з нуля»
  // застосовано тут за аналогією — нове logging з чистого аркуша).
  function applySwap(itemIdx, newEx) {
    var item = workoutState.items[itemIdx];
    var range = Array.isArray(newEx.repRange) ? newEx.repRange : item.repRange;
    var setsCount = item.sets.length || 3;
    var newSets = [];
    for (var s = 0; s < setsCount; s++) {
      newSets.push({ w: null, reps: range[0], rir: isNum(item.sets[0] && item.sets[0].rir) ? item.sets[0].rir : 2, done: false });
    }
    item.exerciseId = newEx.id;
    item.name = newEx.name || newEx.id;
    item.cues = Array.isArray(newEx.cues) ? newEx.cues : [];
    item.incrementKg = isNum(newEx.incrementKg) ? newEx.incrementKg : item.incrementKg;
    item.repRange = range;
    item.pattern = newEx.pattern || null;
    item.mainMuscle = (window.AlgoProgram && typeof AlgoProgram.mainMuscle === "function")
      ? AlgoProgram.mainMuscle(newEx) : item.mainMuscle;
    item.sets = newSets;
    persistDraft();
  }

  function swapCandidateRow(container, itemIdx, cand, exObj) {
    var row = document.createElement("div");
    row.className = "list-row";

    var info = document.createElement("div");
    var nm = document.createElement("p");
    nm.style.fontWeight = "700";
    nm.textContent = exObj.name || cand.exerciseId;
    info.appendChild(nm);
    var sc = document.createElement("p");
    sc.className = "text-faint";
    sc.textContent = "Наскільки підходить: " + cand.score.toFixed(2) +
      " (бракує обсягу " + cand.parts.deficit.toFixed(2) +
      ", давно не було " + cand.parts.staleness.toFixed(2) +
      ", дублює основну вправу " + cand.parts.overlap.toFixed(2) + ")";
    info.appendChild(sc);
    row.appendChild(info);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn btn-secondary";
    btn.textContent = "Обрати";
    btn.addEventListener("click", function () {
      applySwap(itemIdx, exObj);
      anchorOverrideOpen = false;
      renderScreen("workout");
    });
    row.appendChild(btn);
    // Етап 8, §14: «не пропонувати» прямо з екрана заміни.
    var nb = document.createElement("button");
    nb.type = "button";
    nb.className = "btn btn-secondary";
    nb.textContent = "Не пропонувати";
    nb.addEventListener("click", function () {
      if (setExerciseAvoid(exObj.id, painScope) === false) { window.alert("Не вдалось зберегти позначку."); return; }
      renderScreen("workout");
    });
    row.appendChild(nb);

    container.appendChild(row);
  }

  function swapRanked(item, pool) {
    var sessions = (window.Store && Store.getSessions()) || [];
    var nowIso = new Date().toISOString();
    var anchorExs = [];
    var libIdx = exIndexOf(getExerciseLibrary());
    workoutState.items.forEach(function (it) {
      if (it.kind === "anchor" && it.exerciseId !== item.exerciseId && libIdx[it.exerciseId]) {
        anchorExs.push(libIdx[it.exerciseId]);
      }
    });
    return AlgoProgram.rankAssistance(pool, {
      muscle: item.mainMuscle,
      deficitNorm: workoutState.deficitNorm || {},
      staleDays: AlgoProgram.staleDaysMap(sessions, nowIso),
      equipment: effectiveEquipment() || undefined,
      anchorDirect: AlgoProgram.anchorDirectMuscles(anchorExs),
      modeMismatch: false
    });
  }

  // Етап 8, §14: пул заміни без вправ, відсіяних болем / «не пропонувати».
  // Повертає { pool, hidden }.
  function painFilterPool(pool) {
    var av = currentAvoid();
    if (!av || !window.AlgoProgram || typeof AlgoProgram.avoidReasonOf !== "function") return { pool: pool, hidden: 0 };
    var keep = pool.filter(function (ex) { return !AlgoProgram.avoidReasonOf(ex, av); });
    return { pool: keep, hidden: pool.length - keep.length };
  }

  function renderSwapCandidates(container, itemIdx, item, pool) {
    if (!window.AlgoProgram || typeof AlgoProgram.rankAssistance !== "function") {
      container.appendChild(makeStatusLine("Оцінка замін зараз не рахується.", true));
      return;
    }
    var pf = painFilterPool(pool);
    pool = pf.pool;
    if (pf.hidden > 0) {
      container.appendChild(makeStatusLine("Сховано " + pf.hidden + " — через позначки «болить» або «не пропонувати».", false));
    }
    var sessions = (window.Store && Store.getSessions()) || [];
    var nowIso = new Date().toISOString();
    var anchorExs = [];
    var libIdx = exIndexOf(getExerciseLibrary());
    workoutState.items.forEach(function (it) {
      if (it.kind === "anchor" && it.exerciseId !== item.exerciseId && libIdx[it.exerciseId]) {
        anchorExs.push(libIdx[it.exerciseId]);
      }
    });
    var ctx = {
      muscle: item.mainMuscle,
      deficitNorm: workoutState.deficitNorm || {},
      staleDays: AlgoProgram.staleDaysMap(sessions, nowIso),
      equipment: effectiveEquipment() || undefined,
      anchorDirect: AlgoProgram.anchorDirectMuscles(anchorExs),
      modeMismatch: false
    };
    var ranked = AlgoProgram.rankAssistance(pool, ctx);
    if (!ranked.length) {
      container.appendChild(makeStatusLine("Альтернатив не знайдено.", false));
      return;
    }
    ranked.slice(0, 8).forEach(function (cand) {
      var exObj = libIdx[cand.exerciseId];
      if (exObj) swapCandidateRow(container, itemIdx, cand, exObj);
    });
  }

  // Етап 8, §14: пул заміни для item — той самий, що показує картка заміни
  // (anchor — той самий рух; допоміжна — суттєвий внесок у головний м'яз).
  function swapPoolFor(itemIdx, item) {
    var effEq = effectiveEquipment();
    var lib = getExerciseLibrary();
    if (item.kind === "anchor") {
      return lib.filter(function (ex) {
        return ex && ex.pattern === item.pattern && ex.id !== item.exerciseId && exAvailable(ex, effEq);
      });
    }
    var usedIds = {};
    workoutState.items.forEach(function (it, i) { if (i !== itemIdx) usedIds[it.exerciseId] = true; });
    return lib.filter(function (ex) {
      if (!ex || ex.id === item.exerciseId || usedIds[ex.id]) return false;
      if (!exAvailable(ex, effEq)) return false;
      if (!item.mainMuscle) return true;
      return window.AlgoProgram && typeof AlgoProgram.isSignificant === "function" &&
        AlgoProgram.isSignificant(ex, item.mainMuscle);
    });
  }

  function renderExcludeCard(container, itemIdx, item) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Не пропонувати цю вправу"));
    var hint = document.createElement("p");
    hint.className = "text-dim";
    hint.style.marginBottom = "var(--space-2)";
    hint.textContent = "Якщо вправа незручна або від неї болить — генератор її більше не ставитиме. " +
      "Зняти позначку можна в «Ще» → «Щось болить?».";
    card.appendChild(hint);
    card.appendChild(painScopeRow(function () { renderScreen("workout"); }));
    var status = makeStatusLine("");
    status.style.display = "none";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-secondary";
    b.style.marginTop = "var(--space-2)";
    b.textContent = "Не пропонувати (" + scopeLabel(painScope) + ")";
    b.addEventListener("click", function () {
      var oldName = item.name;
      if (setExerciseAvoid(item.exerciseId, painScope) === false) {
        status.textContent = "Не вдалось зберегти позначку.";
        status.style.display = "";
        return;
      }
      var started = (item.sets || []).some(function (st) { return st && st.done; });
      var next = null;
      if (!started && window.AlgoProgram && typeof AlgoProgram.rankAssistance === "function") {
        var ranked = swapRanked(item, painFilterPool(swapPoolFor(itemIdx, item)).pool);
        var libIdx = exIndexOf(getExerciseLibrary());
        next = ranked.length ? libIdx[ranked[0].exerciseId] : null;
      }
      if (next) {
        applySwap(itemIdx, next);
        workoutState.items[itemIdx].painSwap = {
          ruleId: "PAIN_ASSIST_SWAP", replacedId: null, replacedName: oldName,
          short: "Замість «" + oldName + "»: ви попросили її не пропонувати."
        };
        persistDraft();
      }
      renderScreen("workout");
    });
    card.appendChild(b);
    card.appendChild(status);
    container.appendChild(card);
  }

  function renderExerciseDetailScreen(container, itemIdx) {
    var item = workoutState.items[itemIdx];
    if (!item) { detailIndex = null; renderScreen("workout"); return; }

    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "btn btn-secondary";
    backBtn.style.marginBottom = "var(--space-3)";
    backBtn.textContent = "← До тренування";
    backBtn.addEventListener("click", function () {
      detailIndex = null;
      anchorOverrideOpen = false;
      renderScreen("workout");
    });
    container.appendChild(backBtn);

    // ---- Основна інформація ----
    var infoCard = makeCard();
    infoCard.appendChild(makeSectionTitle(item.name));

    if (item.cues.length) {
      var cues = document.createElement("p");
      cues.className = "text-faint";
      cues.style.marginBottom = "var(--space-2)";
      cues.textContent = item.cues.join(" · ");
      infoCard.appendChild(cues);
    }

    var rangeP = document.createElement("p");
    rangeP.className = "text-dim";
    rangeP.textContent = "Робочий діапазон: " + item.repRange[0] + "–" + item.repRange[1] +
      " повторів · " + item.sets.length + " підходів за планом · пауза " +
      (isNum(item.restSec) ? item.restSec : workoutState.restSeconds) + " с";
    infoCard.appendChild(rangeP);

    var e1rmP = document.createElement("p");
    e1rmP.className = "text-dim";
    if (item.bodyweightBase) {
      // §0.2/§2.1: e1RM для власної ваги свідомо не рахується (BODYWEIGHT_BASE) —
      // це не порожні дані, а межа алгоритму, і текст має казати саме це.
      e1rmP.textContent = "Оцінка максимуму (вага на 1 повтор): не рахується для вправ з власною вагою.";
    } else {
      var e1rm = currentE1rm(item.exerciseId);
      e1rmP.textContent = "Оцінка максимуму (вага на 1 повтор): " + (isNum(e1rm) ? (Math.round(e1rm * 10) / 10 + " кг") : "ще немає даних");
    }
    infoCard.appendChild(e1rmP);
    container.appendChild(infoCard);

    // ---- Що працює ---- (§9.1: повний розклад внеску по м'язах, не лише
    // mainMuscle). Без contrib блок не малюємо — порожня рамка гірша за
    // відсутність блоку.
    if (item.contrib && typeof item.contrib === "object") {
      var muscleNames = (window.AlgoProgram && AlgoProgram.MUSCLE_NAME) || {};
      var primaryList = [];
      var secondaryList = [];
      for (var mk in item.contrib) {
        if (!item.contrib.hasOwnProperty(mk)) continue;
        var val = item.contrib[mk];
        if (!isNum(val) || val <= 0) continue;
        var entry = { key: mk, value: val, label: muscleNames[mk] || mk, valueLabel: (Math.round(val * 100) / 100).toFixed(1) };
        // Етап 6: «основний» = прямий сет §10.1 (c ≥ 0.75), решта — непрямі 0.5.
        var dmin = (window.AlgoProgram && AlgoProgram.C && isNum(AlgoProgram.C.DIRECT_MIN)) ? AlgoProgram.C.DIRECT_MIN : 0.75;
        if (val >= dmin) primaryList.push(entry); else secondaryList.push(entry);
      }
      if (primaryList.length || secondaryList.length) {
        primaryList.sort(function (a, b) { return b.value - a.value; });
        secondaryList.sort(function (a, b) { return b.value - a.value; });

        var contribCard = makeCard();
        contribCard.appendChild(makeSectionTitle("Що працює"));

        if (primaryList.length) {
          var primTitle = document.createElement("p");
          primTitle.className = "contrib-group-title";
          primTitle.textContent = "Основні м'язи";
          contribCard.appendChild(primTitle);
          primaryList.forEach(function (entry) {
            var row = document.createElement("p");
            row.className = "contrib-row contrib-row-primary";
            row.textContent = entry.label + " — " + entry.valueLabel;
            contribCard.appendChild(row);
          });
        }

        if (secondaryList.length) {
          var secTitle = document.createElement("p");
          secTitle.className = "contrib-group-title";
          secTitle.textContent = "Другорядні (рахуються як пів підходу)";
          contribCard.appendChild(secTitle);
          secondaryList.forEach(function (entry) {
            var row2 = document.createElement("p");
            row2.className = "contrib-row contrib-row-secondary";
            row2.textContent = entry.label + " — " + entry.valueLabel;
            contribCard.appendChild(row2);
          });
        }

        var contribNote = document.createElement("p");
        contribNote.className = "text-faint contrib-note";
        contribNote.textContent = "1.0 — м'яз головний у русі, 0.5 — працює суттєво, але не головний: так " +
          "рахує обсяг метааналіз Pelland 2026 (непрямий підхід = пів підходу). Який м'яз головний, а який " +
          "другорядний, — наша оцінка, а не вимір.";
        contribCard.appendChild(contribNote);

        container.appendChild(contribCard);
      }
    }

    // ---- Історія ----
    var histCard = makeCard();
    histCard.appendChild(makeSectionTitle("Історія"));
    var sessions = (window.Store && Store.getSessions()) || [];
    var hist = exerciseHistory(sessions, item.exerciseId, 5);
    if (!hist.length) {
      histCard.appendChild(makeStatusLine("Це перший запуск цієї вправи — історії ще немає.", false));
    } else {
      hist.forEach(function (h) {
        var line = document.createElement("p");
        line.className = "text-dim";
        line.style.marginBottom = "var(--space-1)";
        var parts = h.sets.map(function (st) {
          var rir = isNum(st.rirEff) ? st.rirEff : st.rirReported;
          return (isNum(st.w) ? st.w : "—") + "×" + (isNum(st.reps) ? st.reps : "—") +
            (isNum(rir) ? " (запас " + rir + ")" : "");
        });
        line.textContent = h.date + ": " + parts.join(", ");
        histCard.appendChild(line);
      });
    }
    container.appendChild(histCard);

    // ---- Етап 8, §14: «не пропонувати цю вправу» ----
    renderExcludeCard(container, itemIdx, item);

    // ---- Swap ----
    var swapCard = makeCard();
    swapCard.appendChild(makeSectionTitle("Замінити вправу"));

    // Кандидати на заміну — лише з обладнання, яке є сьогодні: той самий
    // фільтр, що бачить generateSession() (exAvailable дзеркалить equipmentOk).
    var effEq = effectiveEquipment();

    if (item.kind === "anchor") {
      // §5.1: anchor-слот заблокований на весь мезоцикл, бо на ньому тримається
      // e1RM-тренд. Вільної заміни немає — тільки свідомий виняток з попередженням.
      var warn = document.createElement("p");
      warn.style.color = "var(--color-danger)";
      warn.style.fontWeight = "700";
      warn.style.marginBottom = "var(--space-2)";
      warn.textContent = "Це основна вправа циклу («" + item.name + "») — вона закріплена до кінця циклу, бо саме на ній видно прогрес. " +
        "Замінювати її варто лише на межі циклу, при болю в русі, коли обладнання немає " +
        "2 сесії поспіль або коли прогрес давно стоїть і інші способи вже спробувані.";
      swapCard.appendChild(warn);

      var warn2 = document.createElement("p");
      warn2.className = "text-faint";
      warn2.style.marginBottom = "var(--space-3)";
      warn2.textContent = "Ручна заміна тут — виняток поза цими умовами. Історія прогресу цієї вправи " +
        "почнеться заново, і зміниться порядок вправ у сесії.";
      swapCard.appendChild(warn2);

      if (!anchorOverrideOpen) {
        var overrideBtn = document.createElement("button");
        overrideBtn.type = "button";
        overrideBtn.className = "btn btn-secondary";
        overrideBtn.textContent = "Розумію ризик — показати заміни";
        overrideBtn.addEventListener("click", function () {
          anchorOverrideOpen = true;
          renderScreen("workout");
        });
        swapCard.appendChild(overrideBtn);
      } else {
        var lib = getExerciseLibrary();
        var pool = lib.filter(function (ex) {
          return ex && ex.pattern === item.pattern && ex.id !== item.exerciseId &&
            exAvailable(ex, effEq);
        });
        renderSwapCandidates(swapCard, itemIdx, item, pool);
      }
    } else {
      var lib2 = getExerciseLibrary();
      var usedIds = {};
      workoutState.items.forEach(function (it, i) {
        if (i !== itemIdx) usedIds[it.exerciseId] = true;
      });
      var pool2 = lib2.filter(function (ex) {
        if (!ex || ex.id === item.exerciseId || usedIds[ex.id]) return false;
        if (!exAvailable(ex, effEq)) return false;
        if (!item.mainMuscle) return true;
        return window.AlgoProgram && typeof AlgoProgram.isSignificant === "function" &&
          AlgoProgram.isSignificant(ex, item.mainMuscle);
      });
      renderSwapCandidates(swapCard, itemIdx, item, pool2);
    }
    container.appendChild(swapCard);
  }

  // §13.5: «≈ 62 хв, режим гібрид» — обов'язковий показ до старту.
  // restSource === "default" виводимо окремо: режим не обраний, паузи в
  // оцінці взяті з hyb мовчки для generateSession, але тут це видно, а не
  // сховано.
  // Крок 14: власник має бачити, що старт консервативний — інакше «щось ваги
  // якісь дитячі» виглядає як баг, а не як свідоме рішення алгоритму.
  // Окрема картка, а не рядок у renderDurationCard(), бо та виходить раніше,
  // якщо duration не порахувалась.
  function renderEasyStartCard(container) {
    if (!workoutState || !workoutState.easyStart) return;
    var card = makeCard();
    var p = document.createElement("p");
    p.style.fontWeight = "700";
    p.textContent = "Перша сесія — обережна";
    card.appendChild(p);
    var body = document.createElement("p");
    body.className = "text-dim";
    body.style.marginTop = "var(--space-2)";
    body.textContent =
      "Оцінних проб на онбордингу не було, тому ваги свідомо занижені: ціль — запас повторів " +
      (isNum(workoutState.easyStartRir) ? workoutState.easyStartRir : 4) +
      ", тобто в кінці кожного підходу має лишатись помітний запас. За наступні сесії " +
      "система підтягне ваги під те, що ви реально робите.";
    card.appendChild(body);
    container.appendChild(card);
  }

  function renderDurationCard(container) {
    var dur = workoutState.duration;
    if (!dur) return;
    var card = makeCard();
    card.classList.add("hero-card");
    var modeLabel = dur.mode ? (MODE_INFO[dur.mode] ? MODE_INFO[dur.mode].label : dur.mode) : null;
    var line = document.createElement("p");
    line.className = "hero-sub";
    // Етап 4: разом з розминкою й заминкою — вони теж у ліміті часу.
    var wp = workoutState.parts || { warmup: false, main: true, cooldown: false };
    var wpp = workoutState.partsPlan || { warmupMin: 0, cooldownMin: 0 };
    var mainMin = wp.main ? dur.min : 0;
    var totalMin = mainMin + (wp.warmup ? wpp.warmupMin : 0) + (wp.cooldown ? wpp.cooldownMin : 0);
    // Число-герой екрана (концепт C): хвилини. Під ним — режим і з чого складається.
    var hero = document.createElement("p");
    hero.className = "hero-num num";
    hero.setAttribute("aria-label", "приблизно " + totalMin + " хвилин");
    hero.textContent = "≈" + totalMin;
    var heroU = document.createElement("span");
    heroU.className = "hero-unit";
    heroU.textContent = " хв";
    hero.appendChild(heroU);
    card.appendChild(hero);
    line.textContent = modeLabel ? "Режим " + modeLabel.toLowerCase() : "≈ " + totalMin + " хв";
    card.appendChild(line);
    var bits = [];
    if (wp.warmup) bits.push("розминка ≈" + wpp.warmupMin + " хв");
    if (wp.main) bits.push("основна ≈" + dur.min + " хв");
    if (wp.cooldown) bits.push("заминка " + wpp.cooldownMin + " хв");
    if (bits.length) {
      var br = document.createElement("p");
      br.className = "text-faint";
      br.style.marginTop = "var(--space-1)";
      br.textContent = bits.join(" · ");
      card.appendChild(br);
    }

    // Етап 3, п.6: звідки сьогоднішній ліміт. Без розкладу — нічого нового.
    var dbg = workoutState.dayBudget;
    if (dbg && dbg.source !== "default") {
      var bl = document.createElement("p");
      bl.className = "text-dim";
      bl.style.marginTop = "var(--space-2)";
      bl.textContent = dayBudgetText(dbg);
      card.appendChild(bl);
    }

    if (dur.restSource === "default") {
      card.appendChild(makeStatusLine(
        "Режим не обрано — паузи в оцінці взяті за замовчуванням (гібрид). Оберіть режим у " +
        "Налаштуваннях, щоб оцінка й тренування збігались.", false
      ));
    }

    if (workoutState.timeBudgetNote && workoutState.timeBudgetNote.short) {
      var isOver = !!(workoutState.timeBudget && workoutState.timeBudget.overBudget);
      var tbShortP = document.createElement("p");
      tbShortP.style.marginTop = "var(--space-2)";
      tbShortP.style.color = isOver ? "var(--color-danger)" : "var(--color-text-dim)";
      tbShortP.textContent = workoutState.timeBudgetNote.short;
      card.appendChild(tbShortP);
      if (workoutState.timeBudgetNote.text) {
        // appendWhyBlock рендерить і `short`, тому короткий рядок вище не
        // дублюємо — передаємо тільки текст під «докладніше».
        appendWhyBlock(card, { text: workoutState.timeBudgetNote.text,
          ruleId: workoutState.timeBudgetNote.ruleId }, null);
      }
    }

    // §8: пояснення дня — короткий рядок живою мовою, технічний текст ховається
    // під «докладніше». Якщо алгоритм не дав поля — блок не рендериться.
    var sw = workoutState.sessionWhy;
    if (sw && (sw.short || sw.text)) {
      appendWhyBlock(card, sw, null);
    }

    container.appendChild(card);
  }

  // §8/§13.1: спільний рендер пояснення — короткий рядок видимий одразу,
  // технічний текст ховається під один <details> на блок. modeWhy (якщо є)
  // рендериться окремим рядком всередині того самого згортання, не зливається
  // з why.
  function appendWhyBlock(card, why, modeWhy) {
    if (why && why.short) {
      var shortP = document.createElement("p");
      shortP.className = "workout-why";
      shortP.textContent = why.short;
      if (why.ruleId) shortP.setAttribute("data-rule-id", why.ruleId);
      card.appendChild(shortP);
    }
    if (modeWhy && modeWhy.short) {
      var modeShortP = document.createElement("p");
      modeShortP.className = "workout-why workout-why--mode";
      modeShortP.textContent = modeWhy.short;
      if (modeWhy.ruleId) modeShortP.setAttribute("data-rule-id", modeWhy.ruleId);
      card.appendChild(modeShortP);
    }

    var hasWhyText = why && why.text;
    var hasModeWhyText = modeWhy && modeWhy.text;
    if (!hasWhyText && !hasModeWhyText) return;

    var details = document.createElement("details");
    details.className = "workout-why-details";
    var summary = document.createElement("summary");
    summary.textContent = "Докладніше";
    details.appendChild(summary);

    if (hasWhyText) {
      var whyTextP = document.createElement("p");
      whyTextP.className = "workout-why";
      whyTextP.textContent = why.text;
      if (why.ruleId) whyTextP.setAttribute("data-rule-id", why.ruleId);
      details.appendChild(whyTextP);
    }
    if (hasModeWhyText) {
      var modeTextP = document.createElement("p");
      modeTextP.className = "workout-why workout-why--mode";
      modeTextP.textContent = modeWhy.text;
      if (modeWhy.ruleId) modeTextP.setAttribute("data-rule-id", modeWhy.ruleId);
      details.appendChild(modeTextP);
    }
    sheetify(details, "Докладніше");
    card.appendChild(details);
  }

  function renderWorkoutScreen(container) {
    renderStoreBanner(container);

    if (!workoutState) {
      var draft = loadDraft();
      if (draft) {
        workoutState = draft;
        readinessAnswer = isNum(draft.readiness) ? draft.readiness : null;
      } else if (readinessAnswer === undefined) {
        renderReadinessPrompt(container);
        return;
      } else {
        workoutState = buildWorkoutState(readinessAnswer);
        if (workoutState.ok) persistDraft();
      }
    }

    if (!workoutState.ok) {
      var errCard = makeCard();
      errCard.style.borderColor = "var(--color-danger)";
      var p = document.createElement("p");
      p.style.color = "var(--color-danger)";
      p.textContent = workoutState.error || "Не вдалось побудувати тренування.";
      errCard.appendChild(p);
      container.appendChild(errCard);
      workoutState = null; // дозволити повторну спробу при наступному відкритті
      return;
    }

    // Крок 14: попередження про легкий старт — вище за все інше на екрані.
    renderEasyStartCard(container);

    // §13.5: показ тривалості до старту — обов'язково, завжди, до першого сета.
    renderDurationCard(container);

    // Етап 8, §14: що враховано через біль — одразу під тривалістю.
    if (detailIndex === null && Array.isArray(workoutState.painNotes) && workoutState.painNotes.length) {
      var painCard = makeCard();
      painCard.appendChild(makeSectionTitle("Враховано біль"));
      workoutState.painNotes.forEach(function (n) {
        var pp = document.createElement("p");
        pp.className = "workout-why";
        pp.setAttribute("data-rule-id", n.ruleId);
        pp.textContent = n.short;
        painCard.appendChild(pp);
      });
      container.appendChild(painCard);
    }

    // Етап 10, §17: пріоритетний м'яз — що з ним зроблено сьогодні.
    if (detailIndex === null && workoutState.priorityNote && workoutState.priorityNote.short) {
      var prCard = makeCard();
      prCard.appendChild(makeSectionTitle("Пріоритетний м'яз"));
      var prP = document.createElement("p");
      prP.className = "workout-why";
      prP.setAttribute("data-rule-id", workoutState.priorityNote.code);
      prP.textContent = workoutState.priorityNote.short;
      prCard.appendChild(prP);
      if (workoutState.priorityNote.text) {
        var prD = document.createElement("details");
        prD.className = "workout-why-details";
        var prS = document.createElement("summary");
        prS.textContent = "Докладніше";
        prD.appendChild(prS);
        prD.appendChild(progressP(workoutState.priorityNote.text, "text-dim"));
        sheetify(prD, "Пріоритетний м'яз");
        prCard.appendChild(prD);
      }
      renderWhy(prCard, "priority");
      container.appendChild(prCard);
    }

    // Етап 4: частини тренування на сьогодні, розминка, «Чому так?».
    if (detailIndex === null) {
      renderPartsToggle(container);
      if (workoutState.deload) renderDeloadWhyCard(container);
    }
    var wParts = workoutState.parts || { warmup: false, main: true, cooldown: false };
    if (wParts.warmup && detailIndex === null) renderWarmupCard(container);
    if (!wParts.main) {
      if (wParts.cooldown) renderCooldownCard(container);
      renderNoMainCard(container);
      return;
    }

    // §13.5: trimToBudget більше ніколи не віддає нуль вправ — лишається рівно
    // одна (anchor або найвищий score), і сесія свідомо перевищує бюджет.
    // Порожній список тут неможливий, але картку про перевищення бюджету
    // показуємо, якщо алгоритм про це просигналив.
    // Етап 2: якщо алгоритм уже дав ноту бюджету, вона стоїть у картці
    // тривалості червоним — друга картка з тим самим «коротше вже нікуди»
    // була дублем. Окрема картка лишається тільки як запасний вихід, коли
    // ноти немає (старий стан чернетки).
    var tb = workoutState.timeBudget;
    var tbNoteShown = !!(workoutState.timeBudgetNote && workoutState.timeBudgetNote.short);
    if (tb && tb.overBudget && !tbNoteShown) {
      // Технічна нота (short/text §13.5) вже показана нижче в картці
      // тривалості (renderDurationCard) — тут тільки коротке чесне
      // попередження, людськими словами, без ruleId на екрані.
      var overCard = makeCard();
      overCard.style.borderColor = "var(--color-danger)";
      var overP = document.createElement("p");
      overP.style.color = "var(--color-danger)";
      overP.style.fontWeight = "700";
      // Бюджет, з яким реально рахувалась сесія (з розкладу — свій на день).
      var budgetMinVal = isNum(tb.budgetMin) ? tb.budgetMin : null;
      var estMinVal = tb.estMin != null ? tb.estMin : null;
      overP.textContent = (budgetMinVal != null
        ? "Бюджет " + budgetMinVal + " хв, але коротше вже нікуди"
        : "Коротше вже нікуди") +
        (estMinVal != null ? " — буде ≈ " + estMinVal + " хв." : ".");
      overCard.appendChild(overP);
      container.appendChild(overCard);
    }

    if (detailIndex !== null) {
      renderExerciseDetailScreen(container, detailIndex);
      return;
    }

    if (workoutState.restEndTs) {
      renderRestTimer(container);
    }

    // Редизайн фаза Б: одне активне — поточний підхід (перший незаписаний),
    // решта підходів — рядки «N · кг × повт · запас ✓». Тап по рядку відкриває
    // його панель (виправити записане або записати не по черзі).
    var cur = currentSetPos();
    workoutState.items.forEach(function (item, itemIdx) {
      var card = makeCard();
      card.classList.add("ex-card");
      var isCurItem = !!cur && cur.item === itemIdx;
      if (isCurItem) card.classList.add("is-current");
      if (item.sets.every(function (x) { return x.done; })) card.classList.add("is-done");
      card.setAttribute("data-ex-idx", String(itemIdx));

      var head = document.createElement("div");
      head.className = "ex-head";
      var title = document.createElement("h2");
      title.className = "ex-title";
      title.textContent = item.name + (item.bodyweightBase ? " · власна вага" : "");
      title.setAttribute("role", "button");
      title.addEventListener("click", function () {
        detailIndex = itemIdx;
        anchorOverrideOpen = false;
        renderScreen("workout");
      });
      head.appendChild(title);
      head.appendChild(makeIcon("chev", "ex-chev"));
      card.appendChild(head);

      var meta = document.createElement("p");
      meta.className = "ex-meta";
      var s0 = item.sets[0] || {};
      var doneN = item.sets.filter(function (x) { return x.done; }).length;
      meta.textContent = (item.kind === "anchor" ? "основна · " : "") + (item.priority ? "пріоритет · " : "") + item.sets.length + " × " + s0.reps +
        (isNum(s0.w) && s0.w > 0 ? " · " + fmtKg(s0.w) + " кг" : "") +
        (doneN ? " · записано " + doneN + "/" + item.sets.length : "");
      card.appendChild(meta);

      // Деталі вправи (підказки, пояснення) — видно лише в активній картці;
      // у згорнутих лишаються в DOM, бо їх читають тексти «Чому так?».
      var extra = document.createElement("div");
      extra.className = "ex-extra";
      card.appendChild(extra);

      // Етап 4: розминочні підходи (не записуються) — лише з увімкненою розминкою.
      if (wParts.warmup && item.warmupSets && item.warmupSets.ok) {
        var wu = document.createElement("p");
        wu.className = "text-dim ex-line";
        wu.textContent = "Розминочні підходи: " + item.warmupSets.sets.map(function (s) {
          return s.reps + " × " + s.weight + " кг";
        }).join(", ") + " — не записуються.";
        extra.appendChild(wu);
      }

      if (item.cues.length) {
        var cues = document.createElement("p");
        cues.className = "text-faint ex-line";
        cues.textContent = item.cues.join(" · ");
        extra.appendChild(cues);
      }

      if (item.timeTrim) {
        var trimP = document.createElement("p");
        trimP.className = "text-faint ex-line";
        trimP.textContent = "Скорочено, щоб укластись у час: " + item.timeTrim.from + " → " +
          item.timeTrim.to + " підх.";
        extra.appendChild(trimP);
      }

      planNotesOf(item).forEach(function (txt) {
        var pn = document.createElement("p");
        pn.className = "text-faint ex-line";
        pn.textContent = txt;
        extra.appendChild(pn);
      });

      // §8/§12/§13.1: короткий рядок видимий, технічний текст — у нижній панелі.
      appendWhyBlock(extra, item.why, item.modeWhy);
      // Етап 10, §17: окремий рядок «пріоритет» — не четверте речення в why.
      if (item.priorityWhy && item.priorityWhy.short) {
        var pwP = document.createElement("p");
        pwP.className = "workout-why";
        pwP.setAttribute("data-rule-id", item.priorityWhy.ruleId || "PRIORITY_MUSCLE");
        pwP.textContent = item.priorityWhy.short;
        extra.appendChild(pwP);
      }
      // §14: у anchor'а «чому» заміни вже в why.short — не дублюємо.
      if (item.painSwap && item.painSwap.short && !(item.why && item.why.ruleId === item.painSwap.ruleId)) {
        var psP = document.createElement("p");
        psP.className = "workout-why";
        psP.setAttribute("data-rule-id", item.painSwap.ruleId || "PAIN_ASSIST_SWAP");
        psP.textContent = item.painSwap.short;
        extra.appendChild(psP);
      }

      var setsBox = document.createElement("div");
      setsBox.className = "set-list";
      item.sets.forEach(function (st, setIdx) {
        var key = itemIdx + ":" + setIdx;
        var isCur = !!cur && cur.item === itemIdx && cur.set === setIdx;
        var isOpen = openSetKey === null ? isCur : openSetKey === key;
        var plusMin = (st.amrapPlus && item.amrapPlus) ? item.amrapPlus.minReps : null;

        var setWrap = document.createElement("div");
        setWrap.className = "set-row" + (st.done ? " is-done" : "") + (isCur ? " is-current" : "") +
          (isOpen ? " is-open" : "");

        // Рядок-зведення (табло): номер · вага × повтори · запас · ✓
        var line = document.createElement("button");
        line.type = "button";
        line.className = "set-line";
        line.setAttribute("aria-expanded", isOpen ? "true" : "false");
        var nEl = document.createElement("span");
        nEl.className = "set-n num";
        nEl.textContent = String(setIdx + 1);
        var wr = document.createElement("span");
        wr.className = "set-wr num";
        var repsTxt = (plusMin !== null && !st.done && st.reps === plusMin) ? (st.reps + "+") : String(st.reps);
        wr.textContent = (item.bodyweightBase && !(st.w > 0) ? "власна" : fmtKg(st.w)) + " × " + repsTxt;
        var rirEl = document.createElement("span");
        rirEl.className = "set-rir";
        rirEl.textContent = st.done ? "запас " + st.rir : (st.amrap ? "проба" : "план: запас " + st.rir);
        line.appendChild(nEl);
        line.appendChild(wr);
        line.appendChild(rirEl);
        line.appendChild(st.done ? makeIcon("check", "set-ok") : makeIcon(isOpen ? "down" : "chev", "set-chev"));
        line.addEventListener("click", function () {
          openSetKey = isOpen ? "none" : key;
          renderScreen("workout");
        });
        setWrap.appendChild(line);

        var edit = document.createElement("div");
        edit.className = "set-edit";
        setWrap.appendChild(edit);

        var setLabel = document.createElement("p");
        setLabel.className = "set-label";
        setLabel.textContent = "Підхід " + (setIdx + 1) + " з " + item.sets.length +
          (st.done ? " — записано" : "");
        edit.appendChild(setLabel);
        if (st.amrap) {
          // §3, джерело 1: людина має знати, що цей сет — вимір, а не план.
          var probeP = document.createElement("p");
          probeP.className = "workout-why";
          probeP.style.fontWeight = "700";
          probeP.textContent = "Проба: зробіть максимум повторів з чистою технікою. " +
            "Так застосунок звіряє ваше відчуття запасу з фактом (раз на 7–10 днів).";
          edit.appendChild(probeP);
        }
        if (plusMin !== null) {
          // Етап 9, §15: «N+» — щонайменше N, далі скільки вийде чисто.
          var plusP = document.createElement("p");
          plusP.className = "workout-why amrap-plus";
          plusP.setAttribute("data-rule-id", "AMRAP_PLUS");
          plusP.textContent = "«" + plusMin + "+» — зробіть щонайменше " + plusMin +
            " і продовжуйте, поки повтори чисті. Зупиніться, коли лишиться 1 повтор до відмови " +
            "(не до відмови). Потім впишіть, скільки вийшло.";
          edit.appendChild(plusP);
          renderWhy(edit, "amrap");
        }

        edit.appendChild(bigNumber({
          label: item.bodyweightBase ? "додатково, кг" : "кг",
          text: (item.bodyweightBase && !(st.w > 0)) ? "0" : fmtKg(st.w),
          raw: st.w, decimal: true,
          onDec: function () {
            st.w = Math.max(0, Math.round(((st.w || 0) - item.incrementKg) * 100) / 100);
            openSetKey = key; renderScreen("workout");
          },
          onInc: function () {
            st.w = Math.round(((st.w || 0) + item.incrementKg) * 100) / 100;
            openSetKey = key; renderScreen("workout");
          },
          onSet: function (v) {
            if (v !== null && v >= 0) st.w = Math.round(v * 100) / 100;
            openSetKey = key; persistDraft(); renderScreen("workout");
          }
        }));
        edit.appendChild(bigNumber({
          label: plusMin !== null ? "повторів, мінімум " + plusMin : "повторів",
          text: repsTxt, raw: st.reps,
          onDec: function () { st.reps = Math.max(0, st.reps - 1); openSetKey = key; renderScreen("workout"); },
          onInc: function () { st.reps = st.reps + 1; openSetKey = key; renderScreen("workout"); },
          onSet: function (v) {
            if (v !== null && v >= 0) st.reps = Math.round(v);
            openSetKey = key; persistDraft(); renderScreen("workout");
          }
        }));

        var rirLab = document.createElement("p");
        rirLab.className = "set-label";
        rirLab.textContent = "Ще змогли б, повторів";
        edit.appendChild(rirLab);
        edit.appendChild(rirSegments(st.rir, function (v) {
          st.rir = v; openSetKey = key; renderScreen("workout");
        }));

        var logBtn = document.createElement("button");
        logBtn.type = "button";
        logBtn.className = st.done ? "btn btn-secondary btn-main" : "btn btn-primary btn-main";
        logBtn.textContent = st.done ? "Записано ✓" : "Записати підхід";
        logBtn.addEventListener("click", function () {
          st.done = true;
          // Пауза цієї вправи (§13.1). Після останнього сета вона ж — перехід
          // до наступної вправи (§13.5: T_вправи включає паузу після кожного
          // сета). Після останнього сета всього тренування таймера немає —
          // «остання пауза не йде».
          var restS = isNum(item.restSec) ? item.restSec : workoutState.restSeconds;
          var anyLeft = workoutState.items.some(function (x) {
            return x.sets.some(function (y) { return !y.done; });
          });
          workoutState.restEndTs = anyLeft ? Date.now() + restS * 1000 : null;
          workoutState.restTotalS = anyLeft ? restS : null;
          openSetKey = null;
          scrollToCurrent = true;
          persistDraft();
          renderScreen("workout");
        });
        edit.appendChild(logBtn);

        setsBox.appendChild(setWrap);
      });
      card.appendChild(setsBox);

      container.appendChild(card);
    });

    if (wParts.cooldown) renderCooldownCard(container);

    var finishCard = makeCard();
    var finishBtn = document.createElement("button");
    finishBtn.type = "button";
    finishBtn.className = "btn btn-primary";
    finishBtn.textContent = "Завершити тренування";
    finishBtn.addEventListener("click", finishWorkout);
    finishCard.appendChild(finishBtn);
    container.appendChild(finishCard);
    if (workoutState.restEndTs) {
      var restSpacer = document.createElement("div");
      restSpacer.className = "rest-spacer";
