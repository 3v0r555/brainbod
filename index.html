      container.appendChild(restSpacer);
    }
    if (scrollToCurrent) {
      scrollToCurrent = false;
      var cp = currentSetPos();
      var card = cp && findChild(container, function (n) {
        return n.getAttribute && n.getAttribute("data-ex-idx") === String(cp.item);
      });
      // r2: цілимось у відкритий підхід, а не в картку: низ панелі має
      // лишитись над доком відпочинку (scroll-margin-bottom у CSS).
      var openRow = card && findDeep(card, function (n) {
        return typeof n.className === "string" && n.className.indexOf("set-row") === 0 && n.className.indexOf("is-open") !== -1;
      });
      var target = openRow || card;
      if (target && typeof target.scrollIntoView === "function") {
        try { target.scrollIntoView({ block: openRow ? "end" : "start" }); } catch (e) { /* лише зручність */ }
      }
    }
  }

  function findDeep(node, pred) {
    var kids = (node && node.children) || [];
    for (var i = 0; i < kids.length; i++) {
      if (pred(kids[i])) return kids[i];
      var r = findDeep(kids[i], pred);
      if (r) return r;
    }
    return null;
  }

  function findChild(node, pred) {
    var kids = (node && node.children) || [];
    for (var i = 0; i < kids.length; i++) if (pred(kids[i])) return kids[i];
    return null;
  }

  // ------------------------------------------------------------------
  // Екран «Тіло» (Обсяг) — крок 11
  // ------------------------------------------------------------------
  //
  // Повний функціональний еквівалент мапи, списком. Усі числа §7/§9/§10
  // (обсяг, коридор MEV/MAV/MRV, готовність R_m, час до готовності) беруться
  // готовими з AlgoProgram (weeklyVolume/weeklyTargets/deficits/
  // recoveryState) — тут нічого з ALGO.md не переписується. Єдина цифра,
  // якої в AlgoProgram нема готовою — "востаннє навантажений": рахуємо її
  // тут мінімально, проходом по сесіях і contrib вправи.

  var volumeSortMode = "readiness"; // "readiness" | "deficit" — у пам'яті модуля, не персиститься
  var volumeOpenMuscle = null;      // ключ м'яза з розкритим accordion
  var volumeLegendOpen = false;     // згорнутий словник термінів (MEV/MAV/MRV/R_m)

  var ZONE_LABEL = {
    fresh: "свіжий", working: "робочий", partial: "часткова",
    low: "не відновився", cold: "холодний старт", unknown: "—"
  };
  var ZONE_CLASS = {
    fresh: "vol-zone-fresh", working: "vol-zone-working",
    partial: "vol-zone-partial", low: "vol-zone-low",
    cold: "vol-zone-cold", unknown: ""
  };

  // Людські формулювання для зон коридору обсягу (§9.5 корелює із
  // corridorZone/corridorRuleId, самі числа й межі — з algo-program.js).
  var CORRIDOR_ZONE_LABEL = {
    below_mev: "нижче мінімуму — обсяг ще не набраний",
    mev_mav: "у робочому коридорі",
    mav_mrv: "біля стелі",
    at_mrv: "на стелі"
  };
  // Колір несе сенс, а не тривогу: колір має ЗАПОВНЕННЯ смуги, не вся смуга.
  // «Нижче MEV» на старті — нормальний стан, тому синій (набираєш), а не
  // червоний; червоне лишається за реальною стелею MRV.
  var CORRIDOR_ZONE_FILL_CLASS = {
    below_mev: "vol-bar-fill--below-mev",
    mev_mav: "vol-bar-fill--mev-mav",
    mav_mrv: "vol-bar-fill--mav-mrv",
    at_mrv: "vol-bar-fill--at-mrv"
  };

  // Словник термінів — показується ОДИН раз на екран, у згорнутому блоці,
  // а не дужками в кожному рядку.
  var VOLUME_GLOSSARY = [
    ["Мінімум", "скільки підходів за тиждень треба, щоб м'яз узагалі ріс (у літературі — MEV)."],
    ["Оптимум", "робочий обсяг, на якому ріст найкращий (MAV)."],
    ["Стеля", "більше підходів уже не встигаєш відновлювати (MRV)."],
    ["Готовність", "наскільки м'яз відновився, 0–100%."],
    ["Смуга", "обсяг тижня від 0 до стелі. Дві риски — мінімум і оптимум, кінець смуги — стеля."]
  ];

  // Людські формулювання ruleId, які показуються в реченнях деталі.
  // Сам ruleId не зникає — виводиться окремим рядком нижче (діагностика).
  var RULE_LABEL = {
    VOLUME_BELOW_MEV: "обсяг нижче мінімуму",
    VOLUME_IN_RANGE: "обсяг у робочому коридорі",
    VOLUME_NEAR_MRV: "обсяг наближається до стелі",
    VOLUME_AT_MRV: "обсяг на стелі",
    VOLUME_AT_MRV_LOW_RECOVERY: "обсяг на стелі при низькій готовності",
    RECOVERY_OK: "м'яз готовий до навантаження",
    RECOVERY_PARTIAL: "м'яз відновився частково",
    RECOVERY_LOW: "м'яз ще не відновився",
    RECOVERY_COLD_START: "холодний старт — історії ще недостатньо",
    RECOVERY_MEV_OVERRIDE: "тримаємо мінімальний обсяг попри відновлення"
  };
  function ruleLabel(ruleId) {
    return (ruleId && RULE_LABEL[ruleId]) || ruleId || "—";
  }

  // "Востаннє навантажений" рахує AlgoProgram.lastWorkedHours (відкрите
  // питання 8) — тут лише форматування.

  function formatHoursAgo(h) {
    if (!isNum(h) || h < 0) return "ще не навантажувався";
    if (h < 1) return "менше години тому";
    if (h < 48) return Math.round(h) + " год тому";
    return Math.round(h / 24) + " дн тому";
  }

  function formatHoursToReady(h) {
    if (h === null || h === undefined) return "готовий";
    if (!isNum(h)) return "—";
    if (h < 1) return "менше ніж за годину";
    if (h < 48) return "≈ " + Math.round(h) + " год";
    return "≈ " + Math.round(h / 24) + " дн";
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function volBarSegment(pct, zoneClass) {
    var d = document.createElement("div");
    d.className = "vol-bar-fill" + (zoneClass ? " " + zoneClass : "");
    d.style.width = clamp(pct, 0, 100) + "%";
    return d;
  }

  function volBarMark(pct) {
    var d = document.createElement("div");
    d.className = "vol-bar-mark";
    d.style.left = clamp(pct, 0, 100) + "%";
    return d;
  }

  // Обсяг приходить дробовим (непрямі внески c_m). У рядку, який має
  // читатись за секунду, «16.2» шумить — округлюємо на ВИВОДІ, самі числа
  // не чіпаємо.
  function fmtSets(v) {
    if (!isNum(v)) return "—";
    return String(Math.round(v * 10) / 10);
  }

  function volDetailLine(text) {
    var p = document.createElement("p");
    p.textContent = text;
    return p;
  }

  function renderVolumeRow(container, data) {
    var isOpen = (volumeOpenMuscle === data.key);

    var row = document.createElement("div");
    row.className = "vol-row";

    var head = document.createElement("div");
    head.className = "vol-row-head";
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.setAttribute("aria-expanded", isOpen ? "true" : "false");

    var name = document.createElement("p");
    name.className = "vol-name";
    name.textContent = data.name;
    head.appendChild(name);

    // Бейдж готовності — тільки коли він щось означає. На холодному старті
    // R_m = 100% за замовчуванням (§9.8), і повторювати це в кожному з 12
    // рядків немає сенсу: про холодний старт сказано один раз угорі.
    if (!data.cold) {
      var badge = document.createElement("span");
      badge.className = "vol-badge " + (ZONE_CLASS[data.zone] || "");
      badge.textContent = Math.round(data.r) + "% " + (ZONE_LABEL[data.zone] || data.zone);
      head.appendChild(badge);
    }

    var chev = document.createElement("span");
    chev.className = "vol-chev";
    chev.setAttribute("aria-hidden", "true");
    chev.textContent = isOpen ? "▴" : "▾";
    head.appendChild(chev);

    // Підрядок: обсяг (головне число рішення) і, ЯКЩО дані є, коли м'яз
    // навантажувався востаннє. Без історії рядок про «востаннє» не малюється
    // взагалі — він не несе інформації.
    var subParts = [];
    subParts.push(data.target > 0
      ? (fmtSets(data.done) + " / " + fmtSets(data.target) + " підх.")
      : (fmtSets(data.done) + " підх."));
    if (isNum(data.lastWorkedH) && data.lastWorkedH >= 0) {
      subParts.push(formatHoursAgo(data.lastWorkedH));
    }
    var sub = document.createElement("p");
    sub.className = "vol-sub";
    sub.textContent = subParts.join(" · ");
    head.appendChild(sub);

    head.addEventListener("click", function () {
      volumeOpenMuscle = isOpen ? null : data.key;
      renderScreen("volume");
    });
    head.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        head.click();
      }
    });
    row.appendChild(head);

    // Смуга обсягу тижня: заповнення до MRV = 100%, риски на MEV і MAV.
    // Числа під смугою прибрані — вони не потрібні для рішення «мало/багато»,
    // а на 430px три підписи × 12 рядків тільки шумлять і вилазять за край.
    // Розшифровки — у словнику вгорі, точні числа — у деталі рядка.
    var barWrap = document.createElement("div");
    barWrap.className = "vol-bar-wrap";

    var track = document.createElement("div");
    var mrv = data.mrv > 0 ? data.mrv : 1;
    var mevPct = (data.mev / mrv) * 100;
    var mavPct = (data.mav / mrv) * 100;
    track.className = "vol-bar-track";
    track.appendChild(volBarSegment(
      (data.volumeWeek / mrv) * 100,
      CORRIDOR_ZONE_FILL_CLASS[data.corridorZone] || ""
    ));
    track.appendChild(volBarMark(mevPct));
    track.appendChild(volBarMark(mavPct));
    barWrap.appendChild(track);

    row.appendChild(barWrap);

    if (isOpen) {
      var detail = document.createElement("div");
      detail.className = "vol-detail";

      detail.appendChild(volDetailLine(
        "Обсяг тижня: " + fmtSets(data.done) + " з " + fmtSets(data.target) + " підходів" +
        (data.deficit > 0 ? " · бракує " + fmtSets(data.deficit) : " · ціль виконана") + "."
      ));

      detail.appendChild(volDetailLine(
        "Мінімум " + data.mev + " · оптимум " + data.mav + " · стеля " + data.mrv +
        " — " + (CORRIDOR_ZONE_LABEL[data.corridorZone] || data.corridorZone || "невідома зона") + "."
      ));

      if (!data.cold) {
        detail.appendChild(volDetailLine(
          "Готовність " + Math.round(data.r) + "% — " +
          (ZONE_LABEL[data.zone] || data.zone) + ": " + ruleLabel(data.ruleId) + "."
        ));
        if (isNum(data.tReadyH) && data.tReadyH > 0) {
          detail.appendChild(volDetailLine(
            "Буде готовий " + formatHoursToReady(data.tReadyH) + "."
          ));
        }
      }

      row.appendChild(detail);
    }

    container.appendChild(row);
  }

  // ------------------------------------------------------------------
  // Етап 5: екран «Прогрес». Усі числа — з AlgoProgram.progressSummary()
  // (e1RM за §0, підходи за §7, тиждень циклу за §4). Тут лише малювання:
  // SVG і CSS вручну, без бібліотек і без перерахунку.
  // ------------------------------------------------------------------
  var SVG_NS = "http://www.w3.org/2000/svg";

  function svgEl(tag, attrs) {
    var el = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) {
      if (attrs.hasOwnProperty(k)) el.setAttribute(k, String(attrs[k]));
    }
    return el;
  }

  function fmt1(v) {
    return isNum(v) ? String(Math.round(v * 10) / 10) : "—";
  }

  function shortDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? (m[3] + "." + m[2]) : "";
  }

  function progressP(text, cls) {
    var p = document.createElement("p");
    if (cls) p.className = cls;
    p.textContent = text;
    return p;
  }

  // Лінійний графік ряду: точки — значення з алгоритму, осі — їхні min/max.
  // r2 (концепт C): без сітки — лише тонка базова лінія; підписи min/max
  // праворуч моно-шрифтом; точка лише на останньому значенні.
  function renderProgressChart(points, unit) {
    var W = 320, H = 132, padL = 6, padR = 46, padT = 12, padB = 22;
    var vals = points.map(function (p) { return p.value; });
    var vMin = Math.min.apply(null, vals), vMax = Math.max.apply(null, vals);
    var lo = vMin, hi = vMax;
    if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    function x(i) {
      return padL + (points.length === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (points.length - 1));
    }
    function y(v) {
      return padT + (hi - v) * (H - padT - padB) / (hi - lo);
    }
    var svg = svgEl("svg", {
      viewBox: "0 0 " + W + " " + H, "class": "prog-chart", role: "img",
      "aria-label": "Графік за " + points.length + " тренувань: від " + fmt1(vals[0]) + " до " +
        fmt1(vals[vals.length - 1]) + " " + unit
    });
    var base = H - padB;
    svg.appendChild(svgEl("line", { x1: padL, x2: W - padR, y1: base, y2: base, "class": "prog-grid" }));
    var marks = (vMax - vMin < 1e-9) ? [vMax] : [vMax, vMin];
    marks.forEach(function (v) {
      var t = svgEl("text", { x: W - padR + 8, y: (y(v) + 4).toFixed(1), "text-anchor": "start", "class": "prog-axis num" });
      t.textContent = fmt1(v);
      svg.appendChild(t);
    });
    var pts = points.map(function (p, i) { return x(i).toFixed(1) + "," + y(p.value).toFixed(1); }).join(" ");
    svg.appendChild(svgEl("polyline", { points: pts, "class": "prog-line" }));
    var li = points.length - 1;
    svg.appendChild(svgEl("circle", { cx: x(li).toFixed(1), cy: y(points[li].value).toFixed(1), r: 7, "class": "prog-dot-halo" }));
    svg.appendChild(svgEl("circle", { cx: x(li).toFixed(1), cy: y(points[li].value).toFixed(1), r: 4, "class": "prog-dot" }));
    var d0 = svgEl("text", { x: padL, y: H - 5, "text-anchor": "start", "class": "prog-axis" });
    d0.textContent = shortDate(points[0].date);
    svg.appendChild(d0);
    if (points.length > 1) {
      var d1 = svgEl("text", { x: W - padR, y: H - 5, "text-anchor": "end", "class": "prog-axis" });
      d1.textContent = shortDate(points[points.length - 1].date);
      svg.appendChild(d1);
    }
    return svg;
  }

  // Велике число з одиницею (r2): «≈101.3 кг», «8 повт.».
  function progHero(numText, unitText) {
    var p = document.createElement("p");
    p.className = "prog-hero";
    var n = document.createElement("span");
    n.className = "num prog-hero-num";
    n.textContent = numText;
    p.appendChild(n);
    var u = document.createElement("span");
    u.className = "hero-unit";
    u.textContent = " " + unitText;
    p.appendChild(u);
    return p;
  }

  function renderProgressCycle(container, sum) {
    var c = sum.cycle;
    var card = makeCard();
    card.appendChild(makeSectionTitle("Цикл"));
    var mm = /(\d+)$/.exec(String(c.mesoId || ""));
    if (!c.known) {
      card.appendChild(progressP("Цикл почнеться з першим тренуванням.", "prog-big"));
    } else if (c.deload) {
      card.appendChild(progressP("Тиждень розвантаження", "prog-big"));
    } else {
      card.appendChild(progressP("Тиждень " + c.week + " з " + c.accumWeeks + " · накопичення" +
        (c.extended ? " (продовжено)" : ""), "prog-big"));
    }
    var bar = document.createElement("div");
    bar.className = "prog-cycle";
    var segs = Math.max(c.accumWeeks, c.extended ? c.week : 0) + 1;
    for (var i = 1; i <= segs; i++) {
      var seg = document.createElement("span");
      var isDl = i === segs;
      var cls = "prog-cycle-seg" + (isDl ? " is-deload" : "");
      if (c.known) {
        if (c.deload ? isDl : i === c.week) cls += " is-current";
        else if (c.deload ? !isDl : i < c.week) cls += " is-done";
      }
      seg.className = cls;
      bar.appendChild(seg);
    }
    card.appendChild(bar);
    card.appendChild(progressP((mm ? "Цикл №" + mm[1] + ". " : "") + (c.deload
      ? "Обсяг менший, вага та сама, запас більший. Потім — новий цикл."
      : "Після " + c.accumWeeks + " тижнів накопичення — тиждень розвантаження (раніше, якщо накопичиться втома)."),
      "text-dim"));
    container.appendChild(card);
  }

  function renderProgressWeeks(container, sum) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Тренування й обсяг"));
    card.appendChild(progHero(String(sum.totals.thisWeekSessions), "тренув. цього тижня"));
    card.appendChild(progressP("Тренувань усього: " + sum.totals.sessions + " · цього тижня: " +
      sum.totals.thisWeekSessions, "text-dim prog-cap"));
    if (sum.weeks.length) {
      var bars = document.createElement("div");
      bars.className = "prog-bars";
      sum.weeks.forEach(function (w) {
        var col = document.createElement("div");
        col.className = "prog-bar-col" + (w.current ? " is-current" : "");
        col.appendChild(progressP(String(w.sets), "prog-bar-val"));
        var track = document.createElement("div");
        track.className = "prog-bar-track";
        var fill = document.createElement("div");
        fill.className = "prog-bar-fill" + (w.sets ? "" : " is-zero");
        fill.style.height = (sum.maxWeekSets > 0 ? Math.round(w.sets / sum.maxWeekSets * 100) : 0) + "%";
        track.appendChild(fill);
        col.appendChild(track);
        col.appendChild(progressP(w.key.slice(-3).replace("W", "т"), "prog-bar-lbl"));
        col.appendChild(progressP(w.sessions ? w.sessions + " тр." : "—", "prog-bar-sub"));
        if (w.deloadSessions) col.appendChild(progressP("розв.", "prog-bar-sub"));
        bars.appendChild(col);
      });
      card.appendChild(bars);
    }
    // r2: пояснення — у нижньому листі, текст той самий.
    var how = document.createElement("details");
    how.className = "workout-why-details";
    var hs = document.createElement("summary");
    hs.textContent = "Як читати";
    how.appendChild(hs);
    how.appendChild(progressP("Стовпчик — записані робочі підходи за тиждень, кожен підхід = 1 (усі вправи; " +
      "розминочні не записуються). Під ним — номер тижня року, кількість тренувань і «розв.» для тижня " +
      "розвантаження. Обсяг по м'язах (непрямі підходи — по половині) — на вкладці «Обсяг».", "text-dim"));
    sheetify(how, "Тренування й обсяг");
    card.appendChild(how);
    container.appendChild(card);
  }

  function renderProgressExercise(container, ex) {
    var card = makeCard();
    var h = document.createElement("h3");
    h.className = "prog-ex-name";
    h.textContent = ex.name;
    card.appendChild(h);
    var unit = (ex.kind === "e1rm" || ex.kind === "e1rm_bw") ? "кг" : "повт.";
    // r2: зміна від першої точки — праворуч від назви, лаймом лише ріст.
    if (isNum(ex.changePct)) {
      var head = document.createElement("div");
      head.className = "prog-ex-head";
      card.removeChild(h);
      head.appendChild(h);
      var dp = document.createElement("span");
      dp.className = "num prog-delta" + (ex.changePct > 0 ? " is-up" : "");
      dp.textContent = (ex.changePct > 0 ? "+" : "") + fmt1(ex.changePct) + "%";
      head.appendChild(dp);
      card.appendChild(head);
    }
    if (ex.kind === "e1rm") {
      card.appendChild(progHero("≈" + fmt1(ex.current), "кг"));
      card.appendChild(progressP("поточна оцінка максимуму (вага на 1 повтор)", "text-dim prog-cap"));
    } else if (ex.kind === "e1rm_bw") {
      card.appendChild(progHero("≈" + fmt1(ex.current), "кг"));
      card.appendChild(progressP("оцінка максимуму: " +
        (ex.bwFrac === 1 ? "тіло + вантаж" : Math.round(ex.bwFrac * 100) + "% ваги тіла + вантаж"), "text-dim prog-cap"));
    } else {
      card.appendChild(progHero(fmt1(ex.current), "повт."));
      card.appendChild(progressP("найкращий підхід останнього тренування", "text-dim prog-cap"));
    }
    if (ex.points.length >= 2) {
      card.appendChild(renderProgressChart(ex.points, unit));
    } else {
      card.appendChild(progressP(ex.kind === "e1rm"
        ? "Графік з'явиться, коли набереться два тренування з оцінкою максимуму. Вона рахується лише з " +
          "підходів, де повторів разом із запасом не більше 12 — довші підходи її не дають."
        : "Графік з'явиться після двох тренувань з цією вправою.", "text-dim"));
    }
    var BW_NOTE = {
      NO_BODY_MASS: "Вкажіть вагу тіла в Налаштуваннях — тоді тут буде оцінка максимуму (частка ваги тіла + вантаж).",
      HIGH_REPS: "Оцінки максимуму немає: у підходах повторів разом із запасом більше 12, а з таких вона неточна. " +
        "Показано найбільше повторів.",
      NO_BW_FRACTION: "Яку частку ваги тіла піднімає ця вправа, у дослідженнях не виміряно — тому лише повтори."
    };
    if (ex.bwNote && BW_NOTE[ex.bwNote]) card.appendChild(progressP(BW_NOTE[ex.bwNote], "text-faint"));
    var lastP = ex.points.length ? ex.points[ex.points.length - 1] : null;
    if (lastP) {
      var load = isNum(lastP.weight) && lastP.weight > 0
        ? (ex.kind === "e1rm" ? "" : "+") + fmt1(lastP.weight) + " кг × " + lastP.reps
        : (isNum(lastP.reps) ? lastP.reps + " повт." : "");
      var line = "Останнє тренування (" + shortDate(lastP.date) + "): " + load;
      if (isNum(ex.changePct)) {
        line += " · від першої точки графіка: " + (ex.changePct > 0 ? "+" : "") + fmt1(ex.changePct) + "%";
      }
      card.appendChild(progressP(line, "text-faint prog-foot"));
    }
    container.appendChild(card);
  }

  // ------------------------------------------------------------------
  // Етап 10: підсумок циклу (§16) і пріоритетний м'яз (§17) — лише показ.
  // Усі числа й рішення — з AlgoProgram.cycleSummary / cycleInputs.
  // ------------------------------------------------------------------
  function muscleName(m) {
    var n = (window.AlgoProgram && AlgoProgram.MUSCLE_NAME && AlgoProgram.MUSCLE_NAME[m]) || m;
    return n.charAt(0).toUpperCase() + n.slice(1);
  }

  function lastCycle() {
    try {
      ensureProgramState();
      var program = Store.getSection("program") || {};
      var list = Array.isArray(program.cycles) ? program.cycles : [];
      return { program: program, cycle: list.length ? list[list.length - 1] : null };
    } catch (e) { return { program: {}, cycle: null }; }
  }

  // Вибір 1–2 пріоритетних м'язів: у Налаштуваннях і в підсумку циклу.
  function renderPriorityChooser(card, screenId) {
    if (!window.AlgoProgram || !Array.isArray(AlgoProgram.MUSCLES)) return;
    var cur = AlgoProgram.normPriority(getSettings().priorityMuscles);
    var max = (AlgoProgram.C && AlgoProgram.C.PRIORITY_MAX) || 2;
    function save(next) {
      saveSettingsPatch({ priorityMuscles: next });
      dropUntouchedDraft();       // сесія збереться заново з новим пріоритетом
      renderScreen(screenId);
    }
    var row = onbChipRow();
    row.setAttribute("data-priority-chooser", "1");
    row.appendChild(onbChip("Без пріоритету", cur.length === 0, function () { save([]); }));
    AlgoProgram.MUSCLES.forEach(function (m) {
      var on = cur.indexOf(m) >= 0;
      var chip = onbChip(muscleName(m), on, function () {
        if (on) save(cur.filter(function (x) { return x !== m; }));
        else if (cur.length < max) save(cur.concat([m]));
      });
      if (!on && cur.length >= max) chip.disabled = true;
      row.appendChild(chip);
    });
    card.appendChild(row);
    card.appendChild(progressP(cur.length
      ? "Обрано: " + cur.map(muscleName).join(", ") + "." + (cur.length >= max ? " Щоб обрати інший, спершу зніміть один із цих." : "")
      : "Пріоритет не обрано — усі м'язи ростуть рівно.", "text-faint"));
  }

  function renderPriorityCard(container, screenId) {
    var card = makeCard();
    card.appendChild(makeSectionTitle("Пріоритетний м'яз"));
    card.appendChild(progressP("Можна обрати 1–2 м'язи, які хочеться підтягнути. Їм — більше підходів і місце " +
      "одразу після основних вправ. Решті — мінімум, що зберігає форму. Ліміт часу на день не змінюється.", "text-dim"));
    renderPriorityChooser(card, screenId);
    renderWhy(card, "priority");
    container.appendChild(card);
  }

  var CYCLE_END_TEXT = {
    CALENDAR: "Цикл пройшов за планом — після 4 тижнів навантаження прийшов час розвантаження.",
    FATIGUE: "Цикл закінчила втома: кілька тижнів поспіль вона трималась високою.",
    PLATEAU: "Цикл закінчило плато: основні вправи кілька тижнів не росли.",
    READINESS: "Цикл закінчили низька готовність або біль.",
    VOLUME: "Цикл закінчив обсяг: якийсь м'яз два тижні був на межі відновлення.",
    UNKNOWN: "Чим закінчився цикл, не записано — він пройшов до появи підсумків."
  };
  var CYCLE_ZONE_TEXT = { below: "менше мінімуму", "in": "у робочій зоні", high: "багато", top: "на межі відновлення" };

  function cycleSub(text) {
    var h = document.createElement("h3");
    h.className = "prog-ex-name";
    h.style.marginTop = "var(--space-3)";
    h.textContent = text;
    return h;
  }

  function pctText(p) { return isNum(p) ? (p > 0 ? "+" : "") + fmt1(p) + "%" : "мало даних"; }

  function renderCycleSummaryCard(container) {
    var lc = lastCycle();
    var c = lc.cycle;
    var card = makeCard();
    card.setAttribute("data-cycle-summary", c ? c.mesoId : "none");
    if (!c || !c.ok) {
      card.appendChild(makeSectionTitle("Підсумок циклу"));
      card.appendChild(progressP("Перший підсумок з'явиться, коли закінчиться навантаження цього циклу — на " +
        "початку тижня розвантаження (зазвичай після 4-го тижня).", "text-dim"));
      container.appendChild(card);
      return;
    }
    card.appendChild(makeSectionTitle("Підсумок циклу" + (isNum(c.number) ? " №" + c.number : "")));
    card.appendChild(progressP(shortDate(c.startedAt) + " – " + shortDate(c.endedAt) + " · " + c.weeks + " тиж. навантаження", "text-dim"));

    // Редизайн фаза Б: заголовна цифра + сегменти регулярності.
    var upN = c.anchors.filter(function (a) { return a.status === "up"; }).length;
    if (c.anchors.length) {
      var head = document.createElement("p");
      head.className = "cyc-head";
      var hn = document.createElement("span");
      hn.className = "num cyc-head-num";
      hn.textContent = upN + "/" + c.anchors.length;
      head.appendChild(hn);
      head.appendChild(document.createTextNode(" основних вправ виросли"));
      card.appendChild(head);
    }
    var segs = document.createElement("div");
    segs.className = "cyc-segs";
    segs.setAttribute("aria-hidden", "true");
    var planned = Math.max(0, Math.min(40, c.planned || 0));
    for (var si = 0; si < planned; si++) {
      var sg = document.createElement("span");
      sg.className = "cyc-seg" + (si < c.sessions ? " is-on" : "");
      segs.appendChild(sg);
    }
    if (planned) card.appendChild(segs);
    card.appendChild(progressP(c.sessions + " з " + c.planned + " тренувань (" + Math.round(c.regularity * 100) + "%)", "text-dim cyc-reg"));
    card.appendChild(progressP(CYCLE_END_TEXT[c.end && c.end.code] || CYCLE_END_TEXT.UNKNOWN, "text-faint"));

    card.appendChild(cycleSub("Сила в основних вправах"));
    if (!c.anchors.length) card.appendChild(progressP("Даних про основні вправи немає.", "text-faint"));
    c.anchors.forEach(function (a) {
      var unit = a.kind === "reps" ? " повт." : " кг";
      var row = document.createElement("div");
      row.className = "cyc-row";
      var l = document.createElement("span");
      l.className = "cyc-row-name";
      l.textContent = a.name + ": " + (isNum(a.first) ? fmt1(a.first) + " → " + fmt1(a.last) + unit : "");
      row.appendChild(l);
      var r = document.createElement("span");
      r.className = "num cyc-row-val" + (a.status === "up" ? " is-up" : "");
      r.textContent = pctText(a.pct);
      row.appendChild(r);
      card.appendChild(row);
    });
    if (c.anchors.some(function (a) { return a.kind === "e1rm"; })) {
      card.appendChild(progressP("Кг — оцінка максимуму на 1 повтор: найкращий тиждень на початку проти кінця циклу.", "text-faint cyc-foot"));
    }

    // Обсяг — 12 рядків, тож згорнуто; уміст той самий.
    var vf = document.createElement("details");
    vf.className = "fold cyc-vol";
    var vs = document.createElement("summary");
    vs.className = "fold-sum";
    var inZone = c.volume.filter(function (v) { return v.zone === "in"; }).length;
    vs.textContent = "Обсяг: у робочій зоні " + inZone + " з " + c.volume.length;
    vf.appendChild(vs);
    c.volume.forEach(function (v) {
      var row = document.createElement("div");
      row.className = "cyc-row";
      row.setAttribute("data-zone", v.zone);
      var l = document.createElement("span");
      l.className = "cyc-row-name";
      l.textContent = muscleName(v.muscle) + (v.priority ? " (пріоритет)" : "");
      row.appendChild(l);
      var r = document.createElement("span");
      r.className = "cyc-row-val cyc-zone-" + v.zone;
      var rn = document.createElement("span");
      rn.className = "num";
      rn.textContent = fmt1(v.avg) + " / " + v.mev + "–" + v.mav;
      r.appendChild(rn);
      var rz = document.createElement("span");
      rz.className = "cyc-zone-t";
      rz.textContent = CYCLE_ZONE_TEXT[v.zone];
      r.appendChild(rz);
      row.appendChild(r);
      vf.appendChild(row);
    });
    vf.appendChild(progressP("Підходів на тиждень у середньому / робоча зона.", "text-faint cyc-foot"));
    card.appendChild(vf);

    var painN = (c.pain && c.pain.zones ? c.pain.zones.length : 0) + (c.pain && c.pain.ids ? c.pain.ids.length : 0);
    card.appendChild(progressP((c.plateau.length ? "Плато: " + c.plateau.map(function (x) { return x.name; }).join(", ") + "." : "Плато не було.") +
      " " + (painN ? "Позначок болю на кінець циклу: " + painN + " — їх враховано у виборі вправ." : "Позначок болю немає."), "text-dim cyc-foot"));

    card.appendChild(cycleSub("Наступний цикл"));
    var nx = card.appendChild(progressP(c.next && c.next.why ? c.next.why.short : "", "workout-why workout-why--mode cyc-next"));
    nx.setAttribute("data-rule-id", "CYCLE_NEXT");
    if (c.applies === false) {
      card.appendChild(progressP("Поточний цикл уже почався до появи підсумків, тож ця рекомендація лише для довідки.", "text-faint"));
    }
    if (c.next && c.next.why && c.next.why.text) {
      var d = document.createElement("details");
      d.className = "workout-why-details";
      var sm = document.createElement("summary");
      sm.textContent = "Докладніше";
      d.appendChild(sm);
      d.appendChild(progressP(c.next.why.text, "text-dim"));
      sheetify(d, "Наступний цикл");
      card.appendChild(d);
    }
    renderWhy(card, "cycle");

    card.appendChild(cycleSub("Пріоритетний м'яз (необов'язково)"));
    renderPriorityChooser(card, "progress");
    container.appendChild(card);
  }

  // «Сьогодні»: коротко про завершений цикл — на розвантаженні й у 1-й тиждень.
  function renderCycleDoneHomeCard(container) {
    try {
      var lc = lastCycle();
      var c = lc.cycle, p = lc.program;
      if (!c || !c.ok || c.backfill) return;
      var show = (p.phase === "deload" && c.mesoId === p.mesoId) ||
        (p.weekIndex === 1 && c.next && c.next.forMesoId === p.mesoId);
      if (!show) return;
      var card = makeCard();
      card.appendChild(makeSectionTitle("Цикл" + (isNum(c.number) ? " №" + c.number : "") + " завершено"));
      var up = c.anchors.filter(function (a) { return a.status === "up"; }).length;
      card.appendChild(progressP("Основні вправи росли: " + up + " з " + c.anchors.length + ". " +
        (c.next && c.next.why ? c.next.why.short : ""), "text-dim"));
      var b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-secondary";
      b.textContent = "Переглянути підсумок";
      b.addEventListener("click", function () { location.hash = "#progress"; });
      card.appendChild(b);
      container.appendChild(card);
    } catch (e) { /* довідка — без неї екран працює */ }
  }

  function renderProgressScreen(container) {
    var sum = null;
    try {
      var exercises = Store.getSection("exercises");
      if (!exercises || !exercises.length) exercises = window.EX_DB || [];
      sum = AlgoProgram.progressSummary({
        sessions: Store.getSessions() || [],
        exercises: exercises,
        program: Store.getSection("program") || {},
        metrics: Store.getSection("metrics") || {},
        bodyMassKg: (Store.getSection("settings") || {}).bodyMassKg,
        now: new Date().toISOString()
      });
    } catch (e) {
      container.appendChild(makeStatusLine("Не вдалось порахувати прогрес: " + ((e && e.message) || e), true));
      return;
    }

    renderProgressCycle(container, sum);

    if (sum.code === "NO_SESSIONS") {
      var empty = makeCard();
      empty.appendChild(progressP("Ще немає збережених тренувань. Після першого тут з'являться оцінка " +
        "максимуму основних вправ, обсяг по тижнях і кількість тренувань.", "text-dim"));
      container.appendChild(empty);
      return;
    }

    renderCycleSummaryCard(container);

    renderProgressWeeks(container, sum);

    if (sum.exercises.length) {
      var head = makeCard();
      head.appendChild(makeSectionTitle("Основні вправи"));
      head.appendChild(progressP(sum.source === "anchors"
        ? "Основні вправи поточного циклу."
        : "Основні вправи ще не закріплені — показано ті, що ви робили найчастіше.", "text-dim"));
      var howEx = document.createElement("details");
      howEx.className = "workout-why-details";
      var hxs = document.createElement("summary");
      hxs.textContent = "Як читати графіки";
      howEx.appendChild(hxs);
      howEx.appendChild(progressP("Точка графіка — оцінка максимуму (вага на 1 повтор) з найкращого підходу тренування; тижні " +
        "розвантаження не враховуються. Велике число — поточна оцінка, яку алгоритм згладжує між " +
        "тренуваннями (один вдалий чи невдалий день її не перекидає), тому вона може відрізнятися від " +
        "останньої точки. Для вправ з власною вагою — оцінка максимуму «частка ваги тіла + вантаж», якщо " +
        "вагу тіла вказано в Налаштуваннях і частку виміряно в дослідженнях (віджимання, підтягування); " +
        "інакше — найбільше повторів.", "text-dim"));
      sheetify(howEx, "Графіки основних вправ");
      head.appendChild(howEx);
      container.appendChild(head);
      sum.exercises.forEach(function (ex) { renderProgressExercise(container, ex); });
    }
  }

  function renderVolumeScreen(container) {
    if (!window.Store || !window.AlgoProgram) {
      var stub = document.createElement("p");
      stub.className = "screen-stub";
      stub.textContent = "Алгоритм або сховище недоступні.";
      container.appendChild(stub);
      return;
    }

    try {
      var settings = Store.getSection("settings") || {};
      var exercises = Store.getSection("exercises");
      if (!exercises || !exercises.length) exercises = window.EX_DB || [];
      var sessions = Store.getSessions() || [];
      var program = Store.getSection("program") || {};
      var metrics = Store.getSection("metrics") || {};
      var idx = exIndexOf(exercises);

      var daysPerWeek = isNum(program.daysPerWeek) ? program.daysPerWeek
        : (isNum(settings.daysPerWeek) ? settings.daysPerWeek : 4);
      var week = isNum(program.weekIndex) ? program.weekIndex : 1;
      var dayIndex = isNum(program.dayIndex) ? program.dayIndex : 1;

      var nowIso = new Date().toISOString();
      var weekKey = AlgoProgram.isoWeekKey(nowIso.slice(0, 10));
      var volumeDone = AlgoProgram.weeklyVolume(sessions, {
        weekKey: weekKey, mesoId: program.mesoId, exercises: exercises, index: idx
      });

      var ciV = cycleInputsNow();
      var targets = AlgoProgram.weeklyTargets({
        daysPerWeek: daysPerWeek, week: week, mode: settings.mode || undefined,
        priority: ciV.priority, rampOffset: ciV.rampOffset
      });
      var defs = AlgoProgram.deficits(volumeDone, targets);
      var zones = AlgoProgram.corridorZones(volumeDone, { mode: settings.mode || undefined });

      // §9 — той самий виклик, що й на екрані тренування (js/ui.js,
      // renderWorkoutScreen) — щоб два екрани не розійшлись у числах.
      // mode, а не volumeScale: 1 — інакше scaleFrom() ігнорує режим і §10
      // працює на немасштабованому коридорі всупереч §13.2 ALGO.md.
      var rec = AlgoProgram.recoveryState({
        sessions: sessions, exercises: exercises, index: idx, nowH: nowIso,
        fatigue: metrics.fatigue, daysPerWeek: daysPerWeek,
        volumeDone: volumeDone,
        sessionsLeft: Math.max(1, daysPerWeek - dayIndex + 1),
        mode: settings.mode || undefined
      });

      var lastWorked = AlgoProgram.lastWorkedHours(sessions, { index: idx, now: nowIso });

      var muscles = AlgoProgram.MUSCLES.slice();
      var rows = muscles.map(function (key) {
        var m = (rec.muscles && rec.muscles[key]) || {};
        var d = defs[key] || {};
        var z = zones[key] || {};
        return {
          key: key,
          name: (AlgoProgram.MUSCLE_NAME && AlgoProgram.MUSCLE_NAME[key]) || key,
          r: isNum(m.r) ? m.r : 100,
          zone: rec.cold ? "cold" : (m.zone || "unknown"),
          ruleId: m.ruleId || null,
          mev: isNum(m.mev) ? m.mev : (z.mev || 0),
          mav: isNum(m.mav) ? m.mav : (z.mav || 0),
          mrv: isNum(m.mrv) ? m.mrv : (z.mrv || 0),
          volumeWeek: isNum(m.volumeWeek) ? m.volumeWeek : (d.done || 0),
          tReadyH: isNum(m.tReadyH) ? m.tReadyH : null,
          done: d.done || 0,
          target: d.target || 0,
          deficit: d.deficit || 0,
          norm: isNum(d.norm) ? d.norm : 0,
          corridorZone: z.zone || null,
          corridorRuleId: z.ruleId || null,
          lastWorkedH: (key in lastWorked) ? lastWorked[key] : null,
          cold: rec.cold
        };
      });

      rows.sort(function (a, b) {
        if (volumeSortMode === "deficit") return b.norm - a.norm;
        return a.r - b.r;
      });

      // Редизайн фаза Б: та сама готовність — мапою, над таблицею.
      bodyMapCard(container, "Готовність м'язів", rec);

      var sortCard = makeCard();
      var sortRow = document.createElement("div");
      sortRow.style.display = "flex";
      sortRow.style.flexWrap = "wrap";
      sortRow.style.gap = "var(--space-2)";

      [
        { id: "readiness", label: "За готовністю" },
        { id: "deficit", label: "Де бракує обсягу" }
      ].forEach(function (opt) {
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (volumeSortMode === opt.id ? " is-active" : "");
        chip.setAttribute("aria-pressed", volumeSortMode === opt.id ? "true" : "false");
        chip.textContent = opt.label;
        chip.addEventListener("click", function () {
          volumeSortMode = opt.id;
          renderScreen("volume");
        });
        sortRow.appendChild(chip);
      });
      sortCard.appendChild(sortRow);

      // Порожній стан — рівно один раз на екран, а не в кожному рядку.
      if (rec.cold) {
        var note = document.createElement("p");
        note.className = "vol-note";
        note.textContent = "Історії тренувань ще немає. " +
          "Поки вона не набереться, готовність усіх м'язів вважається 100%.";
        sortCard.appendChild(note);
      }

      // Розшифровки термінів лишаються доступними, але згорнуті: власнику
      // вони потрібні зрідка, а розпихані по рядках дужки з'їдали екран.
      var legendBtn = document.createElement("button");
      legendBtn.type = "button";
      legendBtn.className = "vol-legend-toggle";
      legendBtn.setAttribute("aria-expanded", volumeLegendOpen ? "true" : "false");
      var legendBtnText = document.createElement("span");
      legendBtnText.textContent = "Що означають мінімум, оптимум, стеля, готовність";
      legendBtn.appendChild(legendBtnText);
      var legendChev = document.createElement("span");
      legendChev.className = "vol-chev";
      legendChev.setAttribute("aria-hidden", "true");
      legendChev.textContent = volumeLegendOpen ? "▴" : "▾";
      legendBtn.appendChild(legendChev);
      legendBtn.addEventListener("click", function () {
        volumeLegendOpen = !volumeLegendOpen;
        renderScreen("volume");
      });
      sortCard.appendChild(legendBtn);

      if (volumeLegendOpen) {
        var legend = document.createElement("div");
        legend.className = "vol-legend";
        VOLUME_GLOSSARY.forEach(function (item) {
          var p = document.createElement("p");
          var term = document.createElement("b");
          term.textContent = item[0];
          p.appendChild(term);
          p.appendChild(document.createTextNode(" — " + item[1]));
          legend.appendChild(p);
        });
        sortCard.appendChild(legend);
      }

      // §7: тижневий обсяг рахується по ISO-тижню (пн–нд), а «востаннє
      // навантажений» — по фактичній даті. У понеділок смуги обсягу
      // обнуляються, хоча вчора могло бути тренування — це задум, не баг,
      // тому пояснюємо тут же коротким рядком, а не мовчимо.
      var weekNote = document.createElement("p");
      weekNote.className = "vol-week-note";
      weekNote.textContent = "Обсяг рахується за календарний тиждень (пн–нд): у понеділок смуги " +
        "починаються з нуля, навіть якщо вчора було тренування.";
      sortCard.appendChild(weekNote);

      container.appendChild(sortCard);

      var listCard = makeCard();
      rows.forEach(function (data) { renderVolumeRow(listCard, data); });
      container.appendChild(listCard);
    } catch (e) {
      var errP = document.createElement("p");
      errP.className = "screen-stub";
      errP.textContent = "Не вдалось порахувати обсяг: " + (e && e.message ? e.message : String(e));
      container.appendChild(errP);
    }
  }

  // ==================================================================
  // Онбординг — крок 14
  // ==================================================================
  //
  // Увесь рахунок робить AlgoCore: seedFromProbe() (проба → e1RM → стартова
  // вага) і onboardingSeed() (усі відповіді → готові секції стану). Тут — рівно
  // ввід, показ кодів людськими словами і ОДИН запис у сховище на «Почати».
  // Своїх формул у цьому блоці немає й бути не може.

  // Людські підписи ідентифікаторів обладнання. Самі ідентифікатори НЕ
  // вигадуються: список збирається з data/exercises.js (equipmentIdsFromDb).
  // Ідентифікатор без підпису показується як є — краще сире слово, ніж
  // мовчазно зниклий пункт.
  var EQUIPMENT_LABEL = {
    barbell: "Штанга",
    dumbbell: "Гантелі",
    machine: "Тренажери",
    cable: "Блок / кросовер",
    bodyweight: "Власна вага",
    "pullup-bar": "Турнік і бруси",
    band: "Резинки"
  };

  var FOCUS_LABEL = { full: "усе тіло", upper: "верх", lower: "низ", weak: "слабка ланка" };

  var PLATE_STEPS = [0.5, 1, 1.25, 2.5, 5];   // найменший блін, що реально є в залі
  var DB_STEPS = [1, 1.25, 2, 2.5, 5];        // крок гантельного ряду

  var ONB_STEPS = [
    // r2 (крок 8, концепт C): що є → чого хочете → коли. Кроки незалежні:
    // перелік основних вправ для проби залежить лише від обладнання.
    { id: "equipment", title: "Що є у вашому залі?" },
    { id: "mode", title: "Що для вас головне?" },
    { id: "days", title: "Коли тренуєтесь?" },
    { id: "probe", title: "Оцінна проба" },
    { id: "summary", title: "Що зрозуміла система" }
  ];

  // Стан майстра живе тільки в пам'яті: у сховище він потрапляє одним записом
  // на «Почати». Половина відповідей у стані застосунку — гірше, ніж їх
  // відсутність: алгоритм не має способу відрізнити «ще не питали» від
  // «відповіли отак».
  var onb = null;

  // §3.1 (етап 2): рівень підготовки НЕ питається. Старт — найобережніший
  // профіль, який знає онбординг (AlgoCore.C.ONBOARD_EXPERIENCE[0], тобто
  // bias новачка §3); далі рівень уточнює калібрування — AMRAP-проби і
  // drop-off після кожної сесії (experienceFromCalibration).
  function onbExperience() {
    var list = coreC().ONBOARD_EXPERIENCE;
    return (Array.isArray(list) && list.length) ? list[0] : "novice";
  }

  function fmtKg(v) {
    if (!isNum(v)) return "—";
    return String(Math.round(v * 100) / 100);
  }

  function coreC() {
    return (window.AlgoCore && AlgoCore.C) ? AlgoCore.C : {};
  }

  // «4 повтори», а не «4 повторів»: число тут конкретне, і крива форма слова
  // одразу читається як машинний текст.
  function plReps(n) {
    var a = Math.abs(n) % 100;
    var b = a % 10;
    if (a > 10 && a < 20) return "повторів";
    if (b === 1) return "повтор";
    if (b >= 2 && b <= 4) return "повтори";
    return "повторів";
  }

  // Онбординг потрібен, поки в settings немає позначки про його проходження.
  // Дві поступки, і обидві навмисні:
  //   • є збережені сесії → людина вже тренується (стан із версії до кроку 14).
  //     Заганяти її в майстер означало б перетерти її ж settings/calibration;
  //   • сховище не пише (locked/unavailable) → майстер нікуди не збережеться і
  //     показувався б вічно, замкнувши доступ до експорту в Налаштуваннях.
  function onboardingNeeded() {
    try {
      if (!window.Store || !window.AlgoCore || typeof AlgoCore.onboardingSeed !== "function") return false;
      if (storeInitResult && storeInitResult.status === "unavailable") return false;
      if (typeof Store.isLocked === "function" && Store.isLocked()) return false;
      var s = getSettings();
      if (s && s.onboarding && s.onboarding.doneAt) return false;
      var sessions = (typeof Store.getSessions === "function" && Store.getSessions()) || [];
      if (sessions.length) return false;
      return true;
    } catch (e) {
      return false;
    }
  }

  // Ідентифікатори обладнання беруться з бази вправ, а не з рукописного
  // списку: розійдуться — і людина позначить те, чого в базі немає (або не
  // побачить того, що є).
  function equipmentIdsFromDb() {
    var out = [];
    var lib = getExerciseLibrary();
    for (var i = 0; i < lib.length; i++) {
      var raw = lib[i] && lib[i].equipment;
      var arr = Array.isArray(raw) ? raw : (typeof raw === "string" && raw ? [raw] : []);
      for (var j = 0; j < arr.length; j++) {
        if (arr[j] && out.indexOf(arr[j]) === -1) out.push(arr[j]);
      }
    }
    out.sort();
    return out;
  }

  function initOnboarding() {
    var ids = equipmentIdsFromDb();
    var sel = {};
    ids.forEach(function (id) { sel[id] = true; });
    var C = coreC();
    onb = {
      step: 0,
      equipmentIds: ids,
      equipment: sel,
      plateStep: isNum(C.DEFAULT_PLATE_STEP) ? C.DEFAULT_PLATE_STEP : 1.25,
      barWeight: isNum(C.DEFAULT_BAR_WEIGHT) ? C.DEFAULT_BAR_WEIGHT : 20,
      dbMin: 2, dbMax: 32, dbStep: 2,
      daysPerWeek: isNum(C.ONBOARD_DAYS_DEFAULT) ? C.ONBOARD_DAYS_DEFAULT : 4,
      // Етап 3, п.6: дні тижня й ліміт на кожен. Днів наперед не ставимо —
      // будь-який набір за людину був би вигадкою.
      schedule: { days: [], budgets: {} },
      mode: "hyb",
      goals: null,          // §13.6: галочки цілей; mode виводиться з них
      probes: {},
      bodyMassKg: null,     // етап 6: необов'язково
      saveNote: null
    };
  }

  function rerenderOnb() { renderScreen(getScreenIdFromHash()); }

  function onbEquipment() {
    var out = [];
    onb.equipmentIds.forEach(function (id) { if (onb.equipment[id]) out.push(id); });
    return out;
  }

  function onbDumbbells() {
    if (!onb.equipment.dumbbell) return [];
    var out = [];
    var w = onb.dbMin;
    while (w <= onb.dbMax + 1e-6 && out.length < 120) {
      out.push(Math.round(w * 100) / 100);
      w = Math.round((w + onb.dbStep) * 100) / 100;
    }
    return out;
  }

  // Налаштування «як вони будуть» — щоб сітка залу в seedFromProbe() на
  // прев'ю була та сама, що на «Почати».
  function onbSettingsDraft() {
    return {
      units: "kg",
      plateStep: onb.plateStep,
      barWeight: onb.barWeight,
      dumbbells: onbDumbbells(),
      daysPerWeek: onb.daysPerWeek,
      experience: onbExperience(),
      equipment: onbEquipment(),
      mode: onb.mode
    };
  }

  // Опорні рухи під обране обладнання. Вибір робить AlgoProgram.pickAnchors()
  // (§5) — тут не вирішується, що є anchor'ом.
  function onbAnchors() {
    try {
      if (!window.AlgoProgram || typeof AlgoProgram.pickAnchors !== "function") return [];
      var lib = getExerciseLibrary();
      var idx = exIndexOf(lib);
      var res = AlgoProgram.pickAnchors({ exercises: lib, equipment: onbEquipment() });
      var slotName = {};
      (AlgoProgram.ANCHOR_SLOTS || []).forEach(function (d) { slotName[d.slot] = SLOT_LABEL[d.slot] || d.name; });
      var out = [];
      (res.slots || []).forEach(function (s) {
        var ex = s.exerciseId ? idx[s.exerciseId] : null;
        if (ex) out.push({ slot: s.slot, slotName: slotName[s.slot] || s.slot, ex: ex });
      });
      return out;
    } catch (e) {
      return [];
    }
  }

  function probeEntry(ex) {
    var p = onb.probes[ex.id];
    if (!p) {
      // §2.1: у вправи з власною вагою поле ваги — це ТІЛЬКИ додатковий вантаж,
      // і 0 тут готове значення, а не порожнє поле. У решти вправ порожньо
      // означає «ще не ввели» (PARTIAL_INPUT).
      var bw = !!(window.AlgoCore && typeof AlgoCore.isBodyweight === "function" && AlgoCore.isBodyweight(ex));
      var C = coreC();
      p = {
        bw: bw,
        w: bw ? 0 : null,
        reps: 8,
        rir: isNum(C.ONBOARD_TARGET_RIR) ? C.ONBOARD_TARGET_RIR : 2,
        skipped: false
      };
      onb.probes[ex.id] = p;
    }
    return p;
  }

  // Робочий діапазон під обраний режим (§13.1/§13.3) — щоб стартова вага
  // рахувалась під ті самі повтори, які потім призначить перша сесія.
  function onbRepRange(a) {
    try {
      if (!window.AlgoProgram || typeof AlgoProgram.effRange !== "function") return null;
      var er = AlgoProgram.effRange(a.ex, { mode: onb.mode, item: { kind: "anchor", slot: a.slot } });
      return (er && er.ok && er.range) ? er.range : null;
    } catch (e) {
      return null;
    }
  }

  function probeInput(a) {
    var p = probeEntry(a.ex);
    if (p.skipped) return null;
    return {
      exerciseId: a.ex.id, exercise: a.ex,
      weight: p.w, reps: p.reps, rir: p.rir,
      repRange: onbRepRange(a)
    };
  }

  function probeResult(a) {
    var input = probeInput(a);
    if (!input) return null;
    try {
      input.settings = onbSettingsDraft();
      input.experience = onbExperience();
      return AlgoCore.seedFromProbe(input);
    } catch (e) {
      return null;
    }
  }

  // Коди seedFromProbe() людською мовою. Мовчазна відмова тут — найгірший
  // варіант: людина вводить числа й не розуміє, чому старту немає.
  function probeCodeText(res) {
    var C = coreC();
    var repsMin = isNum(C.PROBE_REPS_MIN) ? C.PROBE_REPS_MIN : 1;
    var repsMax = isNum(C.PROBE_REPS_MAX) ? C.PROBE_REPS_MAX : 30;
    var rirMin = isNum(C.PROBE_RIR_MIN) ? C.PROBE_RIR_MIN : 0;
    var rirMax = isNum(C.PROBE_RIR_MAX) ? C.PROBE_RIR_MAX : 5;
    switch (res.code) {
      case "PARTIAL_INPUT":
        // Повтори й запас у цій формі завжди заповнені числом, тому неповний
        // ввід тут означає рівно одне — не вказана вага.
        return "Вкажіть вагу підходу — або пропустіть цю вправу.";
      case "BAD_REPS":
        return "Повтори мають бути цілим числом від " + repsMin + " до " + repsMax +
          ": оцінна проба — це один робочий підхід.";
      case "BAD_RIR":
        return "Повторів у запасі — ціле число від " + rirMin + " до " + rirMax +
          ": скільки повторів ще лишалось у баку.";
      case "BAD_WEIGHT":
        return "Вкажіть вагу більшу за нуль — скільки реально було на снаряді.";
      case "N_TOO_HIGH":
        return "Підхід вийшов надто легким, щоб оцінити з нього силу. Повторіть пробу " +
          "з важчою вагою — так, щоб повторів вийшло менше при тому самому запасі.";
      default:
        return "Пробу не прийнято (" + res.code + "). Змініть числа або пропустіть цю вправу.";
    }
  }

  // Округлення — окремий результат від самої оцінки: e1RM може порахуватись,
  // а ваги під нього в наявному наборі не знайтись.
  function weightCodeText(res) {
    if (!res || !res.ok) return null;
    if (res.weightCode === "NO_GRID") {
      return "Ваги під цю оцінку взяти нема з чого: набір гантелей порожній. " +
        "Поверніться на крок обладнання й задайте ряд гантелей.";
    }
    if (res.weightCode === "FLOOR") {
      return "Розрахунок дає менше, ніж найлегше, що є в наборі — стартуємо з " +
        fmtKg(res.weight) + " кг, легше просто немає.";
    }
    if (res.weightCode === "TOP") {
      return "Розрахунок дає більше, ніж найважче, що є в наборі — впираємось у стелю: " +
        fmtKg(res.weight) + " кг.";
    }
    return null;
  }

  // Однорядковий підсумок прийнятої проби — той самий текст на кроці проби і
  // на підсумку.
  function probeStartText(res) {
    if (!res || !res.ok) return null;
    if (res.code === "BODYWEIGHT_BASE") {
      // §0.2/§2.1: e1RM тут не рахується взагалі — прогрес міряється повторами.
      return "Власна вага: рахуються повтори, а не вага. Старт — " + res.repsTarget + " " +
        plReps(res.repsTarget) +
        (isNum(res.weight) && res.weight > 0 ? ", додатково " + fmtKg(res.weight) + " кг" : "") + ".";
    }
    var w = isNum(res.weight) ? fmtKg(res.weight) + " кг" : "вага під набір не підібралась";
    return "Старт: " + w + " × " + res.repsTarget + " " + plReps(res.repsTarget) +
      " (оцінка максимуму на 1 повтор ≈ " + fmtKg(res.e1rm) + " кг).";
  }

  function onbNote(container, text, tone) {
    var p = document.createElement("p");
    p.className = "onb-note" + (tone ? " onb-note--" + tone : "");
    p.textContent = text;
    container.appendChild(p);
    return p;
  }

  function onbHint(container, text) {
    var p = document.createElement("p");
    p.className = "text-dim onb-hint";
    p.textContent = text;
    container.appendChild(p);
    return p;
  }

  function onbChip(label, active, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (active ? " is-active" : "");
    b.setAttribute("aria-pressed", active ? "true" : "false");
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function onbChipRow() {
    var row = document.createElement("div");
    row.className = "onb-chips";
    return row;
  }

  // Значення з фіксованої драбинки (крок бліна, крок гантельного ряду):
  // мінусом/плюсом ходимо по списку, а не по вільному числу.
  function ladderStepper(label, list, value, onPick) {
    var i = list.indexOf(value);
    if (i === -1) i = 0;
    return stepperRow(label, list[i], function (v) { return fmtKg(v); },
      function () { onPick(list[Math.max(0, i - 1)]); },
      function () { onPick(list[Math.min(list.length - 1, i + 1)]); }).row;
  }

  function numStepper(label, value, step, min, max, suffix, onPick) {
    return stepperRow(label, value, function (v) { return fmtKg(v) + (suffix || ""); },
      function () { onPick(Math.max(min, Math.round((value - step) * 100) / 100)); },
      function () { onPick(Math.min(max, Math.round((value + step) * 100) / 100)); }).row;
  }

  // ---------- крок 1: обладнання ----------

  function renderOnbEquipment(container) {
    var card = makeCard();
    card.classList.add("onb-plain");
    onbHint(card, "Позначте все, до чого реально є доступ. Від цього залежать склад вправ і ваги.");

    var row = document.createElement("div");
    row.className = "tile-grid";
    onb.equipmentIds.forEach(function (id) {
      row.appendChild(choiceTile(EQUIPMENT_LABEL[id] || id, null, !!onb.equipment[id], function () {
        onb.equipment[id] = !onb.equipment[id];
        rerenderOnb();
      }));
    });
    card.appendChild(row);

    if (!onbEquipment().length) {
      onbNote(card, "Оберіть хоча б один пункт — інакше програму нема з чого зібрати.", "warn");
    }
    container.appendChild(card);

    if (onb.equipment.barbell) {
      var bar = makeCard();
      bar.appendChild(makeSectionTitle("Штанга"));
      onbHint(bar, "Крок на штанзі — це два бліни, по одному з кожного боку. " +
        "Тому вказується найменший блін, який є в парі.");
      bar.appendChild(ladderStepper("Найменший блін, кг", PLATE_STEPS, onb.plateStep, function (v) {
        onb.plateStep = v; rerenderOnb();
      }));
      bar.appendChild(numStepper("Вага грифа, кг", onb.barWeight, 2.5, 5, 35, "", function (v) {
        onb.barWeight = v; rerenderOnb();
      }));
      container.appendChild(bar);
    }

    if (onb.equipment.dumbbell) {
      var db = makeCard();
      db.appendChild(makeSectionTitle("Гантелі"));
      onbHint(db, "Ряд гантелей, які є в залі. Вага гантельних вправ округляється саме до цього " +
        "ряду — тому важливо, щоб він збігався з дійсністю.");
      db.appendChild(numStepper("Найлегша, кг", onb.dbMin, 1, 1, 20, "", function (v) {
        onb.dbMin = Math.min(v, onb.dbMax); rerenderOnb();
      }));
      db.appendChild(numStepper("Найважча, кг", onb.dbMax, 2, onb.dbMin, 80, "", function (v) {
        onb.dbMax = v; rerenderOnb();
      }));
      db.appendChild(ladderStepper("Крок ряду, кг", DB_STEPS, onb.dbStep, function (v) {
        onb.dbStep = v; rerenderOnb();
      }));

      var list = onbDumbbells();
      var preview = list.length > 4
        ? (list.slice(0, 3).map(fmtKg).join(", ") + " … " + fmtKg(list[list.length - 1]))
        : list.map(fmtKg).join(", ");
      onbNote(db, list.length
        ? ("Ряд: " + preview + " кг — усього " + list.length + " шт.")
        : "Ряд поки порожній: найважча має бути не легшою за найлегшу.",
        list.length ? null : "warn");
      container.appendChild(db);
    }
  }

  // ---------- крок 2: днів на тиждень ----------

  function onbScheduleOk() {
    var bd = scheduleBounds();
    var n = onb && onb.schedule ? onb.schedule.days.length : 0;
    return n >= bd.lo && n <= bd.hi;
  }

  function renderOnbDays(container) {
    var card = makeCard();
    onbHint(card, "Позначте дні, коли реально можете тренуватись, — не в найкращому тижні життя. " +
      "Схема тренувань і тижневий обсяг рахуються від кількості днів, а для кожного дня можна " +
      "задати максимум хвилин.");
    // Схему не вигадуємо — редактор бере готову з AlgoProgram.templateFor().
    renderScheduleEditor(card, onb.schedule, null, function (next) {
      onb.schedule = next;
      if (onbScheduleOk()) onb.daysPerWeek = next.days.length;
      rerenderOnb();
    });
    if (onbScheduleOk()) onbNote(card, BUDGET_CEILING_NOTE);
    var fq = document.createElement("p");
    fq.className = "text-faint";
    fq.style.marginTop = "var(--space-2)";
    fq.textContent = FREQ_NOTE;
    card.appendChild(fq);
    container.appendChild(card);
  }

  // ---------- крок 3: режим цілей ----------

  function renderOnbMode(container) {
    var card = makeCard();
    card.classList.add("onb-plain");
    onbHint(card, "Можна кілька. Повтори, обсяг і відпочинок програма підбере сама; змінити — " +
      "у Налаштуваннях, не частіше ніж раз на чотири тижні.");
    if (!onb.goals) onb.goals = goalsOf(onb.mode);
    renderGoalRows(card, onb.goals, function (key) {
      var next = toggleGoal(onb.goals, key);
      if (!next) return;
      onb.goals = next;
      onb.mode = modeOfGoals(next) || onb.mode;
      rerenderOnb();
    });
    // Числа колонки показуємо дослівно з таблиці режимів, а не переказом.
    var tbl = modeNumbersTable(onb.mode);
    if (tbl) {
      var tl = document.createElement("p");
      tl.className = "set-label";
      tl.style.marginTop = "var(--space-3)";
      tl.textContent = "Що виходить" + (MODE_INFO[onb.mode] ? " · " + MODE_INFO[onb.mode].label.toLowerCase() : "") + " · повтори · відпочинок";
      card.appendChild(tl);
      card.appendChild(tbl);
    }
    if (onb.goals.length === 1 && onb.goals[0] === "end") onbNote(card, END_ONLY_NOTE);
    renderWhy(card, "goals");
    container.appendChild(card);
  }

  // ---------- крок 4: оцінна проба ----------

  function probeWeightRow(label, value, step, onSet) {
    var row = document.createElement("div");
    row.className = "stepper onb-weight";

    var lab = document.createElement("span");
    lab.className = "text-dim";
    lab.textContent = label;
    row.appendChild(lab);

    var wrap = document.createElement("div");
    wrap.className = "stepper";

    // Дві величини кроку: точний крок снаряда і «на десятку». Без другої пари
    // дійти від грифа до робочої ваги — тридцять тапів.
    [["−10", -10], ["−", -step]].forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "stepper-btn" + (d[1] === -10 ? " stepper-btn--wide" : "");
      b.textContent = d[0];
      b.addEventListener("click", function () { onSet((isNum(value) ? value : 0) + d[1]); });
      wrap.appendChild(b);
    });

    var val = document.createElement("span");
    val.className = "stepper-value";
    val.textContent = isNum(value) ? fmtKg(value) : "—";
    wrap.appendChild(val);

    [["+", step], ["+10", 10]].forEach(function (d) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "stepper-btn" + (d[1] === 10 ? " stepper-btn--wide" : "");
      b.textContent = d[0];
      b.addEventListener("click", function () { onSet((isNum(value) ? value : 0) + d[1]); });
      wrap.appendChild(b);
    });

    row.appendChild(wrap);
    return row;
  }

  function renderProbeCard(container, a) {
    var p = probeEntry(a.ex);
    var card = makeCard();

    var title = document.createElement("h2");
    title.className = "onb-option-name";
    title.textContent = a.ex.name + (p.bw ? " · власна вага" : "");
    card.appendChild(title);

    var sub = document.createElement("p");
    sub.className = "text-faint onb-option-sub";
    sub.textContent = a.slotName;
    card.appendChild(sub);

    if (p.skipped) {
      onbNote(card, "Пропущено — стартову вагу для цієї вправи система підбере обережно сама.");
      var back = document.createElement("button");
      back.type = "button";
      back.className = "btn btn-secondary";
      back.textContent = "Ввести пробу";
      back.addEventListener("click", function () { p.skipped = false; rerenderOnb(); });
      card.appendChild(back);
      container.appendChild(card);
      return;
    }

    // Інструкція «як робити пробу» — один раз угорі екрана, а не в кожній з
    // п'яти карток: п'ять однакових абзаців витісняли самі поля за екран.
    var inc = isNum(a.ex.incrementKg) && a.ex.incrementKg > 0 ? a.ex.incrementKg : 2.5;
    card.appendChild(probeWeightRow(p.bw ? "Додатково, кг" : "Вага, кг", p.w, inc, function (v) {
      p.w = Math.max(0, Math.round(v * 100) / 100);
      rerenderOnb();
    }));

    card.appendChild(stepperRow("Повтори", p.reps, function (v) { return String(v); },
      function () { p.reps = Math.max(0, p.reps - 1); rerenderOnb(); },
      function () { p.reps = p.reps + 1; rerenderOnb(); }).row);

    card.appendChild(stepperRow("Повторів у запасі", p.rir, function (v) { return String(v); },
      function () { p.rir = Math.max(0, p.rir - 1); rerenderOnb(); },
      function () { p.rir = p.rir + 1; rerenderOnb(); }).row);

    var res = probeResult(a);
    if (res && res.ok) {
      onbNote(card, probeStartText(res), "ok");
      var wt = weightCodeText(res);
      if (wt) onbNote(card, wt, "warn");
    } else if (res) {
      onbNote(card, probeCodeText(res), res.code === "PARTIAL_INPUT" ? null : "warn");
    }

    var skip = document.createElement("button");
    skip.type = "button";
    skip.className = "btn btn-secondary";
    skip.textContent = "Не знаю / пропустити";
    skip.addEventListener("click", function () { p.skipped = true; rerenderOnb(); });
    card.appendChild(skip);

    container.appendChild(card);
  }

  function renderOnbProbe(container) {
    var anchors = onbAnchors();

    var C = coreC();
    var tRir = isNum(C.ONBOARD_TARGET_RIR) ? C.ONBOARD_TARGET_RIR : 2;

    var head = makeCard();
    onbHint(head, "Зробіть один підхід кожної основної вправи: приблизно на 8 повторів, " +
      "залишивши " + tRir + " " + plReps(tRir) + " в запасі. Тоді впишіть, що вийшло насправді — " +
      "з цього рахується стартова вага.");
    onbHint(head, "Це не обов'язково: будь-яку вправу (чи всі одразу) можна пропустити. " +
      "Тоді перша сесія буде навмисно легкою, а ваги підтягнуться за наступні тренування.");
    container.appendChild(head);

    // Етап 6: маса тіла — можна пропустити (docs/DATA.md → settings.bodyMassKg).
    var bmCard = makeCard();
    var bmTitle = document.createElement("h2");
    bmTitle.className = "onb-option-name";
    bmTitle.textContent = "Вага тіла · можна пропустити";
    bmCard.appendChild(bmTitle);
    onbHint(bmCard, "Потрібна лише для графіка прогресу у віджиманнях і підтягуваннях. На стартові ваги " +
      "не впливає; змінити чи прибрати — у Налаштуваннях.");
    bmCard.appendChild(bodyMassRow(onb.bodyMassKg, function (v) { onb.bodyMassKg = v; rerenderOnb(); }));
    if (onb.bodyMassKg !== null) {
      var bmSkip = document.createElement("button");
      bmSkip.type = "button";
      bmSkip.className = "btn btn-secondary";
      bmSkip.textContent = "Не вказувати";
      bmSkip.addEventListener("click", function () { onb.bodyMassKg = null; rerenderOnb(); });
      bmCard.appendChild(bmSkip);
    }
    container.appendChild(bmCard);

    if (!anchors.length) {
      var empty = makeCard();
      onbNote(empty, "Для обраного обладнання основних вправ у базі не знайшлось — пробу " +
        "пропускаємо. Старт буде обережним.", "warn");
      container.appendChild(empty);
      return;
    }

    anchors.forEach(function (a) { renderProbeCard(container, a); });
  }

  // ---------- крок 5: підсумок ----------

  function buildOnboardingSeed() {
    var anchors = onbAnchors();
    var probes = [];
    anchors.forEach(function (a) {
      var input = probeInput(a);
      if (input) probes.push(input);
    });
    return AlgoCore.onboardingSeed({
      equipment: onbEquipment(),
      daysPerWeek: onb.daysPerWeek,
      schedule: onbScheduleOk() ? onb.schedule : null,
      mode: onb.mode,
      plateStep: onb.plateStep,
      barWeight: onb.barWeight,
      dumbbells: onbDumbbells(),
      experience: onbExperience(),
      probes: probes,
      bodyMassKg: onb.bodyMassKg,
      now: new Date().toISOString()
    });
  }

  function renderOnbSummary(container) {
    var anchors = onbAnchors();
    var seed;
    try {
      seed = buildOnboardingSeed();
    } catch (e) {
      seed = null;
    }

    var card = makeCard();

    var eqNames = onbEquipment().map(function (id) { return EQUIPMENT_LABEL[id] || id; });
    onbNote(card, "Обладнання: " + (eqNames.length ? eqNames.join(", ") : "нічого не позначено") + ".");
    var schDays = (onb.schedule && onb.schedule.days) || [];
    onbNote(card, "Дні: " + (schDays.length
      ? schDays.map(function (d) {
          var b = onb.schedule.budgets[String(d)];
          return WEEKDAY_SHORT[d - 1] + (b ? " (до " + b + " хв)" : "");
        }).join(", ") + " — " + onb.daysPerWeek + " " + trainWord(onb.daysPerWeek) + " на тиждень"
      : onb.daysPerWeek + " на тиждень") + ". Режим: " +
      ((MODE_INFO[onb.mode] && MODE_INFO[onb.mode].label) || onb.mode) + ".");
    onbNote(card, "Вага тіла: " + (isNum(onb.bodyMassKg) ? fmtKg(onb.bodyMassKg) + " кг" :
      "не вказана (можна додати в Налаштуваннях)") + ".");
    onbNote(card, "Рівень підготовки питати не будемо: застосунок визначить його сам за перші " +
      "тижні — з того, як реально йдуть ваші підходи. До того ваги обережні.");
    container.appendChild(card);

    var startCard = makeCard();
    startCard.appendChild(makeSectionTitle("Стартові ваги"));

    if (!anchors.length) {
      onbNote(startCard, "Основних вправ під обране обладнання немає — стартуємо обережно.");
    } else {
      anchors.forEach(function (a) {
        var row = document.createElement("div");
        row.className = "list-row onb-summary-row";

        var nm = document.createElement("p");
        nm.className = "onb-option-name";
        nm.textContent = a.ex.name;
        row.appendChild(nm);

        var val = document.createElement("p");
        val.className = "text-dim";
        var res = probeResult(a);
        if (!res) {
          val.textContent = "пропущено — стартуємо обережно";
        } else if (res.ok && res.code === "BODYWEIGHT_BASE") {
          val.textContent = res.repsTarget + " " + plReps(res.repsTarget) + " власною вагою" +
            (isNum(res.weight) && res.weight > 0 ? " + " + fmtKg(res.weight) + " кг" : "");
        } else if (res.ok && isNum(res.weight)) {
          val.textContent = fmtKg(res.weight) + " кг × " + res.repsTarget;
        } else if (res.ok) {
          val.textContent = "оцінка є, ваги під неї в наборі немає";
        } else if (res.code === "PARTIAL_INPUT") {
          // Незаповнена проба — не відхилена проба. Плутати ці два стани в
          // підсумку означає сказати людині, що її відповідь забракували.
          val.textContent = "не заповнено — стартуємо обережно";
        } else {
          val.textContent = "пробу не прийнято — стартуємо обережно";
        }
        row.appendChild(val);
        startCard.appendChild(row);
      });
    }

    if (seed && seed.easyStart) {
      var C = coreC();
      onbNote(startCard, "Придатних проб немає, тому перша сесія навмисно легка: ціль — запас " +
        (isNum(C.EASY_START_RIR) ? C.EASY_START_RIR : 4) +
        " (стільки повторів лишається в запасі). Далі ваги підуть від того, що ви реально зробите.", "ok");
    }
    container.appendChild(startCard);

    if (onb.saveNote) {
      var errCard = makeCard();
      onbNote(errCard, onb.saveNote, "warn");
      container.appendChild(errCard);
    }
  }

  // Єдина точка запису онбордингу в сховище. Три секції, один клік — щоб
  // недоведений до кінця майстер не лишав по собі половину стану.
  function finishOnboarding() {
    try {
      var seed = buildOnboardingSeed();

      var settings = seed.settings;
      // docs/DATA.md → settings.onboarding. Позначка живе в стані, а не в
      // пам'яті сторінки, — інакше майстер повертався б після кожного
      // перезавантаження. easyStart тут же, бо в момент першої сесії вже нема
      // з чого відновити, що проб не було: metrics.e1rm порожній і після
      // проби на вправі з власною вагою.
      settings.onboarding = {
        doneAt: new Date().toISOString(),
        easyStart: !!seed.easyStart
      };

      var r1 = Store.setSection("settings", settings);
      var r2 = Store.setSection("calibration", seed.calibration);

      // metrics приходить ПАТЧЕМ {e1rm}: цілим об'єктом затерли б
      // weeklyVolume/fatigue/plateau, які онбординг не чіпає.
      var metrics = Store.getSection("metrics") || {};
      var patch = (seed.metrics && seed.metrics.e1rm) || {};
      var cur = metrics.e1rm || {};
      for (var k in patch) {
        if (patch.hasOwnProperty(k)) cur[k] = patch[k];
      }
      metrics.e1rm = cur;
      var r3 = Store.setSection("metrics", metrics);

      if (!(r1 && r1.ok) || !(r2 && r2.ok) || !(r3 && r3.ok)) {
        onb.saveNote = "Сховище відмовилось прийняти запис. Спробуйте ще раз; " +
          "якщо повториться — збережіть експорт стану в Налаштуваннях.";
        rerenderOnb();
        return;
      }

      // §5: anchor'и обираються один раз під щойно збережене обладнання —
      // ті самі, що показав підсумок (pickAnchors з тим самим набором).
      ensureAnchors();

      onb = null;
      workoutState = null;
      readinessAnswer = undefined;
      location.hash = "#home";
      renderScreen("home");
    } catch (e) {
      if (onb) {
        onb.saveNote = "Запис не пройшов: " + (e && e.message ? e.message : String(e));
        rerenderOnb();
      }
    }
  }

  // ---------- каркас майстра ----------

  function renderOnboarding(container) {
    if (!onb) initOnboarding();
    if (onb.step < 0) onb.step = 0;
    if (onb.step > ONB_STEPS.length - 1) onb.step = ONB_STEPS.length - 1;
    var step = ONB_STEPS[onb.step];

    var progress = document.createElement("p");
    progress.className = "onb-progress";
    progress.textContent = "Крок " + (onb.step + 1) + " з " + ONB_STEPS.length;
    container.appendChild(progress);

    var bar = document.createElement("div");
    bar.className = "onb-bar";
    for (var i = 0; i < ONB_STEPS.length; i++) {
      var seg = document.createElement("span");
      seg.className = "onb-bar-seg" + (i <= onb.step ? " is-done" : "");
      bar.appendChild(seg);
    }
    container.appendChild(bar);

    var h1 = document.createElement("h1");
    h1.className = "screen-title";
    h1.textContent = step.title;
    container.appendChild(h1);

    if (step.id === "equipment") renderOnbEquipment(container);
    else if (step.id === "days") renderOnbDays(container);
    else if (step.id === "mode") renderOnbMode(container);
    else if (step.id === "probe") renderOnbProbe(container);
    else renderOnbSummary(container);

    var nav = document.createElement("div");
    nav.className = "onb-nav";

    if (onb.step > 0) {
      var back = document.createElement("button");
      back.type = "button";
      back.className = "btn btn-secondary";
      back.textContent = "Назад";
      back.addEventListener("click", function () { onb.step--; rerenderOnb(); });
      nav.appendChild(back);
    }

    if (onb.step < ONB_STEPS.length - 1) {
      var blocked = (step.id === "equipment" && !onbEquipment().length) ||
        (step.id === "days" && !onbScheduleOk());
      var next = document.createElement("button");
      next.type = "button";
      next.className = blocked ? "btn btn-secondary" : "btn btn-primary";
      next.textContent = "Далі";
      next.disabled = blocked;
      next.addEventListener("click", function () {
        if (blocked) return;
        onb.step++;
        rerenderOnb();
      });
      nav.appendChild(next);
    } else {
      // Головна дія останнього кроку стоїть там, де на всіх попередніх стояло
      // «Далі», — інакше «Почати» губиться серед карток, а «Назад» опиняється
      // нижче за нього.
      var go = document.createElement("button");
      go.type = "button";
      go.className = "btn btn-primary";
      go.textContent = "Почати";
      go.addEventListener("click", finishOnboarding);
      nav.appendChild(go);
    }

    container.appendChild(nav);
  }

  // ------------------------------------------------------------------
  // Старт
  // ------------------------------------------------------------------

  document.addEventListener("DOMContentLoaded", function () {
    initStore();
    buildShell();
    window.addEventListener("hashchange", router);
    router();
    registerServiceWorker();
  });
})();

</script>
</body>
</html>
